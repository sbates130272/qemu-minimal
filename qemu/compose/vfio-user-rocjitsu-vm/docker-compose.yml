---
# rocjitsu-only VM stack
#
# Spins up one or more rocjitsu vfio-user GPU servers alongside a qemu-system
# VM. No ernic NIC is attached. Use vfio-user-ernic-vm/ for ernic-only or
# vfio-user-ernic-rocjitsu-vm/ for both.
#
# Usage:
#   cp qemu/env/example qemu/.env && $EDITOR qemu/.env
#   qemu-tool gen-vm --ansible-playbook ansible/playbooks/vm-rocjitsu.yml
#   qemu-tool compose --stack vfio-user-rocjitsu-vm up
#   ssh -p ${VM_SSH_PORT:-2222} ubuntu@localhost

# Every container here runs as the caller, with no capabilities.
#
# `qemu-tool compose` fills CONTAINER_USER and CONTAINER_KVM_GID in from your
# own uid:gid and the host kvm group, so the documented command needs no
# configuration. Plain `docker compose` against this file is told what to set
# rather than quietly running the stack as root -- which is what the `:?` form
# buys and `:-` would not: an unset variable interpolates to empty, `user: ":"`
# is not an error to Docker, and the container runs as uid 0.
#
#   CONTAINER_USER=$(id -u):$(id -g) \
#   CONTAINER_KVM_GID=$(getent group kvm | cut -d: -f3) docker compose up
#
# The kvm group is needed because a container given --user <uid>:<gid> holds no
# supplementary groups, and /dev/kvm is crw-rw---- root:kvm. You must be in
# that group on the host too.
x-gpu-common: &gpu-common
  volumes:
    - vfu-sockets:/run/vfu
  restart: on-failure
  user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
  # rocjitsu opens a unix socket on a tmpfs volume (mounted 1777, so an
  # unprivileged uid creates its socket there with no pre-seeding) and needs no
  # capability at all. Docker nonetheless grants CHOWN, DAC_OVERRIDE, SETUID,
  # NET_RAW and ten more by default, which is a default rather than a decision.
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"

services:
  rocjitsu:
    <<: *gpu-common
    image: "${ROCJITSU_IMAGE:-docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20261014.geea0485-rocjitsu.84fb06b}"
    command:
      - rocjitsu
      - --config
      - "${ROCJITSU_CONFIG_PATH:-/usr/local/share/rocjitsu/configs/gfx1250_mi455x.json}"
      - --vfio-socket
      - /run/vfu/rocjitsu-1.sock
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /run/vfu/rocjitsu-1.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  qemu:
    image: "${QEMU_IMAGE:-docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261014.geea0485-qemu11.1.2-vfu.8039244}"
    depends_on:
      rocjitsu:
        condition: service_healthy
    volumes:
      - vfu-sockets:/run/vfu:ro
      - "${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}:${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}"
      - "${QEMU_TOOL_SRC:-/tmp}:/qemu-tool-src:ro"
    devices:
      - /dev/kvm
    # Same uid as rocjitsu, and that is load-bearing rather than tidy:
    # rocjitsu does not chmod its vfio-user socket, so it stays 0755 owned by
    # whoever created it, and connect(2) on a unix socket needs write on the
    # inode. A qemu on a different uid cannot attach the GPU at all.
    user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
    group_add:
      - "${CONTAINER_KVM_GID:?set CONTAINER_KVM_GID to the host kvm gid}"
    # QEMU configures no network here (SLIRP is userspace), makes no device
    # nodes, and binds only 2222.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    shm_size: "${VM_SHM_SIZE:-8g}"
    # Passed into the container rather than interpolated into the command, so
    # the shell can drop --nvme entirely when the setting is unset. run-vm
    # cannot find the settings file from inside the container, so anything it
    # needs has to arrive as a flag.
    environment:
      VM_NVME: "${VM_NVME:-}"
    ports:
      - "${VM_SSH_PORT:-2222}:2222"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /qemu-tool-src/qemu/pyproject.toml ]; then
          cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
          HOME=/tmp PIPX_HOME=/tmp/pipx PIPX_BIN_DIR=/tmp/bin pipx install --force /tmp/qemu-tool-build
        else
          HOME=/tmp PIPX_HOME=/tmp/pipx PIPX_BIN_DIR=/tmp/bin pipx install --force qemu-tool
        fi
        socks=$(ls /run/vfu/*.sock 2>/dev/null | tr '\n' ',' | sed 's/,$//')
        if [ -z "$$socks" ]; then
          echo "ERROR: no vfio-user sockets found in /run/vfu" >&2
          exit 1
        fi
        exec /tmp/bin/qemu-tool run-vm \
          --images "${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}" \
          --vm-name "${VM_NAME:-qemu-minimal}" \
          --vcpus "${VM_VCPUS:-4}" \
          --vmem "${VM_VMEM:-8192}" \
          --ssh-port 2222 \
          --vfio-userdev "$$socks" \
          $${VM_NVME:+--nvme "$$VM_NVME"}

volumes:
  vfu-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
