# Generated by `qemu-tool gen-compose`. Do not edit.
#
# Regenerate after changing qemu/env/mi355x-node:
#   qemu-tool gen-compose --env-file qemu/env/mi355x-node
#
# env-file: qemu/env/mi355x-node
# env-sha256: eaac64e24c1ca551391a2d7920b8b4960f274dd1af31e6500a135387e5234a58

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-ernic-common: &ernic-common
  image: "${ERNIC_IMAGE}"
  logging: *logging
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  volumes:
    - vfu-sockets:/run/vfu
    - ernic-stats:/run/ernic-stats

x-qemu-common: &qemu-common
  image: "${QEMU_IMAGE}"
  logging: *logging
  volumes:
    - vfu-sockets:/run/vfu:ro
    - "${VM_IMAGES_DIR}:${VM_IMAGES_DIR}"
    - "${QEMU_TOOL_SRC:-../../..}:/qemu-tool-src:ro"
  devices:
    - /dev/kvm
  restart: "no"

services:

  # ---- VM 1 NIC 1/8: TCP mesh manager ----
  ernic-1-1:
    <<: *ernic-common
    hostname: 172.31.1.1
    devices:
      - /dev/net/tun
    networks:
      l2: {}
      fleet:
        ipv4_address: 172.31.1.1
    restart: "no"
    environment:
      - ERNIC_TCP_GUEST_GIDS=fe80::706f:63ff:fe6d:1,192.168.100.11
    entrypoint:
      - /bin/sh
      - -c
      - |
        n=0; until [ -e /sys/class/net/tap0 ]; do
          n=$$((n+1))
          [ $$n -gt 240 ] && echo 'tap0 never appeared' && exit 1
          sleep 0.5
        done
        exec rocm-ernic '-s' '/run/vfu/ernic-1-1.sock' '-b' 'tcp:manager:listen:6320' '-m' '72:6f:63:6d:00:01' '-S' '/run/ernic-stats/ernic-1-1.stats' '-T' 'tap0'
    healthcheck:
      test: ["CMD", "awk", "$2 ~ /:18B0$/ && $4 == \"0A\" {found=1} END {exit !found}", "/proc/net/tcp"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1 NIC 2/8: TCP mesh worker (node 2) ----
