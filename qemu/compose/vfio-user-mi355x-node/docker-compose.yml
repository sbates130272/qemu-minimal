        condition: service_healthy
      rocjitsu-4-3:
        condition: service_healthy
      rocjitsu-4-4:
        condition: service_healthy
      rocjitsu-4-5:
        condition: service_healthy
      rocjitsu-4-6:
        condition: service_healthy
      rocjitsu-4-7:
        condition: service_healthy
