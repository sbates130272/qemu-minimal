        ipv4_address: 172.31.3.4
    shm_size: "16g"
    depends_on:
      ernic-4-1:
        condition: service_healthy
      ernic-4-2:
        condition: service_healthy
      ernic-4-3:
        condition: service_healthy
      ernic-4-4:
        condition: service_healthy
      ernic-4-5:
        condition: service_healthy
      ernic-4-6:
        condition: service_healthy
      ernic-4-7:
        condition: service_healthy
