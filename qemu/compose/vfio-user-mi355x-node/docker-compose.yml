          --vfio-user-root-port \
          --vfio-user-switch-width 2 \
          --cpu-sockets 1 \
          --pci-hole64-size "512G" \
          --vcpus "8" \
          --vmem "16384" \
          --extra-hostfwd "tcp::9100-:9100" \
          --vfio-userdev "/run/vfu/ernic-3-1.sock,/run/vfu/rocjitsu-3-1.sock,/run/vfu/ernic-3-2.sock,/run/vfu/rocjitsu-3-2.sock,/run/vfu/ernic-3-3.sock,/run/vfu/rocjitsu-3-3.sock,/run/vfu/ernic-3-4.sock,/run/vfu/rocjitsu-3-4.sock,/run/vfu/ernic-3-5.sock,/run/vfu/rocjitsu-3-5.sock,/run/vfu/ernic-3-6.sock,/run/vfu/rocjitsu-3-6.sock,/run/vfu/ernic-3-7.sock,/run/vfu/rocjitsu-3-7.sock,/run/vfu/ernic-3-8.sock,/run/vfu/rocjitsu-3-8.sock"

