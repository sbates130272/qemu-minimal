---
# Generated by `qemu-tool gen-compose`. Do not edit.
# env-file: qemu/env.scale-out
# env-sha256: e4b9ed72f2266298d057ee73695887fd869384a2dac823e09dc5c622a90a8fef

global:
  scrape_interval: 15s

scrape_configs:
  # The guests sit behind QEMU SLIRP inside their qemu
  # containers and have no address on this network. The
  # container is the target; --extra-hostfwd forwards :9100
  # through to the guest's node-exporter. Each container has
  # its own netns, so every VM uses the same port.
  #
  # Targets are addresses, not names: the compose file pins one
  # per service so nothing in the fleet depends on Docker's
  # embedded DNS, and a scrape loop is no exception.
  - job_name: fleet-node
    static_configs:
      - targets: ["172.31.3.1:9100"]
        labels:
          vm: "1"
          vm_name: "stebates-fleet-1"
      - targets: ["172.31.3.2:9100"]
        labels:
          vm: "2"
          vm_name: "stebates-fleet-2"
      - targets: ["172.31.3.3:9100"]
        labels:
          vm: "3"
          vm_name: "stebates-fleet-3"
      - targets: ["172.31.3.4:9100"]
        labels:
          vm: "4"
          vm_name: "stebates-fleet-4"
      - targets: ["172.31.3.5:9100"]
        labels:
          vm: "5"
          vm_name: "stebates-fleet-5"
      - targets: ["172.31.3.6:9100"]
        labels:
          vm: "6"
          vm_name: "stebates-fleet-6"
      - targets: ["172.31.3.7:9100"]
        labels:
          vm: "7"
          vm_name: "stebates-fleet-7"
      - targets: ["172.31.3.8:9100"]
        labels:
          vm: "8"
          vm_name: "stebates-fleet-8"

  - job_name: ernic-stats
    static_configs:
      - targets: ["172.31.0.10:9840"]
