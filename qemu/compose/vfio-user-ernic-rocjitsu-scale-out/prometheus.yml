---
# Generated by `qemu-tool gen-compose`. Do not edit.
# env-file: qemu/env.scale-out
# env-sha256: 61b89f4047b67478234ad3194c383843bf7e0bbf99478eeb35037858061f11ab

global:
  scrape_interval: 15s

scrape_configs:
  # The guests sit behind QEMU SLIRP inside their qemu
  # containers and have no address on this network. The
  # container is the target; --extra-hostfwd forwards :9100
  # through to the guest's node-exporter. Each container has
  # its own netns, so every VM uses the same port.
  #
  # Targets are addresses, not names: the compose file pins one
  # per service so nothing in the fleet depends on Docker's
  # embedded DNS, and a scrape loop is no exception.
  - job_name: fleet-node
    static_configs:
      - targets: ["172.31.3.1:9100"]
        labels:
          vm: "1"
          vm_name: "stebates-fleet-1"
      - targets: ["172.31.3.2:9100"]
        labels:
          vm: "2"
          vm_name: "stebates-fleet-2"
      - targets: ["172.31.3.3:9100"]
        labels:
          vm: "3"
          vm_name: "stebates-fleet-3"
      - targets: ["172.31.3.4:9100"]
        labels:
          vm: "4"
          vm_name: "stebates-fleet-4"
      - targets: ["172.31.3.5:9100"]
        labels:
          vm: "5"
          vm_name: "stebates-fleet-5"
      - targets: ["172.31.3.6:9100"]
        labels:
          vm: "6"
          vm_name: "stebates-fleet-6"
      - targets: ["172.31.3.7:9100"]
        labels:
          vm: "7"
          vm_name: "stebates-fleet-7"
      - targets: ["172.31.3.8:9100"]
        labels:
          vm: "8"
          vm_name: "stebates-fleet-8"

  - job_name: ernic-stats
    static_configs:
      - targets: ["172.31.0.10:9840"]

  # The LMCache MP server inside each guest. Same shape as
  # fleet-node above and for the same reason -- the target
  # is the qemu CONTAINER, and VM_EXTRA_HOSTFWD forwards
  # the port through to the server. Add
  #   tcp::9500-:9500
  # to VM_EXTRA_HOSTFWD or every target here stays down.
  #
  # This is the server's --http-port, which is where
  # /metrics actually lives. Its --prometheus-port is a
  # decoy here: it only binds when the HTTP server is off,
  # and `lmcache server` always runs it.
  - job_name: lmcache-server
    static_configs:
      - targets: ["172.31.3.1:9500"]
        labels:
          vm: "1"
          vm_name: "stebates-fleet-1"
          lmcache_instance_id: "stebates-fleet-1"
      - targets: ["172.31.3.2:9500"]
        labels:
          vm: "2"
          vm_name: "stebates-fleet-2"
          lmcache_instance_id: "stebates-fleet-2"
      - targets: ["172.31.3.3:9500"]
        labels:
          vm: "3"
          vm_name: "stebates-fleet-3"
          lmcache_instance_id: "stebates-fleet-3"
      - targets: ["172.31.3.4:9500"]
        labels:
          vm: "4"
          vm_name: "stebates-fleet-4"
          lmcache_instance_id: "stebates-fleet-4"
      - targets: ["172.31.3.5:9500"]
        labels:
          vm: "5"
          vm_name: "stebates-fleet-5"
          lmcache_instance_id: "stebates-fleet-5"
      - targets: ["172.31.3.6:9500"]
        labels:
          vm: "6"
          vm_name: "stebates-fleet-6"
          lmcache_instance_id: "stebates-fleet-6"
      - targets: ["172.31.3.7:9500"]
        labels:
          vm: "7"
          vm_name: "stebates-fleet-7"
          lmcache_instance_id: "stebates-fleet-7"
      - targets: ["172.31.3.8:9500"]
        labels:
          vm: "8"
          vm_name: "stebates-fleet-8"
          lmcache_instance_id: "stebates-fleet-8"

  # The coordinator's directory, via qemu-tool
  # lmcache-stats. Separate from the job below because
  # the coordinator's own /metrics does not carry it.
  - job_name: lmcache-directory
    static_configs:
      - targets: ["172.31.0.14:9841"]

  - job_name: lmcache-coordinator
    static_configs:
      - targets: ["172.31.0.12:9300"]
