---
# Generated by `qemu-tool gen-compose`. Do not edit.
# env-file: qemu/env/helios-tray.xml
# env-sha256: 203d1839dc7300c5d69aef3829bb4c6661a86f39b952a783fcfaebff68981712  # pre-commit: ignore

global:
  scrape_interval: 15s

scrape_configs:
  # The guests sit behind QEMU SLIRP inside their qemu
  # containers and have no address on this network. The
  # container is the target; --extra-hostfwd forwards :9100
  # through to the guest's node-exporter. Each container has
  # its own netns, so every VM uses the same port.
  #
  # Targets are addresses, not names: the compose file pins one
  # per service so nothing in the fleet depends on Docker's
  # embedded DNS, and a scrape loop is no exception.
  - job_name: fleet-node
    static_configs:
      - targets: ["172.31.3.1:9100"]
        labels:
          vm: "1"
          vm_name: "stebates-helios-1"

  # AMD GPU metrics exporter inside each guest. Same shape as
  # fleet-node: the target is the qemu CONTAINER and
  # VM_EXTRA_HOSTFWD tcp::9488-:9488 forwards the port through
  # to amd-metrics-exporter running in the guest.
  - job_name: amd-gpu
    static_configs:
      - targets: ["172.31.3.1:9488"]
        labels:
          vm: "1"
          vm_name: "stebates-helios-1"

  # hsa-snoop: HSA/AQL queue snooper (port 9490). Exposes per-kernel
  # launch counts, duration histograms and active queue counts via
  # kprobe on kfd_ioctl_create_queue. Same hostfwd pattern as fleet-node.
  - job_name: hsa-snoop
    static_configs:
      - targets: ["172.31.3.1:9490"]
        labels:
          vm: "1"
          vm_name: "stebates-helios-1"

  # RDMA metrics exporter inside each guest (port 9879).
  # Reads /sys/class/infiniband/*/counters; on ionic_rdma
  # these are empty today, but the target is wired so that
  # when the emulated device grows counters it starts reporting
  # with no further change. Same hostfwd pattern as fleet-node.
  - job_name: rdma-exporter
    static_configs:
      - targets: ["172.31.3.1:9879"]
        labels:
          vm: "1"
          vm_name: "stebates-helios-1"

  - job_name: ernic-stats
    static_configs:
      - targets: ["172.31.0.10:9840"]
