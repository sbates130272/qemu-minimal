  # ---- metrics (opt-in: --profile metrics) ----
  ernic-stats-exporter:
    <<: *qemu-common
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.10
    devices: []
    volumes:
      - ernic-stats:/run/ernic-stats:ro
      - "${QEMU_TOOL_SRC:-../../..}:/qemu-tool-src:ro"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
        for i in 1 2 3 4 5; do
          PIPX_BIN_DIR=/usr/local/bin pipx install --force \
            /tmp/qemu-tool-build && break
          sleep 10
        done
        exec qemu-tool ernic-stats \
          --stats-dir /run/ernic-stats \
          --port 9840

  prometheus:
    image: docker.io/prom/prometheus:latest
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.11
    restart: on-failure
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"

networks:
  # Every service has a fixed address and nothing resolves a
  # service name at run time. Docker's embedded DNS is a single
  # resolver per network, and a fleet start burst saturates it:
  # at 48 VMs, workers died with 'Temporary failure in name
  # resolution', and because the mesh allocates a NEW node id on
  # every reconnect, the restarts walked the fleet toward the
  # 64-node protocol ceiling. Third octet is the service family:
  #   0 infra   1 ernic   2 rocjitsu   3 qemu
  fleet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  vfu-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  ernic-stats:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  prom-data:
