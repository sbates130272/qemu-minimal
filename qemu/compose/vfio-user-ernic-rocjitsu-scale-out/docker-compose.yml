---
# Generated by `qemu-tool gen-compose`. Do not edit.
#
# Regenerate after changing qemu/env.scale-out:
#   qemu-tool gen-compose --env-file qemu/env.scale-out
#
# env-file: qemu/env.scale-out
# env-sha256: 61b89f4047b67478234ad3194c383843bf7e0bbf99478eeb35037858061f11ab

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-ernic-common: &ernic-common
  image: "${ERNIC_IMAGE}"
  logging: *logging
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  volumes:
    - vfu-sockets:/run/vfu
    - ernic-stats:/run/ernic-stats

x-qemu-common: &qemu-common
  image: "${QEMU_IMAGE}"
  logging: *logging
  volumes:
    - vfu-sockets:/run/vfu:ro
    - "${VM_IMAGES_DIR}:${VM_IMAGES_DIR}"
    - "/var/lib/qemu-tool/share:/var/lib/qemu-tool/share:ro"
    - "${QEMU_TOOL_SRC:-../../..}:/qemu-tool-src:ro"
  devices:
    - /dev/kvm
  restart: "no"

services:

  # ---- VM 1 NIC: TCP mesh manager ----
  ernic-1:
    <<: *ernic-common
    hostname: 172.31.1.1
    devices:
      - /dev/net/tun
    networks:
      l2: {}
      fleet:
        ipv4_address: 172.31.1.1
    restart: "no"
    environment:
      - ERNIC_TCP_GUEST_GIDS=fe80::706f:63ff:fe6d:1,192.168.100.11
    entrypoint:
      - /bin/sh
      - -c
      - |
        n=0; until [ -e /sys/class/net/tap0 ]; do
          n=$$((n+1))
          [ $$n -gt 240 ] && echo 'tap0 never appeared' && exit 1
          sleep 0.5
        done
        exec rocm-ernic '-s' '/run/vfu/ernic-1.sock' '-b' 'tcp:manager:listen:6320' '-m' '72:6f:63:6d:00:01' '-S' '/run/ernic-stats/ernic-1.stats' '-T' 'tap0'
    healthcheck:
      test: ["CMD", "awk", "$2 ~ /:18B0$/ && $4 == \"0A\" {found=1} END {exit !found}", "/proc/net/tcp"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

