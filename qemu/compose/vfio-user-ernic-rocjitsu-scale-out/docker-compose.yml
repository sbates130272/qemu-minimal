  tapsetup-1-3:
    build:
      context: ./tapsetup
      args:
        - AMD_CERT
    image: "qemu-tool/ernic-tapsetup:1"
    pull_policy: build
    logging: *logging
    network_mode: "service:ernic-1-3"
