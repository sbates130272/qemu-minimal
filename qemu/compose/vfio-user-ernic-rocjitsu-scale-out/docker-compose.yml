        condition: service_started
  tapsetup-8:
    build: ./tapsetup
    image: "qemu-tool/ernic-tapsetup:1"
    logging: *logging
    network_mode: "service:ernic-8"
    cap_add: [NET_ADMIN]
    environment:
      - FLEET_PREFIX=172.31
    devices:
      - /dev/net/tun
    restart: "no"
    depends_on:
      ernic-8:
        condition: service_started

networks:
  # Dumb shared L2 carrying guest Ethernet only. No address
  # is assigned: each ernic bridges its tap onto it, and the
  # guests address each other over ERNIC_GUEST_SUBNET.
  l2:
    driver: bridge
  # Every service has a fixed address and nothing resolves a
  # service name at run time. Docker's embedded DNS is a single
  # resolver per network, and a fleet start burst saturates it:
  # at 48 VMs, workers died with 'Temporary failure in name
  # resolution', and because the mesh allocates a NEW node id on
  # every reconnect, the restarts walked the fleet toward the
  # 64-node protocol ceiling. Third octet is the service family:
  #   0 infra   1 ernic   2 rocjitsu   3 qemu
  fleet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  vfu-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  ernic-stats:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
