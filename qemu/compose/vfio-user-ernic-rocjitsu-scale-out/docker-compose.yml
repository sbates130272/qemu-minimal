      retries: 30
      start_period: 5s

  # ---- VM 1 SDXI ----
  sdxi-1:
    <<: *qemu-common
    image: "${SDXI_IMAGE}"
    networks:
      fleet:
        ipv4_address: 172.31.4.1
    restart: on-failure
    command:
      - -s
      - /run/vfu/sdxi-1.sock
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -qE ' 01 [0-9]+ /run/vfu/sdxi-1[.]sock$' /proc/net/unix"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1: guest ernic IP 192.168.100.11 ----
  qemu-1:
    <<: *qemu-common
    networks:
      fleet:
        ipv4_address: 172.31.3.1
    shm_size: "16g"
    depends_on:
      ernic-1-1:
        condition: service_healthy
      ernic-1-2:
        condition: service_healthy
      ernic-1-3:
        condition: service_healthy
      ernic-1-4:
        condition: service_healthy
      ernic-1-5:
        condition: service_healthy
      ernic-1-6:
        condition: service_healthy
      ernic-1-7:
        condition: service_healthy
      ernic-1-8:
        condition: service_healthy
      rocjitsu-1-1:
        condition: service_healthy
      rocjitsu-1-2:
        condition: service_healthy
      rocjitsu-1-3:
        condition: service_healthy
      rocjitsu-1-4:
        condition: service_healthy
      sdxi-1:
        condition: service_healthy
    ports:
      - "2222:2222"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /qemu-tool-src/qemu/pyproject.toml ]; then
          cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
          rm -rf /tmp/qemu-tool-build/build /tmp/qemu-tool-build/*.egg-info
          python3 -m venv /tmp/qemu-tool-venv
          /tmp/qemu-tool-venv/bin/pip install -q -e /tmp/qemu-tool-build
          mkdir -p /tmp/bin
          ln -sf /tmp/qemu-tool-venv/bin/qemu-tool /tmp/bin/qemu-tool
        else
          for i in 1 2 3 4 5; do
            HOME=/tmp PIPX_HOME=/tmp/pipx PIPX_BIN_DIR=/tmp/bin pipx install --force qemu-tool && break
            sleep 10
          done
        fi
        exec /tmp/bin/qemu-tool run-vm \
          --images "${VM_IMAGES_DIR}" \
          --vm-name "stebates-helios-1" \
          --ssh-port 2222 \
          --backing-shared \
          --vfio-user-root-port \
          --vfio-user-switch-width 3 \
          --cpu-sockets 1 \
          --cpu-phys-bits 41 \
          --pci-hole64-size "512G" \
          --vcpus "8" \
          --vmem "16384" \
          --nvme "6" \
          --extra-hostfwd "tcp::9100-:9100" \
          --vfio-userdev "/run/vfu/ernic-1-1.sock,/run/vfu/ernic-1-2.sock,/run/vfu/rocjitsu-1-1.sock,/run/vfu/ernic-1-3.sock,/run/vfu/ernic-1-4.sock,/run/vfu/rocjitsu-1-2.sock,/run/vfu/ernic-1-5.sock,/run/vfu/ernic-1-6.sock,/run/vfu/rocjitsu-1-3.sock,/run/vfu/ernic-1-7.sock,/run/vfu/ernic-1-8.sock,/run/vfu/rocjitsu-1-4.sock"
          --vfio-userdev-cpu "/run/vfu/sdxi-1.sock"

  # ---- metrics (opt-in: --profile metrics) ----
  ernic-stats-exporter:
    <<: *qemu-common
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.10
    devices: []
    group_add: []
    user: "65534:65534"
    stop_grace_period: 5s
    volumes:
      - ernic-stats:/run/ernic-stats:ro
      - "${QEMU_TOOL_SRC:-/tmp}:/qemu-tool-src:ro"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /qemu-tool-src/qemu/pyproject.toml ]; then
          cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
          rm -rf /tmp/qemu-tool-build/build /tmp/qemu-tool-build/*.egg-info
          python3 -m venv /tmp/qemu-tool-venv
          /tmp/qemu-tool-venv/bin/pip install -q -e /tmp/qemu-tool-build
          mkdir -p /tmp/bin
          ln -sf /tmp/qemu-tool-venv/bin/qemu-tool /tmp/bin/qemu-tool
        else
          for i in 1 2 3 4 5; do
            HOME=/tmp PIPX_HOME=/tmp/pipx PIPX_BIN_DIR=/tmp/bin pipx install --force qemu-tool && break
            sleep 10
          done
        fi
        exec /tmp/bin/qemu-tool ernic-stats \
          --stats-dir /run/ernic-stats \
          --port 9840

  prometheus:
    image: docker.io/prom/prometheus:latest
    logging: *logging
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.11
    restart: on-failure
    user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/qemu-tool/stacks/helios-tray/prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  # ---- logs (opt-in: --profile metrics) ----
  loki:
    image: "docker.io/grafana/loki:3.3.2"
    logging: *logging
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.15
    restart: on-failure
    user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ./logging/loki-config.yml:/etc/loki/config.yml:ro
      - /var/lib/qemu-tool/loki-data:/loki
    command:
      - -config.file=/etc/loki/config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Ships every stack container's logs to Loki. The guests
  # run their own Alloy: a VM's journal is behind QEMU,
  # not on this Docker socket.
  #
  # Mounts the Docker socket directly. Anything that can
  # connect to that socket is root on the host, whatever
  # the mount flags say. Accepted here: this is a lab
  # stack and the socket is needed for container discovery
  # and log tailing. The container is otherwise locked
  # down (cap_drop ALL, no-new-privileges).
  alloy:
    image: "docker.io/grafana/alloy:v1.5.1"
    logging: *logging
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.16
    restart: on-failure
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      loki:
        condition: service_healthy
    environment:
      - LOKI_HOST=172.31.0.15:3100
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logging/alloy-host.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy

  grafana:
    image: "docker.io/grafana/grafana:latest"
    logging: *logging
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.13
    restart: on-failure
    user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=dark
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fleet/quickstart.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /var/lib/qemu-tool/grafana-data:/var/lib/grafana
    ports:
      - "0.0.0.0:3000:3000"

  # ---- guest Ethernet wiring ----
  # One short-lived sidecar per ernic. It shares that
  # ernic's network namespace, creates the tap and the
  # bridge, and exits. NET_ADMIN lives here and nowhere
  # else.
  #
  # The one service CONTAINER_USER does not apply to, and
  # not by choice. cap_add raises only the bounding and
  # permitted sets; Docker sets no AMBIENT capabilities,
  # so a non-root uid holds nothing effective and
  # NET_ADMIN is dropped at the switch to it. Measured:
  # --user <uid> --cap-add NET_ADMIN gives 'RTNETLINK
  # answers: Operation not permitted' on the first `ip`
  # call. Compose cannot express ambient caps, so there is
  # no fix for the uid.
  #
  # What CAN be done is the rest of the cap set. This used
  # to run at Docker's default -- CHOWN, DAC_OVERRIDE,
  # FOWNER, SETUID, SETGID, NET_RAW, MKNOD and more -- plus
  # NET_ADMIN. It now runs at NET_ADMIN and nothing else,
  # on a read-only root filesystem, for the seconds it
  # takes to wire a bridge.
  #
  # TAP_OWNER below is how the ernic stays unprivileged
  # anyway: the tap is created persistent and owned by
  # the uid that will attach to it, because TUNSETIFF on
  # a persistent tap needs a matching owner or
  # NET_ADMIN. Left at the default of 0 it would hand a
  # non-root ernic EPERM and a guest with no Ethernet.
  tapsetup-1-1:
    build:
      context: ./tapsetup
      args:
        - AMD_CERT
    image: "qemu-tool/ernic-tapsetup:1"
    pull_policy: build
    logging: *logging
    network_mode: "service:ernic-1-1"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      - FLEET_PREFIX=172.31
      - "TAP_OWNER=${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
    devices:
      - /dev/net/tun
    restart: "no"
    depends_on:
      ernic-1-1:
        condition: service_started
  tapsetup-1-2:
    build:
      context: ./tapsetup
      args:
        - AMD_CERT
    image: "qemu-tool/ernic-tapsetup:1"
    pull_policy: build
    logging: *logging
    network_mode: "service:ernic-1-2"
