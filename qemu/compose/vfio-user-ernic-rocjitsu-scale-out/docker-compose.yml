---
# Generated by `qemu-tool gen-compose`. Do not edit.
#
# Regenerate after changing qemu/env/helios-tray.xml:
#   qemu-tool gen-compose --fleet-file qemu/env/helios-tray.xml
#
# env-file: qemu/env/helios-tray.xml
# env-sha256: 203d1839dc7300c5d69aef3829bb4c6661a86f39b952a783fcfaebff68981712  # pre-commit: ignore

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-ernic-common: &ernic-common
  image: "${ERNIC_IMAGE}"
  logging: *logging
  stop_signal: SIGKILL
  user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  volumes:
    - vfu-sockets:/run/vfu
    - ernic-stats:/run/ernic-stats

x-qemu-common: &qemu-common
  image: "${QEMU_IMAGE}"
  logging: *logging
  volumes:
    - vfu-sockets:/run/vfu:ro
    - "${VM_IMAGES_DIR}:${VM_IMAGES_DIR}"
    - "${QEMU_TOOL_SRC:-../../..}:/qemu-tool-src:ro"
  devices:
    - /dev/kvm
  user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
  group_add:
    - "${CONTAINER_KVM_GID:?set CONTAINER_KVM_GID to the host kvm gid}"
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  stop_grace_period: 120s
  restart: "no"

services:

  # ---- VM 1 NIC 1/8: TCP mesh manager ----
  ernic-1-1:
    <<: *ernic-common
    hostname: 172.31.1.1
    devices:
      - /dev/net/tun
    networks:
      l2: {}
      fleet:
        ipv4_address: 172.31.1.1
    restart: "no"
    environment:
      - ERNIC_TCP_GUEST_GIDS=fe80::706f:63ff:fe6d:1,192.168.100.11
    entrypoint:
      - /bin/sh
      - -c
      - |
        n=0; until [ -e /sys/class/net/tap0 ]; do
          n=$$((n+1))
          [ $$n -gt 240 ] && echo 'tap0 never appeared' && exit 1
          sleep 0.5
        done
        exec rocm-ernic '-s' '/run/vfu/ernic-1-1.sock' '-b' 'tcp:manager:listen:6320' '-m' '72:6f:63:6d:00:01' '-S' '/run/ernic-stats/ernic-1-1.stats' '-T' 'tap0'
    healthcheck:
      test: ["CMD", "awk", "$2 ~ /:18B0$/ && $4 == \"0A\" {found=1} END {exit !found}", "/proc/net/tcp", "/proc/net/tcp6"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1 NIC 2/8: TCP mesh worker (node 2) ----
  ernic-1-2:
    <<: *ernic-common
    hostname: 172.31.1.2
    devices:
      - /dev/net/tun
    networks:
      l2: {}
      fleet:
        ipv4_address: 172.31.1.2
    restart: on-failure
    environment:
      - ERNIC_TCP_GUEST_GIDS=fe80::706f:63ff:fe6d:2,192.168.100.12
    entrypoint:
      - /bin/sh
      - -c
      - |
        n=0; until [ -e /sys/class/net/tap0 ]; do
          n=$$((n+1))
          [ $$n -gt 240 ] && echo 'tap0 never appeared' && exit 1
          sleep 0.5
        done
        exec rocm-ernic '-s' '/run/vfu/ernic-1-2.sock' '-b' 'tcp:worker:172.31.1.1:6320' '-m' '72:6f:63:6d:00:02' '-S' '/run/ernic-stats/ernic-1-2.stats' '-T' 'tap0'
    depends_on:
      ernic-1-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "awk", "$3 ~ /:18B0$/ && $4 == \"01\" {found=1} END {exit !found}", "/proc/net/tcp", "/proc/net/tcp6"]
