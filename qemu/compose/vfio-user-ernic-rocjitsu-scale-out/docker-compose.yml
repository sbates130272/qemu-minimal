    image: "qemu-tool/ernic-tapsetup:1"
    logging: *logging
    network_mode: "service:ernic-3"
    cap_add: [NET_ADMIN]
    environment:
      - FLEET_PREFIX=172.31
    devices:
      - /dev/net/tun
    restart: "no"
    depends_on:
      ernic-3:
        condition: service_started
  tapsetup-4:
    build: ./tapsetup
    image: "qemu-tool/ernic-tapsetup:1"
    logging: *logging
    network_mode: "service:ernic-4"
    cap_add: [NET_ADMIN]
    environment:
      - FLEET_PREFIX=172.31
    devices:
      - /dev/net/tun
    restart: "no"
    depends_on:
      ernic-4:
        condition: service_started
  tapsetup-5:
    build: ./tapsetup
    image: "qemu-tool/ernic-tapsetup:1"
    logging: *logging
    network_mode: "service:ernic-5"
    cap_add: [NET_ADMIN]
    environment:
      - FLEET_PREFIX=172.31
    devices:
      - /dev/net/tun
    restart: "no"
    depends_on:
      ernic-5:
        condition: service_started
  tapsetup-6:
    build: ./tapsetup
    image: "qemu-tool/ernic-tapsetup:1"
    logging: *logging
    network_mode: "service:ernic-6"
    cap_add: [NET_ADMIN]
    environment:
      - FLEET_PREFIX=172.31
    devices:
      - /dev/net/tun
    restart: "no"
    depends_on:
      ernic-6:
        condition: service_started
  tapsetup-7:
    build: ./tapsetup
    image: "qemu-tool/ernic-tapsetup:1"
    logging: *logging
    network_mode: "service:ernic-7"
    cap_add: [NET_ADMIN]
    environment:
