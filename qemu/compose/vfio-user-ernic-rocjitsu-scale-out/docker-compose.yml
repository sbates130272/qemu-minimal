        exec rocm-ernic '-s' '/run/vfu/ernic-1-7.sock' '-b' 'tcp:worker:172.31.1.1:6320' '-m' '72:6f:63:6d:00:07' '-S' '/run/ernic-stats/ernic-1-7.stats' '-T' 'tap0'
