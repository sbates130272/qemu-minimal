    ports:
      - "2222:2222"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
        for i in 1 2 3 4 5; do
          PIPX_BIN_DIR=/usr/local/bin pipx install --force \
            /tmp/qemu-tool-build && break
          sleep 10
        done
        exec qemu-tool run-vm \
          --images "${VM_IMAGES_DIR}" \
          --vm-name "stebates-fleet-1" \
          --ssh-port 2222 \
          --backing-shared \
          --vcpus "4" \
          --vmem "8192" \
          --extra-hostfwd "tcp::9100-:9100" \
          --vfio-userdev "/run/vfu/ernic-1.sock,/run/vfu/rocjitsu-1.sock"

