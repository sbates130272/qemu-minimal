      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1 GPU 1/4 ----
  rocjitsu-1-1:
    <<: *ernic-common
    image: "${ROCJITSU_IMAGE}"
    networks:
      fleet:
        ipv4_address: 172.31.2.1
    restart: on-failure
    command:
      - rocjitsu
      - --config
      - /usr/local/share/rocjitsu/configs/gfx1250_mi455x.json
      - --vfio-socket
      - /run/vfu/rocjitsu-1-1.sock
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -qE ' 01 [0-9]+ /run/vfu/rocjitsu-1-1[.]sock$' /proc/net/unix"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1 GPU 2/4 ----
  rocjitsu-1-2:
    <<: *ernic-common
    image: "${ROCJITSU_IMAGE}"
    networks:
      fleet:
        ipv4_address: 172.31.2.2
    restart: on-failure
    command:
      - rocjitsu
      - --config
      - /usr/local/share/rocjitsu/configs/gfx1250_mi455x.json
