---
# Generated by `qemu-tool gen-compose`. Do not edit.
#
# Regenerate after changing qemu/env.scale-out:
#   qemu-tool gen-compose --env-file qemu/env.scale-out
#
# env-file: qemu/env.scale-out
# env-sha256: c406ef4ad8de91e668546be513cc86993eef6f4c1802a82111420601e7842317

x-ernic-common: &ernic-common
  image: "${ERNIC_IMAGE}"
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  volumes:
    - vfu-sockets:/run/vfu
    - ernic-stats:/run/ernic-stats
  environment:
    - ERNIC_DEBUG_MESH

x-qemu-common: &qemu-common
  image: "${QEMU_IMAGE}"
  volumes:
    - vfu-sockets:/run/vfu:ro
    - "${VM_IMAGES_DIR}:${VM_IMAGES_DIR}"
    - "${QEMU_TOOL_SRC:-../../..}:/qemu-tool-src:ro"
  devices:
    - /dev/kvm
  restart: "no"

services:

  # ---- VM 1 NIC: TCP mesh manager ----
  ernic-1:
    <<: *ernic-common
    hostname: 172.31.1.1
    networks:
      fleet:
        ipv4_address: 172.31.1.1
    restart: "no"
    command:
      - rocm-ernic
      - -s
      - /run/vfu/ernic-1.sock
      - -b
      - "tcp:manager:listen:6320"
      - -m
      - "72:6f:63:6d:00:01"
      - -S
      - /run/ernic-stats/ernic-1.stats
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',6320),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 2 NIC: TCP mesh worker ----
  ernic-2:
    <<: *ernic-common
    hostname: 172.31.1.2
    networks:
      fleet:
        ipv4_address: 172.31.1.2
    restart: on-failure
    command:
      - rocm-ernic
      - -s
      - /run/vfu/ernic-2.sock
      - -b
      - "tcp:worker:172.31.1.1:6320"
      - -m
      - "72:6f:63:6d:00:02"
      - -S
      - /run/ernic-stats/ernic-2.stats
    depends_on:
      ernic-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-S", "/run/vfu/ernic-2.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 3 NIC: TCP mesh worker ----
  ernic-3:
