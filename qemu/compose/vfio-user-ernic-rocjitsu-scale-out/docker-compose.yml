        exec rocm-ernic '-s' '/run/vfu/ernic-1-4.sock' '-b' 'tcp:worker:172.31.1.1:6320' '-m' '72:6f:63:6d:00:04' '-S' '/run/ernic-stats/ernic-1-4.stats' '-T' 'tap0'
    depends_on:
