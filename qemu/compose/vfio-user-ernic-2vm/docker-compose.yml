---
# 2-VM ernic mesh stack with optional rocjitsu GPUs
#
# Always starts: ernic-hub (VM 1 NIC) + ernic-worker (VM 2 NIC) + qemu-1 + qemu-2.
# rocjitsu GPUs are opt-in per VM via Compose profiles:
#   --profile rocjitsu-vm1   add GPU to VM 1
#   --profile rocjitsu-vm2   add GPU to VM 2
#
# Usage:
#   cp env.example .env && $EDITOR .env
#   # ernic-only:
#   qemu-tool compose --stack vfio-user-ernic-2vm --vm-name vm1-name up
#   # both VMs with GPUs:
#   qemu-tool compose --stack vfio-user-ernic-2vm --vm-name vm1-name \
#     --profile rocjitsu-vm1 --profile rocjitsu-vm2 up
#   ssh -p ${VM1_SSH_PORT:-2222} ubuntu@localhost   # VM 1
#   ssh -p ${VM2_SSH_PORT:-2223} ubuntu@localhost   # VM 2

x-gpu-common: &gpu-common
  restart: on-failure

x-qemu-common: &qemu-common
  image: "${QEMU_IMAGE:-docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:latest}"
  volumes:
    - vfu-sockets:/run/vfu:ro
    - "${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}:${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}"
    - "${QEMU_TOOL_SRC:-../../..}:/qemu-tool-src:ro"
  devices:
    - /dev/kvm
  shm_size: "${VM_SHM_SIZE:-8g}"
  restart: "no"

services:
  # ---- rocm-ernic NIC for VM 1: TCP manager (hub) ----
  ernic-hub:
    <<: *gpu-common
    image: "${ERNIC_IMAGE:-docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-ernic:latest}"
    environment:
      - ERNIC_DEBUG_MESH
    command:
      - rocm-ernic
      - -s
      - /run/vfu/ernic-1.sock
      - -b
      - "tcp:manager:listen:${ERNIC_TCP_PORT:-6320}"
      - -m
      - "${ERNIC1_MAC:-72:6f:63:6d:00:01}"
    volumes:
      - vfu-sockets:/run/vfu
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /run/vfu/ernic-1.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- rocm-ernic NIC for VM 2: TCP worker (spoke) ----
  ernic-worker:
    <<: *gpu-common
    image: "${ERNIC_IMAGE:-docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-ernic:latest}"
    environment:
      - ERNIC_DEBUG_MESH
    command:
      - rocm-ernic
      - -s
      - /run/vfu/ernic-2.sock
      - -b
      - "tcp:worker:ernic-hub:${ERNIC_TCP_PORT:-6320}"
      - -m
      - "${ERNIC2_MAC:-72:6f:63:6d:00:02}"
    volumes:
      - vfu-sockets:/run/vfu
    depends_on:
      ernic-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /run/vfu/ernic-2.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- rocjitsu GPU for VM 1 (opt-in: --profile rocjitsu-vm1) ----
  rocjitsu-1:
    <<: *gpu-common
    profiles: [rocjitsu-vm1]
    image: "${ROCJITSU_IMAGE:-docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:latest}"
    command:
      - rocjitsu
      - --config
      - "/usr/local/share/rocjitsu/configs/${ROCJITSU_CONFIG:-gfx1250_mi455x.json}"
      - --vfio-socket
      - /run/vfu/rocjitsu-1.sock
    volumes:
      - vfu-sockets:/run/vfu
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /run/vfu/rocjitsu-1.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- rocjitsu GPU for VM 2 (opt-in: --profile rocjitsu-vm2) ----
  rocjitsu-2:
    <<: *gpu-common
    profiles: [rocjitsu-vm2]
    image: "${ROCJITSU_IMAGE:-docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:latest}"
    command:
      - rocjitsu
      - --config
      - "/usr/local/share/rocjitsu/configs/${ROCJITSU_CONFIG:-gfx1250_mi455x.json}"
      - --vfio-socket
      - /run/vfu/rocjitsu-2.sock
    volumes:
      - vfu-sockets:/run/vfu
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /run/vfu/rocjitsu-2.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1: always connected to ernic-hub; GPU added when rocjitsu-vm1 profile active ----
  qemu-1:
    <<: *qemu-common
    depends_on:
      ernic-hub:
        condition: service_healthy
      rocjitsu-1:
        condition: service_healthy
        required: false
    ports:
      - "${VM1_SSH_PORT:-2222}:2222"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
        PIPX_BIN_DIR=/usr/local/bin pipx install --force /tmp/qemu-tool-build
        socks=$(ls /run/vfu/ernic-1.sock /run/vfu/rocjitsu-1.sock 2>/dev/null | tr '\n' ',' | sed 's/,$//')
        exec qemu-tool run-vm \
          --images "${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}" \
          --vm-name "${VM1_NAME:-qemu-minimal}" \
          --vcpus "${VM_VCPUS:-4}" \
          --vmem "${VM_VMEM:-8192}" \
          --ssh-port 2222 \
          --vfio-userdev "$$socks"

  # ---- VM 2: always connected to ernic-worker; GPU added when rocjitsu-vm2 profile active ----
  qemu-2:
    <<: *qemu-common
    depends_on:
      ernic-worker:
        condition: service_healthy
      rocjitsu-2:
        condition: service_healthy
        required: false
    ports:
      - "${VM2_SSH_PORT:-2223}:2222"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
        PIPX_BIN_DIR=/usr/local/bin pipx install --force /tmp/qemu-tool-build
        socks=$(ls /run/vfu/ernic-2.sock /run/vfu/rocjitsu-2.sock 2>/dev/null | tr '\n' ',' | sed 's/,$//')
        exec qemu-tool run-vm \
          --images "${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}" \
          --vm-name "${VM2_NAME:-qemu-minimal-2}" \
          --vcpus "${VM_VCPUS:-4}" \
          --vmem "${VM_VMEM:-8192}" \
          --ssh-port 2222 \
          --vfio-userdev "$$socks"

volumes:
  vfu-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
