---
# Generated by `qemu-tool gen-compose`. Do not edit.
#
# Regenerate after changing qemu/stacks/xio.xml:
#   qemu-tool gen-compose --xml qemu/stacks/xio.xml
#
# xml-sha256: ed8e0f7d58ee750610da7518aeec7013c379b0d40c66a7119267f65613ee545f  # pre-commit: ignore

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-ernic-common: &ernic-common
  image: "docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-ernic-sbates-fork:20261112.gdca6903-ernic.90434a2-vfu.3719c3a"
  logging: *logging
  stop_signal: SIGKILL
  user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  volumes:
    - vfu-sockets:/run/vfu
    - ernic-stats:/run/ernic-stats

x-qemu-common: &qemu-common
  image: "docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user-sbates-fork:20261112.gdca6903-qemu.4cb9698-vfu.3719c3a"
  logging: *logging
  volumes:
    - vfu-sockets:/run/vfu:ro
    - "${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}:${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}"
    - "${QEMU_TOOL_SRC:-../../..}:/qemu-tool-src:ro"
  devices:
    - /dev/kvm
  user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
  group_add:
    - "${CONTAINER_KVM_GID:?set CONTAINER_KVM_GID to the host kvm gid}"
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  stop_grace_period: 120s
  restart: "no"

services:

  # ---- VM 1 NIC 1/2 (nic0): loopback backend, no mesh ----
  ernic-1-1:
    <<: *ernic-common
    hostname: 172.31.1.1
    networks:
      fleet:
        ipv4_address: 172.31.1.1
    restart: "no"
    command:
      - "rocm-ernic"
      - "-s"
      - "/run/vfu/ernic-1-1.sock"
      - "-b"
      - "loopback"
      - "-m"
      - "72:6f:63:6d:00:01"
      - "-S"
      - "/run/ernic-stats/ernic-1-1.stats"
    healthcheck:
      test: ["CMD", "awk", "$6 == \"01\" && $8 == \"/run/vfu/ernic-1-1.sock\" {found=1} END {exit !found}", "/proc/net/unix"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1 NIC 2/2 (nvmeof): nvmeof backend, no mesh ----
  ernic-1-2:
    <<: *ernic-common
    hostname: 172.31.1.2
    networks:
      fleet:
        ipv4_address: 172.31.1.2
    restart: "no"
    command:
      - "rocm-ernic"
      - "-s"
      - "/run/vfu/ernic-1-2.sock"
      - "-b"
      - "nvmeof:size=1G,ns=2,kv=1,size=256M"
      - "-m"
      - "72:6f:63:6d:00:02"
      - "-S"
      - "/run/ernic-stats/ernic-1-2.stats"
    healthcheck:
      test: ["CMD", "awk", "$6 == \"01\" && $8 == \"/run/vfu/ernic-1-2.sock\" {found=1} END {exit !found}", "/proc/net/unix"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1 GPU 1/2 (gpu0) ----
  rocjitsu-1-1:
    <<: *ernic-common
    image: "docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20261112.gdca6903-rocjitsu.50be05a"
    networks:
      fleet:
        ipv4_address: 172.31.2.1
    restart: "no"
    command:
      - rocjitsu
      - --config
      - /usr/local/share/rocjitsu/configs/gfx1250_mi455x.json
      - --vfio-socket
      - /run/vfu/rocjitsu-1-1.sock
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -qE ' 01 [0-9]+ /run/vfu/rocjitsu-1-1[.]sock$' /proc/net/unix"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1 GPU 2/2 (gpu1) ----
  rocjitsu-1-2:
    <<: *ernic-common
    image: "docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20261112.gdca6903-rocjitsu.50be05a"
    networks:
      fleet:
        ipv4_address: 172.31.2.2
    restart: "no"
    command:
      - rocjitsu
      - --config
      - /usr/local/share/rocjitsu/configs/gfx1250_mi455x.json
      - --vfio-socket
      - /run/vfu/rocjitsu-1-2.sock
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -qE ' 01 [0-9]+ /run/vfu/rocjitsu-1-2[.]sock$' /proc/net/unix"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ---- VM 1 SPDK NVMe (nvme-kv) ----
  spdk-1:
    <<: *ernic-common
    image: "docker.io/sbates130272/batesste-ci-images-ubuntu-spdk-libvfio-user-sbates-fork:20261119.gc3dd883-spdk.18d1d8d-vfu.3719c3a"
    networks:
      fleet:
        ipv4_address: 172.31.5.1
    restart: "no"
    environment:
      - VFIO_USER_SOCKET_DIR=/run/vfu/spdk-1
      - "NVME_NAMESPACES=kv:mem"
      - "SPDK_SERIAL=XIO-KV"
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -qE ' 01 [0-9]+ /run/vfu/spdk-1/cntrl$' /proc/net/unix"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  # ---- VM 1: guest ernic IP 192.168.100.11 ----
  qemu-1:
    <<: *qemu-common
    networks:
      fleet:
        ipv4_address: 172.31.3.1
    shm_size: "12g"
    depends_on:
      ernic-1-1:
        condition: service_healthy
      ernic-1-2:
        condition: service_healthy
      rocjitsu-1-1:
        condition: service_healthy
      rocjitsu-1-2:
        condition: service_healthy
      spdk-1:
        condition: service_healthy
    ports:
      - "127.0.0.1:2422:2222"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /qemu-tool-src/qemu/pyproject.toml ]; then
          cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
          rm -rf /tmp/qemu-tool-build/build /tmp/qemu-tool-build/*.egg-info
          python3 -m venv /tmp/qemu-tool-venv
          /tmp/qemu-tool-venv/bin/pip install -q setuptools wheel
          /tmp/qemu-tool-venv/bin/pip install -q --no-build-isolation -e /tmp/qemu-tool-build
          mkdir -p /tmp/bin
          ln -sf /tmp/qemu-tool-venv/bin/qemu-tool /tmp/bin/qemu-tool
        else
          for i in 1 2 3 4 5; do
            HOME=/tmp PIPX_HOME=/tmp/pipx PIPX_BIN_DIR=/tmp/bin pipx install --force qemu-tool && break
            sleep 10
          done
        fi
        exec /tmp/bin/qemu-tool run-vm \
          --images "${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}" \
          --vm-name "xio-1" \
          --ssh-port 2222 \
          --backing-shared \
          --vfio-user-root-port \
          --cpu-phys-bits 42 \
          --pci-hole64-size "1024G" \
          --vcpus "4" \
          --vmem "8192" \
          --nvme "1" \
          --extra-hostfwd "tcp::9100-:9100" \
          --extra-hostfwd "tcp::9879-:9879" \
          --pci-mmio-bridge \
          --vfio-userdev "/run/vfu/ernic-1-1.sock,/run/vfu/rocjitsu-1-1.sock,/run/vfu/ernic-1-2.sock,/run/vfu/rocjitsu-1-2.sock,/run/vfu/spdk-1/cntrl"

  # ---- metrics (opt-in: --profile metrics) ----
  ernic-stats-exporter:
    <<: *qemu-common
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.10
    devices: []
    group_add: []
    user: "65534:65534"
    stop_grace_period: 5s
    volumes:
      - ernic-stats:/run/ernic-stats:ro
      - "${QEMU_TOOL_SRC:-/tmp}:/qemu-tool-src:ro"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /qemu-tool-src/qemu/pyproject.toml ]; then
          cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
          rm -rf /tmp/qemu-tool-build/build /tmp/qemu-tool-build/*.egg-info
          python3 -m venv /tmp/qemu-tool-venv
          /tmp/qemu-tool-venv/bin/pip install -q setuptools wheel
          /tmp/qemu-tool-venv/bin/pip install -q --no-build-isolation -e /tmp/qemu-tool-build
          mkdir -p /tmp/bin
          ln -sf /tmp/qemu-tool-venv/bin/qemu-tool /tmp/bin/qemu-tool
        else
          for i in 1 2 3 4 5; do
            HOME=/tmp PIPX_HOME=/tmp/pipx PIPX_BIN_DIR=/tmp/bin pipx install --force qemu-tool && break
            sleep 10
          done
        fi
        exec /tmp/bin/qemu-tool ernic-stats \
          --stats-dir /run/ernic-stats \
          --port 9840

  prometheus:
    image: docker.io/prom/prometheus:latest
    logging: *logging
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.11
    restart: "no"
    user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/qemu-tool/prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  # ---- logs (opt-in: --profile metrics) ----
  loki:
    image: "docker.io/grafana/loki:3.3.2"
    logging: *logging
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.15
    restart: "no"
    user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ./logging/loki-config.yml:/etc/loki/config.yml:ro
      - /var/lib/qemu-tool/loki-data:/loki
    command:
      - -config.file=/etc/loki/config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Ships every stack container's logs to Loki. The guests
  # run their own Alloy: a VM's journal is behind QEMU,
  # not on this Docker socket.
  #
  # Mounts the Docker socket directly. Anything that can
  # connect to that socket is root on the host, whatever
  # the mount flags say. Accepted here: this is a lab
  # stack and the socket is needed for container discovery
  # and log tailing. The container is otherwise locked
  # down (cap_drop ALL, no-new-privileges).
  alloy:
    image: "docker.io/grafana/alloy:v1.5.1"
    logging: *logging
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.16
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      loki:
        condition: service_healthy
    environment:
      - LOKI_HOST=172.31.0.15:3100
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logging/alloy-host.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy

  grafana:
    image: "docker.io/grafana/grafana:latest"
    logging: *logging
    profiles: [metrics]
    networks:
      fleet:
        ipv4_address: 172.31.0.13
    restart: "no"
    user: "${CONTAINER_USER:?set CONTAINER_USER=<uid>:<gid>}"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=dark
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fleet/quickstart.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /var/lib/qemu-tool/grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

networks:
  # Every service has a fixed address and nothing resolves a
  # service name at run time. Docker's embedded DNS is a single
  # resolver per network, and a fleet start burst saturates it:
  # at 48 VMs, workers died with 'Temporary failure in name
  # resolution', and because the mesh allocates a NEW node id on
  # every reconnect, the restarts walked the fleet toward the
  # 64-node protocol ceiling. Third octet is the service family:
  #   0 infra   1 ernic   2 rocjitsu   3 qemu   4 sdxi   5 spdk
  fleet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  vfu-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  ernic-stats:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
