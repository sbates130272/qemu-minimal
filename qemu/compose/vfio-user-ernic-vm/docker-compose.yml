---
# ernic-only VM stack
#
# Spins up a rocm-ernic vfio-user NIC server alongside a qemu-system VM.
# No rocjitsu GPU is attached. Use vfio-user-rocjitsu-vm/ for GPU-only or
# vfio-user-ernic-rocjitsu-vm/ for both.
#
# Usage:
#   cp env.example .env && $EDITOR .env
#   qemu-tool gen-vm --ansible-playbook ansible/playbooks/vm-ernic.yml
#   docker compose up
#   ssh -p ${VM_SSH_PORT:-2222} ubuntu@localhost

x-gpu-common: &gpu-common
  volumes:
    - vfu-sockets:/run/vfu
  restart: on-failure

services:
  ernic:
    <<: *gpu-common
    image: "${ERNIC_IMAGE:-docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-ernic:latest}"
    command: ["rocm-ernic", "-s", "/run/vfu/ernic-1.sock"]
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /run/vfu/ernic-1.sock"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  qemu:
    image: "${QEMU_IMAGE:-docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:latest}"
    depends_on:
      ernic:
        condition: service_healthy
    volumes:
      - vfu-sockets:/run/vfu:ro
      - "${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}:${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}"
      - "${QEMU_TOOL_SRC:-../../..}:/qemu-tool-src:ro"
    devices:
      - /dev/kvm
    shm_size: "${VM_SHM_SIZE:-8g}"
    ports:
      - "${VM_SSH_PORT:-2222}:2222"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp -r /qemu-tool-src/qemu /tmp/qemu-tool-build
        PIPX_BIN_DIR=/usr/local/bin pipx install --force /tmp/qemu-tool-build
        socks=$(ls /run/vfu/*.sock 2>/dev/null | tr '\n' ',' | sed 's/,$//')
        if [ -z "$$socks" ]; then
          echo "ERROR: no vfio-user sockets found in /run/vfu" >&2
          exit 1
        fi
        exec qemu-tool run-vm \
          --images "${VM_IMAGES_DIR:-/var/lib/qemu-tool/images}" \
          --vm-name "${VM_NAME:-qemu-minimal}" \
          --vcpus "${VM_VCPUS:-4}" \
          --vmem "${VM_VMEM:-8192}" \
          --ssh-port 2222 \
          --vfio-userdev "$$socks"

volumes:
  vfu-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
