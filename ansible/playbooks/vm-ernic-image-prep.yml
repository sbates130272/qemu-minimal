---
- name: Bake rocm-ernic prerequisites into a base VM image
  hosts: all
  gather_facts: true
  become: true
  vars:
    username: "{{ vm_username | default('ubuntu') }}"
    root_user: "{{ vm_root_user | default('ubuntu') }}"
    user_setup_motd: true
    user_setup_install_amd_ca: false
    user_setup_dotfiles_enable: true
    rocm_setup_user: "{{ vm_username | default('ubuntu') }}"
    rocm_setup_repo_stream: therock
    rocm_setup_minimal: true
    # hipcc is bundled in the ROCm meta-package under /opt/rocm/core-*/bin/
    # and is not a standalone apt package in the therock stream. Drop it from
    # the minimal list to avoid "no installation candidate" failures.
    rocm_setup_minimal_packages:
      - libstdc++-14-dev
      - amdrocm-runtime-dev
    rocm_setup_skip_reboot: false
    rocm_setup_run_checks: true
    rocm_setup_run_gpu_checks: false
    rocm_setup_extra_kernel_packages:
      - linux-generic-hwe-26.04
    ernic_image_rdma: true
    ernic_gpu_passthrough: true
  pre_tasks:
    # Block distro (Ubuntu universe) versions of packages that the ROCm
    # meta-package ships correctly under /opt/rocm/core-*/bin/. Without this
    # apt resolves rocminfo/hipcc from universe during the rocm_setup role's
    # package install steps, installing stale versions that crash against newer
    # ROCm runtimes.
    - name: Pin ROCm-conflicting Ubuntu universe packages to never-install
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/rocm-no-distro-packages
        content: |
          Package: rocminfo
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: hipcc
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: rocm-smi-lib
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsakmt1
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsa-runtime64-1
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsa-runtime-dev
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libamdhip64-*
          Pin: release o=Ubuntu
          Pin-Priority: -1
        mode: '0644'
      become: true

    - name: Remove any partial dotfiles clone so user_setup can start fresh
      ansible.builtin.file:
        path: "/home/{{ username }}/.dotfiles"
        state: absent
      become: true

    # Remove stale ROCm GPG keyring and sources so the rocm_setup role
    # re-fetches both from scratch. Without this, idempotent key/source
    # tasks on --ansible-only runs leave a mismatched keyring+sources pair
    # that breaks apt-get update for all subsequent roles.
    - name: Remove stale ROCm GPG keyrings and sources
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/apt/keyrings/rocm.gpg
        - /etc/apt/keyrings/amdrocm.gpg
        - /etc/apt/sources.list.d/rocm.sources

    - name: Remove any stale device-metrics-exporter apt sources
      ansible.builtin.shell:
        cmd: |
          find /etc/apt/sources.list.d -type f \
            -exec grep -l "device-metrics-exporter\|amdgpu-exporter" {} \; \
            | xargs -r rm -f
      become: true
      changed_when: false

  roles:
    - role: sbates130272.batesste.user_setup
    - role: sbates130272.batesste.fave_packages
    - role: sbates130272.batesste.git_setup
    - role: sbates130272.rocm_ernic.ernic_image_prep

  tasks:
    # ernic_guest_setup builds the DKMS module and rdma-core provider
    # into the backing image so compose VMs don't have to rebuild on
    # every boot.  The RDMA device check at the end of driver.yml
    # expects hardware (ernic NIC via vfio-user) which is not present
    # during image prep — the rescue block catches that expected failure.
    - name: Install rocm-ernic driver and rdma-core provider (hardware-free build)
      block:
        - ansible.builtin.include_role:
            name: sbates130272.rocm_ernic.ernic_guest_setup
          vars:
            ernic_configure_nic: false
            ernic_gpu_passthrough: false
      rescue:
        - ansible.builtin.debug:
            msg: >-
              ernic_guest_setup RDMA device check failed as expected
              (no ernic NIC during image prep). DKMS module is installed;
              it will bind on compose VM boot.

  post_tasks:
    # Purge any distro ROCm runtime libs that got pulled in as transitive
    # dependencies before the apt pin was active. The ROCm 10.0 meta-package
    # provides the correct versions under /opt/rocm/core-*/lib/.
    - name: Purge stale distro ROCm runtime packages
      ansible.builtin.package:
        name:
          - libhsakmt1
          - libhsa-runtime64-1
          - libhsa-runtime-dev
          - libamdhip64-7
          - libamdhip64-dev
        state: absent
        purge: true
      become: true

    # Blacklist amdgpu from autoloading so it can be probed manually after
    # rocjitsu is ready to handle vfio-user BAR accesses.
    - name: Blacklist amdgpu autoload
      ansible.builtin.copy:
        dest: /etc/modprobe.d/amdgpu-blacklist.conf
        content: "blacklist amdgpu\n"
        mode: '0644'
      become: true

    # Generate all gfx1250 firmware stubs and ip_discovery.bin on the Ansible
    # controller (where Docker is available), then copy the results to the guest.
    - name: Create local temp dir for firmware generation
      ansible.builtin.tempfile:
        state: directory
        prefix: rj_fw_
      register: rj_fw_tmp
      delegate_to: localhost
      become: false

    - name: Generate gfx1250 firmware stubs on controller via rocjitsu container
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          -v {{ rj_fw_tmp.path }}:/out
          {{ rocjitsu_image | default('sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:latest') }}
          python3 /usr/local/bin/vfio_guest_firmware.py --output /out
      delegate_to: localhost
      become: false

    - name: Generate ip_discovery.bin on controller via rocjitsu container
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          -v {{ rj_fw_tmp.path }}:/out
          {{ rocjitsu_image | default('sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:latest') }}
          rj-ip-discovery gfx1250 /out/ip_discovery.bin
      delegate_to: localhost
      become: false

    - name: Copy firmware stubs to guest /lib/firmware/amdgpu/
      ansible.builtin.copy:
        src: "{{ rj_fw_tmp.path }}/"
        dest: /lib/firmware/amdgpu/
        mode: '0644'
      become: true

    - name: Clean up local firmware temp dir
      ansible.builtin.file:
        path: "{{ rj_fw_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false

    # gc_12_1_0_mes.bin and gc_12_1_0_mes1.bin are requested by the gfx12.1
    # driver path but not generated by vfio_guest_firmware.py. The uni_mes
    # stub is a compatible placeholder for these older MES firmware paths.
    - name: Create gc_12_1_0_mes.bin and mes1.bin stubs from uni_mes
      ansible.builtin.copy:
        src: /lib/firmware/amdgpu/gc_12_1_0_uni_mes.bin
        dest: /lib/firmware/amdgpu/{{ item }}
        remote_src: true
        mode: '0644'
      become: true
      loop:
        - gc_12_1_0_mes.bin
        - gc_12_1_0_mes1.bin

    # Patch the amdgpu DKMS source to assume PCIe atomics support when
    # emu_mode=1 is active. The emulated device cannot advertise atomics
    # through the vfio-user PCI capability, but KFD requires them to
    # accept the device. This patches kfd_device.c in the installed DKMS
    # source and triggers a module rebuild.
    - name: Patch KFD atomics check for emu_mode in DKMS source
      ansible.builtin.shell:
        cmd: |
          set -e
          SRC=$(find /usr/src -maxdepth 1 -name 'amdgpu-*' | sort -V | tail -1)
          FILE="$SRC/amd/amdkfd/kfd_device.c"
          OLD='kfd->pci_atomic_requested = amdgpu_amdkfd_have_atomics_support(kfd->adev);'
          NEW='kfd->pci_atomic_requested = amdgpu_amdkfd_have_atomics_support(kfd->adev) || (amdgpu_emu_mode == 1);'
          if grep -qF "$NEW" "$FILE"; then
            echo "already patched"
            exit 0
          fi
          sed -i "s|$OLD|$NEW|g" "$FILE"
          echo "patched $FILE"
        executable: /bin/bash
      become: true
      register: atomics_patch
      changed_when: "'patched' in atomics_patch.stdout"

    - name: Rebuild DKMS amdgpu module after atomics patch
      ansible.builtin.command:
        cmd: dkms autoinstall --force
      become: true
      when: atomics_patch.changed

    # Install rocBLAS dev headers so gfx1250 GEMM workloads can be compiled.
    - name: Install rocBLAS dev package
      ansible.builtin.package:
        name:
          - amdrocm-blas-dev
        state: present
        update_cache: false
      become: true

    # Install a helper script to probe amdgpu after rocjitsu is ready.
    # amdgpu is blacklisted from autoloading; call this script post-boot
    # once the vfio-user socket is up.
    - name: Install amdgpu probe script
      ansible.builtin.copy:
        dest: /usr/local/bin/amdgpu-probe
        mode: '0755'
        content: |
          #!/bin/bash
          # Probe amdgpu with gfx1250 emulation parameters.
          # Run after rocjitsu vfio-user server is ready.
          exec sudo modprobe amdgpu \
            emu_mode=1 \
            fw_load_type=0 \
            discovery=2 \
            ip_block_mask=0x3f \
            vm_update_mode=3 \
            gpu_recovery=0 \
            vramlimit=256
      become: true

    # The device-metrics-exporter repo has no resolute suite yet; pin to noble.
    - name: Add device-metrics-exporter apt source (noble suite)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/device-metrics-exporter.sources
        content: |
          Types: deb
          URIs: https://repo.radeon.com/device-metrics-exporter/apt/1.5.1
          Suites: noble
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/rocm.gpg
        mode: '0644'
      become: true

    - name: Install AMD Device Metrics Exporter
      ansible.builtin.package:
        name: amdgpu-exporter
        state: present
        update_cache: true
      become: true
