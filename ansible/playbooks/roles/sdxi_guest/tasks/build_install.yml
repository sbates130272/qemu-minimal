---
# Phase 1: Fetch and prepare on the CONTROLLER (run_once, non-root).
# The clone runs once regardless of fleet size; SLIRP guests would each need
# to traverse the host network, so this fetch belongs on the controller.

- name: Clone emulation/sdxi from rocm-systems on the controller
  ansible.builtin.shell:
    cmd: |
      set -e
      DEST="{{ sdxi_guest_controller_src_dir }}"
      REF="{{ sdxi_guest_source_ref }}"
      REPO="{{ sdxi_guest_source_repo }}"
      BRANCH="{{ sdxi_guest_source_branch }}"

      if [ "{{ sdxi_guest_force | bool }}" = "True" ] && [ -d "$DEST" ]; then
        rm -rf "$DEST"
      fi

      if [ ! -d "$DEST/.git" ]; then
        git clone --depth=1 --filter=blob:none --sparse --branch "$BRANCH" "$REPO" "$DEST"
        cd "$DEST"
        git sparse-checkout set emulation/sdxi
      else
        CURRENT=$(cd "$DEST" && git rev-parse HEAD 2>/dev/null || true)
        if [ "$CURRENT" = "$REF" ]; then
          echo "$REF"
          exit 0
        fi
        cd "$DEST"
        git fetch --depth=1 origin "$BRANCH"
      fi

      git checkout "$REF"
      git rev-parse HEAD
  register: _sdxi_clone
  changed_when: _sdxi_clone.stdout.strip() != sdxi_guest_source_ref
  when: not (sdxi_guest_local_src_dir | length > 0)
  delegate_to: localhost
  become: false
  run_once: true

- name: Sync local source into the controller src dir
  ansible.builtin.shell:
    cmd: |
      set -e
      SRC="{{ sdxi_guest_local_src_dir }}"
      DEST="{{ sdxi_guest_controller_src_dir }}"
      if [ "{{ sdxi_guest_force | bool }}" = "True" ] && [ -d "$DEST" ]; then
        rm -rf "$DEST"
      fi
      rsync -a --delete "$SRC/" "$DEST/"
  when: sdxi_guest_local_src_dir | length > 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Apply kernel-API compat patches on the controller
  ansible.builtin.shell:
    cmd: |
      pf="{{ role_path }}/files/{{ item | basename }}"
      cd "{{ sdxi_guest_controller_src_dir }}"
      if patch --dry-run -R -p1 < "$pf" > /dev/null 2>&1; then
        echo already-applied
      else
        patch -p1 < "$pf"
      fi
  register: _patch_result
  changed_when: "'already-applied' not in _patch_result.stdout"
  loop:
    - 0001-fix-io_uring_cmd_complete_in_task-callback-API.patch
  delegate_to: localhost
  become: false
  run_once: true

- name: Archive emulation/sdxi source on the controller
  ansible.builtin.shell:
    cmd: |
      set -e
      TARBALL="/tmp/sdxi-src-{{ sdxi_guest_source_ref[:12] }}.tar.gz"
      tar -czf "$TARBALL" \
          -C "{{ sdxi_guest_controller_src_dir }}/emulation/sdxi" .
      echo "$TARBALL"
  register: _sdxi_tarball
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true

# Phase 2: Build and install on each GUEST.

- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - "linux-headers-{{ sdxi_guest_kernel_resolved }}"
      - python3-pip
    state: present
    update_cache: false

- name: Extract sdxi source on the guest
  ansible.builtin.unarchive:
    src: "{{ _sdxi_tarball.stdout.strip() }}"
    dest: /tmp/sdxi-src
    creates: /tmp/sdxi-src/drivers/sdxi_char/sdxi_char.c
  when: not sdxi_guest_force

- name: Extract sdxi source on the guest (forced)
  ansible.builtin.unarchive:
    src: "{{ _sdxi_tarball.stdout.strip() }}"
    dest: /tmp/sdxi-src
  when: sdxi_guest_force | bool

- name: Build the sdxi_char kernel module
  community.general.make:
    chdir: /tmp/sdxi-src/drivers/sdxi_char
    params:
      KDIR: "/lib/modules/{{ sdxi_guest_kernel_resolved }}/build"

- name: Install the kernel module
  ansible.builtin.copy:
    src: /tmp/sdxi-src/drivers/sdxi_char/sdxi_char.ko
    dest: "/{{ sdxi_guest_module_install_dir_prefix }}/{{ sdxi_guest_kernel_resolved }}/extra/sdxi_char.ko"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Run depmod

- name: Install sdxi-cli Python package
  ansible.builtin.pip:
    name: /tmp/sdxi-src/tools/sdxi-cli
    state: present
    extra_args: --break-system-packages

- name: Flush handlers so depmod runs before modprobe
  ansible.builtin.meta: flush_handlers

- name: Load the module now
  community.general.modprobe:
    name: sdxi_char
    state: present

- name: Write the installed ref stamp
  ansible.builtin.copy:
    dest: /etc/sdxi-guest-ref
    content: "{{ sdxi_guest_source_ref }}\n"
    owner: root
    group: root
    mode: "0644"
