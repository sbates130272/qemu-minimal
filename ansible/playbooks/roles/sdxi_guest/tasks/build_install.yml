---
- name: Sparse-clone emulation/sdxi from rocm-systems on the guest
  ansible.builtin.shell:
    cmd: |
      set -e
      DEST=/tmp/rocm-systems
      REF="{{ sdxi_guest_source_ref }}"
      REPO="{{ sdxi_guest_source_repo }}"
      BRANCH="{{ sdxi_guest_source_branch }}"

      if [ "{{ sdxi_guest_force | bool }}" = "True" ] && [ -d "$DEST" ]; then
        rm -rf "$DEST"
      fi

      if [ ! -d "$DEST/.git" ]; then
        git clone --depth=1 --filter=blob:none --sparse --branch "$BRANCH" "$REPO" "$DEST"
        cd "$DEST"
        git sparse-checkout set emulation/sdxi
      else
        CURRENT=$(cd "$DEST" && git rev-parse HEAD 2>/dev/null || true)
        if [ "$CURRENT" = "$REF" ]; then
          echo "$REF"
          exit 0
        fi
        cd "$DEST"
        git fetch --depth=1 origin "$BRANCH"
      fi

      git checkout "$REF"
      git rev-parse HEAD
  register: _sdxi_clone
  changed_when: _sdxi_clone.stdout.strip() != sdxi_guest_source_ref
  when: not (sdxi_guest_local_src_dir | length > 0)

- name: Copy local source to the guest
  ansible.builtin.copy:
    src: "{{ sdxi_guest_local_src_dir }}/"
    dest: /tmp/rocm-systems/
    mode: preserve
  when: sdxi_guest_local_src_dir | length > 0

- name: Copy kernel-API compat patches to the guest
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tmp/sdxi-patches/
    mode: "0644"
  loop:
    - 0001-fix-io_uring_cmd_complete_in_task-callback-API.patch

- name: Apply kernel-API compat patches
  ansible.builtin.shell:
    cmd: |
      pf=/tmp/sdxi-patches/{{ item | basename }}
      cd /tmp/rocm-systems
      if patch --dry-run -R -p1 < "$pf" > /dev/null 2>&1; then
        echo already-applied
      else
        patch -p1 < "$pf"
      fi
  register: _patch_result
  changed_when: "'already-applied' not in _patch_result.stdout"
  loop:
    - 0001-fix-io_uring_cmd_complete_in_task-callback-API.patch

- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - "linux-headers-{{ sdxi_guest_kernel_resolved }}"
    state: present
    update_cache: false

- name: Build the sdxi_char kernel module
  community.general.make:
    chdir: /tmp/rocm-systems/emulation/sdxi/drivers/sdxi_char
    params:
      KDIR: "/lib/modules/{{ sdxi_guest_kernel_resolved }}/build"

- name: Install the kernel module
  ansible.builtin.copy:
    src: /tmp/rocm-systems/emulation/sdxi/drivers/sdxi_char/sdxi_char.ko
    dest: "/{{ sdxi_guest_module_install_dir_prefix }}/{{ sdxi_guest_kernel_resolved }}/extra/sdxi_char.ko"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Run depmod

- name: Remove pre-built sdxi-cli binary so make rebuilds from source
  ansible.builtin.file:
    path: /tmp/rocm-systems/emulation/sdxi/tools/sdxi-cli/sdxi-cli
    state: absent

- name: Build the sdxi-cli userspace tool
  community.general.make:
    chdir: /tmp/rocm-systems/emulation/sdxi/tools/sdxi-cli

- name: Install sdxi-cli
  ansible.builtin.copy:
    src: /tmp/rocm-systems/emulation/sdxi/tools/sdxi-cli/sdxi-cli
    dest: "{{ sdxi_guest_cli_install_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Flush handlers so depmod runs before modprobe
  ansible.builtin.meta: flush_handlers

- name: Load the module now
  community.general.modprobe:
    name: sdxi_char
    state: present

- name: Write the installed ref stamp
  ansible.builtin.copy:
    dest: /etc/sdxi-guest-ref
    content: "{{ sdxi_guest_source_ref }}\n"
    owner: root
    group: root
    mode: "0644"
