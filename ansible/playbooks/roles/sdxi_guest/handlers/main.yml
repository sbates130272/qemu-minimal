---
- name: Run depmod
  ansible.builtin.command:
    cmd: >-
      depmod -a {{
        sdxi_guest_kernel if sdxi_guest_kernel | length > 0
        else ansible_kernel }}
  changed_when: true

- name: Reload udev rules
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: true
