---
# Prebuilt ionic + ionic_rdma carrying the two AMD patches, installed into
# updates/dkms where they outrank the in-tree modules. Built once with
# scripts/setup-ionic-dkms.sh against the pinned kernel; see
# defaults/main.yml for why this is not a per-guest DKMS build.
- name: Create the module directory
  ansible.builtin.file:
    path: "/lib/modules/{{ ernic_fleet_kernel }}/updates/dkms"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the patched ionic modules
  ansible.builtin.copy:
    src: "{{ ernic_fleet_ionic_modules_dir }}/{{ item }}"
    dest: "/lib/modules/{{ ernic_fleet_kernel }}/updates/dkms/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ionic.ko.zst
    - ionic_rdma.ko.zst
  notify: Run depmod

- name: Read the installed module's PCI alias table
  ansible.builtin.command:
    argv:
      - modinfo
      - -F
      - alias
      - "/lib/modules/{{ ernic_fleet_kernel }}/updates/dkms/ionic.ko.zst"
  register: ernic_fleet_ionic_alias
  changed_when: false

# Deliberately NOT the four-field tuple. A driver match table identifies what
# the module can bind, and ionic's entries wildcard the subsystem
# (pci:v00001DD8d00001002sv*sd*bc*sc*i*) because the same driver drives real
# Pensando cards -- so the device id is the whole of what is assertable here.
# The tuple belongs in udev, which is the layer that has to tell the emulated
# NIC apart from a real 1dd8:1002.
#
# This also used to grep for d0000100A and claim it proved the module was the
# patched build. Both halves are dead: the id moved in rocm-ernic@3fb74d1, so
# the check failed outright on a current module and took fleet provisioning
# with it before the udev rules were ever installed; and in-tree ionic now
# advertises 1002 too, so no PCI id can distinguish patched from stock. What
# the patched build adds is SRQ (AGENTS.md issue 20), which is a run-time
# capability of the device and not visible in modinfo. So this asserts only
# "a module that binds the emulated NIC at all" -- and says so when it fails,
# because the symptom it guards against is a device that never appears.
- name: Verify the installed module can bind the emulated device id
  ansible.builtin.assert:
    that:
      - ernic_fleet_ionic_alias.stdout is search(ernic_fleet_ionic_alias_want)
    fail_msg: >-
      {{ ernic_fleet_ionic_modules_dir }}/ionic.ko.zst does not bind the
      emulated NIC. Looked for a PCI alias matching
      "{{ ernic_fleet_ionic_alias_want }}"
      (vendor {{ ernic_fleet_pci_vendor }}, device {{ ernic_fleet_pci_device }});
      modinfo reports:
      {{ ernic_fleet_ionic_alias.stdout_lines | join(' | ') | default('no aliases') }}.
      A module built before rocm-ernic@3fb74d1 advertises d0000100A instead --
      rebuild it with scripts/setup-ionic-dkms.sh from the pinned tree.
  vars:
    ernic_fleet_ionic_alias_want: >-
      pci:v0000{{ ernic_fleet_pci_vendor[2:] | upper }}d0000{{ ernic_fleet_pci_device[2:] | upper }}

# Loud, not silently skipped: these rules are the single file whose absence
# cost 32 guests 18 hours, so an empty source is a decision that has to be
# stated rather than a default that quietly leaves the image's own copy.
- name: Install the rocm-ernic udev naming rules
  ansible.builtin.copy:
    src: "{{ ernic_fleet_udev_rules_src }}"
    dest: /etc/udev/rules.d/99-rocm-ernic.rules
    owner: root
    group: root
    mode: "0644"
  when: ernic_fleet_udev_rules_src | length > 0
  notify: Reload udev rules

- name: Warn that the guest keeps whatever naming rules its image shipped
  ansible.builtin.debug:
    msg: >-
      ernic_fleet_udev_rules_src is empty, so 99-rocm-ernic.rules is whatever
      the image baked in. If it matches 0x100a the device will not be renamed
      and rocm-ernic-netcfg will fall back to the kernel name.
  when: ernic_fleet_udev_rules_src | length == 0

- name: Load the ernic modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/rocm-ernic-ionic.conf
    content: "{{ ernic_fleet_modules | join('\n') }}\n"
    owner: root
    group: root
    mode: "0644"
