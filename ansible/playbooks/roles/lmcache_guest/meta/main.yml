---
galaxy_info:
  role_name: lmcache_guest
  author: qemu-minimal
  description: >-
    Install Docker in an ernic+rocjitsu guest and run the LMCache worker
    container as a systemd unit gated on the emulated devices being present
    and configured.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      # `all`, not the codenames this used to carry: galaxy's schema accepts
      # only its own enum here, and noble/resolute are not in it. The guests
      # this runs on are pinned by the qcow2 in env.scale-out, not by this
      # field, so narrowing it bought nothing and failed the lint gate.
      versions:
        - all
dependencies: []
