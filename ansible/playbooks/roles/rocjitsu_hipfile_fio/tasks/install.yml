---
- name: Locate the ROCm root with hipFile headers and library
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for d in /opt/rocm /opt/rocm-* /opt/rocm/*; do
        if { [ -e "${d}/include/hipfile/hipfile.h" ] || [ -e "${d}/include/hipfile.h" ]; } \
           && [ -e "${d}/lib/libhipfile.so" ]; then
          printf '%s\n' "${d}"
          exit 0
        fi
      done
      exit 1
    executable: /bin/bash
  register: rocjitsu_hipfile_fio_rocm_root
  changed_when: false

- name: Set the ROCm root
  ansible.builtin.set_fact:
    rocjitsu_hipfile_fio_rocm: "{{ rocjitsu_hipfile_fio_rocm_root.stdout }}"

- name: Check for the nested hipFile header
  ansible.builtin.stat:
    path: "{{ rocjitsu_hipfile_fio_rocm }}/include/hipfile/hipfile.h"
  register: rocjitsu_hipfile_fio_header_nested

- name: Check for the flat hipFile header
  ansible.builtin.stat:
    path: "{{ rocjitsu_hipfile_fio_rocm }}/include/hipfile.h"
  register: rocjitsu_hipfile_fio_header_flat

- name: Check for the hipFile library
  ansible.builtin.stat:
    path: "{{ rocjitsu_hipfile_fio_rocm }}/lib/libhipfile.so"
  register: rocjitsu_hipfile_fio_library

- name: Fail when the selected ROCm root has no usable hipFile install
  ansible.builtin.fail:
    msg: >-
      Selected ROCm root {{ rocjitsu_hipfile_fio_rocm }} has neither a nested
      nor a flat hipFile header, or is missing lib/libhipfile.so.
  when: >-
    ((not rocjitsu_hipfile_fio_header_nested.stat.exists)
     and (not rocjitsu_hipfile_fio_header_flat.stat.exists))
    or (not rocjitsu_hipfile_fio_library.stat.exists)

- name: Read the baked fio commit stamp
  ansible.builtin.slurp:
    src: "{{ rocjitsu_hipfile_fio_prefix }}/share/fio-commit.txt"
  register: rocjitsu_hipfile_fio_stamp
  failed_when: false

- name: Check whether fio is already installed
  ansible.builtin.stat:
    path: "{{ rocjitsu_hipfile_fio_prefix }}/bin/fio"
  register: rocjitsu_hipfile_fio_binary

- name: Determine whether fio needs rebuilding
  ansible.builtin.set_fact:
    rocjitsu_hipfile_fio_needs_build: >-
      {{ (not rocjitsu_hipfile_fio_binary.stat.exists)
         or ((rocjitsu_hipfile_fio_stamp.content | default('') | b64decode | trim)
             != rocjitsu_hipfile_fio_commit) }}

- name: Build fio with the libhipfile engine
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      rm -rf /tmp/fio-build
      git init -q /tmp/fio-build
      git -C /tmp/fio-build remote add origin "{{ rocjitsu_hipfile_fio_repo }}"
      git -C /tmp/fio-build fetch -q --depth 1 origin "{{ rocjitsu_hipfile_fio_commit }}"
      git -C /tmp/fio-build checkout -q FETCH_HEAD
      export ROCM_PATH="{{ rocjitsu_hipfile_fio_rocm }}"
      cd /tmp/fio-build
      ./configure --disable-native --enable-libhipfile >/dev/null
      make -j"$(nproc)" >/dev/null
      make install "prefix={{ rocjitsu_hipfile_fio_prefix }}" >/dev/null
      mkdir -p "{{ rocjitsu_hipfile_fio_prefix }}/share"
      printf '%s\n' "{{ rocjitsu_hipfile_fio_commit }}" \
        > "{{ rocjitsu_hipfile_fio_prefix }}/share/fio-commit.txt"
    executable: /bin/bash
  become: true
  when: rocjitsu_hipfile_fio_needs_build | bool

- name: Verify fio exposes the libhipfile engine
  ansible.builtin.command:
    cmd: "{{ rocjitsu_hipfile_fio_prefix }}/bin/fio --enghelp"
  register: rocjitsu_hipfile_fio_enghelp
  changed_when: false
  failed_when: "'libhipfile' not in rocjitsu_hipfile_fio_enghelp.stdout"
