---
# sdxi_setup: build and install the SDXI kernel driver and userspace CLI
# inside a helios-tray guest.
#
# Source
# ------
# The role clones ROCm/rocm-systems from GitHub on the CONTROLLER
# (run_once, so fleet runs fetch once instead of N times through SLIRP),
# archives the two relevant subdirectories from emulation/sdxi/, copies the
# tarball to each guest, and builds there against the pinned kernel.
#
# No default for sdxi_setup_source_ref: a moving-target SHA baked into an
# image image is worse than a failed play that says why it stopped.
sdxi_setup_source_ref: ""
sdxi_setup_source_repo: "https://github.com/ROCm/rocm-systems.git"

# Local directory on the CONTROLLER to clone into.  Shared across all hosts
# in the play (run_once fetch); the tarball derived from it carries the ref
# in its name so parallel builds for different refs do not stomp each other.
sdxi_setup_controller_src_dir: "/tmp/sdxi-src"

# Kernel the module is built against.  Empty means the running kernel
# (uname -r), which is the right value for a live VM.  Set explicitly when
# baking an image (must match the kernel that image will run).
sdxi_setup_kernel: ""

# The modules built from drivers/. sdxi_char is the one that is loaded;
# sdxi_perf is installed and blacklisted.
sdxi_setup_modules: [sdxi_char, sdxi_perf]

# Install paths inside the guest. Modules go in <prefix>/<kernel>/updates.
sdxi_setup_module_install_dir_prefix: "/lib/modules"
sdxi_setup_cli_install_path: "/usr/local/bin/sdxi-cli"

# Device access
# -------------
# A misc device is root-owned by default.  The udev rule sets group=sdxi
# mode=0660, so the user below just needs to be in the group.
sdxi_setup_group: sdxi
sdxi_setup_user: ubuntu

# files/99-sdxi.rules, carried in this role.  Set to ""
# to skip installation (inherits whatever the image baked in).
sdxi_setup_udev_rules_src: 99-sdxi.rules

# Write /etc/modules-load.d/sdxi.conf so sdxi_char loads at boot.
sdxi_setup_autoload: true

# Force a rebuild even when the stamp file already matches the ref.
sdxi_setup_force: false

# Optional: use a local source tree instead of cloning from GitHub.
# When set, the clone step is skipped and this directory is archived directly.
# The directory must contain emulation/sdxi/drivers/sdxi_char and
# emulation/sdxi/tools/sdxi-cli at its root (same layout as the upstream repo).
sdxi_setup_local_src_dir: ""

# Metrics
# -------
# tasks/metrics.yml installs sdxi-textfile-metrics.py and a timer that runs
# it, writing the device's counters to sdxi.prom for node_exporter's textfile
# collector. A guest with no node_exporter is skipped with a message, and so
# is one where this is false.
sdxi_setup_metrics: true

# The contexts whose 14 counters are written. sdxi_char uses two: 0 is its
# admin ring and 1 carries every client operation. An id is 0 to 127; the
# driver masks it to seven bits.
sdxi_setup_metrics_contexts: [0, 1]

# Seconds between samples. Half the amdgpu textfile timer's 30 s, which is
# the stacks' scrape interval: the owner's choice, so the panels answer
# within a minute, not two, at twice the samples. Each sample
# holds the driver's one lock for 28 register accesses per context, each a
# round trip to the SDXI server, and a data-path ioctl waits for it.
#
# The home dashboard's SDXI rate panels take their rate over a fixed 2
# minutes, eight of these intervals, and tests/test_sdxi_metrics.py holds
# the two together: raise this and the window in the dashboard follows by
# hand. Worked through Prometheus's rate() arithmetic, not measured on a
# guest: with this interval and that window a steady workload reads 0.87 to
# 1.02 of its true rate (30 s reads 0.86 to 1.15). Sampling at the scrape
# interval is not a cure on its own: the timer drifts across the scrape, and
# over $__rate_interval (one minute) the rate dips by a third each time it
# does. The window has to stay at least four intervals; the test fails
# otherwise.
sdxi_setup_metrics_interval: 15

# node_exporter's textfile collector directory. rocjitsu_setup's metrics
# tasks create the same path and point node_exporter at it; this role
# creates it too when it is not there, so neither has to run first.
sdxi_setup_metrics_textfile_dir: /var/lib/prometheus/node-exporter

# How the tasks tell whether node_exporter is installed.
sdxi_setup_metrics_node_exporter: /usr/bin/prometheus-node-exporter
