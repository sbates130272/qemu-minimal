---
# What a compose fleet guest needs for its emulated RDMA NIC that the image
# does not otherwise carry: stable device names, module autoload, and an
# address assigned at boot.
#
# Why this is a role and not the collection's configure play: a fleet boots
# from a backing image through `qemu-tool compose` and runs no Ansible at all,
# so the run-time configure stage of sbates130272.rocm_ernic.ernic_guest_setup
# never happens. Anything a fleet guest needs has to be in the image, or be a
# boot-time unit the image carries. vm-rocm-golden.yml applies this to the
# image, one task file at a time.

# ── Emulated device identity ─────────────────────
# The full tuple, and nothing shorter. rocm-ernic@3fb74d1 moved the emulated
# device from 1dd8:100a to 1dd8:1002, and 1dd8:1002 is a real Pensando DSC
# Ethernet Controller id that physical cards ship with -- so vendor+device no
# longer identifies the emulation and the subsystem pair is what does.
# Lowercase, 0x-prefixed, four hex digits: that is how sysfs spells them, and
# every consumer here compares them literally.
#
# files/99-rocm-ernic.rules carries the same four values. tests/
# test_ernic_identity.py asserts the two agree, because a rules file that
# matches the wrong id renames nothing, which presents as a missing device
# rather than as a wrong id -- 32 guests sat unusable for 18 hours on exactly
# that.
rocm_ernic_setup_pci_vendor: "0x1dd8"
rocm_ernic_setup_pci_device: "0x1002"
rocm_ernic_setup_pci_subsystem_vendor: "0x1dd8"
rocm_ernic_setup_pci_subsystem_device: "0x5400"

# ── Device naming ───────────────────────────────
# Stable names: Ethernet rocm-ernic0, IB rocm-rdma-ernic0. Without them a
# guest keeps kernel names and every `-d rocm-rdma-ernic0` in the test drivers
# fails.
#
# This used to be "" and no playbook ever set it, so the role installed no
# rules and inherited whatever the published qcow2 baked in -- which is how a
# fleet ended up matching an id that upstream had moved away from. The repo now
# carries the file, in this role's files/. Set this
# to "" only to deliberately keep the image's own copy.
rocm_ernic_setup_udev_rules_src: 99-rocm-ernic.rules
rocm_ernic_setup_modules: [ionic, ionic_rdma]

# ── Guest Ethernet ───────────────────────────────
# The image's netplan is `match: name: "en*"`, and udev's rename leaves
# enp0s5np0 behind as an altname, which that glob matches -- so networkd
# adopts rocm-ernic0, runs DHCP on it and flushes the static address. It is a
# race, and not one that is reliably won: 2 of 8 guests lost the address on
# first boot. 05- sorts before netplan's generated 10-netplan-*, and /etc
# outranks /run.
rocm_ernic_setup_networkd_unmanaged: true
# Addresses the NIC at boot from the NIC's own MAC, so one image serves every
# guest in the fleet. gen-compose hands VM n the MAC
# <ERNIC_MAC_PREFIX>:<n>>8>:<n&0xff> and the address <subnet>.<10+n>, so the
# MAC already carries n. This is the run-time half of the configure play --
# the half AGENTS.md issue 12 says does not survive a reboot.
rocm_ernic_setup_netcfg: true
rocm_ernic_setup_nic_subnet: "192.168.100"

# ── Image preparation ────────────────────────────
# Everything the sbates130272.rocm_ernic collection stopped doing at 0.2.0,
# when ernic_image_prep was removed and the collection narrowed to "turn an
# already-prepared guest into an RDMA node". Upstream's prepared guest is the
# published `ionic` qcow2 from batesste-ci-images; this repo builds its own
# guest with gen-vm, so this role is that image's provisioning expressed as
# Ansible. Keep it aligned with ubuntu-qcow2-gen/{build-vm.sh,provision/ionic.sh}
# and packages/ionic.txt in that repo.

# ── Mainline kernel ──────────────────────────────
# The reason this role exists. drivers/infiniband/hw/ionic merged for 6.18, so
# no Ubuntu release ships a kernel that can build ionic_rdma -- resolute GA is
# 7.0.0-31. The HWE metapackage this replaced (linux-generic-hwe-26.04) is a
# no-op on 26.04 and left every DKMS build failing against 7.0.0-31.
#
# The ref itself is deliberately NOT defaulted here. It has to agree with the
# ernic_ionic_kernel_ref the same run hands the collection -- driver_ionic.yml
# compares major.minor and fails the build otherwise -- so it lives in
# vm-rocm-golden.yml, defined once and shared by its plays. A
# default here would be a second copy that silently wins whenever a caller
# forgets to pass one; kernel.yml asserts instead.
rocm_ernic_setup_kernel_install: true
rocm_ernic_setup_kernel_ref: ""
rocm_ernic_setup_kernel_mirror: https://kernel.ubuntu.com/mainline
# Where the .debs land in the guest before the single apt transaction.
rocm_ernic_setup_kernel_payload_dir: /tmp/mainline-kernel
rocm_ernic_setup_kernel_reboot_timeout: 600
# kernel.yml ends by asserting the installed headers carry ib_umem_get_va, the
# helper ionic_rdma needs. vm-rocm-golden.yml reuses kernel.yml for the kernel
# alone and never builds ionic_rdma, so it turns this off rather than failing a
# GPU lane on an RDMA precondition it does not care about.
rocm_ernic_setup_kernel_assert_ionic: true

# ── Packages ─────────────────────────────────────
# packages/ionic.txt, minus what cloud-init and the other roles already bring.
# Deliberately no linux-headers-generic and no linux-modules-extra: those are
# metapackages for the release kernel, and DKMS must not build against it. The
# matching headers and modules come from the mainline .debs above.
rocm_ernic_setup_packages:
  # DKMS toolchain.
  - build-essential
  - cmake
  - ninja-build
  - pkg-config
  - dkms
  - git
  # Dependencies of the mainline .debs, pre-seeded so the kernel install is a
  # local dpkg operation rather than a second round of archive resolution.
  - linux-base
  - kmod
  - initramfs-tools
  - wireless-regdb
  # rdma-core build dependencies, for the lanes whose provider pin moves past
  # what the release packages or which need the GDA patches.
  - libnl-3-dev
  - libnl-route-3-dev
  - libudev-dev
  - libsystemd-dev
  - python3-docutils
  # The verbs userspace itself. On resolute this is 61.0, past the v61 that
  # first shipped providers/ionic upstream, so ibverbs-providers already
  # carries libionic-rdmav59.so and nothing has to be built to get it.
  - rdma-core
  - ibverbs-utils
  - libibverbs-dev
  # ib_send_bw and friends, for lanes that move traffic rather than only
  # assert the modules built.
  - perftest
  # Not in ionic.txt, and the reason ernic_guest_build_deps exists upstream:
  # iperf3 is what the TCP performance checks measure with.
  - iperf3
rocm_ernic_setup_apt_retries: 3
rocm_ernic_setup_apt_delay: 10

# ── rdma-core provider stamp ─────────────────────
# ernic_guest_setup's rdma_core.yml reads this before deciding whether to
# build rdma-core from source, a roughly seven-minute build that also puts the
# GitHub release CDN on the critical path of every lane. Format is
# <version>:<gda-patch-hash>, "none" when no GDA patches were applied; the role
# compares the trimmed contents against a value it computes, so both the text
# and the trailing newline matter. Written from what dpkg actually reports, not
# from a pin -- a stamp that disagrees with the installed libraries is worse
# than no stamp.
rocm_ernic_setup_provider_stamp: true
rocm_ernic_setup_stamp_dir: /usr/local/share/rocm-ernic

# ── Emulated device ──────────────────────────────
# OFF, because upstream hwdata now carries this and injecting it is worse
# than useless. pci-ids.ucw.cz lists, under AMD Pensando Systems:
#
#   1dd8  AMD Pensando Systems
#   	1002  DSC Ethernet Controller
#   		1dd8 5400  ROCm Emulated RDMA NIC
#
# -- so the name arrives through the SUBSYSTEM pair (1dd8:5400), which is
# this device's, rather than through the device id, which is a real Pensando
# NIC's and was never ours to name. Confirmed on a live guest: `lspci -nn`
# reports "AMD Pensando Systems DSC Ethernet Controller [1dd8:1002]" with
# nothing injected, and the guest's /usr/share/misc/pci.ids already contains
# the 5400 line. `update-pciids` refreshes it like any other entry.
#
# Off because there is nothing to add, NOT because adding is unsafe. What the
# role writes is the THREE-level entry above -- the subsystem line nested
# under the device line -- and its presence check asks for that subsystem
# line, so on a current guest it finds 1dd8 5400 already there and skips. The
# earlier version wrote a second DEVICE line for 1002 under vendor 1dd8, which
# is a duplicate: pciutils does not ignore a duplicate, it refuses to parse the
# file and then names nothing on the bus. That shape is gone; this stays off
# because hwdata is right, not to protect against the role.
#
# Kept rather than deleted because the id has now moved twice (1022:8000 ->
# 1dd8:100a -> 1dd8:1002). If it moves again before hwdata catches up, set this
# true and the four ids below to the new ones; the role inserts whichever of
# the device and subsystem lines is missing and refuses to insert either twice.
rocm_ernic_setup_pciids: false
rocm_ernic_setup_pciids_vendor: "1dd8"
rocm_ernic_setup_pciids_device: "1002"
rocm_ernic_setup_pciids_subvendor: "1dd8"
rocm_ernic_setup_pciids_subdevice: "5400"
# Two spaces between an id and its name, one space between the two subsystem
# ids, and the indentation is TABS -- spaces are a parse error, not a style
# difference. The tabs are supplied by the merge, not by these values.
rocm_ernic_setup_pciids_device_name: "DSC Ethernet Controller"
rocm_ernic_setup_pciids_subsystem_name: "ROCm Emulated RDMA NIC"
rocm_ernic_setup_pciids_device_entry: >-
  {{ rocm_ernic_setup_pciids_device }}  {{ rocm_ernic_setup_pciids_device_name }}
rocm_ernic_setup_pciids_subsystem_entry: >-
  {{ rocm_ernic_setup_pciids_subvendor }} {{ rocm_ernic_setup_pciids_subdevice }}  {{ rocm_ernic_setup_pciids_subsystem_name }}

# Write the modules-load.d entry during image preparation as well as in
# naming.yml, so a guest rebooted between the two already loads the driver.
# Both write rocm_ernic_setup_modules, defined once above.
rocm_ernic_setup_modules_load: true

# ── System tuning ────────────────────────────────
# Keep user units (tmux sessions, background test runs) alive after the SSH
# session that started them goes away.
rocm_ernic_setup_logind_keep_processes: true

# A freshly booted guest runs unattended-upgrades, which holds the dpkg lock
# for the first minute or so and makes every early task in a compose VM look
# like a flake. The collection works around it with a 300s lock wait; masking
# the units in the image removes the wait instead.
rocm_ernic_setup_mask_unattended_upgrades: true

# Drop the apt cache at the end to shrink the backing image.
rocm_ernic_setup_clean_apt: true
