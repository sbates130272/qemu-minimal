---
# Run immediately before rocm.ernic.ernic_source, on the controller. That
# role keeps a clone at ernic_source_clone_dir. It used to update it with
# ansible.builtin.git, which runs "git fetch --tags origin", and git refuses
# that once upstream has moved a tag the clone already holds -- so the bake
# died there, after everything that precedes it, over a tag it never reads.
# The script run here takes the moved tag with a forced fetch.
#
# The role now runs git itself. It fetches the commit it was given by name,
# with --no-tags, and a moved tag cannot fail that. Only when that fetch
# fails, for whatever reason, does it fetch every branch and tag, and that
# fetch is still unforced: this is what the guard is kept for, and
# tests/test_source_clone.py reads the installed role to say when it can go.
#
# The role also fails on a clone with local changes to tracked files, as
# ansible.builtin.git did. That is left to fail: ernic_source_force_clone
# would discard them, and nothing here sets it.
#
# Nothing is removed. The directory is shared by every bake and configure
# run on this controller, and another run may be reading patches and scripts
# out of it. A clone that is broken some other way is reported and left for
# the role to fail on; files/source-clone-state.sh says how the states are
# told apart.
#
# The role's own variable names the directory, with the role's default as
# the fallback: a role default is not in scope until the role is included.

- name: Check the rocm-ernic clone on the controller can still be updated
  # Not when the caller named a checkout of their own, which the role does
  # not update, nor once the role has resolved its sources in this run.
  when:
    - not (ernic_source_resolved | default(false))
    - ernic_source_dir | default('') | trim | length == 0
  vars:
    rocm_ernic_setup_source_clone_dir: >-
      {{ ernic_source_clone_dir | default('/var/tmp/rocm-ernic-src') | trim }}
  block:
    - name: Fetch into the rocm-ernic clone
      ansible.builtin.command:
        argv:
          - sh
          - "{{ role_path }}/files/source-clone-state.sh"
          - "{{ rocm_ernic_setup_source_clone_dir }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: rocm_ernic_setup_source_clone
      changed_when: rocm_ernic_setup_source_clone.stdout.startswith('repaired:')
      failed_when: >-
        rocm_ernic_setup_source_clone.rc != 0
        or rocm_ernic_setup_source_clone.stdout_lines | length != 1
        or rocm_ernic_setup_source_clone.stdout.split(':')[0]
           not in ['absent', 'healthy', 'repaired', 'offline', 'broken']

    - name: Report the state of the rocm-ernic clone
      ansible.builtin.debug:
        msg: "{{ rocm_ernic_setup_source_clone.stdout }}"
      run_once: true
