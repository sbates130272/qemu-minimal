---
# Install a pinned mainline kernel from the loose .debs on kernel.ubuntu.com,
# mirroring what ubuntu-qcow2-gen/build-vm.sh does for the published ionic
# image. Two details there are load-bearing and reproduced here:
#
#   - the -64k arm64 page-size variants are filtered out, because taking both
#     installs two kernels and leaves grub picking between them;
#   - the .debs go in as one apt transaction against local files rather than
#     dpkg -i, so linux-base, kmod, wireless-regdb and an initramfs tool are
#     resolved from the archive instead of leaving dpkg half-configured.
#
# build-vm.sh gets a dedicated provisioning boot and a separate verification
# boot. Here the reboot and the post-reboot assert play those parts.

# Empty by default on purpose -- see defaults/main.yml. Caught here rather than
# at the mirror fetch, which would otherwise request .../mainline//amd64/ and
# report a bare 404.
- name: Fail when no kernel ref was pinned
  ansible.builtin.assert:
    that: rocm_ernic_setup_kernel_ref | trim | length > 0
    fail_msg: >-
      rocm_ernic_setup_kernel_ref is empty. Set it from ionic_kernel_pin in
      vm-rocm-golden.yml, which is where the pin lives, so the
      guest kernel matches the ionic sources this run builds.

- name: Derive the mainline kernel version and architecture
  ansible.builtin.set_fact:
    rocm_ernic_setup_kver: "{{ rocm_ernic_setup_kernel_ref | regex_replace('^v', '') }}"
    rocm_ernic_setup_debarch: >-
      {{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}

- name: Check whether the pinned kernel is already the running one
  ansible.builtin.set_fact:
    rocm_ernic_setup_kernel_current: >-
      {{ ansible_kernel.split('-')[0] == rocm_ernic_setup_kver }}

- name: Install the pinned mainline kernel
  when: not (rocm_ernic_setup_kernel_current | bool)
  block:

    # The listing is the request kernel.ubuntu.com answers 503 to.
    - name: Fetch the mainline index for the pinned ref
      ansible.builtin.uri:
        url: >-
          {{ rocm_ernic_setup_kernel_mirror }}/{{ rocm_ernic_setup_kernel_ref }}/{{
          rocm_ernic_setup_debarch }}/
        return_content: true
      register: rocm_ernic_setup_kernel_index
      retries: "{{ rocm_ernic_setup_kernel_fetch_retries }}"
      delay: "{{ rocm_ernic_setup_kernel_fetch_delay }}"
      until: rocm_ernic_setup_kernel_index is success
      when: rocm_ernic_setup_kernel_debs_dir | length == 0

    # A caller with the .debs already on the controller -- a build cache --
    # names the directory and nothing is fetched.
    - name: List the kernel .deb files the controller already has
      ansible.builtin.find:
        paths: "{{ rocm_ernic_setup_kernel_debs_dir }}"
        patterns: "linux-*.deb"
      register: rocm_ernic_setup_kernel_local
      delegate_to: localhost
      become: false
      when: rocm_ernic_setup_kernel_debs_dir | length > 0

    - name: Select the kernel .deb files
      ansible.builtin.set_fact:
        # -64k is the arm64 64K-page flavour; see the header comment.
        rocm_ernic_setup_kernel_debs: >-
          {{ (rocm_ernic_setup_kernel_local.files | default([])
              | map(attribute='path') | map('basename') | list
              if rocm_ernic_setup_kernel_debs_dir | length > 0
              else rocm_ernic_setup_kernel_index.content
                   | regex_findall('linux-[a-z-]+-[0-9][^"]*\.deb'))
             | reject('search', '-64k')
             | unique | sort }}

    - name: Assert the mainline ref published a usable kernel set
      ansible.builtin.assert:
        that:
          - rocm_ernic_setup_kernel_debs | select('match', 'linux-image') | length > 0
          - rocm_ernic_setup_kernel_debs | select('match', 'linux-headers') | length > 0
          - rocm_ernic_setup_kernel_debs | select('match', 'linux-modules') | length > 0
        fail_msg: >-
          {{ rocm_ernic_setup_kernel_debs_dir
             if rocm_ernic_setup_kernel_debs_dir | length > 0
             else rocm_ernic_setup_kernel_mirror ~ '/' ~ rocm_ernic_setup_kernel_ref
                  ~ '/' ~ rocm_ernic_setup_debarch ~ '/' }}
          does not carry a complete image, headers and
          modules set: {{ rocm_ernic_setup_kernel_debs | join(', ') | default('nothing') }}.
          Mainline builds are pruned over time and can fail for a release --
          check the ref, or move rocm_ernic_setup_kernel_ref and IONIC_KERNEL_REF
          together.

    - name: Create the kernel payload directory
      ansible.builtin.file:
        path: "{{ rocm_ernic_setup_kernel_payload_dir }}"
        state: directory
        mode: "0755"

    - name: Download the kernel .deb files
      ansible.builtin.get_url:
        url: >-
          {{ rocm_ernic_setup_kernel_mirror }}/{{ rocm_ernic_setup_kernel_ref }}/{{
          rocm_ernic_setup_debarch }}/{{ item }}
        dest: "{{ rocm_ernic_setup_kernel_payload_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ rocm_ernic_setup_kernel_debs }}"
      register: rocm_ernic_setup_kernel_dl
      retries: "{{ rocm_ernic_setup_kernel_fetch_retries }}"
      delay: "{{ rocm_ernic_setup_kernel_fetch_delay }}"
      until: rocm_ernic_setup_kernel_dl is success
      when: rocm_ernic_setup_kernel_debs_dir | length == 0

    - name: Copy the kernel .deb files from the controller
      ansible.builtin.copy:
        src: "{{ rocm_ernic_setup_kernel_debs_dir }}/{{ item }}"
        dest: "{{ rocm_ernic_setup_kernel_payload_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ rocm_ernic_setup_kernel_debs }}"
      when: rocm_ernic_setup_kernel_debs_dir | length > 0

    # Read back by whoever records what the image was built from.
    - name: Record the kernel .deb files that were installed
      ansible.builtin.copy:
        dest: /etc/rocm-ernic-kernel-debs
        content: "{{ rocm_ernic_setup_kernel_debs | join('\n') }}\n"
        owner: root
        group: root
        mode: "0644"

    # linux-headers-7.3.x depends on libssl4 (OpenSSL 4.0), not shipped with
    # Ubuntu 26.04 (resolute). Check first so a rerun after a previous partial
    # install does not re-fetch it. libssl4's dep on openssl-provider-legacy is
    # unversioned -- the resolute 3.5.5 package satisfies it.
    - name: Check if libssl4 is already installed
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - -f=${Status}
          - libssl4
      register: rocm_ernic_setup_libssl4_query
      changed_when: false
      failed_when: false

    - name: Download libssl4 into the kernel payload
      vars:
        _libssl4_archive: >-
          {{ 'https://ports.ubuntu.com' if rocm_ernic_setup_debarch == 'arm64'
             else 'https://archive.ubuntu.com' }}/ubuntu/pool/main/o/openssl
      ansible.builtin.get_url:
        url: >-
          {{ _libssl4_archive }}/libssl4_{{
          rocm_ernic_setup_kernel_libssl4_deb_version }}_{{ rocm_ernic_setup_debarch }}.deb
        dest: "{{ rocm_ernic_setup_kernel_payload_dir }}/libssl4.deb"
        mode: "0644"
      retries: "{{ rocm_ernic_setup_kernel_fetch_retries }}"
      delay: "{{ rocm_ernic_setup_kernel_fetch_delay }}"
      until: rocm_ernic_setup_libssl4_dl is success
      register: rocm_ernic_setup_libssl4_dl
      when: >-
        rocm_ernic_setup_libssl4_query.rc != 0
        or 'install ok installed' not in (rocm_ernic_setup_libssl4_query.stdout | default(''))

    # One transaction, apt not dpkg -- see the header comment. The apt module
    # cannot express this: its `deb` argument takes a single path, and looping
    # it would install the .debs one at a time, which is the half-configured
    # state the single transaction exists to avoid.
    - name: Install the kernel .deb files  # noqa: command-instead-of-module
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          apt-get install -y {{ rocm_ernic_setup_kernel_payload_dir }}/*.deb
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

# Not inside the block above: a guest already on the pinned kernel is
# pinned too, so a rerun, or an image that got its kernel another way, ends
# in the same state.
#
# update-grub orders kernels by version and boots the first. That happens to
# be the pinned one for as long as nothing newer is installed -- an archive
# kernel that sorts above a mainline build would be booted instead, with no
# ionic DKMS module built for it. GRUB_TOP_LEVEL names the kernel to put
# first, whatever else is installed, and GRUB_DEFAULT=0 boots the first; a
# kernel that is no longer there is ignored, and the order falls back to
# version. A drop-in named to sort last, because the cloud image's own
# drop-ins are read after /etc/default/grub and would outrank an edit there.
- name: Pin the boot entry to the pinned kernel
  when: rocm_ernic_setup_kernel_grub_pin | bool
  block:
    - name: Find the pinned kernel image
      ansible.builtin.find:
        paths: /boot
        patterns: "vmlinuz-{{ rocm_ernic_setup_kver }}-*"
        file_type: file
      register: rocm_ernic_setup_kernel_images

    - name: Assert exactly one image of the pinned kernel is installed
      ansible.builtin.assert:
        that: rocm_ernic_setup_kernel_images.files | length == 1
        fail_msg: >-
          Expected one /boot/vmlinuz-{{ rocm_ernic_setup_kver }}-* and found
          {{ rocm_ernic_setup_kernel_images.files | map(attribute='path')
             | join(', ') | default('none', true) }}. The boot entry cannot
          be pinned to a kernel that is absent or ambiguous.

    - name: Create the grub drop-in directory
      ansible.builtin.file:
        path: /etc/default/grub.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the grub drop-in that names the pinned kernel
      ansible.builtin.copy:
        dest: "{{ rocm_ernic_setup_kernel_grub_dropin }}"
        content: |
          # Written by rocm_ernic_setup. The kernel this image is built
          # around boots first, whatever else is installed.
          GRUB_TOP_LEVEL="{{ rocm_ernic_setup_kernel_images.files[0].path }}"
          GRUB_DEFAULT=0
        owner: root
        group: root
        mode: "0644"
      register: rocm_ernic_setup_kernel_grub_pinned

# Also when nothing was pinned: a kernel was just installed.
- name: Regenerate the grub configuration
  ansible.builtin.command:
    argv:
      - update-grub
  changed_when: true
  when: >-
    not (rocm_ernic_setup_kernel_current | bool)
    or rocm_ernic_setup_kernel_grub_pinned is changed

- name: Boot the pinned kernel
  when: not (rocm_ernic_setup_kernel_current | bool)
  block:

    - name: Remove the kernel payload
      ansible.builtin.file:
        path: "{{ rocm_ernic_setup_kernel_payload_dir }}"
        state: absent

    # build-vm.sh proves the kernel with a separate boot rather than trusting
    # update-grub. Same idea: a kernel that installs but does not boot is a
    # much more expensive failure once DKMS lanes are running against it.
    - name: Reboot into the new kernel
      ansible.builtin.reboot:
        reboot_timeout: "{{ rocm_ernic_setup_kernel_reboot_timeout }}"

    - name: Re-gather facts after the reboot
      ansible.builtin.setup:

- name: Assert the guest booted the pinned kernel
  ansible.builtin.assert:
    that:
      - ansible_kernel.split('-')[0] == rocm_ernic_setup_kver
    fail_msg: >-
      Guest booted {{ ansible_kernel }}, not {{ rocm_ernic_setup_kver }}. grub
      picked a different entry, or the mainline .debs installed a kernel this
      role did not expect.

# The version match above is a proxy. This is the thing it is a proxy for, and
# it is the exact check ernic_guest_setup's driver_ionic.yml makes before
# building -- failing it here names the cause, where failing it there is a wall
# of implicit-declaration errors deep inside a DKMS log.
#
# Gated because vm-rocm-golden.yml reuses this file for the kernel alone; see
# rocm_ernic_setup_kernel_assert_ionic in defaults/main.yml.
- name: Look for the IB-core helper the ionic sources need
  ansible.builtin.command:
    argv:
      - grep
      - -qs
      - ib_umem_get_va
      - "/lib/modules/{{ ansible_kernel }}/build/include/rdma/ib_umem.h"
  register: rocm_ernic_setup_umem_helper
  failed_when: false
  changed_when: false
  when: rocm_ernic_setup_kernel_assert_ionic | bool

- name: Assert the kernel headers can build ionic_rdma
  when: rocm_ernic_setup_kernel_assert_ionic | bool
  ansible.builtin.assert:
    that:
      - rocm_ernic_setup_umem_helper.rc == 0
    fail_msg: >-
      /lib/modules/{{ ansible_kernel }}/build does not provide ib_umem_get_va.
      The mainline headers .deb did not install, or this kernel predates the
      helper -- it landed after 7.0, which is what the 7.0.0-31 guest failed on.
