---
# Bake ernic, rocjitsu, SRQ+P4 ionic and SDXI into one VM image.
# Runs vm-ernic then vm-rocjitsu then vm-ernic-srq-p4 sequentially on the
# same host; all are idempotent.
#
# Both ernic and rocjitsu imports suppress their own trailing slim play: the
# only slim pass is the one at the end of this file. See vm-slim.yml.
- import_playbook: vm-ernic.yml
  vars:
    image_slim_enable: false
- import_playbook: vm-rocjitsu.yml
  vars:
    image_slim_enable: false
- import_playbook: vm-ernic-srq-p4.yml

- import_playbook: vm-slim.yml
  tags: [install]
