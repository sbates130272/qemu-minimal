---
# Put the LMCache worker into every guest of a running scale-out fleet.
#
#   qemu-tool gen-compose --env-file qemu/env.scale-out
#   qemu-tool compose --env-file qemu/env.scale-out \
#       --stack vfio-user-ernic-rocjitsu-scale-out \
#       --profile metrics --profile lmcache up -d
#   docker save qemu-tool/lmcache-rocm:0.5.6-gfx1250-srq \
#       -o /var/lib/qemu-tool/share/lmcache-srq.tar
#   ansible-playbook -i ../qemu/compose/vfio-user-ernic-rocjitsu-scale-out/\
# fleet-inventory.yml playbooks/fleet-lmcache.yml
#
# The save goes into VM_FILESYSTEM, which run-vm exports over 9p, so every
# guest loads that one file rather than being handed a copy each. The tag has
# to be the -srq one on EVERY guest: see LMCACHE_IMAGE in qemu/env.scale-out
# for why a mixed fleet silently loses P2P.
#
# The inventory is generated by `qemu-tool gen-compose` alongside the compose
# file, so VM_COUNT, the SSH ports and the guest IPs are stated once in
# qemu/env.scale-out and never restated here. A hand-written inventory that
# drifts from the fleet is exactly the failure this avoids: the play would
# configure six of eight guests and succeed.
#
# Unlike the vm-* playbooks this one configures a RUNNING fleet rather than
# baking an image. It is re-runnable, and it has to be: everything it sets up
# inside the guest except the Docker packages is run-time state that a reboot
# discards (AGENTS.md issue 12). The systemd unit's preflight restores the
# ernic address on its own, which is the part that makes a reboot survivable
# without re-running this.

# ---------------------------------------------------------------------------
# What P2P needs to be true, and where each piece lives
# ---------------------------------------------------------------------------
# L1 P2P over the emulated ernic was first verified working 2026-10-09:
# VM2's COLD lookup hit 2/2 on keys only VM1 had stored, and both ernics'
# total_bytes_rdma_read moved 0 -> 16,777,216, which is exactly
# 2 kv x 4 layers x 8 heads x 128 dim x 2 B = 16 KiB/token x 512 tokens x 2
# requests. Four things had to hold at once. Each failed silently on its own,
# and each presented as a timeout several layers above its real cause, so they
# are listed together here rather than only where they are implemented.
#
# 1. ONE IMAGE TAG ACROSS THE FLEET -- enforced: LMCACHE_IMAGE in
#    qemu/env.scale-out, carried here by the generated fleet-inventory.yml,
#    which overrides the role default. NIXL pickles descriptor lists and its
#    meta package picks a variant by PRESENCE (nixl_cu13 -> cu12 -> rocm), not
#    by platform, so a guest on a CUDA-variant image cannot unpickle a ROCm
#    peer's descriptors. Symptom: "Failed to add P2P adapter for peer", no p2p
#    L2 adapter ever created, then "P2P load task N timed out" forever.
#
# 2. ip_discovery.bin IN THE GUEST -- enforced: tasks/amdgpu_firmware.yml plus
#    bind_amdgpu() in the preflight. Without it amdgpu probes -2, no KFD node
#    appears, and the server silently comes up as StubCPUDevice.
#
# 3 and 4 are NOT enforced here. They are properties of how the test client is
# invoked, and nothing in this play can impose them -- which is precisely why
# they were rediscovered the hard way. The canonical verification run is:
#
#      lmcache bench server --mode gpu \
#        --kvcache-shape-spec "(2,32,16,8,128):float16:4" \
#        --num-tokens 512 --start 300 --end 302
#
#    Seed on one guest, then run the SAME --start/--end on another; the second
#    guest's cold lookup is the P2P pull. Confirm with the ernic counters
#    (/run/ernic-stats/ernic-N.stats, total_bytes_rdma_read) on BOTH ends --
#    a hit alone does not prove the bytes crossed the mesh.
#
# 3. TRANSFER MODE. On a CPU-mode client pass --transfer-mode lmcache_driven.
#    `auto` maps cpu -> engine_driven, whose commit_store raises
#    "EOFError: Ran out of input" server-side, so every STORE burns its full
#    10 s deadline and reports "timeout". Do NOT answer that by setting the
#    server's --supported-transfer-mode to auto: it makes registration succeed
#    and the store fail later and more obscurely. Moot once the guest has a
#    real GPU -- the server then rejects cpu clients outright with
#    "ValueError: Expected a cuda device, but got: cpu".
#
# 4. KV GEOMETRY. Shrink it for tests. The default
#    (2,1024,16,8,128):float16:32 is 32 tensors x 16 MiB and takes ~20 minutes
#    to allocate on the emulated GPU; 4 x 2 MiB takes 14 seconds. STORE and
#    RETRIEVE are 3-6 ms either way, so the geometry buys nothing but wall
#    clock. Note the shape spec's nb overrides --num-blocks.
# ---------------------------------------------------------------------------

- name: Run the LMCache worker in every fleet guest
  hosts: fleet
  gather_facts: true
  become: false
  # The same pins vm-ernic.yml reads. lmcache_guest builds the SRQ driver
  # from them, so without this ionic_kernel_pin is undefined here and the
  # build fails with "'ionic_kernel_pin' is undefined" -- which is what
  # happened the first time the fleet reached that task in CI. Loading the
  # file rather than restating the values keeps one source of truth: the
  # kernel ref has to match IONIC_KERNEL_REF in the collection, and the
  # source ref has to match the ernic.<sha> in ERNIC_IMAGE.
  vars_files:
    - vars/ernic-pins.yml
  # One at a time would take VM_COUNT x image-load; all at once is the start
  # burst the stack README warns about. This is a compromise that has the
  # guests' apt and docker load overlapping without a fleet-wide thundering
  # herd against the Docker apt repo.
  serial: 4
  tags: [install, configure]
  vars:
    # All three derived from the inventory rather than restated: the inventory
    # is generated from VM_COUNT, so none of them can drift from the fleet.
    lmcache_guest_instance_id: "{{ inventory_hostname }}"
    # The ernic address, with no prefix -- it is what peers dial and what the
    # coordinator records, so it must be the guest's address on the one
    # network every guest shares.
    lmcache_guest_advertise_ip: "{{ fleet_guest_ip }}"
    lmcache_guest_eth_address: "{{ fleet_guest_ip }}/{{ fleet_guest_prefix }}"
  roles:
    # Guest-side RDMA metrics, on :9879. Worth knowing before reading them:
    # rdma_exporter reads /sys/class/infiniband/<dev>/ports/<n>/counters and
    # hw_counters, and the emulated ionic_rdma implements NEITHER -- the port
    # exposes only cap_mask, gids, rate, state and empty cm_* files, and
    # `rdma statistic show` answers "Invalid argument". So on this fleet it
    # will scrape up and export nothing.
    #
    # It is installed anyway because it is the right instrument and costs a
    # binary: the day the emulated device grows counters, this starts
    # reporting with no further change. For numbers TODAY, use the ethtool
    # collector the lmcache_guest role enables on node_exporter -- the ionic
    # netdev does keep tx/rx byte counts, and RoCE rides on that netdev.
    - role: sbates130272.batesste.rdma_setup
      vars:
        rdma_setup_install_rdma_exporter: true
        # The role's default is a full apt safe-upgrade + autoremove inside
        # every guest. Skip it: these guests run a pinned mainline kernel and
        # a DKMS-adjacent RDMA stack, so an unattended distro upgrade is a
        # real way to lose the device mid-fleet, and it costs minutes per
        # guest for nothing this role needs.
        rdma_setup_skip_system_upgrade: true
        # rdmatop comes from a PPA whose signing key does not fetch from here
        # ("Unable to get required signing key"), and it is an interactive
        # top-style viewer -- nothing in this fleet reads it. The exporter,
        # which is the part we want, installs without it.
        rdma_setup_install_rdmatop: false
    - role: lmcache_guest

  post_tasks:
    - name: Report the server's own view
      become: true
      ansible.builtin.command:
        cmd: journalctl -u {{ lmcache_guest_container_name }} --no-pager -n 25
      register: lmcache_guest_journal
      changed_when: false
      failed_when: false

    - name: Show it
      ansible.builtin.debug:
        var: lmcache_guest_journal.stdout_lines

# A second play, once every guest has been through the first. Registration is
# the thing worth asserting and it can only be checked from the coordinator:
# a unit can be active, and a server can be serving, while its registration
# never landed -- a wrong advertise IP or a coordinator URL the guest cannot
# reach both present exactly that way.
- name: Verify the fleet registered with the coordinator
  hosts: fleet[0]
  gather_facts: false
  become: false
  tags: [configure]
  tasks:
    - name: Ask the coordinator who it can see
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ lmcache_guest_coordinator_url }}/instances"
        return_content: true
      register: lmcache_instances
      retries: 12
      delay: 10
      until: >-
        lmcache_instances.json.instances | default([]) | length
        >= (groups['fleet'] | length)
      failed_when: false

    - name: Report registration
      vars:
        seen: "{{ lmcache_instances.json.instances | default([])
                  | map(attribute='instance_id') | list }}"
      ansible.builtin.debug:
        msg: >-
          {{ seen | length }} of {{ groups['fleet'] | length }} registered.
          Missing: {{ groups['fleet'] | difference(seen) | default([]) }}

