---
# Put the LMCache worker into every guest of a running scale-out fleet.
#
#   qemu-tool gen-compose --env-file qemu/env.scale-out
#   qemu-tool compose --env-file qemu/env.scale-out \
#       --stack vfio-user-ernic-rocjitsu-scale-out \
#       --profile metrics --profile lmcache up -d
#   docker save qemu-tool/lmcache-rocm:0.5.5-gfx1250 -o /tmp/lmcache-rocm.tar
#   ansible-playbook -i inventory/qemu-minimal-fleet.yml playbooks/fleet-lmcache.yml \
#       -e lmcache_guest_image_archive=/tmp/lmcache-rocm.tar
#
# The inventory is generated by `qemu-tool gen-compose` alongside the compose
# file, so VM_COUNT, the SSH ports and the guest IPs are stated once in
# qemu/env.scale-out and never restated here. A hand-written inventory that
# drifts from the fleet is exactly the failure this avoids: the play would
# configure six of eight guests and succeed.
#
# Unlike the vm-* playbooks this one configures a RUNNING fleet rather than
# baking an image. It is re-runnable, and it has to be: everything it sets up
# inside the guest except the Docker packages is run-time state that a reboot
# discards (AGENTS.md issue 12). The systemd unit's preflight restores the
# ernic address on its own, which is the part that makes a reboot survivable
# without re-running this.

- name: Run the LMCache worker in every fleet guest
  hosts: fleet
  gather_facts: true
  become: false
  # One at a time would take VM_COUNT x image-load; all at once is the start
  # burst the stack README warns about. This is a compromise that has the
  # guests' apt and docker load overlapping without a fleet-wide thundering
  # herd against the Docker apt repo.
  serial: 4
  tags: [install, configure]
  vars:
    # All three derived from the inventory rather than restated: the inventory
    # is generated from VM_COUNT, so none of them can drift from the fleet.
    lmcache_guest_instance_id: "{{ inventory_hostname }}"
    # The ernic address, with no prefix -- it is what peers dial and what the
    # coordinator records, so it must be the guest's address on the one
    # network every guest shares.
    lmcache_guest_advertise_ip: "{{ fleet_guest_ip }}"
    lmcache_guest_eth_address: "{{ fleet_guest_ip }}/{{ fleet_guest_prefix }}"
  roles:
    - role: lmcache_guest

  post_tasks:
    - name: Report the server's own view
      become: true
      ansible.builtin.command:
        cmd: journalctl -u {{ lmcache_guest_container_name }} --no-pager -n 25
      register: lmcache_guest_journal
      changed_when: false
      failed_when: false

    - name: Show it
      ansible.builtin.debug:
        var: lmcache_guest_journal.stdout_lines

# A second play, once every guest has been through the first. Registration is
# the thing worth asserting and it can only be checked from the coordinator:
# a unit can be active, and a server can be serving, while its registration
# never landed -- a wrong advertise IP or a coordinator URL the guest cannot
# reach both present exactly that way.
- name: Verify the fleet registered with the coordinator
  hosts: fleet[0]
  gather_facts: false
  become: false
  tags: [configure]
  tasks:
    - name: Ask the coordinator who it can see
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ lmcache_guest_coordinator_url }}/instances"
        return_content: true
      register: lmcache_instances
      retries: 12
      delay: 10
      until: >-
        lmcache_instances.json.instances | default([]) | length
        >= (groups['fleet'] | length)
      failed_when: false

    - name: Report registration
      vars:
        seen: "{{ lmcache_instances.json.instances | default([])
                  | map(attribute='instance_id') | list }}"
      ansible.builtin.debug:
        msg: >-
          {{ seen | length }} of {{ groups['fleet'] | length }} registered.
          Missing: {{ groups['fleet'] | difference(seen) | default([]) }}

