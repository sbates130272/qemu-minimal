---
# Make the xio guest's doorbell rig ready: install the guest tool and check
# both devices are there. Re-runnable. Run it after the stack rendered from
# qemu/stacks/xio.xml and qemu/overlays/xio-doorbell.xml is up, against the
# inventory that render wrote:
#
#   cd ansible && ansible-playbook \
#       -i /var/lib/qemu-tool/stacks/xio-doorbell/fleet-inventory.yml \
#       --private-key <key> playbooks/vfu-doorbell-guest.yml
#
# The guest half is built in the guest, from the rocm-xio checkout the xio
# stack's rocm_xio_setup role makes (db_xio_src). The overlay names the branch
# it installs, <xio-ref>feat/vfu-doorbell, so the checkout holds
# tools/vfu-doorbell and kernel/vfu-dma. Make it first, with the overlay in
# force:
#
#   qemu-tool quick-start --flavor xio --xml qemu/stacks/xio.xml \
#       --xml qemu/overlays/xio-doorbell.xml --xio-test test
#
# or, once the stack is up, the same with `test --xio-test`. An unpinned branch
# is not rebuilt when it has only been pushed to; add
# -e rocm_xio_setup_force=true to that run to take the new commit. The servers
# are not built here: they run on the host, from the image <doorbell-image>
# names, which rocm-xio's CI builds from the same branch.
#
# The built-in scenarios only run when asked for, because they take a minute;
# --tags all,selftest runs everything including them:
#
#   ansible-playbook ... --tags all,selftest
#
# The vfu-dma kernel module (bus addresses from the DMA API, so vfu-ring
# works under a translating IOMMU) is built in the guest with DKMS on every
# run. It needs the kernel headers for the running kernel in the guest, and the
# run fails with a message if they are missing. The playbook only builds and
# installs the module.
# It never loads a module or binds a driver, and neither does vfu-ring: that
# is vfu-driver-select, run in the guest as root, which leaves the ringer on the
# one driver a --dma mode needs:
#
#   vfu-driver-select status
#   vfu-driver-select physical | vfu-dma | vfio
#
# The corporate CA is installed from $VM_CA_CERT_FILE if it is set, or from
# -e db_ca_cert_file=<path>. It is skipped when neither is. It has to come from
# here: the guest is an overlay on a published qcow2, which gets no cloud-init
# seed, so `gen-vm --ca-cert` never reaches it.

- name: Make the doorbell guest ready
  hosts: fleet
  gather_facts: false
  become: false
  vars:
    # rocm_xio_setup_source_dir's default. A playbook cannot read a role's
    # default, so it is repeated; pass -e db_xio_src if the role's moved.
    db_xio_src: /usr/local/src/rocm-xio
    db_ca_cert_file: "{{ lookup('ansible.builtin.env', 'VM_CA_CERT_FILE') }}"
  tasks:
    - name: Install the extra CA certificate
      become: true
      ansible.builtin.copy:
        src: "{{ db_ca_cert_file }}"
        dest: "/usr/local/share/ca-certificates/{{ db_ca_cert_file | basename }}"
        mode: "0644"
      when: db_ca_cert_file | length > 0
      register: db_ca_installed

    - name: Rebuild the CA trust bundle
      become: true
      ansible.builtin.command:
        cmd: update-ca-certificates
      when: db_ca_installed is changed
      changed_when: true

    - name: Look for the rocm-xio checkout and its doorbell tools
      ansible.builtin.stat:
        path: "{{ db_xio_src }}/tools/vfu-doorbell/CMakeLists.txt"
      register: db_xio

    - name: Fail unless the guest has rocm-xio with the doorbell tools
      ansible.builtin.assert:
        that:
          - db_xio.stat.exists
        fail_msg: >-
          {{ db_xio_src }}/tools/vfu-doorbell is not in the guest. Install
          rocm-xio from the branch that has it by running the xio flavor's
          rocm-xio play with qemu/overlays/xio-doorbell.xml layered after
          qemu/stacks/xio.xml (see the top of this playbook).

    # The role clones as root, so git refuses the tree for anyone else.
    - name: Say which rocm-xio commit the tools are built from
      become: true
      ansible.builtin.command:
        cmd: git -C {{ db_xio_src }} rev-parse HEAD
      register: db_xio_head
      changed_when: false

    - name: Report it
      ansible.builtin.debug:
        msg: "rocm-xio {{ db_xio_head.stdout }}; the servers on the host must be built from the same commit"

    - name: Install the build tools
      become: true
      ansible.builtin.apt:
        name:
          - build-essential
          - cmake
        state: present

    # vfu-ring is the one target that needs no libvfio-user: the CMake project
    # skips the vfu-doorbell server where that library is not found.
    - name: Build vfu-ring
      become: true
      ansible.builtin.shell:
        cmd: |
          set -e
          cmake -S {{ db_xio_src }}/tools/vfu-doorbell -B /var/tmp/vfu-doorbell-build \
              -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /var/tmp/vfu-doorbell-build --target vfu-ring -j"$(nproc)"
        executable: /bin/bash
      changed_when: true

    - name: Install vfu-ring
      become: true
      ansible.builtin.copy:
        src: /var/tmp/vfu-doorbell-build/vfu-ring
        dest: /usr/local/bin/vfu-ring
        mode: "0755"
        remote_src: true

    - name: Install vfu-driver-select
      become: true
      ansible.builtin.copy:
        src: "{{ db_xio_src }}/tools/vfu-doorbell/vfu-driver-select"
        dest: /usr/local/bin/vfu-driver-select
        mode: "0755"
        remote_src: true

    # The devices are plain PCI functions with vendor 1de0 and no driver; the
    # tool maps their BARs through sysfs.
    - name: Find the ringee and the ringer
      ansible.builtin.command:
        cmd: "lspci -n -d 1de0:"
      register: db_lspci
      changed_when: false

    - name: Fail unless both devices are there
      ansible.builtin.assert:
        that:
          - "'1de0:0001' in db_lspci.stdout"
          - "'1de0:0002' in db_lspci.stdout"
        fail_msg: >-
          Expected the ringee (1de0:0001) and the ringer (1de0:0002); lspci
          shows: {{ db_lspci.stdout }}

    # The ringer writes by DMA, and QEMU only lets a device DMA to another
    # device's registers once PCI Bus Master Enable is set, which no driver does
    # here. A fresh guest has it clear and every ringer write then fails with
    # ENODEV. Setting it is idempotent.
    - name: Enable bus mastering on the ringer
      become: true
      ansible.builtin.command:
        cmd: setpci -d 1de0:0002 COMMAND=0x4:0x4
      changed_when: false

    - name: Read the ringer's command register back
      become: true
      ansible.builtin.command:
        cmd: setpci -d 1de0:0002 COMMAND
      register: db_cmd
      changed_when: false

    - name: Fail unless bus mastering is on
      ansible.builtin.assert:
        that:
          - "(db_cmd.stdout | trim | int(base=16)) % 8 >= 4"
        fail_msg: >-
          Bus Master Enable did not stick on the ringer: COMMAND is
          {{ db_cmd.stdout | trim }}

    - name: Show what the tool sees
      become: true
      ansible.builtin.command:
        cmd: /usr/local/bin/vfu-ring info
      register: db_info
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ db_info.stdout_lines }}"

    - name: Run the built-in scenarios
      become: true
      ansible.builtin.command:
        cmd: /usr/local/bin/vfu-ring selftest
      register: db_selftest
      changed_when: false
      tags: [never, selftest]

    - name: Report the scenarios
      ansible.builtin.debug:
        msg: "{{ db_selftest.stdout_lines }}"
      tags: [never, selftest]

    # The vfu-dma module, from the same checkout. Version of the DKMS package,
    # bumped with the module.
    - name: Find the running kernel
      ansible.builtin.command:
        cmd: uname -r
      register: db_kver
      changed_when: false

    - name: Look for kernel headers for it
      ansible.builtin.stat:
        path: "/lib/modules/{{ db_kver.stdout }}/build/Makefile"
      register: db_headers

    - name: Fail unless kernel headers are installed for it
      ansible.builtin.assert:
        that:
          - db_headers.stat.exists
        fail_msg: >-
          No kernel headers for {{ db_kver.stdout }} (no
          /lib/modules/{{ db_kver.stdout }}/build). The module builds against
          them. For an Ubuntu mainline kernel, install the matching
          linux-headers-*_all.deb and linux-headers-*-generic_*_amd64.deb from
          https://kernel.ubuntu.com/mainline/ in the guest, then rerun.

    - name: Install the build tools
      become: true
      ansible.builtin.apt:
        name:
          - dkms
          - gcc
          - make
        state: present

    - name: Create the DKMS source directory
      become: true
      ansible.builtin.file:
        path: /usr/src/vfu-dma-0.1
        state: directory
        mode: "0755"

    - name: Copy the vfu-dma sources
      become: true
      ansible.builtin.copy:
        src: "{{ db_xio_src }}/kernel/vfu-dma/{{ item }}"
        dest: "/usr/src/vfu-dma-0.1/{{ item }}"
        mode: "0644"
        remote_src: true
      loop:
        - vfu-dma.c
        - vfu-dma-uapi.h
        - Makefile
        - dkms.conf
      register: db_vfu_dma_files

    - name: Set the DKMS package version
      become: true
      ansible.builtin.replace:
        path: /usr/src/vfu-dma-0.1/dkms.conf
        regexp: "#MODULE_VERSION#"
        replace: "0.1"

    # Rebuild when the sources changed or the module is not installed yet. A
    # loaded copy keeps running until vfu-driver-select physical unloads it.
    - name: Build and install the module with DKMS
      become: true
      ansible.builtin.shell: |
        set -e
        if dkms status vfu-dma/0.1 | grep -q installed && [ "{{ db_vfu_dma_files.changed }}" != "True" ]; then
          exit 0
        fi
        dkms remove vfu-dma/0.1 --all >/dev/null 2>&1 || true
        dkms add vfu-dma/0.1
        dkms build vfu-dma/0.1
        dkms install vfu-dma/0.1
        echo changed
      args:
        executable: /bin/bash
      register: db_dkms
      changed_when: "'changed' in db_dkms.stdout"
