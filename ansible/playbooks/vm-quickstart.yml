---
# Make the guests of a running quickstart stack test-ready, then prove the
# GPU, the RDMA NIC and the NVMe with one test each.
#
#   ansible-playbook -i <stack dir>/fleet-inventory.yml \
#       playbooks/vm-quickstart.yml --private-key <key>
#
# Normally reached through `qemu-tool quick-start`, which is also what the
# daily report-for-vm-rocm-golden lane runs. It configures RUNNING guests
# rather than baking an image, and it is re-runnable.
#
# It is small because the published qcow2 already carries almost everything:
# the mainline kernel, the ionic DKMS pair and its modules-load.d entry,
# rdma-core, perftest, fio, ROCm on PATH and in the linker cache, the patched
# amdgpu module and the amdgpu-probe script. Checked against a guest booted
# from the image, not assumed. What a freshly booted guest still lacks:
#
#   1. /lib/firmware/amdgpu/ip_discovery.bin. Omitted from the published disk
#      on purpose -- it is per rocjitsu build -- and without it amdgpu probes
#      -2, no KFD node appears and the guest looks GPU-less.
#   2. The ernic udev naming rules, which the image does not ship.
#   3. An address on the ernic. Run-time only state, and without it ARP goes
#      unanswered and ib_send_bw cannot do its out-of-band exchange at all.
#   4. amdgpu loaded. It is blacklisted at boot by design: the device is
#      attached from outside the guest, so the driver must not load before
#      the rocjitsu server is serving.
#   5. The metrics exporters the stack's Prometheus scrapes.
#
# Everything else here is a test or a fact for the report.

- name: Make both guests test-ready
  hosts: fleet
  gather_facts: true
  # No play-level become: the firmware role delegates tasks to the controller,
  # where sudo is neither wanted nor available. Each task that needs root in
  # the guest takes become for itself, as the included roles already do.
  become: false
  vars:
    fleet_guest_eth_address: "{{ fleet_guest_ip }}/{{ fleet_guest_prefix }}"
  tasks:
    # On AMD corporate network the host exports AMD_CERT (base64 ZScaler CA)
    # and VM_CA_CERT_FILE (destination path). The published qcow2 has neither,
    # so HTTPS downloads in later tasks fail without this. If AMD_CERT is unset
    # (non-corporate host) the task is skipped and validate_certs stays true.
    - name: Install ZScaler CA cert so HTTPS works in guest
      become: true
      ansible.builtin.copy:
        dest: "{{ lookup('env', 'VM_CA_CERT_FILE') }}"
        content: "{{ lookup('env', 'AMD_CERT') | b64decode }}"
        mode: "0644"
      when: lookup('env', 'AMD_CERT') | length > 0

    - name: Rebuild CA trust bundle
      become: true
      ansible.builtin.command:
        cmd: update-ca-certificates
      changed_when: true
      when: lookup('env', 'AMD_CERT') | length > 0

    - name: Install the gfx1250 firmware stubs generated from this stack's rocjitsu
      ansible.builtin.include_role:
        name: rocjitsu_setup
        tasks_from: firmware
      vars:
        rocjitsu_setup_firmware_live: true

    # Takes effect at the next device-add, not now: udev will not rename a
    # live interface. So everything below finds the device by MAC or asks
    # ibv_devinfo for its name rather than assuming the renamed one.
    - name: Install the ernic udev naming rules
      ansible.builtin.include_role:
        name: rocm_ernic_setup
        tasks_from: naming
        apply:
          become: true

    - name: Assign ernic Ethernet address
      become: true
      ansible.builtin.shell:
        cmd: |
          iface=$(ip -br link | awk '/72:6f:63:6d/ {print $1}')
          [ -n "$iface" ] || { echo "ernic interface not found"; exit 1; }
          ip link set "$iface" up
          ip addr add "{{ fleet_guest_eth_address }}" dev "$iface" 2>/dev/null || true
          echo "assigned {{ fleet_guest_eth_address }} to $iface"
        executable: /bin/bash
      changed_when: true

    # For the NEXT boot of this guest; vm-rocm-golden.yml bakes the same mask
    # in. The published qcow2 predates that, so a reboot stalls for over 90 s
    # without it.
    - name: Mask systemd-networkd-wait-online to prevent ernic boot delay
      become: true
      ansible.builtin.systemd_service:
        name: systemd-networkd-wait-online.service
        masked: true
      failed_when: false

    - name: Check whether KFD is already up
      ansible.builtin.stat:
        path: /dev/kfd
      register: quickstart_kfd

    # The image's own wrapper, not a bare modprobe: modprobe on an already
    # resident amdgpu silently discards its parameters and returns 0, and
    # amdgpu-probe refuses in that case. The parameters are not optional --
    # discovery=2 is what makes the driver read ip_discovery.bin at all.
    - name: Probe amdgpu with the emulation parameters
      become: true
      ansible.builtin.command:
        cmd: /usr/local/bin/amdgpu-probe
      when: not quickstart_kfd.stat.exists
      changed_when: true

    - name: Wait for the KFD node
      ansible.builtin.wait_for:
        path: /dev/kfd
        timeout: 120

    # A fact, not a play var: the plays below read it too. /opt/rocm is the
    # versionless path the image provides; it resolves to the therock
    # component directory, which is also on PATH and in the linker cache.
    - name: Record the ROCm prefix
      ansible.builtin.set_fact:
        quickstart_rocm: /opt/rocm

    - name: Fail with a useful message when the image has no hipcc
      ansible.builtin.stat:
        path: "{{ quickstart_rocm }}/bin/hipcc"
      register: quickstart_hipcc
      failed_when: not quickstart_hipcc.stat.exists

    # No module loading here. The image loads ionic and ionic_rdma at boot from
    # modules-load.d, and keeps both out of the initramfs so the loaded pair is
    # the DKMS pair. The retry below covers the time the device takes to
    # register.
    #
    # The IB device name is asked for rather than assumed: without a re-add
    # the device keeps its kernel name, and a guest prepared for UCX answers
    # to something else again. A wrong -d is a confusing failure.
    #
    # Retried: ionic_rdma probes over vfio-user and the device registration
    # races with SSH availability -- ibv_devinfo -l can return empty on a
    # fresh boot before the IB device is registered. 60 x 2s = 120s ceiling
    # (doubled from 30 x 2s: CI runners are slower and ionic_rdma + RDMA
    # stack initialisation over vfio-user can take up to 90 s on cold start).
    - name: Find the IB device
      ansible.builtin.command:
        cmd: ibv_devinfo -l
      register: quickstart_ibv_list
      changed_when: false
      until: >-
        quickstart_ibv_list.stdout_lines[1:]
        | map('trim') | reject('equalto', '') | list | length > 0
      retries: 30
      delay: 2

    - name: Record the IB device name
      ansible.builtin.set_fact:
        quickstart_ib_device: >-
          {{ quickstart_ibv_list.stdout_lines[1:]
             | map('trim') | reject('equalto', '') | list | first }}

    - name: Wait for the port to come up
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ibv_devinfo -d {{ quickstart_ib_device }} | grep -q 'state:.*PORT_ACTIVE'
        executable: /bin/bash
      register: quickstart_port
      until: quickstart_port.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: Report what each guest has
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: kernel {{ ansible_facts['kernel'] }},
          IB {{ quickstart_ib_device }}
          ({{ quickstart_port.attempts | default(1) }} attempt(s) to PORT_ACTIVE),
          ernic {{ fleet_guest_ip }}


# ---------------------------------------------------------------------------
# Metrics exporters (non-fatal)
# ---------------------------------------------------------------------------
#
# node_exporter with an amdgpu textfile collector, and rdma_exporter, which
# the stack's Prometheus scrapes. vm-rocm-golden.yml bakes both in from the
# same task files, so on an image built from it this play changes nothing;
# it is here for images that predate that. Non-fatal: they come from apt and
# GitHub at run time, and a failure must not stop the tests below.
- name: Install the metrics exporters
  hosts: fleet
  gather_facts: false
  any_errors_fatal: false
  ignore_errors: true
  become: false
  tasks:
    - name: Install node_exporter and the amdgpu textfile collector
      ansible.builtin.include_role:
        name: rocjitsu_setup
        tasks_from: metrics

    - name: Install rdma_exporter
      ansible.builtin.include_role:
        name: rocm_ernic_setup
        tasks_from: metrics

# ---------------------------------------------------------------------------
# GPU test
# ---------------------------------------------------------------------------
#
# ONE scratch-using process per guest per device lifetime. The emulated GPU
# serves its private/scratch segment to exactly one process, and the second
# one in the same boot wedges the device for every later process -- see
# roles/rocjitsu_setup/defaults/main.yml. So this play runs a single
# workload and nothing else touches the GPU afterwards.
- name: Prove the GPU
  hosts: fleet
  gather_facts: false
  become: false
  tasks:
    - name: Create the work directory
      ansible.builtin.file:
        path: /var/tmp/quickstart
        state: directory
        mode: "0755"

    # The source rocjitsu_setup already owns, by relative path rather than
    # a second copy: it reports the device name and CU count, then checks the
    # result rather than only that the kernel launched.
    - name: Copy the HIP source
      ansible.builtin.copy:
        src: roles/rocjitsu_setup/files/vector_add.hip
        dest: /var/tmp/quickstart/vector_add.hip
        mode: "0644"

    - name: Enumerate the ROCm agents
      ansible.builtin.command:
        cmd: "{{ quickstart_rocm }}/bin/rocm_agent_enumerator"
      register: quickstart_agents
      changed_when: false

    # gfx000 is the CPU agent and is always listed; a run where it is the only
    # entry means KFD came up without the GPU attached.
    - name: Record the GPU target
      ansible.builtin.set_fact:
        quickstart_arch: >-
          {{ quickstart_agents.stdout_lines | map('trim')
             | reject('match', '^gfx000$') | reject('equalto', '')
             | list | first | default('') }}

    - name: Fail when no GPU agent was enumerated
      ansible.builtin.fail:
        msg: >-
          rocm_agent_enumerator found no GPU agent (saw
          {{ quickstart_agents.stdout_lines | join(', ') }}). amdgpu loaded but
          KFD did not attach the device.
      when: quickstart_arch | length == 0

    - name: Compile vector_add
      ansible.builtin.command:
        cmd: >-
          timeout 600 {{ quickstart_rocm }}/bin/hipcc
          --offload-arch={{ quickstart_arch }}
          -o /var/tmp/quickstart/vector_add
          /var/tmp/quickstart/vector_add.hip
      changed_when: true

    - name: Run vector_add
      ansible.builtin.command:
        cmd: timeout 600 /var/tmp/quickstart/vector_add 4096
      register: quickstart_vector_add
      changed_when: false
      failed_when: >-
        quickstart_vector_add.rc != 0
        or 'vector-add: PASS' not in quickstart_vector_add.stdout

    - name: Show the GPU test output
      ansible.builtin.debug:
        msg: "{{ quickstart_vector_add.stdout_lines }}"

# ---------------------------------------------------------------------------
# RDMA test
# ---------------------------------------------------------------------------
#
# ib_send_bw from guest 1 to guest 2 over the mesh. The server goes into a
# transient SYSTEM unit, not a backgrounded SSH command: a perftest server
# started over SSH exits with the session even when disowned. It is never
# killed either -- it exits on its own once the client finishes, and killing
# a perftest mid-run leaves the guest RDMA device broken until the whole
# stack is recreated.
- name: Start the RDMA server on the last guest
  hosts: fleet[-1]
  gather_facts: false
  become: true
  tasks:
    - name: Clear any unit left by an earlier run
      ansible.builtin.shell:
        cmd: |
          systemctl stop quickstart-ib-send-bw.service 2>/dev/null || true
          systemctl reset-failed quickstart-ib-send-bw.service 2>/dev/null || true
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Start ib_send_bw as a transient unit
      ansible.builtin.command:
        cmd: >-
          systemd-run --unit=quickstart-ib-send-bw --collect
          /usr/bin/ib_send_bw -d {{ quickstart_ib_device }}
          {% if quickstart_rdma_duration is defined %}
          --duration {{ quickstart_rdma_duration }}
          {% else %}
          --iters 1000
          {% endif %}
          --size 65536
      changed_when: true

    # Read the listening socket; do NOT connect to it. `wait_for: port:` was
    # the first attempt and it is a trap here: it opens a TCP connection,
    # which IS the client as far as ib_send_bw is concerned. The server took
    # the probe for its peer, failed the parameter exchange
    # ("ethernet_read_data: Couldn't read reports") and exited before the
    # real client arrived a second later, which then reported "Couldn't
    # connect" and looked like a broken L2 segment. Anything that opens this
    # port changes what it is measuring.
    - name: Wait for it to listen
      ansible.builtin.shell:
        cmd: set -o pipefail; ss -ltn 'sport = :18515' | grep -q LISTEN
        executable: /bin/bash
      register: quickstart_server_listening
      until: quickstart_server_listening.rc == 0
      retries: 30
      delay: 2
      changed_when: false

- name: Run the RDMA client on the first guest
  hosts: fleet[0]
  gather_facts: false
  become: false
  tasks:
    - name: Run ib_send_bw against the peer
      ansible.builtin.command:
        cmd: >-
          timeout {{ (quickstart_rdma_duration | default(0) | int + 60) if quickstart_rdma_duration is defined else 300 }}
          /usr/bin/ib_send_bw -d {{ quickstart_ib_device }}
          {% if quickstart_rdma_duration is defined %}
          --duration {{ quickstart_rdma_duration }}
          {% else %}
          --iters 1000
          {% endif %}
          --size 65536
          {{ hostvars[groups['fleet'][-1]].fleet_guest_ip }}
      register: quickstart_ib_send_bw
      changed_when: false

    - name: Show the RDMA test output
      ansible.builtin.debug:
        msg: "{{ quickstart_ib_send_bw.stdout_lines }}"

    # The BW line, not the exit status: ib_send_bw exits 0 on runs that moved
    # nothing useful, and this is the number the report quotes.
    - name: Assert the run reported a non-zero bandwidth
      ansible.builtin.set_fact:
        quickstart_bw: >-
          {{ quickstart_ib_send_bw.stdout_lines
             | select('search', '^\s*65536\s')
             | list | first | default('') }}
      failed_when: quickstart_bw | length == 0

# ---------------------------------------------------------------------------
# NVMe I/O test
# ---------------------------------------------------------------------------
#
# Sequential write then read on /dev/nvme0n1 using fio with direct I/O.
# The device is emulated scratch -- write first, then read back what was
# written. Both passes run for 10 s. The assertion is non-zero bandwidth:
# this proves the block device is functional, not that it hits any
# particular throughput floor (emulated NVMe over qcow2 varies widely).
- name: Test NVMe I/O on each guest
  hosts: fleet
  gather_facts: false
  become: false
  tasks:
    - name: Check /dev/nvme0n1 exists
      ansible.builtin.stat:
        path: /dev/nvme0n1
      register: quickstart_nvme_dev
      failed_when: not quickstart_nvme_dev.stat.exists

    - name: Run fio sequential write on nvme0n1
      become: true
      ansible.builtin.command:
        cmd: >-
          fio --name=nvme-write --filename=/dev/nvme0n1
          --rw=write --bs=128k --direct=1
          --time_based --runtime={{ quickstart_nvme_duration | default(10) }} --numjobs=1
          --output-format=json
      register: quickstart_nvme_write
      changed_when: false

    - name: Run fio sequential read on nvme0n1
      become: true
      ansible.builtin.command:
        cmd: >-
          fio --name=nvme-read --filename=/dev/nvme0n1
          --rw=read --bs=128k --direct=1
          --time_based --runtime={{ quickstart_nvme_duration | default(10) }} --numjobs=1
          --output-format=json
      register: quickstart_nvme_read
      changed_when: false

    - name: Extract NVMe write and read bandwidth
      ansible.builtin.set_fact:
        quickstart_nvme_write_bw: >-
          {{ (quickstart_nvme_write.stdout | from_json).jobs[0].write.bw_bytes }}
        quickstart_nvme_read_bw: >-
          {{ (quickstart_nvme_read.stdout | from_json).jobs[0].read.bw_bytes }}

    - name: Assert non-zero NVMe bandwidth
      ansible.builtin.assert:
        that:
          - quickstart_nvme_write_bw | int > 0
          - quickstart_nvme_read_bw | int > 0
        fail_msg: >-
          NVMe I/O test failed: write={{ quickstart_nvme_write_bw }}
          read={{ quickstart_nvme_read_bw }} bytes/s

    - name: Show NVMe I/O results
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: NVMe write
          {{ (quickstart_nvme_write_bw | int / 1048576) | round(0) }} MiB/s,
          read {{ (quickstart_nvme_read_bw | int / 1048576) | round(0) }} MiB/s

# ---------------------------------------------------------------------------
# Facts for the report
# ---------------------------------------------------------------------------
- name: Collect the facts the report quotes
  hosts: fleet
  gather_facts: false
  become: false
  vars:
    # Where `qemu-tool quick-start` collects per-guest output from. Writing
    # files rather than printing lets it assemble a report without parsing an
    # Ansible recap.
    quickstart_artifacts_dir: /var/tmp/quickstart-artifacts
  tasks:
    - name: Gather a summary in the guest
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          echo "## {{ inventory_hostname }}"
          echo
          echo '```'
          echo "kernel:  $(uname -r)"
          echo "rocm:    $(dirname "$(readlink -f {{ quickstart_rocm }}/bin)")"
          echo "gpu:     {{ quickstart_arch | default('none') }}"
          ibv_devinfo -d {{ quickstart_ib_device }} | head -8
          echo "--- block devices (nvme0n1 is the emulated NVMe)"
          lsblk -d -o NAME,SIZE,TYPE
          echo "--- addresses"
          ip -br addr
          echo '```'
        executable: /bin/bash
      register: quickstart_summary
      changed_when: false

    # Not run_once: it would behave differently under the free strategy, and
    # creating the same directory once per guest costs nothing.
    - name: Make the artifacts directory on the controller
      ansible.builtin.file:
        path: "{{ quickstart_artifacts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Write this guest's summary to the controller
      ansible.builtin.copy:
        content: |
          {{ quickstart_summary.stdout }}

          ### GPU test

          ```
          {{ quickstart_vector_add.stdout | default('not run') }}
          ```

          {% if quickstart_ib_send_bw is defined %}
          ### RDMA test (client)

          ```
          {{ quickstart_ib_send_bw.stdout }}
          ```
          {% endif %}

          {% if quickstart_nvme_write_bw is defined %}
          ### NVMe I/O test

          | Direction | Bandwidth |
          |-----------|-----------|
          | write | {{ (quickstart_nvme_write_bw | int / 1048576) | round(0) }} MiB/s |
          | read  | {{ (quickstart_nvme_read_bw  | int / 1048576) | round(0) }} MiB/s |
          {% endif %}
        dest: "{{ quickstart_artifacts_dir }}/{{ inventory_hostname }}.md"
        mode: "0644"
      delegate_to: localhost
