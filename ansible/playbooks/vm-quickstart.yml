---
# Make the guests of a running quickstart stack test-ready, then prove the
# GPU, the RDMA NIC and the NVMe with one test each.
#
#   ansible-playbook -i <stack dir>/fleet-inventory.yml \
#       playbooks/vm-quickstart.yml --private-key <key>
#
# Normally reached through `qemu-tool quick-start`, which is also what the
# daily report-for-vm-rocm-golden lane runs. It configures RUNNING guests
# rather than baking an image, and it is re-runnable.
#
# It is small because the published qcow2 already carries almost everything.
# The image is the one vm-rocm-golden.yml bakes, and that playbook installs
# the mainline kernel, the ionic DKMS pair and its modules-load.d entry,
# rdma-core, perftest, fio, ROCm, the patched amdgpu module and the
# amdgpu-probe script, the ernic udev naming rules, the boot-time addressing
# unit and the metrics exporters. What a freshly booted guest still lacks:
#
#   1. /lib/firmware/amdgpu/ip_discovery.bin. Omitted from the published disk
#      on purpose -- it is per rocjitsu build -- and without it amdgpu probes
#      -2, no KFD node appears and the guest looks GPU-less.
#   2. amdgpu loaded. It is blacklisted at boot by design: the device is
#      attached from outside the guest, so the driver must not load before
#      the rocjitsu server is serving.
#
# Three steps here repeat what that bake already did -- the naming rules, the
# ernic address and the exporters -- and are kept: this playbook is also run
# against guests that did not come from that image, and each is a no-op or a
# harmless repeat on one that did. One is not a no-op on the published image
# 20261117.g80c17f8: that bake installed rocm-ernic's own copy of the naming
# rules, from ernic_source_pin, and the step here replaces it with this
# repository's. The image published after it, 20261117.g481c892, which the
# fleet files pull, already has this repository's.
#
# Everything else here is a test or a fact for the report.

- name: Make both guests test-ready
  hosts: fleet
  gather_facts: true
  # No play-level become: the firmware role delegates tasks to the controller,
  # where sudo is neither wanted nor available. Each task that needs root in
  # the guest takes become for itself, as the included roles already do.
  become: false
  vars:
    fleet_guest_eth_address: "{{ fleet_guest_ip }}/{{ fleet_guest_prefix }}"
  tasks:
    # On AMD corporate network the host exports AMD_CERT (base64 ZScaler CA)
    # and VM_CA_CERT_FILE (destination path). The published qcow2 has neither,
    # so HTTPS downloads in later tasks fail without this. If AMD_CERT is unset
    # (non-corporate host) the task is skipped and validate_certs stays true.
    - name: Install ZScaler CA cert so HTTPS works in guest
      become: true
      ansible.builtin.copy:
        dest: "{{ lookup('env', 'VM_CA_CERT_FILE') }}"
        content: "{{ lookup('env', 'AMD_CERT') | b64decode }}"
        mode: "0644"
      when: lookup('env', 'AMD_CERT') | length > 0

    - name: Rebuild CA trust bundle
      become: true
      ansible.builtin.command:
        cmd: update-ca-certificates
      changed_when: true
      when: lookup('env', 'AMD_CERT') | length > 0

    - name: Install the gfx1250 firmware stubs generated from this stack's rocjitsu
      ansible.builtin.include_role:
        name: rocjitsu_setup
        tasks_from: firmware
      vars:
        rocjitsu_setup_firmware_live: true

    # Takes effect at the next device-add, not now: udev will not rename a
    # live interface. So everything below finds the device by MAC or asks
    # ibv_devinfo for its name rather than assuming the renamed one.
    - name: Install the ernic udev naming rules
      ansible.builtin.include_role:
        name: rocm_ernic_setup
        tasks_from: naming
        apply:
          become: true

    - name: Assign ernic Ethernet address
      become: true
      ansible.builtin.shell:
        cmd: |
          iface=$(ip -br link | awk '/72:6f:63:6d/ {print $1}')
          [ -n "$iface" ] || { echo "ernic interface not found"; exit 1; }
          ip link set "$iface" up
          ip addr add "{{ fleet_guest_eth_address }}" dev "$iface" 2>/dev/null || true
          echo "assigned {{ fleet_guest_eth_address }} to $iface"
        executable: /bin/bash
      changed_when: true

    # For the NEXT boot of this guest. vm-rocm-golden.yml bakes the same mask
    # in, so on the published image this changes nothing; it is here for a
    # guest baked before that, where a reboot stalls for over 90 s without it.
    - name: Mask systemd-networkd-wait-online to prevent ernic boot delay
      become: true
      ansible.builtin.systemd_service:
        name: systemd-networkd-wait-online.service
        masked: true
      failed_when: false

    # /dev/kfd says amdgpu is resident and nothing about the GPU: the driver
    # creates the node before it registers with the PCI bus, so it is there
    # after a probe that failed and bound nothing.
    - name: Check whether amdgpu is already resident
      ansible.builtin.stat:
        path: /dev/kfd
      register: quickstart_kfd

    # Which of the two it is. Asked only of a resident module: a wrapper from
    # before --status existed takes the argument for a plain run, and on a
    # resident module that loads nothing. "unbound" is a GPU with no driver
    # under an amdgpu that has the right parameters -- an earlier probe
    # failed, most often for want of the firmware the tasks above install.
    # Those tasks re-bind only when they installed something, so a guest
    # whose blob already matched is still unbound here.
    - name: Ask the probe what state a resident amdgpu is in
      ansible.builtin.command:
        cmd: /usr/local/bin/amdgpu-probe --status
      register: quickstart_probe_status
      changed_when: false
      failed_when: false
      when: quickstart_kfd.stat.exists

    # The image's own wrapper, not a bare modprobe: modprobe on an already
    # resident amdgpu silently discards its parameters and returns 0, and
    # amdgpu-probe refuses in that case. The parameters are not optional --
    # discovery=2 is what makes the driver read ip_discovery.bin at all.
    # It also refuses while that blob is not staged, so this stays after the
    # firmware tasks above. On an unbound guest it loads nothing and binds
    # the GPU through sysfs. A resident amdgpu in any other state is left
    # alone, as it always was: the wrapper of a published image exits 1 on a
    # second run when it finds no render node, and a consumer may have
    # loaded the driver with parameters of their own.
    - name: Probe amdgpu with the emulation parameters
      become: true
      ansible.builtin.command:
        cmd: /usr/local/bin/amdgpu-probe
      when: >-
        not quickstart_kfd.stat.exists
        or (quickstart_probe_status.stdout | default('') | trim) == 'unbound'
      changed_when: true

    # Not a wait for /dev/kfd, for the reason above: that passed on a guest
    # with no GPU bound, and the tests further down then failed with nothing
    # naming the cause. Node 0 of the topology is the CPU and has an empty
    # name; a bound GPU adds a named one.
    - name: Wait for a GPU in the KFD topology
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for _ in $(seq 40); do
            gpus=$(cat /sys/class/kfd/kfd/topology/nodes/*/name 2>/dev/null | grep -c . || true)
            if [ "${gpus:-0}" -ge 1 ]; then
              echo "${gpus} GPU node(s)"
              exit 0
            fi
            sleep 3
          done
          echo "No GPU in the KFD topology after 120 s: amdgpu did not bind one." >&2
          echo "amdgpu-probe --status: $(/usr/local/bin/amdgpu-probe --status 2>&1 || true)" >&2
          echo "See: sudo dmesg | grep -i amdgpu" >&2
          exit 1
        executable: /bin/bash
      changed_when: false

    # A fact, not a play var: the plays below read it too. /opt/rocm is the
    # versionless path the image provides; it resolves to the therock
    # component directory, which is also on PATH and in the linker cache.
    - name: Record the ROCm prefix
      ansible.builtin.set_fact:
        quickstart_rocm: /opt/rocm

    - name: Fail with a useful message when the image has no hipcc
      ansible.builtin.stat:
        path: "{{ quickstart_rocm }}/bin/hipcc"
      register: quickstart_hipcc
      failed_when: not quickstart_hipcc.stat.exists

    # No module loading here. The image loads ionic and ionic_rdma at boot from
    # modules-load.d, and keeps both out of the initramfs so the loaded pair is
    # the DKMS pair. The retry below covers the time the device takes to
    # register.
    #
    # The IB device name is asked for rather than assumed: without a re-add
    # the device keeps its kernel name, and a guest prepared for UCX answers
    # to something else again. A wrong -d is a confusing failure.
    #
    # Retried: ionic_rdma probes over vfio-user and the device registration
    # races with SSH availability -- ibv_devinfo -l can return empty on a
    # fresh boot before the IB device is registered. 60 x 2s = 120s ceiling
    # (doubled from 30 x 2s: CI runners are slower and ionic_rdma + RDMA
    # stack initialisation over vfio-user can take up to 90 s on cold start).
    - name: Find the IB device
      ansible.builtin.command:
        cmd: ibv_devinfo -l
      register: quickstart_ibv_list
      changed_when: false
      until: >-
        quickstart_ibv_list.stdout_lines[1:]
        | map('trim') | reject('equalto', '') | list | length > 0
      retries: 30
      delay: 2

    - name: Record the IB device name
      ansible.builtin.set_fact:
        quickstart_ib_device: >-
          {{ quickstart_ibv_list.stdout_lines[1:]
             | map('trim') | reject('equalto', '') | list | first }}

    - name: Wait for the port to come up
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ibv_devinfo -d {{ quickstart_ib_device }} | grep -q 'state:.*PORT_ACTIVE'
        executable: /bin/bash
      register: quickstart_port
      until: quickstart_port.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: Report what each guest has
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: kernel {{ ansible_facts['kernel'] }},
          IB {{ quickstart_ib_device }}
          ({{ quickstart_port.attempts | default(1) }} attempt(s) to PORT_ACTIVE),
          ernic {{ fleet_guest_ip }}


# ---------------------------------------------------------------------------
# Metrics exporters (non-fatal)
# ---------------------------------------------------------------------------
#
# node_exporter with an amdgpu textfile collector, and rdma_exporter, which
# the stack's Prometheus scrapes. vm-rocm-golden.yml bakes both in from the
# same task files; this play is here for images that predate that.
#
# It was not a no-op on a golden guest, whatever this comment used to say.
# Measured against 20261117.g80c17f8: the node_exporter tasks changed
# nothing, and the rdma_exporter tarball was downloaded from GitHub and the
# binary reinstalled on every guest on every run. The role now records the
# tarball it installed and skips both when the record names the pinned one.
# That image carries no record, so each guest made from it is still
# installed to once. The bake of 20261117.g481c892, which the fleet files
# pull, wrote the record, and its guests are not: on two guests pulled from
# the registry this play skipped the download, the install and the record,
# and the binary kept the bake's mtime.
#
# Non-fatal: they come from apt and GitHub at run time, and a failure must
# not stop the tests below.
- name: Install the metrics exporters
  hosts: fleet
  gather_facts: false
  any_errors_fatal: false
  ignore_errors: true
  become: false
  tasks:
    - name: Install node_exporter and the amdgpu textfile collector
      ansible.builtin.include_role:
        name: rocjitsu_setup
        tasks_from: metrics

    - name: Install rdma_exporter
      ansible.builtin.include_role:
        name: rocm_ernic_setup
        tasks_from: metrics

# ---------------------------------------------------------------------------
# GPU test
# ---------------------------------------------------------------------------
#
# ONE scratch-using process per guest per device lifetime. The emulated GPU
# serves its private/scratch segment to exactly one process, and the second
# one in the same boot wedges the device for every later process -- see
# roles/rocjitsu_setup/defaults/main.yml. So this play runs a single
# workload and nothing else touches the GPU afterwards.
- name: Prove the GPU
  hosts: fleet
  gather_facts: false
  become: false
  tasks:
    - name: Create the work directory
      ansible.builtin.file:
        path: /var/tmp/quickstart
        state: directory
        mode: "0755"

    # The source rocjitsu_setup already owns, by relative path rather than
    # a second copy: it reports the device name and CU count, then checks the
    # result rather than only that the kernel launched.
    - name: Copy the HIP source
      ansible.builtin.copy:
        src: roles/rocjitsu_setup/files/vector_add.hip
        dest: /var/tmp/quickstart/vector_add.hip
        mode: "0644"

    - name: Enumerate the ROCm agents
      ansible.builtin.command:
        cmd: "{{ quickstart_rocm }}/bin/rocm_agent_enumerator"
      register: quickstart_agents
      changed_when: false

    # gfx000 is the CPU agent and is always listed; a run where it is the only
    # entry means KFD came up without the GPU attached.
    - name: Record the GPU target
      ansible.builtin.set_fact:
        quickstart_arch: >-
          {{ quickstart_agents.stdout_lines | map('trim')
             | reject('match', '^gfx000$') | reject('equalto', '')
             | list | first | default('') }}

    - name: Fail when no GPU agent was enumerated
      ansible.builtin.fail:
        msg: >-
          rocm_agent_enumerator found no GPU agent (saw
          {{ quickstart_agents.stdout_lines | join(', ') }}). amdgpu loaded but
          KFD did not attach the device.
      when: quickstart_arch | length == 0

    - name: Compile vector_add
      ansible.builtin.command:
        cmd: >-
          timeout 600 {{ quickstart_rocm }}/bin/hipcc
          --offload-arch={{ quickstart_arch }}
          -o /var/tmp/quickstart/vector_add
          /var/tmp/quickstart/vector_add.hip
      changed_when: true

    - name: Run vector_add
      ansible.builtin.command:
        cmd: timeout 600 /var/tmp/quickstart/vector_add 4096
      register: quickstart_vector_add
      changed_when: false
      failed_when: >-
        quickstart_vector_add.rc != 0
        or 'vector-add: PASS' not in quickstart_vector_add.stdout

    - name: Show the GPU test output
      ansible.builtin.debug:
        msg: "{{ quickstart_vector_add.stdout_lines }}"

# ---------------------------------------------------------------------------
# RDMA test
# ---------------------------------------------------------------------------
#
# ib_send_bw from guest 1 to guest 2 over the mesh. The server goes into a
# transient SYSTEM unit, not a backgrounded SSH command: a perftest server
# started over SSH exits with the session even when disowned. It is never
# killed either -- it exits on its own once the client finishes, and killing
# a perftest mid-run leaves the guest RDMA device broken until the whole
# stack is recreated.
- name: Start the RDMA server on the last guest
  hosts: fleet[-1]
  gather_facts: false
  become: true
  tasks:
    - name: Clear any unit left by an earlier run
      ansible.builtin.shell:
        cmd: |
          systemctl stop quickstart-ib-send-bw.service 2>/dev/null || true
          systemctl reset-failed quickstart-ib-send-bw.service 2>/dev/null || true
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Start ib_send_bw as a transient unit
      ansible.builtin.command:
        cmd: >-
          systemd-run --unit=quickstart-ib-send-bw --collect
          /usr/bin/ib_send_bw -d {{ quickstart_ib_device }}
          {% if quickstart_rdma_duration is defined %}
          --duration {{ quickstart_rdma_duration }}
          {% else %}
          --iters 1000
          {% endif %}
          --size 65536
      changed_when: true

    # Read the listening socket; do NOT connect to it. `wait_for: port:` was
    # the first attempt and it is a trap here: it opens a TCP connection,
    # which IS the client as far as ib_send_bw is concerned. The server took
    # the probe for its peer, failed the parameter exchange
    # ("ethernet_read_data: Couldn't read reports") and exited before the
    # real client arrived a second later, which then reported "Couldn't
    # connect" and looked like a broken L2 segment. Anything that opens this
    # port changes what it is measuring.
    - name: Wait for it to listen
      ansible.builtin.shell:
        cmd: set -o pipefail; ss -ltn 'sport = :18515' | grep -q LISTEN
        executable: /bin/bash
      register: quickstart_server_listening
      until: quickstart_server_listening.rc == 0
      retries: 30
      delay: 2
      changed_when: false

- name: Run the RDMA client on the first guest
  hosts: fleet[0]
  gather_facts: false
  become: false
  tasks:
    - name: Run ib_send_bw against the peer
      ansible.builtin.command:
        cmd: >-
          timeout {{ (quickstart_rdma_duration | default(0) | int + 60) if quickstart_rdma_duration is defined else 300 }}
          /usr/bin/ib_send_bw -d {{ quickstart_ib_device }}
          {% if quickstart_rdma_duration is defined %}
          --duration {{ quickstart_rdma_duration }}
          {% else %}
          --iters 1000
          {% endif %}
          --size 65536
          {{ hostvars[groups['fleet'][-1]].fleet_guest_ip }}
      register: quickstart_ib_send_bw
      changed_when: false

    - name: Show the RDMA test output
      ansible.builtin.debug:
        msg: "{{ quickstart_ib_send_bw.stdout_lines }}"

    # The BW line, not the exit status: ib_send_bw exits 0 on runs that moved
    # nothing useful, and this is the number the report quotes.
    - name: Assert the run reported a non-zero bandwidth
      ansible.builtin.set_fact:
        quickstart_bw: >-
          {{ quickstart_ib_send_bw.stdout_lines
             | select('search', '^\s*65536\s')
             | list | first | default('') }}
      failed_when: quickstart_bw | length == 0

# ---------------------------------------------------------------------------
# NVMe I/O test
# ---------------------------------------------------------------------------
#
# Sequential write then read on /dev/nvme0n1 using fio with direct I/O.
# The device is emulated scratch -- write first, then read back what was
# written. Both passes run for 10 s. The assertion is non-zero bandwidth:
# this proves the block device is functional, not that it hits any
# particular throughput floor (emulated NVMe over qcow2 varies widely).
- name: Test NVMe I/O on each guest
  hosts: fleet
  gather_facts: false
  become: false
  tasks:
    - name: Check /dev/nvme0n1 exists
      ansible.builtin.stat:
        path: /dev/nvme0n1
      register: quickstart_nvme_dev
      failed_when: not quickstart_nvme_dev.stat.exists

    - name: Run fio sequential write on nvme0n1
      become: true
      ansible.builtin.command:
        cmd: >-
          fio --name=nvme-write --filename=/dev/nvme0n1
          --rw=write --bs=128k --direct=1
          --time_based --runtime={{ quickstart_nvme_duration | default(10) }} --numjobs=1
          --output-format=json
      register: quickstart_nvme_write
      changed_when: false

    - name: Run fio sequential read on nvme0n1
      become: true
      ansible.builtin.command:
        cmd: >-
          fio --name=nvme-read --filename=/dev/nvme0n1
          --rw=read --bs=128k --direct=1
          --time_based --runtime={{ quickstart_nvme_duration | default(10) }} --numjobs=1
          --output-format=json
      register: quickstart_nvme_read
      changed_when: false

    - name: Extract NVMe write and read bandwidth
      ansible.builtin.set_fact:
        quickstart_nvme_write_bw: >-
          {{ (quickstart_nvme_write.stdout | from_json).jobs[0].write.bw_bytes }}
        quickstart_nvme_read_bw: >-
          {{ (quickstart_nvme_read.stdout | from_json).jobs[0].read.bw_bytes }}

    - name: Assert non-zero NVMe bandwidth
      ansible.builtin.assert:
        that:
          - quickstart_nvme_write_bw | int > 0
          - quickstart_nvme_read_bw | int > 0
        fail_msg: >-
          NVMe I/O test failed: write={{ quickstart_nvme_write_bw }}
          read={{ quickstart_nvme_read_bw }} bytes/s

    - name: Show NVMe I/O results
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: NVMe write
          {{ (quickstart_nvme_write_bw | int / 1048576) | round(0) }} MiB/s,
          read {{ (quickstart_nvme_read_bw | int / 1048576) | round(0) }} MiB/s

# ---------------------------------------------------------------------------
# Facts for the report
# ---------------------------------------------------------------------------
- name: Collect the facts the report quotes
  hosts: fleet
  gather_facts: false
  become: false
  vars:
    # Where `qemu-tool quick-start` collects per-guest output from. Writing
    # files rather than printing lets it assemble a report without parsing an
    # Ansible recap.
    quickstart_artifacts_dir: /var/tmp/quickstart-artifacts
  tasks:
    - name: Gather a summary in the guest
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          echo "## {{ inventory_hostname }}"
          echo
          echo '```'
          echo "kernel:  $(uname -r)"
          echo "rocm:    $(dirname "$(readlink -f {{ quickstart_rocm }}/bin)")"
          echo "gpu:     {{ quickstart_arch | default('none') }}"
          ibv_devinfo -d {{ quickstart_ib_device }} | head -8
          echo "--- block devices (nvme0n1 is the emulated NVMe)"
          lsblk -d -o NAME,SIZE,TYPE
          echo "--- addresses"
          ip -br addr
          echo '```'
        executable: /bin/bash
      register: quickstart_summary
      changed_when: false

    # Not run_once: it would behave differently under the free strategy, and
    # creating the same directory once per guest costs nothing.
    - name: Make the artifacts directory on the controller
      ansible.builtin.file:
        path: "{{ quickstart_artifacts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Write this guest's summary to the controller
      ansible.builtin.copy:
        content: |
          {{ quickstart_summary.stdout }}

          ### GPU test

          ```
          {{ quickstart_vector_add.stdout | default('not run') }}
          ```

          {% if quickstart_ib_send_bw is defined %}
          ### RDMA test (client)

          ```
          {{ quickstart_ib_send_bw.stdout }}
          ```
          {% endif %}

          {% if quickstart_nvme_write_bw is defined %}
          ### NVMe I/O test

          | Direction | Bandwidth |
          |-----------|-----------|
          | write | {{ (quickstart_nvme_write_bw | int / 1048576) | round(0) }} MiB/s |
          | read  | {{ (quickstart_nvme_read_bw  | int / 1048576) | round(0) }} MiB/s |
          {% endif %}
        dest: "{{ quickstart_artifacts_dir }}/{{ inventory_hostname }}.md"
        mode: "0644"
      delegate_to: localhost

# ---------------------------------------------------------------------------
# RDMA with GPU memory (optional, off by default)
# ---------------------------------------------------------------------------
#
# ib_write_bw from guest 1 to the last guest with the buffers in GPU memory
# on both sides (--use_rocm, registered as a dma-buf with --use_rocm_dmabuf)
# and every byte checked on arrival (--data_validation). OFF unless
# quickstart_rocm_rdma is true, and last in the file, so a default run does
# exactly what it did and the facts above are written before this can fail:
#
#   ansible-playbook -i <stack dir>/fleet-inventory.yml \
#       playbooks/vm-quickstart.yml --private-key <key> \
#       -e quickstart_rocm_rdma=true
#
# It is off because on the stacks this repository ships it FAILS, and how
# was measured on the default stack (stock QEMU, 2026-11-17, two guests):
#
#   --use_rocm alone             ibv_reg_mr of the hipMalloc'd buffer is
#                                refused in the guest, on both sides,
#                                "Couldn't allocate MR with error=14". The
#                                NIC's server is never asked, so no QEMU
#                                image changes this one.
#   --use_rocm --use_rocm_dmabuf registers; the first work request fails,
#                                "Failed status-remote access error (10):
#                                wr_id 0 syndrom 0x9", and the sender's NIC
#                                server logs "could not gather 65536 bytes".
#                                This is the NIC failing to reach the GPU's
#                                memory: one vfio-user server DMA-ing into
#                                another's BAR, which needs a QEMU patch
#                                only the fork image carries. Untried there.
#   PERFTEST_ROCM_HOST_ALLOC=1   with --use_rocm alone: passes, staged and
#                                live. The buffer is host memory the GPU can
#                                address, not VRAM, so it shows everything
#                                but the NIC reaching the GPU works.
#
# So the play runs the dma-buf form, the one that reaches the NIC. On a
# stack that pins stock QEMU a red result with the lines above is the known
# one. AGENTS.md, "perftest with ROCm memory support", has the rest. The
# run that passes is the last row:
#
#   -e '{"quickstart_rocm_rdma": true, "quickstart_rocm_rdma_dmabuf": false,
#        "quickstart_rocm_rdma_env": {"PERFTEST_ROCM_HOST_ALLOC": "1",
#                                     "PERFTEST_ROCM_VALIDATION": "staged"}}'
#
# Those command lines passed through this play before it had the dma-buf
# variable; the play has not run since. Its verdict now says the buffers
# were host memory. Exporting a host-mapped buffer as a dma-buf has not been
# tried, hence the second variable.
#
# It needs the perftest the golden bake builds, in /usr/local/bin; the
# archive's in /usr/bin has no --use_rocm, and the play says so instead of
# running it. It needs the GPU bound on both guests, which the first play of
# this file does. Further HIP processes in the same boot as that play's
# vector_add are fine: a dozen ran on each guest, two at once, with no hang.
#
# Four things to know before turning it on:
#
#   - The server runs as root in a transient system unit with only the
#     environment given here, and the client as the login user over SSH. A
#     HIP failure on one side only is read with that in mind.
#   - The client runs under timeout(1). A perftest that is killed mid-run
#     leaves the guest's RDMA device broken until the stack is recreated
#     (docker compose down and up), so a run that times out costs a restart.
#     Every failure above ended on its own within seconds.
#   - Validation is host-staged by default (PERFTEST_ROCM_VALIDATION=staged):
#     the buffer is copied back once and compared on the host. That is a
#     choice, not a need: the live path, a kernel resident on the GPU,
#     passed on rocjitsu too. Set quickstart_rocm_rdma_env to {} for it.
#   - perftest exits 1 after a transfer that completed when its CPU-frequency
#     calibration is noisy ("Can't produce a report"). That is not a failed
#     transfer, and a rerun usually passes.
- name: Move validated RDMA traffic between GPU memory on two guests
  hosts: fleet[0]
  gather_facts: false
  become: false
  tags: [rocm_rdma]
  vars:
    # The gate. Everything below is read only when it is true.
    quickstart_rocm_rdma: false
    # ib_write_bw or ib_read_bw: the two verbs --data_validation supports.
    # For a WRITE the server validates and prints the verdict; for a READ
    # the client does.
    quickstart_rocm_rdma_tool: ib_write_bw
    quickstart_rocm_rdma_bin_dir: /usr/local/bin
    # The ROCm device id handed to --use_rocm.
    quickstart_rocm_rdma_gpu: 0
    # Register the GPU buffer as a dma-buf (--use_rocm_dmabuf). Without it
    # the registration is a plain ibv_reg_mr of a GPU address, which the
    # guest's kernel refuses before the NIC is involved.
    quickstart_rocm_rdma_dmabuf: true
    # -t has to be at least 32 and the same on both sides, and -n at least
    # 32. 64 KiB a message is far below the 16 MiB at which the mesh drops a
    # connection.
    quickstart_rocm_rdma_options: "--data_validation -t 128 -n 1000 -s 65536"
    quickstart_rocm_rdma_env:
      PERFTEST_ROCM_VALIDATION: staged
    # Not perftest's default 18515, which the RDMA test above listens on.
    quickstart_rocm_rdma_port: 18516
    quickstart_rocm_rdma_timeout: 600
    quickstart_rocm_rdma_server: "{{ groups['fleet'][-1] }}"
    quickstart_rocm_rdma_unit: quickstart-rocm-rdma
    quickstart_rocm_rdma_log: /var/tmp/quickstart-rocm-rdma-server.log
    quickstart_rocm_rdma_exe: >-
      {{ quickstart_rocm_rdma_bin_dir }}/{{ quickstart_rocm_rdma_tool }}
    quickstart_rocm_rdma_memory: >-
      {{ ['--use_rocm=' ~ quickstart_rocm_rdma_gpu]
         + (['--use_rocm_dmabuf'] if quickstart_rocm_rdma_dmabuf | bool else []) }}
    # What the buffers really were, for the verdict: with
    # PERFTEST_ROCM_HOST_ALLOC set they are host memory, not VRAM.
    quickstart_rocm_rdma_where: >-
      {{ 'host memory mapped for the GPU (PERFTEST_ROCM_HOST_ALLOC is set), not VRAM,'
         if 'PERFTEST_ROCM_HOST_ALLOC' in quickstart_rocm_rdma_env
         else 'GPU memory' }}
    quickstart_rocm_rdma_setenv: >-
      {{ quickstart_rocm_rdma_env | dict2items
         | map(attribute='key') | zip(quickstart_rocm_rdma_env | dict2items
                                      | map(attribute='value'))
         | map('join', '=') | list }}
  tasks:
    - name: Skip the GPU-memory RDMA test unless it was asked for
      ansible.builtin.meta: end_play
      when: not (quickstart_rocm_rdma | bool)

    - name: Assert the test was given something it can run
      ansible.builtin.assert:
        that:
          - groups['fleet'] | length >= 2
          - quickstart_rocm_rdma_tool in ['ib_write_bw', 'ib_read_bw']
        fail_msg: >-
          The GPU-memory RDMA test needs two guests (this fleet has
          {{ groups['fleet'] | length }}) and ib_write_bw or ib_read_bw, the
          verbs --data_validation supports (asked for
          {{ quickstart_rocm_rdma_tool }}).

    # The help text, which needs no device. The archive's perftest has
    # neither flag, and a guest baked before the golden image built its own
    # has only that one.
    - name: Check both guests have a perftest built with ROCm
      ansible.builtin.shell:
        cmd: |
          exe={{ quickstart_rocm_rdma_exe | quote }}
          if [ ! -x "$exe" ]; then
            echo "$exe is not there: this guest has no perftest built with ROCm" >&2
            exit 1
          fi
          help=$("$exe" --help 2>&1 || true)
          for flag in '--use_rocm=<rocm device id>' '--data_validation ' {{
              quickstart_rocm_rdma_dmabuf | bool | ternary("'--use_rocm_dmabuf'", '') }}; do
            case "$help" in
              *"$flag"*) ;;
              *) echo "$exe does not offer $flag" >&2; exit 1 ;;
            esac
          done
        executable: /bin/bash
      delegate_to: "{{ item }}"
      loop: "{{ [inventory_hostname, quickstart_rocm_rdma_server] }}"
      changed_when: false

    # "loaded" is amdgpu resident with the emulation parameters and every
    # GPU bound. Anything else and hipGetDeviceCount finds nothing.
    - name: Check the GPU is bound on both guests
      ansible.builtin.command:
        cmd: /usr/local/bin/amdgpu-probe --status
      delegate_to: "{{ item }}"
      loop: "{{ [inventory_hostname, quickstart_rocm_rdma_server] }}"
      register: quickstart_rocm_rdma_probe
      changed_when: false
      failed_when: quickstart_rocm_rdma_probe.stdout | trim != 'loaded'

    # Asked of each guest, as the first play does: the name is not assumed.
    - name: Find the IB device on both guests
      ansible.builtin.command:
        cmd: ibv_devinfo -l
      delegate_to: "{{ item }}"
      loop: "{{ [inventory_hostname, quickstart_rocm_rdma_server] }}"
      register: quickstart_rocm_rdma_ibv
      changed_when: false
      failed_when: >-
        quickstart_rocm_rdma_ibv.stdout_lines[1:]
        | map('trim') | reject('equalto', '') | list | length == 0

    - name: Record the IB device names
      ansible.builtin.set_fact:
        quickstart_rocm_rdma_client_dev: >-
          {{ quickstart_rocm_rdma_ibv.results[0].stdout_lines[1:]
             | map('trim') | reject('equalto', '') | list | first }}
        quickstart_rocm_rdma_server_dev: >-
          {{ quickstart_rocm_rdma_ibv.results[1].stdout_lines[1:]
             | map('trim') | reject('equalto', '') | list | first }}

    - name: Clear any server unit left by an earlier run
      become: true
      ansible.builtin.shell:
        cmd: |
          systemctl stop {{ quickstart_rocm_rdma_unit }}.service 2>/dev/null || true
          systemctl reset-failed {{ quickstart_rocm_rdma_unit }}.service 2>/dev/null || true
          rm -f {{ quickstart_rocm_rdma_log | quote }}
        executable: /bin/bash
      delegate_to: "{{ quickstart_rocm_rdma_server }}"
      changed_when: false
      failed_when: false

    # A transient system unit, for the reason the RDMA test above gives: a
    # perftest server started over SSH exits with the session. Its output
    # goes to a file, because for a WRITE the server is the side that prints
    # the verdict.
    - name: Start the server as a transient unit
      become: true
      ansible.builtin.command:
        argv: >-
          {{ ['systemd-run', '--unit=' ~ quickstart_rocm_rdma_unit, '--collect',
              '--property=StandardOutput=file:' ~ quickstart_rocm_rdma_log,
              '--property=StandardError=inherit']
             + (quickstart_rocm_rdma_setenv | map('regex_replace', '^', '--setenv=') | list)
             + [quickstart_rocm_rdma_exe, '-d', quickstart_rocm_rdma_server_dev,
                '-p', quickstart_rocm_rdma_port | string]
             + quickstart_rocm_rdma_memory
             + (quickstart_rocm_rdma_options | split) }}
      delegate_to: "{{ quickstart_rocm_rdma_server }}"
      changed_when: true

    # Read the listening socket; do not connect to it. See the RDMA test.
    - name: Wait for the server to listen
      become: true
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ss -ltn 'sport = :{{ quickstart_rocm_rdma_port }}' | grep LISTEN
        executable: /bin/bash
      delegate_to: "{{ quickstart_rocm_rdma_server }}"
      register: quickstart_rocm_rdma_listening
      until: quickstart_rocm_rdma_listening.rc == 0
      retries: 60
      delay: 2
      changed_when: false
      failed_when: false

    # Not failed here whatever it returns: the server's side of the story
    # is read first, and the verdict is given once, below.
    - name: Run the client against the peer
      ansible.builtin.command:
        argv: >-
          {{ ['timeout', quickstart_rocm_rdma_timeout | string, 'env']
             + quickstart_rocm_rdma_setenv
             + [quickstart_rocm_rdma_exe, '-d', quickstart_rocm_rdma_client_dev,
                '-p', quickstart_rocm_rdma_port | string]
             + quickstart_rocm_rdma_memory
             + (quickstart_rocm_rdma_options | split)
             + [hostvars[quickstart_rocm_rdma_server].fleet_guest_ip] }}
      register: quickstart_rocm_rdma_client
      changed_when: false
      failed_when: false
      when: quickstart_rocm_rdma_listening.rc == 0

    # It exits on its own once the client has finished. It is not stopped:
    # stopping a perftest mid-run is what breaks the RDMA device. Waited for
    # as long as the client was allowed: the verdict goes to a file, which
    # is written when the server exits, and for a WRITE the server copies
    # the buffer back from the GPU and compares it after the client is done.
    # A server no client reached is given one look and left.
    - name: Wait for the server to finish
      become: true
      ansible.builtin.command:
        cmd: systemctl is-active {{ quickstart_rocm_rdma_unit }}.service
      delegate_to: "{{ quickstart_rocm_rdma_server }}"
      register: quickstart_rocm_rdma_active
      until: quickstart_rocm_rdma_active.stdout | trim not in ['active', 'activating']
      retries: >-
        {{ (quickstart_rocm_rdma_timeout | int // 2)
           if quickstart_rocm_rdma_listening.rc == 0 else 1 }}
      delay: 2
      changed_when: false
      failed_when: false

    - name: Read what the server printed
      become: true
      ansible.builtin.shell:
        cmd: |
          cat {{ quickstart_rocm_rdma_log | quote }} 2>/dev/null || true
          echo "--- journal"
          journalctl --no-pager -n 40 -u {{ quickstart_rocm_rdma_unit }}.service 2>/dev/null || true
        executable: /bin/bash
      delegate_to: "{{ quickstart_rocm_rdma_server }}"
      register: quickstart_rocm_rdma_server_out
      changed_when: false
      failed_when: false

    - name: Show both sides
      ansible.builtin.debug:
        msg:
          server: "{{ quickstart_rocm_rdma_server_out.stdout_lines | default([]) }}"
          client: >-
            {{ (quickstart_rocm_rdma_client.stdout_lines | default([]))
               + (quickstart_rocm_rdma_client.stderr_lines | default([])) }}
          client_rc: "{{ quickstart_rocm_rdma_client.rc | default('not run') }}"

    # The VALIDATION line, not the exit status: perftest's server does not
    # fail its exit code on a failed validation. PASSED has to be there, from
    # whichever side validates, and no other verdict from either.
    - name: Assert the transfer ran and every byte validated
      vars:
        quickstart_rocm_rdma_said: >-
          {{ (quickstart_rocm_rdma_server_out.stdout | default(''))
             ~ "\n" ~ (quickstart_rocm_rdma_client.stdout | default(''))
             ~ "\n" ~ (quickstart_rocm_rdma_client.stderr | default('')) }}
      ansible.builtin.assert:
        that:
          - quickstart_rocm_rdma_listening.rc == 0
          - quickstart_rocm_rdma_client.rc | default(1) == 0
          - "'VALIDATION: PASSED' in quickstart_rocm_rdma_said"
          - "quickstart_rocm_rdma_said is not search('VALIDATION: (FAILED|WARNING|ERROR)')"
        fail_msg: >-
          {{ quickstart_rocm_rdma_tool }} with
          {{ quickstart_rocm_rdma_memory | join(' ') }} and
          --data_validation did not pass between
          {{ inventory_hostname }} and {{ quickstart_rocm_rdma_server }}
          (server listening: {{ quickstart_rocm_rdma_listening.rc == 0 }},
          client exit: {{ quickstart_rocm_rdma_client.rc | default('not run') }}).
          Both sides' output is in the task above. "Couldn't allocate MR
          with error=14" is the guest refusing to register a GPU address
          (--use_rocm without --use_rocm_dmabuf); "remote access error" on
          the first work request is the NIC failing to reach the GPU's
          memory, the known result on a stack that pins stock QEMU; "Can't
          produce a report" is perftest's calibration, not the transfer. If
          the client was timed out or killed, recreate the stack before
          anything else uses the RDMA device. AGENTS.md, "perftest with ROCm
          memory support", has what was measured.
        success_msg: >-
          {{ quickstart_rocm_rdma_tool }} moved validated data between
          {{ quickstart_rocm_rdma_where }} on {{ inventory_hostname }} and
          {{ quickstart_rocm_rdma_server }}.
