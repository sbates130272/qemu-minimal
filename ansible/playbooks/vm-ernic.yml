---
# Stage 1 — install (default): bake ernic prerequisites into a VM image.
# Run via: qemu-tool gen-vm --ansible-playbook ansible/playbooks/vm-ernic.yml
#
# Stage 2 — configure (post-boot): bind the ernic driver and configure the
# RDMA NIC after the ernic vfio-user server is running.
# Run via: ansible-playbook -i inventory/qemu-minimal-vms.yml vm-ernic.yml --tags configure

# This guest installs no ROCm at all -- there is no rocm_setup anywhere below,
# and the CI lane asserts ionic/ionic_rdma rather than amdgpu -- so it sits on
# vm-basic.yml, not on vm-rocm.yml.
- import_playbook: vm-basic.yml
  tags: [install]
  vars:
    vm_install_amd_ca: false
    user_setup_dotfiles_enable: true
    # ionic_image_prep, the mainline kernel install and the ionic DKMS build
    # all still have to run after this. See vm-slim.yml.
    image_slim_enable: false

- name: Install ernic driver into VM image
  hosts: all
  gather_facts: true
  become: true
  tags: [install]
  vars_files:
    - vars/github-api.yml
    - vars/ernic-pins.yml
  module_defaults:
    ansible.builtin.uri:
      headers: "{{ github_api_headers }}"
  vars:
    username: "{{ vm_username | default('ubuntu') }}"
    root_user: "{{ vm_root_user | default('ubuntu') }}"
    # No rocm_setup_* vars here. Nothing in this play runs rocm_setup: the old
    # ernic_image_prep gated it on ernic_gpu_passthrough, which is false, and
    # its local replacement does not run it at all. The block that used to sit
    # here -- repo stream, minimal package list, metrics exporter, and the
    # matching apt pins and ROCm keyring cleanup in pre_tasks -- configured a
    # role that never ran. See vm-rocm.yml, which owns all of it now.
    ernic_gpu_passthrough: false
    # The collection does not carry a build toolchain and does not assume one;
    # ionic_image_prep installs it, so leave the role's own gate off.
    ernic_guest_build_deps: false
    # One kernel pin, read by both sides. Left empty, ernic_source would take
    # IONIC_KERNEL_REF out of the checkout's cmake/ErnicKernelModule.cmake --
    # the same ref today, but upstream's to move, and driver_ionic.yml fails
    # the build when the sources and the guest kernel disagree on major.minor.
    # Since this repo installs the kernel itself, it can pin both to the same
    # ref instead of hoping they stay compatible. See vars/ernic-pins.yml.
    ernic_ionic_kernel_ref: "{{ ionic_kernel_pin }}"
    ionic_image_kernel_ref: "{{ ernic_ionic_kernel_ref }}"
    # ernic_source defaults this to "main". See vars/ernic-pins.yml.
    ernic_source_repo_version: "{{ ernic_source_pin }}"
  roles:
    # Repo-local: collection 0.2.0 removed ernic_image_prep and now assumes an
    # already-prepared guest -- the published `ionic` qcow2 from
    # batesste-ci-images. This repo builds its own guest with gen-vm, so it
    # owns that preparation. See playbooks/roles/ionic_image_prep/defaults.
    - role: ionic_image_prep

  tasks:
    # Resolve the checkout here rather than letting ernic_guest_setup do it
    # inside the rescue below. A reshaped or missing source tree is a real
    # failure, and down there it gets swallowed and reported as "DKMS module
    # is installed" when nothing was built. ernic_source sets
    # ernic_source_resolved, so the copy inside ernic_guest_setup is a no-op.
    - name: Resolve the rocm-ernic source checkout
      ansible.builtin.include_role:
        name: sbates130272.rocm_ernic.ernic_source

    # ernic_guest_setup builds the ionic-ernic DKMS package (ionic +
    # ionic_rdma) and the stock rdma-core providers/ionic into the backing
    # image so compose VMs don't have to rebuild on every boot.  The RDMA
    # device check at the end of driver.yml expects hardware (ernic NIC via
    # vfio-user) which is not present during image install — the rescue block
    # catches that expected failure.
    - name: Install the ionic modules and rdma-core provider (hardware-free build)
      block:
        - ansible.builtin.include_role:
            name: sbates130272.rocm_ernic.ernic_guest_setup
          vars:
            ernic_configure_nic: false
      rescue:
        # One expected failure only: driver.yml's "Verify the rocm-ernic RDMA
        # device exists". A DKMS build error or a staging failure lands here
        # too, and claiming the module is installed would be a lie that only
        # surfaces later as an unrelated red step. Re-raise anything else.
        - name: Re-raise an ernic_guest_setup failure that is not the NIC check
          ansible.builtin.fail:
            msg: >-
              ernic_guest_setup failed at
              "{{ ansible_failed_task.name | default('unknown task') }}":
              {{ ansible_failed_result.msg | default('no message') }}
          when: >-
            'RDMA device exists'
            not in (ansible_failed_task.name | default(''))

        - name: Note the expected hardware-free RDMA check failure
          ansible.builtin.debug:
            msg: >-
              ernic_guest_setup RDMA device check failed as expected
              (no ernic NIC during image install). DKMS module is installed;
              it will bind on compose VM boot.

- name: Configure ernic NIC (post-boot, run with --tags configure)
  hosts: all
  gather_facts: true
  # ernic_guest_setup escalates nowhere itself -- driver_common.yml reloads
  # udev, modprobes and triggers udev with no become: at all -- so it expects
  # the play to do it, which is what upstream's own guest-setup.yml does.
  # Running this false got as far as "Reload udev rules" and died on "Failed to
  # connect to udev via varlink: Permission denied"; the modprobe right after
  # it would have gone the same way.
  become: true
  tags: [configure, never]
  vars_files:
    - vars/ernic-pins.yml
  vars:
    username: "{{ vm_username | default('ubuntu') }}"
    ernic_guest_agent: false
    ernic_guest_build_deps: false
    # The collection defaults this true, which pulls in rocm_xio_fetch.yml and
    # clones into /opt/rocm-xio. This lane has no GPU, so the GDA patches are
    # neither wanted nor usable. The install play sets this false too.
    ernic_gpu_passthrough: false
    # Separate play, separate vars: this one runs on its own via --tags
    # configure, so it needs both pins too. See vars/ernic-pins.yml.
    ernic_ionic_kernel_ref: "{{ ionic_kernel_pin }}"
    ernic_source_repo_version: "{{ ernic_source_pin }}"
    # nic.yml asserts ernic_guest_vm_ip is non-empty and the role defaults it
    # to "{{ vm_ip | default('') }}", so something has to supply it. Upstream
    # has no static answer either: vm-register.yml derives it per guest as
    # "{{ ernic_nic_subnet }}.{{ 10 * item.id }}" from the instance manifest,
    # with ids running from 1. There is no manifest here -- this drives one
    # guest straight over SSH -- so do the same arithmetic against a default
    # index of 1, and let a caller override either half. ernic_nic_subnet is
    # not a role default; it lives in the upstream repo's group_vars/all.yml,
    # which this playbook does not load, so its value is repeated here.
    ernic_nic_subnet: "192.168.200"
    ernic_guest_vm_index: "{{ vm_index | default(1) }}"
    ernic_guest_vm_ip: >-
      {{ vm_ip | default(ernic_nic_subnet ~ '.'
                         ~ (10 * (vm_index | default(1) | int))) }}
  roles:
    - role: sbates130272.rocm_ernic.ernic_guest_setup

# Last line of every leaf. Importers pass image_slim_enable: false so this
# does not run in the middle of their chain; see vm-slim.yml. Tagged install,
# so the --tags configure invocation of the play above does not slim a guest
# that has just been configured.
- import_playbook: vm-slim.yml
  tags: [install]
