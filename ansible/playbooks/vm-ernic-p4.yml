---
# Bake the P4-capable ionic stack into an already-provisioned ernic guest.
#
# Run against a BOOTED guest, over SSH:
#
#   ansible-playbook -i <inventory> vm-ernic-p4.yml
#
# and not through "gen-vm --ansible-playbook". This runs at image-build time
# with no vfio-user device attached -- the same reason vm-ernic-srq.yml runs
# the same way, and the same reason module reload is off.
#
# WHY THIS EXISTS
#
# ernic_p4.ko enables the P4 datapath on the emulated ernic. Without it the
# server container's P4 engine has no guest-side consumer; `rocm-ernic
# --p4-program` would load a program no one can execute.
#
# ORDER MATTERS (from rocm-ernic docs/p4.rst, added at c828f99)
#
# 1. ernic_guest_setup with ernic_guest_ionic_extra_patches: ["patches/p4"]
#    -- the P4 series is a second patch series applied on top of the base
#    ionic patch. It registers the auxiliary device ernic_p4.ko binds to.
#    Running ernic_p4_dkms without this series leaves no aux device to bind.
#
# 2. ernic_p4_dkms -- builds drivers/ernic_p4/ernic_p4.ko.
#
# This does NOT go through ernic_srq_dkms. The symver to confirm is
# ionic_adminq_post_wait, which ernic_p4.ko imports.
#
# NO MODULE RELOAD
#
# Same constraint as vm-ernic-srq.yml: this runs at image-build time with no
# vfio-user device attached, so there is nothing to reload for. `rmmod ionic`
# on the emulated device can hang on a DSR timeout and take the guest with it
# (AGENTS.md issue 6). The modules land in updates/dkms and are what modprobe
# picks on the next boot, which is the first boot that has a device at all.
#
# WHERE THE SERIES COMES FROM
#
# The P4 patch series lives in rocm-ernic under patches/p4, reached through
# the collection pin in ansible/requirements.yml plus the matching source pin
# in vars/ernic-pins.yml. Nothing is vendored here.

- name: Build the P4-capable ionic stack into the guest
  hosts: all
  gather_facts: true
  become: true
  vars_files:
    - vars/ernic-pins.yml
  vars:
    ernic_source_repo_version: "{{ ernic_source_pin }}"
    ionic_p4_stamp: /etc/ionic-p4.json
    ionic_p4_stage_dir: /var/tmp/p4
    ionic_p4_source_root: /var/tmp/ionic-p4-src

  tasks:
    - name: Assert the guest kernel matches the pinned ref
      ansible.builtin.assert:
        that:
          - ansible_kernel is version(ionic_kernel_pin | regex_replace('^v', ''), '>=')
          - (ansible_kernel | regex_replace('^([0-9]+\.[0-9]+).*$', '\1'))
            == (ionic_kernel_pin | regex_replace('^v', '')
                | regex_replace('^([0-9]+\.[0-9]+).*$', '\1'))
        fail_msg: >-
          This guest runs {{ ansible_kernel }}, but the P4 series is pinned
          to {{ ionic_kernel_pin }}. Repin the guest image to a matching
          kernel; do not build across a minor release.

    - name: Resolve the rocm-ernic source checkout on the controller
      ansible.builtin.include_role:
        name: sbates130272.rocm_ernic.ernic_source

    # Step 1: rebuild ionic with the P4 patch series on top of the base
    # series. This is not ernic_srq_dkms -- it is ernic_guest_setup with an
    # extra patch directory. The role rebuilds and reinstalls ionic-ernic
    # as its DKMS package; ernic_p4_dkms below then builds against the
    # resulting modules, so this must complete first.
    - name: Build ionic with the P4 patch series
      ansible.builtin.include_role:
        name: sbates130272.rocm_ernic.ernic_guest_setup
      vars:
        ernic_guest_ionic_extra_patches:
          - "{{ ernic_source_dir }}/patches/p4"
        ernic_guest_ionic_dkms_reload: false
        ernic_guest_ionic_source_root: "{{ ionic_p4_source_root }}"
        ernic_guest_ionic_stage_dir: "{{ ionic_p4_stage_dir }}"
        ernic_guest_ionic_fetch_on_controller: true
        ernic_guest_ionic_force_fetch: false

    # Step 2: build ernic_p4.ko against the patched ionic
    - name: Build and install the ernic_p4 DKMS module
      ansible.builtin.include_role:
        name: sbates130272.rocm_ernic.ernic_p4_dkms
      vars:
        ernic_p4_dkms_install: true
        ernic_p4_dkms_reload: false
        ernic_p4_dkms_fetch_on_controller: true
        ernic_p4_dkms_force_fetch: false
        ernic_p4_dkms_stage_dir: "{{ ionic_p4_stage_dir }}"
        ernic_p4_dkms_source_root: "{{ ionic_p4_source_root }}"

    # Confirm the installed ionic carries the P4 symbol ernic_p4.ko imports
    - name: Confirm ionic exports ionic_adminq_post_wait
      ansible.builtin.shell: |
        set -euo pipefail
        ko=$(modinfo -n ionic)
        case "${ko}" in
            */updates/dkms/*) ;;
            *)
                echo "modprobe would load ${ko}, not the DKMS module" >&2
                exit 1
                ;;
        esac
        tmp=$(mktemp -d)
        trap 'rm -rf "${tmp}"' EXIT
        case "${ko}" in
            *.zst) zstd -qdc "${ko}" > "${tmp}/m.ko" ;;
            *.xz)  xz -dc "${ko}"    > "${tmp}/m.ko" ;;
            *.gz)  gzip -dc "${ko}"  > "${tmp}/m.ko" ;;
            *)     cp "${ko}" "${tmp}/m.ko" ;;
        esac
        nm "${tmp}/m.ko" | grep -c ionic_adminq_post_wait
      args:
        executable: /bin/bash
      changed_when: false
      register: ionic_p4_symbols
      failed_when: ionic_p4_symbols.stdout | int < 1

    - name: Record the P4 build in the guest
      ansible.builtin.copy:
        dest: "{{ ionic_p4_stamp }}"
        mode: "0644"
        content: |
          {
            "kernel_ref": "{{ ionic_kernel_pin }}",
            "built_for_kernel": "{{ ansible_kernel }}",
            "rocm_ernic_ref": "{{ ernic_source_pin }}",
            "kernel_patches": "rocm-ernic patches/p4 (on top of base ionic patches)",
            "dkms_packages": "ionic-ernic/{{ ionic_kernel_pin | regex_replace('^v', '') }} + ernic-p4",
            "modules_reloaded": false,
            "note": "ernic_p4.ko binds an aux device registered by the P4 ionic patch series. The server image must be built with -DERNIC_BUILD_P4=ON."
          }

    - name: Remove the build trees
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ionic_p4_stage_dir }}"
        - "{{ ionic_p4_source_root }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          ionic P4 stack installed: ionic rebuilt with patches/p4
          ({{ ionic_p4_symbols.stdout | trim }} ionic_adminq_post_wait symbol(s)
          exported), ernic_p4.ko installed.
          Recorded in {{ ionic_p4_stamp }}.
