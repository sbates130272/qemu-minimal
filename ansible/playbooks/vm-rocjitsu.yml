---
- name: Bake rocjitsu prerequisites into a base VM image
  hosts: all
  gather_facts: true
  become: true
  tags: [install]
  module_defaults:
    ansible.builtin.uri:
      headers: >-
        {{
          ({'Authorization': 'token ' + lookup('env', 'GITHUB_TOKEN')}
           if lookup('env', 'GITHUB_TOKEN')
           else {})
        }}
  vars:
    username: "{{ vm_username | default('ubuntu') }}"
    root_user: "{{ vm_root_user | default('ubuntu') }}"
    user_setup_motd: true
    user_setup_install_amd_ca: false
    user_setup_dotfiles_enable: true
    rocm_setup_user: "{{ vm_username | default('ubuntu') }}"
    rocm_setup_repo_stream: therock
    rocm_setup_minimal: true
    rocm_setup_minimal_packages:
      - libstdc++-14-dev
      - amdrocm-runtime-dev
      # gemm-hipfile-bench needs the hipFile SDK, and amdrocm-runtime-dev does
      # not pull it in -- it depends only on sysdeps, runtime and llvm-dev.
      # Without this the report script's probe correctly reports the headers
      # unavailable, emits no read_gbs, and the whole run aborts.
      - amdrocm-hipfile-dev
    # These are QEMU guests, never WSL. Pinned rather than left to the role's
    # default(false) because a non-false wsl_mode silently drops the minimal
    # path back to the full amdrocm meta-package.
    rocm_setup_wsl: false
    rocm_setup_wsl_install: false
    rocm_setup_skip_reboot: false
    rocm_setup_run_checks: true
    rocm_setup_run_gpu_checks: false
    # Both spellings resolve to 7.0.0-31-generic from the stock archive, but
    # neither package name exists on the other release.
    rocm_setup_extra_kernel_packages:
      - "linux-generic-hwe-{{ '24.04' if ansible_distribution_release == 'noble' else '26.04' }}"
    rocm_setup_install_metrics_exporter: true
    # Regenerate the initramfs after writing the amdgpu blacklist and the
    # gfx1250 stubs. On by default: without it the blacklist is inert at boot
    # and the resulting image needs a manual update-initramfs before it works
    # at all. See the task below. Set false to keep the stale initramfs.
    rocjitsu_update_initramfs: "{{ vm_rocjitsu_update_initramfs | default(true) }}"
    # A release tag, deliberately not the rolling "latest" pre-release: that
    # tag is reassigned on every upstream build, so baking it into an image
    # would mean two rebuilds of the same commit install different bits.
    vm_rocjitsu_hsa_snoop_version: "{{ vm_hsa_snoop_version | default('1.1.1') }}"
    # RVS is not in TheRock's apt index under any name, so it comes from AMD's
    # standalone tarball instead. Pinned for the same reason as hsa-snoop above.
    vm_rocjitsu_rvs_version: "{{ vm_rvs_version | default('1.5.125-620') }}"
    # The tarballs are only built as "amdrocm7", but every soname RVS needs --
    # libamdhip64.so.7, libhsa-runtime64.so.1, librocblas.so.5 -- is what
    # TheRock 10.0 ships, and its libraries self-resolve rocm_sysdeps and llvm
    # through their own $ORIGIN rpaths. Verified by running the 1.5.125 tarball
    # against a bare 10.0.0-4 tree. Recheck this if either side bumps a major.
    vm_rocjitsu_rvs_prefix: "{{ vm_rvs_prefix | default('/opt/rvs') }}"
    # "gap" emits only what no driver release ships -- imu, mes, mes1 and
    # ip_discovery -- alongside the real blobs from amdgpu-dkms-firmware 31.60,
    # which live a directory up the search order in /lib/firmware/updates/amdgpu
    # and so are not at risk of being shadowed by anything written here. "full"
    # stubs the whole set, which is what we did before those blobs existed; it
    # is still the right answer for a guest on an older driver release, and the
    # wrong one otherwise, since a stub mec/rlc is strictly worse than the
    # firmware it stands in for.
    rocjitsu_firmware_set: "{{ vm_rocjitsu_firmware_set | default('gap') }}"
  pre_tasks:
    - name: Pin ROCm-conflicting Ubuntu universe packages to never-install
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/rocm-no-distro-packages
        content: |
          Package: rocminfo
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: hipcc
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: rocm-smi-lib
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsakmt1
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsa-runtime64-1
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsa-runtime-dev
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libamdhip64-*
          Pin: release o=Ubuntu
          Pin-Priority: -1
        mode: '0644'
      become: true

    - name: Remove any partial dotfiles clone so user_setup can start fresh
      ansible.builtin.file:
        path: "/home/{{ username }}/.dotfiles"
        state: absent
      become: true

    - name: Remove stale ROCm GPG keyrings and sources
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/apt/keyrings/rocm.gpg
        - /etc/apt/keyrings/amdrocm.gpg
        - /etc/apt/sources.list.d/rocm.sources

    - name: Remove any stale device-metrics-exporter apt sources
      ansible.builtin.shell:
        cmd: |
          find /etc/apt/sources.list.d -type f \
            -exec grep -l "device-metrics-exporter\|amdgpu-exporter" {} \; \
            | xargs -r rm -f
      become: true
      changed_when: false

  roles:
    - role: sbates130272.batesste.user_setup
    - role: sbates130272.batesste.fave_packages
    - role: sbates130272.batesste.git_setup
    - role: sbates130272.batesste.rocm_setup

  tasks:
    # WORKAROUND for sbates130272/batesste-ansible#248. TheRock installs to a
    # versioned prefix (/opt/rocm/core-10.0), but rocm_setup writes
    # /etc/ld.so.conf.d/rocm.conf pointing at /opt/rocm/lib and /opt/rocm/lib64
    # and never adds anything to PATH. Both are absent, so ldconfig resolves no
    # ROCm libraries and rocminfo is "command not found" despite being
    # installed. Delete these four tasks once the role derives the prefix.
    - name: Resolve the ROCm install prefix
      ansible.builtin.find:
        paths: /opt/rocm
        patterns: 'core-*'
        file_type: directory
      register: rocjitsu_rocm_prefix_candidates

    - name: Set the ROCm prefix fact
      ansible.builtin.set_fact:
        # A lexical sort, which is only correct while there is one core-* to
        # find. Revisit if a guest ever carries two: core-9.0 sorts after
        # core-10.0.
        rocjitsu_rocm_prefix: >-
          {{ (rocjitsu_rocm_prefix_candidates.files
              | map(attribute='path') | sort | last)
             if rocjitsu_rocm_prefix_candidates.files else '/opt/rocm' }}

    - name: Point the linker and PATH at the resolved ROCm prefix
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        mode: '0644'
      become: true
      loop:
        - dest: /etc/ld.so.conf.d/rocm.conf
          content: "{{ rocjitsu_rocm_prefix }}/lib\n"
        - dest: /etc/profile.d/rocm.sh
          content: "export PATH={{ rocjitsu_rocm_prefix }}/bin:$PATH\n"

    - name: Refresh the linker cache for the new ROCm path
      ansible.builtin.command:
        cmd: ldconfig
      become: true
      changed_when: false

    - name: Purge stale distro ROCm runtime packages
      ansible.builtin.package:
        name:
          - libhsakmt1
          - libhsa-runtime64-1
          - libhsa-runtime-dev
          - libamdhip64-7
          - libamdhip64-dev
        state: absent
        purge: true
      become: true

    - name: Blacklist amdgpu autoload
      ansible.builtin.copy:
        dest: /etc/modprobe.d/amdgpu-blacklist.conf
        content: "blacklist amdgpu\n"
        mode: '0644'
      become: true

    - name: Create local temp dir for firmware generation
      ansible.builtin.tempfile:
        state: directory
        prefix: rj_fw_
      register: rj_fw_tmp
      delegate_to: localhost
      become: false

    # Generate inside the container and stream the result out as a tar rather
    # than bind-mounting rj_fw_tmp.path to /out. "docker run -v" is resolved by
    # the daemon, so when this controller is itself a container talking to the
    # host's docker socket -- as it is in CI -- the host has no such path,
    # creates it empty, and the stubs land on the host where the controller
    # cannot see them. docker run still exits 0, so the failure only surfaces
    # much later as a missing gc_12_1_0_rlc_1.bin in the guest.
    # The generator emits ip_discovery.bin itself unless --no-ip-discovery, so
    # there is no separate rj-ip-discovery call: running one here only
    # overwrote what had just been produced.
    - name: Generate gfx1250 firmware stubs on controller via rocjitsu container
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          docker run --rm --entrypoint /bin/sh
          {{ rocjitsu_image | default('sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260921.gb3399b3-rocjitsu.8e01a5a') }}
          -c 'python3 /usr/local/bin/vfio_guest_firmware.py
          --set {{ rocjitsu_firmware_set }} --output /out
          && tar -cf - -C /out .'
          | tar -xf - -C {{ rj_fw_tmp.path }}
        executable: /bin/bash
      delegate_to: localhost
      become: false

    # Guards against the silent-empty-directory failure above: if the stream
    # produced nothing, fail here rather than three tasks later in the guest.
    #
    # imu, not rlc_1. The default "gap" set deliberately omits rlc_1 and the
    # other blobs amdgpu-dkms-firmware ships for real as of 31.60, so asserting
    # on one of those fails against a working generator. imu is in both sets and
    # in neither package: the driver opens it whenever fw_load_type is not PSP,
    # which is exactly the fw_load_type=0 this guest boots with.
    - name: Assert the firmware stubs were generated
      ansible.builtin.stat:
        path: "{{ rj_fw_tmp.path }}/gc_12_1_0_imu.bin"
      register: _rj_fw_stat
      delegate_to: localhost
      become: false
      failed_when: not _rj_fw_stat.stat.exists

    - name: Copy firmware stubs to guest /lib/firmware/amdgpu/
      ansible.builtin.copy:
        src: "{{ rj_fw_tmp.path }}/"
        dest: /lib/firmware/amdgpu/
        mode: '0644'
      become: true

    - name: Clean up local firmware temp dir
      ansible.builtin.file:
        path: "{{ rj_fw_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false

    # The gap set lands *beside* the packaged blobs rather than over them, so
    # the packaged ones have to actually be there. They arrive with
    # amdgpu-dkms-firmware, which amdgpu-dkms depends on, so this passes on any
    # guest whose driver release is 31.60 or newer -- and fails loudly on one
    # that is older, which is the case --set full exists for. Checking here
    # rather than letting the driver fail: a missing blob surfaces as a bare
    # "MES firmware reports incorrect version in ucode binary" or a -2 on
    # request_firmware, neither of which names the package at fault.
    #
    # Note the path: amdgpu-dkms-firmware installs under /lib/firmware/updates/,
    # not /lib/firmware/. That is deliberate on the package's part -- the kernel
    # searches updates/ first, so the DKMS blobs win over anything of the same
    # name in the base tree, including the stubs copied above. Asserting against
    # /lib/firmware/amdgpu here instead finds only our own stubs, which is how
    # this check came to pass on a guest carrying debris from an earlier
    # --set full run and fail on a freshly built one that was entirely correct.
    #
    # The list is the package's own, and it does ship mec_1 and rlc. If this
    # ever needs revisiting, the authoritative answers are the package manifest
    # and the driver's, not a hand-kept list:
    #   dpkg -L amdgpu-dkms-firmware | grep -E 'gc_12_1_0|sdma_7_1_0'
    #   modinfo -F firmware "$(modinfo -n amdgpu)" | grep -E 'gc_12_1_0|sdma_7_1_0'
    - name: Assert the driver-packaged gfx1250 firmware is present
      ansible.builtin.stat:
        path: /lib/firmware/updates/amdgpu/{{ item }}
      register: _rj_pkg_fw
      become: true
      loop:
        - gc_12_1_0_mec.bin
        - gc_12_1_0_mec_1.bin
        - gc_12_1_0_rlc.bin
        - gc_12_1_0_rlc_1.bin
        - gc_12_1_0_uni_mes.bin
        - sdma_7_1_0.bin
      when: rocjitsu_firmware_set == 'gap'

    - name: Fail when the driver-packaged firmware is missing
      ansible.builtin.fail:
        msg: >-
          {{ _rj_pkg_fw.results | rejectattr('stat.exists') | map(attribute='item')
             | list | join(', ') }} missing from /lib/firmware/updates/amdgpu.
          These ship in amdgpu-dkms-firmware 31.60 and newer, which the default
          "gap" firmware set assumes. Either install a 31.60+ driver release, or
          set rocjitsu_firmware_set=full to stub the whole set as before.
      when:
        - rocjitsu_firmware_set == 'gap'
        - _rj_pkg_fw.results | rejectattr('stat.exists') | list | length > 0

    # The initramfs on disk predates both /etc/modprobe.d/amdgpu-blacklist.conf
    # and the stubs copied above, and it contains amdgpu plus the stock
    # firmware set. So amdgpu still loads early in boot -- "blacklist" in
    # modprobe.d only suppresses alias-based autoload, and the stale initramfs
    # has no copy of the blacklist anyway. At that point the root filesystem is
    # not mounted, the stubs are unreachable, and every request fails -2:
    #
    #   Direct firmware load for amdgpu/gc_12_1_0_rlc_1.bin failed with error -2
    #   amdgpu 0000:00:05.0: Fatal error during GPU init
    #
    # The module then stays resident, so amdgpu-probe -- which is just
    # "modprobe amdgpu emu_mode=1 ..." -- is a silent no-op returning 0 and the
    # emulation parameters never apply. Check with:
    #
    #   cat /sys/module/amdgpu/parameters/emu_mode   # 0 means the probe did nothing
    #
    # Regenerating makes the blacklist effective at boot and gives amdgpu-probe
    # a clean insertion, so it is the default. Set vm_rocjitsu_update_initramfs
    # to false to skip it; "sudo update-initramfs -u" in the guest then gets the
    # same result by hand.
    # This runs after the DKMS patches below, not here, so the initramfs picks
    # up the rebuilt module rather than the one shipped by the package.
    #
    # Patch the amdgpu DKMS source to assume PCIe atomics support when
    # emu_mode=1 is active. The emulated device cannot advertise atomics
    # through the vfio-user PCI capability, but KFD requires them to
    # accept the device.
    - name: Patch KFD atomics check for emu_mode in DKMS source
      ansible.builtin.shell:
        cmd: |
          python3 - << 'PYEOF'
          import glob, sys
          srcs = sorted(glob.glob('/usr/src/amdgpu-*'))
          if not srcs:
              print('no amdgpu DKMS source found', file=sys.stderr)
              sys.exit(1)
          path = srcs[-1] + '/amd/amdkfd/kfd_device.c'
          old = 'kfd->pci_atomic_requested = amdgpu_amdkfd_have_atomics_support(kfd->adev);'
          new = 'kfd->pci_atomic_requested = amdgpu_amdkfd_have_atomics_support(kfd->adev) || (amdgpu_emu_mode == 1);'
          with open(path) as f:
              content = f.read()
          if new in content:
              print('already patched')
              sys.exit(0)
          if old not in content:
              print(f'target string not found in {path}', file=sys.stderr)
              sys.exit(1)
          with open(path, 'w') as f:
              f.write(content.replace(old, new, 1))
          print(f'patched {path}')
          PYEOF
        executable: /bin/bash
      become: true
      register: atomics_patch
      changed_when: "'patched /' in atomics_patch.stdout"

    # The rocjitsu device is exposed with rombar=0, so there is no option ROM
    # and amdgpu_device_init takes the "VBIOS image optional" path, leaving
    # adev->mode_info.atom_context NULL. amdgpu_ras_init then queries the RAS
    # capability from the VBIOS, and the atomfirmware helpers it calls
    # dereference atom_context unconditionally, so the probe oopses in
    # amdgpu_atom_parse_data_header and takes the guest down. Guard it the same
    # way amdgpu_ras_get_quirks -- the function immediately above it -- already
    # guards the same field.
    - name: Patch RAS VBIOS capability query for a NULL atom_context
      ansible.builtin.shell:
        cmd: |
          python3 - << 'PYEOF'
          import glob, sys
          srcs = sorted(glob.glob('/usr/src/amdgpu-*'))
          if not srcs:
              print('no amdgpu DKMS source found', file=sys.stderr)
              sys.exit(1)
          path = srcs[-1] + '/amd/amdgpu/amdgpu_ras.c'
          old = ('static void amdgpu_ras_query_ras_capablity_from_vbios('
                 'struct amdgpu_device *adev)\n{\n\t/* mem_ecc cap */')
          new = ('static void amdgpu_ras_query_ras_capablity_from_vbios('
                 'struct amdgpu_device *adev)\n{\n'
                 '\tif (!adev->mode_info.atom_context)\n\t\treturn;\n\n'
                 '\t/* mem_ecc cap */')
          with open(path) as f:
              content = f.read()
          if new in content:
              print('already patched')
              sys.exit(0)
          if old not in content:
              print(f'target string not found in {path}', file=sys.stderr)
              sys.exit(1)
          with open(path, 'w') as f:
              f.write(content.replace(old, new, 1))
          print(f'patched {path}')
          PYEOF
        executable: /bin/bash
      become: true
      register: ras_vbios_patch
      changed_when: "'patched /' in ras_vbios_patch.stdout"

    - name: Rebuild DKMS amdgpu module after source patches
      ansible.builtin.shell:
        cmd: |
          VER=$(dkms status amdgpu | awk -F'[,/]' 'NR==1{gsub(/ /,"",$2); print $2}')
          dkms build amdgpu/"$VER" -k $(uname -r) --force
          dkms install amdgpu/"$VER" -k $(uname -r) --force
        executable: /bin/bash
      become: true
      when: atomics_patch.changed or ras_vbios_patch.changed

    - name: Regenerate initramfs so the amdgpu blacklist and stubs take effect
      ansible.builtin.command:
        cmd: update-initramfs -u
      become: true
      when: rocjitsu_update_initramfs | bool
      changed_when: true

    - name: Install rocBLAS dev package
      ansible.builtin.package:
        name:
          - amdrocm-blas-dev
        state: present
        update_cache: false
      become: true

    - name: Install amdgpu probe script
      ansible.builtin.copy:
        dest: /usr/local/bin/amdgpu-probe
        mode: '0755'
        # !unsafe because copy templates "content" through Jinja, and Jinja
        # reads "{#" as the start of a comment. Bash array length is spelled
        # "${#arr[@]}", so the script below is a syntax error to Jinja and the
        # task dies with "Missing end of comment tag" -- at playbook run time,
        # not at --syntax-check, which does not finalize task args. Tagging the
        # whole script unsafe disables templating for it, which is what we want
        # anyway: there is nothing here for Ansible to substitute.
        content: !unsafe |
          #!/bin/bash
          # Probe amdgpu with gfx1250 emulation parameters.
          # Run after rocjitsu vfio-user server is ready.
          set -euo pipefail

          params=(
            emu_mode=1
            fw_load_type=0
            discovery=2
            # Upstream's qemu-vfio.md says 0x3f, which is right for its own
            # driver: there the compute IP blocks enumerate as common, gmc, ih,
            # gfx, sdma, mes -- indices 0..5. This DKMS build enumerates an
            # extra ras_v1_0 at index 5, so mes lands at 6 and 0x3f masks it
            # off. gfx_v12_1 needs MES to bring the command processor up, and
            # without it the probe oopses in gfx_v12_1_xcc_cp_resume. Count the
            # "detected ip block number" lines in dmesg before changing this.
            ip_block_mask=0x7f
            vm_update_mode=3
            gpu_recovery=0
            # 1 GiB, per upstream's qemu-vfio.md. Not a performance knob: it is
            # the budget ROCr provisions queue scratch from, at the occupancy
            # the device advertises. A smaller limit runs scratch-free kernels
            # fine but makes a private-segment dispatch wait forever for an
            # allocation that never arrives, which is exactly how the bug we
            # chased presents. Unrelated to vram_aperture_bytes in the rocjitsu
            # config -- that is the BAR window, and upstream leaves it at
            # 256 MiB alongside this.
            vramlimit=1024
          )

          # modprobe is a no-op on a resident module: it returns 0 without
          # re-inserting, so every parameter above is discarded in silence.
          # That is exactly what happens when a stale initramfs loaded amdgpu
          # during boot. Compare what is live against what we asked for and
          # say so, rather than exiting 0 having done nothing.
          if [ -d /sys/module/amdgpu ]; then
            mismatch=()
            for kv in "${params[@]}"; do
              name=${kv%%=*}
              want=${kv#*=}
              # The kernel prints these decimal, so normalise 0x3f to 63.
              if [ "$want" != "${want#0x}" ]; then
                want=$((want))
              fi
              live=$(cat "/sys/module/amdgpu/parameters/$name" 2>/dev/null) || continue
              if [ "$live" != "$want" ]; then
                mismatch+=("$name: want $want, live $live")
              fi
            done

            if [ ${#mismatch[@]} -eq 0 ]; then
              echo "amdgpu already loaded with the emulation parameters."
              exit 0
            fi

            echo "amdgpu is already loaded with the wrong parameters:" >&2
            printf '  %s\n' "${mismatch[@]}" >&2
            echo "modprobe cannot change these on a resident module. Either" >&2
            echo "  sudo rmmod amdgpu && sudo $0" >&2
            echo "or make the boot-time blacklist effective and reboot:" >&2
            echo "  sudo update-initramfs -u && sudo reboot" >&2
            exit 1
          fi

          exec sudo modprobe amdgpu "${params[@]}"
      become: true

    # The device-metrics-exporter repo has no resolute suite yet; pin to noble.
    - name: Add device-metrics-exporter apt source (noble suite)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/device-metrics-exporter.sources
        content: |
          Types: deb
          URIs: https://repo.radeon.com/device-metrics-exporter/apt/1.5.1
          Suites: noble
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/rocm.gpg
        mode: '0644'
      become: true

    - name: Install AMD Device Metrics Exporter
      ansible.builtin.package:
        name: amdgpu-exporter
        state: present
        update_cache: true
      become: true

    - name: Install amd-smi
      ansible.builtin.package:
        name: amdrocm-amdsmi
        state: present
        update_cache: true
      become: true

    - name: Create the RVS install prefix
      ansible.builtin.file:
        path: "{{ vm_rocjitsu_rvs_prefix }}"
        state: directory
        mode: '0755'
      become: true

    # Unpacked into its own prefix rather than over the ROCm tree: TheRock
    # installs under a versioned path (/opt/rocm/core-10.0) that apt owns, and
    # the tarball carries bin/, lib/, include/ and share/ that would collide
    # there. Downloaded guest-side for the same proxy reason as hsa-snoop.
    - name: Install ROCm Validation Suite from the AMD tarball
      ansible.builtin.unarchive:
        src: >-
          https://repo.amd.com/rocm/rvs/tarball/amdrocm7-rvs-{{ vm_rocjitsu_rvs_version }}-Linux.tar.gz
        dest: "{{ vm_rocjitsu_rvs_prefix }}"
        remote_src: true
        creates: "{{ vm_rocjitsu_rvs_prefix }}/bin/rvs"
      become: true

    # fio-hipfile-bench builds fio from a pinned master commit in the guest,
    # because the libhipfile ioengine is in no fio release tag. The distro fio
    # that fave_packages installs has no such engine, so it cannot serve here.
    # These are the build's own needs; amdrocm-hipfile-dev above supplies the
    # hipFile SDK the engine probe looks for.
    - name: Install fio build dependencies for the libhipfile engine
      ansible.builtin.package:
        name:
          - libaio-dev
          - libnuma-dev
          - pkg-config
          - zlib1g-dev
        state: present
        update_cache: true
      become: true

    # hsa-snoop watches AQL and SDMA queues by planting an ftrace kprobe on the
    # KFD create_queue ioctl. Its own Depends, declared by the package.
    - name: Install hsa-snoop runtime dependencies
      ansible.builtin.package:
        name:
          - bpftrace
        state: present
        update_cache: true
      become: true

    # Downloaded in the guest rather than on the controller, which is not the
    # obvious choice: the controller here sits behind a TLS-inspecting proxy
    # whose CA is not in its trust store, so a GitHub release-asset fetch dies
    # with "certificate signed by unknown authority" -- while the same fetch
    # from inside the guest succeeds, as the ROCm install from repo.radeon.com
    # already demonstrates. Keep it guest-side; moving it to the controller
    # reintroduces a failure that only shows up on a corporate network.
    - name: Install hsa-snoop
      ansible.builtin.apt:
        deb: >-
          https://github.com/sbates130272/hsa-snoop/releases/download/v{{ vm_rocjitsu_hsa_snoop_version }}/hsa-snoop_{{ vm_rocjitsu_hsa_snoop_version }}_amd64.deb
      become: true

    # The package ships a system-wide collector that scrapes queues for its
    # :9488 exporter. On a real card that is free; against a single-threaded
    # emulator it competes with the dispatch under test, so it is disabled and
    # hsa-snoop is instead invoked per-workload by the rocjitsu_gpu_test role.
    # Disabled rather than masked -- this is a measurement decision, not a
    # judgement that the unit is wrong.
    #
    # BOTH units, and hsa-snoop-prometheus is the one that matters: it is the
    # unit the package enables by default, and its ExecStart is "hsa-snoop --all
    # --prometheus --ais-snoop". Disabling only hsa-snoop.service left it running
    # on every boot, holding trace_pipe -- which admits a single reader -- so the
    # role's own hsa-snoop died with "Device or resource busy" before tracing
    # anything. It also has Restart=on-failure, so killing the process without
    # disabling the unit just brings it back five seconds later; that restart is
    # what earlier looked like an "orphaned" collector surviving its unit.
    - name: Disable the hsa-snoop collector services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      become: true
      loop:
        - hsa-snoop.service
        - hsa-snoop-prometheus.service

# Tagged "never" so it is skipped by a default run, which is what gen-vm does:
# that play bakes an image inside a build VM with no vfio-user device attached,
# so there is no GPU to test at that point. These tests need the compose stack
# up, and run against the live guest afterwards:
#
#   qemu-tool compose --env-file qemu/.env.rocjitsu \
#     --stack vfio-user-rocjitsu-vm up -d
#   ansible-playbook -i 127.0.0.1:2230, -u ubuntu \
#     ansible/playbooks/vm-rocjitsu.yml --tags test
#
# Note the trailing comma in -i: it makes the argument an inventory list of one
# host rather than a path to an inventory file. The port is the *host* side of
# the compose publish (VM_SSH_PORT), not the 2222 inside the container.
- name: Run GPU workloads on a live rocjitsu VM
  hosts: all
  gather_facts: true
  tags: [test, never]
  roles:
    - role: rocjitsu_gpu_test
