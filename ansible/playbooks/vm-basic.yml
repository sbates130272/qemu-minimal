---
# The base for every guest this repo builds, and a complete bake on its own.
# vm-rocm-golden.yml imports it and adds everything else. Nothing else should
# carry a copy of the roles below.
- name: Post cloud-init VM setup
  hosts: all
  gather_facts: true
  # Tasks that need root in the upstream sbates130272.batesste roles set
  # `become: true` explicitly, so leave the default off here. Otherwise the
  # git_setup role's `community.general.git_config` (scope: global) tasks
  # would write to /root/.gitconfig instead of the target user's home.
  become: false
  tags: [install]
  vars:
    username: "{{ vm_username | default('ubuntu') }}"
    root_user: "{{ vm_root_user | default('ubuntu') }}"
    user_setup_motd: true
    # vm-rocm-golden.yml turns this off: a published image does not carry the
    # AMD corporate CA.
    user_setup_install_amd_ca: "{{ vm_install_amd_ca | default(true) }}"
    # sbates130272.batesste 3.0.0's git_setup asserts on both of these whenever
    # git_setup_dotfiles_enable is false, which is its default and is what every
    # bake here runs -- nothing sets it, and the dotfiles switch CI passes in
    # ANSIBLE_EXTRA_ARGS is user_setup_dotfiles_enable, a different role's. Set
    # here rather than in the leaves because git_setup runs in this play and
    # nowhere else.
    #
    # Deliberately generic. These guests are published as qcow2s, so a personal
    # name and address do not belong in their ~/.gitconfig, and nothing in a
    # guest makes a commit anyone reads. git_setup_signingkey stays at its 3.0.0
    # default of "" -- no private key is deployed here, and the role skips the
    # user.signingkey write when it is empty.
    git_setup_user_name: "qemu-minimal VM"
    git_setup_user_email: "qemu-minimal@localhost"
  pre_tasks:
    # No "remove any partial dotfiles clone" task here any more. It existed
    # because a detached-HEAD or wrong-ref checkout made user_setup's git task
    # fail; sbates130272.batesste 3.0.0 clones with force: true, which discards
    # exactly that and re-clones cleanly.

    # These two live here, rather than next to the ROCm apt pin in the golden,
    # because of what they protect: fave_packages below opens with
    # `update_cache: true`, and a mismatched keyring+sources pair fails the
    # whole play before any importer's pre_tasks get a turn. They used to sit
    # ahead of these roles in each leaf's single play; the layering made the
    # roles a play of their own and moved the cleanup a play *later*, which
    # silently inverted the ordering the cleanup exists for.
    #
    # `state: absent` on a guest that never saw ROCm is a no-op, so vm-basic
    # carrying three ROCm-named paths costs nothing on the basic and ernic
    # lanes. The apt *pin* stays with the ROCm install -- a pin does not affect
    # update_cache, so it has no ordering constraint against this play.
    #
    # Only reachable on --ansible-only re-runs: a bake from the pristine cloud
    # image has no stale keyring to mismatch, which is why CI never showed it.
    - name: Remove stale ROCm GPG keyrings and sources
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/apt/keyrings/rocm.gpg
        - /etc/apt/keyrings/amdrocm.gpg
        - /etc/apt/sources.list.d/rocm.sources

    - name: Remove any stale device-metrics-exporter apt sources
      ansible.builtin.shell:
        cmd: |
          find /etc/apt/sources.list.d -type f \
            -exec grep -l "device-metrics-exporter\|amdgpu-exporter" {} \; \
            | xargs -r rm -f
      become: true
      changed_when: false
  roles:
    - role: sbates130272.batesste.user_setup
    - role: sbates130272.batesste.fave_packages
    - role: sbates130272.batesste.git_setup

# Delete what the bake left behind and fstrim it back to the qcow2. Last, and
# only when this playbook is the whole bake: vm-rocm-golden.yml imports this
# file with image_slim_enable: false, because every play it runs afterwards
# still needs the apt lists, /tmp and the build trees this removes, and it
# slims once itself at the end.
- name: Slim the baked image
  hosts: all
  # For ansible_kernel, which the role's opt-in kernel purge filters on.
  gather_facts: true
  become: true
  tags: [install]
  roles:
    - role: image_slim
      when: image_slim_enable | default(true) | bool
