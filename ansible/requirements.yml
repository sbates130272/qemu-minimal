---
# Installed with --no-deps, so every collection the playbooks reach has to be
# named here. That is deliberate: sbates130272.batesste declares
# community.libvirt, which is used only by its vm_create role, and none of
# these playbooks invoke that role. (It declared amazon.aws too until 3.0.0
# dropped it -- that one pulled ~10 MiB for a role nothing outside the
# collection's own aws_ec2_setup touches.)
#
# The cost of --no-deps is that a new upstream dependency goes missing here
# instead of being installed silently, surfacing as a module-not-found. If that
# happens, add the collection below rather than dropping --no-deps.
collections:
  # Exact, not a range. 3.0.0 is a breaking release -- git_setup now asserts on
  # an unset identity, check_platform fails instead of ending the host, and
  # four rocm_setup/fave_packages defaults flipped -- and an exact pin is what
  # makes the next one arrive as a deliberate PR rather than as a lane that
  # broke overnight when the collections cache was evicted. vm-basic.yml
  # supplies the identity; see git_setup_user_name there.
  - name: sbates130272.batesste
    version: "3.0.0"
  # Pinned to the upstream git tree rather than Galaxy. Galaxy publishes only
  # 0.1.0, which is the pre-ionic collection: it builds the out-of-tree
  # rocm_ernic_eth/rocm_ernic_rdma modules and reads driver/ and rdma-core/,
  # both deleted upstream on 2026-09-16. ">=0.1.0" looks like it would pick up
  # 0.2.0 and never will, because 0.2.0 was never published. The collection
  # lives in the repo's ansible/ subdirectory, which is what the #/ansible/
  # fragment selects.
  #
  # Pinned to a SHA, not a branch: a git requirement is re-resolved on every
  # ansible-galaxy run (there is no installed version for it to compare
  # against), so a branch would silently move the collection under us
  # mid-series. Bump this deliberately. Move back to a Galaxy version pin once
  # 0.2.0 is published there.
  #
  # ernic_source clones the same repo again inside the guest to build from, and
  # defaults that checkout to "main". playbooks/vars/ernic-pins.yml pins it to
  # this same SHA so the roles and the sources they build come from one tree --
  # bump both together.
  - name: https://github.com/ROCm/rocm-ernic.git#/ansible/
    type: git
    version: 1484557971b038f655da85b0d77ef0ba88308c22
  - name: ansible.posix
    version: ">=2.2.2"
  # Floor from sbates130272.batesste 3.0.0's galaxy.yml. --no-deps means galaxy
  # never sees that requirement, so it has to be repeated here or a too-old
  # community.general installs cleanly and fails in a role instead.
  - name: community.general
    version: ">=13.4.0"
  # Required by community.general itself, not used directly.
  - name: community.library_inventory_filtering_v1
    version: ">=1.0.0"
