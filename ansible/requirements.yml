---
# Installed with --no-deps, so every collection the playbooks reach has to be
# named here. That is deliberate: sbates130272.batesste declares
# community.libvirt, which is used only by its vm_create role, and none of
# these playbooks invoke that role. (It declared amazon.aws too until 3.0.0
# dropped it -- that one pulled ~10 MiB for a role nothing outside the
# collection's own aws_ec2_setup touches.)
#
# The cost of --no-deps is that a new upstream dependency goes missing here
# instead of being installed silently, surfacing as a module-not-found. If that
# happens, add the collection below rather than dropping --no-deps.
collections:
  # Exact, not a range. 3.0.0 was the breaking release -- git_setup now
  # asserts on an unset identity, check_platform fails instead of ending the
  # host, and four rocm_setup/fave_packages defaults flipped -- and an exact
  # pin is what makes the next one arrive as a deliberate PR rather than as a
  # lane that broke overnight when the collections cache was evicted.
  # vm-basic.yml supplies the identity; see git_setup_user_name there.
  #
  # 3.1.0 adds a ROCm 10.x minimal package set to rocm_setup and a rocjitsu
  # lane, which is why it is worth taking here: this repo's guests are ROCm
  # 10.1. Nothing in it is breaking. Watch the vm-rocm and vm-rocjitsu lanes
  # on the bump -- rocm_setup is what they run, so they are where a surprise
  # would land.
  #
  # 3.3.1 drops check_platform's fallback to top-level fact variables, which
  # warned on every role and stops working at ansible-core 2.24, and makes
  # ~/.bashrc source the ~/.bashrc.d snippets 3.3.0 moved the shell setup
  # into. 3.3.0 also removed ptop from fave_packages. The golden bake has
  # dotfiles off, so its guest gains ~/.bashrc.d/user_setup.sh and a sourcing
  # loop in ~/.bashrc; nothing else in the image changes.
  #
  # 3.4.0 is a provisioning-speed release. What reaches a golden bake:
  # rocm_setup asks rocm-latest for every version in one call instead of
  # five, user_setup writes its SSH client settings as one block and no
  # longer fails when a snap data directory cannot be removed, and
  # fave_packages skips the uv install instead of failing the play when
  # GitHub rate-limits the version lookup. user_setup still removes snapd
  # without purging it, so the purge in vm-basic.yml stays. The rdma_setup
  # default changes do not apply: no playbook here runs that role.
  - name: sbates130272.batesste
    version: "3.4.0"
  # rocm-ernic's collection, installed from the upstream git tree. Upstream
  # does not publish it to Galaxy. It did once, at 0.1.0 only and under
  # another namespace, and renamed it rocm.ernic when it stopped; CHANGELOG.md
  # has the old name. It installs as rocm.ernic 0.3.0, under
  # ansible_collections/rocm/ernic, and the playbooks name its roles
  # rocm.ernic.<role>. The collection lives in the repo's ansible/
  # subdirectory, which is what the #/ansible/ fragment selects. Upstream
  # means to attach a built collection to a GitHub release tagged
  # ernic-ansible-v<version>; no such tag exists yet, so a commit is the only
  # pin there is.
  #
  # Pinned to a SHA, not a branch: a git requirement is re-resolved on every
  # ansible-galaxy run (there is no installed version for it to compare
  # against), so a branch would silently move the collection under us
  # mid-series. Bump this deliberately.
  #
  # THIS PIN IS THE ROLES, and only the roles: the task files, the role
  # defaults, and the base ionic series and the two scripts that
  # ernic_guest_setup stages from the collection's own files/.
  #
  # The SOURCES are a second pin, ernic_source_pin in
  # playbooks/vm-rocm-golden.yml: the commit ernic_source checks out on the
  # controller. Everything with a half in the device server is built from
  # that checkout, not from this collection -- the SRQ and P4 patch series,
  # the scripts that fetch and build them, the rdma-core provider series, the
  # ernic_p4 module and the P4 client and its headers. The playbook hands
  # those paths to the roles, and tests/test_playbook_pins.py holds it to
  # that. So ernic_source_pin moves with the ernic.<sha> in every <ernic-ref>
  # and ERNIC_IMAGE, and this pin does not have to: run a guest built from
  # sources ahead of its server and ibv_create_srq() fails, UCX declines
  # rc_verbs, and anything built on it quietly falls back to TCP.
  #
  # The two pins differ today (ernic_source_pin is 90434a2), and that is
  # deliberate. Moving this one alone is safe only while the roles here
  # still drive the scripts and series at ernic_source_pin the way those
  # expect, so compare ansible/roles and ansible/files between the two
  # commits on every bump of either. At bd90234 against 90434a2 no .patch
  # file under ansible/files/patches differs, and neither does
  # setup-ionic-dkms.sh.
  - name: https://github.com/ROCm/rocm-ernic.git#/ansible/
    type: git
    version: bd902345b0f8f3863f535a0a09da9f21ce744737
  - name: ansible.posix
    version: ">=2.2.2"
  # Floor from sbates130272.batesste 3.0.0's galaxy.yml. --no-deps means galaxy
  # never sees that requirement, so it has to be repeated here or a too-old
  # community.general installs cleanly and fails in a role instead.
  - name: community.general
    version: ">=13.4.0"
  # Required by community.general itself, not used directly.
  - name: community.library_inventory_filtering_v1
    version: ">=1.0.0"
