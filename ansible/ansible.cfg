[defaults]
inventory = inventory/qemu-minimal-vms.yml
collections_path = ~/.ansible/collections:/usr/share/ansible/collections
# No roles_path. Repo-local roles live in playbooks/roles/, which Ansible
# searches relative to the playbook itself -- so they resolve regardless of cwd
# and regardless of whether this file was loaded at all. That matters: the
# ernic workflows invoke ansible-playbook directly from the repo root for the
# configure stage, where neither this file nor a relative roles_path applies.
host_key_checking = False
