name: qemu-minimal - publish-pages

# The only workflow that writes the site. Every report lane uploads a named
# artifact and stops there; this assembles them into one site on the gh-pages
# branch.
#
# It exists because the lanes used to publish themselves: vm-report and
# vm-report-two-vms each called actions/deploy-pages with their own full
# _site/, and a Pages deploy replaces the whole site. Whichever ran last won
# and the other lane's report simply vanished, with both workflows green.
#
# Artifacts are fetched by name from the most recent run that produced them,
# not from the run that triggered this one, so a lane that has not run for a
# week still contributes its last report and the site is always complete.
#
# Prerequisite (one-time, requires repo-admin access):
#   Settings > Pages > Source = "Deploy from a branch", gh-pages / (root)

on:
  workflow_run:
    workflows:
      - qemu-minimal - vm-report
      - qemu-minimal - vm-report-rocjitsu
      - qemu-minimal - vm-report-two-vms
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-pages
  # Never cancel: a cancelled run can leave the branch half-written.
  cancel-in-progress: false

jobs:
  publish:
    name: publish-pages
    # A failed report lane has nothing worth publishing, but a push or a manual
    # run has no triggering run to judge.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the latest artifact from every report lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging

          # Lane name -> path under the published site.
          fetch() {
            name=$1
            dest=$2
            # The API returns newest first, so per_page=1 is the latest run
            # that produced this name. Filter as a list and use // empty: for a
            # name that has never been uploaded, .artifacts[0] is null and
            # indexing it is a jq error, which under set -e would kill the job
            # instead of taking the warning path below.
            url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=1" \
                    --jq '[.artifacts[] | select(.expired == false)][0].archive_download_url // empty' \
                  || true)
            if [ -z "${url}" ]; then
              echo "::warning::no unexpired '${name}' artifact, leaving ${dest}/ as it is on the branch"
              return 0
            fi
            mkdir -p "staging/${dest}"
            curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" "${url}" -o /tmp/"${name}".zip
            unzip -q /tmp/"${name}".zip -d "staging/${dest}"
            if [ -d "staging/${dest}/site" ] && [ ! -e "staging/${dest}/index.md" ]; then
              rsync -a "staging/${dest}/site/" "staging/${dest}/"
              rm -rf "staging/${dest}/site"
            fi
            echo "${name} -> ${dest}/ ($(find "staging/${dest}" -type f | wc -l) files)"
          }

          fetch vm-report-1vm 1vm
          fetch vm-report-rocjitsu rocjitsu
          fetch vm-report-2vm two-vm

          # generate-vm-report.sh writes a _config.yml wherever it thinks it is
          # at a site root. Assembled into subdirectories they are all nested,
          # and Jekyll reads only the one at the root, so they are dead files
          # that would just mislead the next person to look.
          find staging -mindepth 2 -name _config.yml -delete

      - name: Write the site root
        run: |
          set -euo pipefail
          cat > staging/_config.yml <<'CFG'
          theme: minima
          title: qemu-minimal
          description: VM inspection reports for the qemu-minimal project
          CFG

          # No .nojekyll here, unlike rocm-ernic: that site is pre-rendered
          # Sphinx HTML, whereas the reports are markdown that GitHub's Jekyll
          # build has to turn into pages. Adding it would serve raw markdown.
          cat > staging/index.md <<'MD'
          ---
          title: qemu-minimal
          ---

          # qemu-minimal

          Live VM inspection reports, regenerated by CI. Each is produced by
          [`scripts/generate-vm-report.sh`](https://github.com/sbates130272/qemu-minimal/blob/main/scripts/generate-vm-report.sh)
          against a guest booted in that lane, so it reflects the VM as CI
          actually built it rather than what the docs claim.

          | Report | Lane | What it covers |
          |---|---|---|
          | [Single VM](1vm/) | `vm-report` | One `gen-vm` guest with an NVMe device, booted on a GitHub-hosted runner. |
          | [rocjitsu VM](rocjitsu/) | `vm-report-rocjitsu` | One rocjitsu vfio-user guest with GEMM and hipFile/NVMe metrics. |
          | [Two VMs — VM 1](two-vm/) | `vm-report-two-vms` | The `vfio-user-ernic-2vm` compose stack, both guests with a rocjitsu GPU. |
          | [Two VMs — VM 2](two-vm/vm2/) | `vm-report-two-vms` | The second guest of the same stack. |

          Each lane runs on its own schedule and publishes independently, so
          the reports here are not all from the same moment; each page carries
          its own generation timestamp and commit.

          Source: [sbates130272/qemu-minimal](https://github.com/sbates130272/qemu-minimal)
          MD

      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The runner has no key; without this an inherited commit.gpgSign
          # would fail the commit rather than skip the signature.
          git config --global commit.gpgSign false

          publish() {
            rm -rf gh-pages
            git init -q gh-pages
            cd gh-pages
            git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
              git checkout -q -b gh-pages FETCH_HEAD
            else
              echo "gh-pages does not exist yet, creating it"
              git checkout -q -b gh-pages
            fi

            cp ../staging/_config.yml ../staging/index.md .

            # Per-subtree --delete rather than one --delete over the whole site.
            # A lane whose artifact expired contributes no staging directory,
            # and a global --delete would then erase a report that is still the
            # most recent one there is. This also leaves perf/ alone without
            # needing to name it.
            for lane in ../staging/*/; do
              [ -d "${lane}" ] || continue
              rsync -a --delete "${lane}" "$(basename "${lane}")/"
            done

            git add -A
            if git diff --cached --quiet; then
              echo "site is already up to date, nothing to push"
              return 0
            fi
            git commit -q \
              -m "site: publish from ${GITHUB_SHA}" \
              -m "Built by publish-pages.yml. [skip ci]"
            git push -q origin gh-pages
          }

          # A report lane finishing while this one builds lands a commit on the
          # branch and the push is rejected. Rebuilding from the new tip is
          # correct and cheap, since the site is assembled from scratch anyway.
          cd "${GITHUB_WORKSPACE}"
          for attempt in 1 2 3; do
            if publish; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::publish attempt ${attempt} failed, retrying"
            cd "${GITHUB_WORKSPACE}"
            sleep $((attempt * 5))
          done
          echo "::error::could not publish to gh-pages after 3 attempts"
          exit 1
