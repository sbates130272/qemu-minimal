name: qemu-minimal - Shell Check

# No push: trigger and no paths: filter, unlike most lanes here. Every commit
# reaches main through a PR merge, so a post-merge run would re-test a tree
# this already passed on. And the job below is a required check: a required
# check that is path-filtered never reports at all on a PR outside the filter,
# which leaves that PR blocked on a status that will never arrive. 17s.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: Shell Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1
      
      - name: Run ShellCheck
        run: |
          shellcheck -S error \
            libvirt/create-nvme \
            libvirt/virt-install-ubuntu \
            scripts/*.sh \
            scripts/vm-report/*.sh \
            qemu/compose/*/tapsetup/*.sh

      # The sidecar scripts under qemu/compose/ were outside the list above
      # until they had already shipped a bug this would have caught: setup.sh
      # iterated `ls /sys/class/net` (SC2045) while picking the interface to
      # bridge, which is the exact line that mis-bridged the mesh interface on
      # a 2-VM fleet. A glob here is one target; the lane is 17s.
      #
      # Not linted, deliberately: the lmcache_guest role's *.sh.j2 templates.
      # They are bash, but Jinja expressions are not shell syntax and
      # shellcheck fails to parse them outright. Rendering them first needs the
      # whole role's variable scope, which is a different lane's job.

