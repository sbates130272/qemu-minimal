name: qemu-minimal - Report for helios

on:
  push:
    branches:
      - main
    paths:
      - 'ansible/playbooks/vm-helios.yml'
      - 'ansible/playbooks/vm-basic.yml'
      - 'ansible/playbooks/vars/**'
      - 'ansible/playbooks/vm-slim.yml'
      - 'ansible/playbooks/roles/**'
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - 'qemu/compose/vfio-user-helios-tray/**'
      - 'qemu/docker/sdxi/**'
      - 'qemu/xml/helios-tray.xml'
      - 'qemu/xml/overlay-helios-ci.xml'
      - 'scripts/generate-vm-report.sh'
      - '.github/actions/setup-vm-job/action.yml'
      - '.github/workflows/qemu-minimal-report-for-helios.yml'
      - '.github/workflows/qemu-minimal-publish-pages.yml'
  # Daily at 02:00 MST alongside the other report lanes.
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-report-helios
  cancel-in-progress: true

env:
  ERNIC_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20261112.gdca6903-ernic.90434a2-vfu.05bb5e5
  ROCJITSU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20261112.gdca6903-rocjitsu.50be05a
  QEMU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261112.gdca6903-qemu11.1.3-vfu.05bb5e5
  SDXI_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-sdxi:20261112.gdca6903-sdxi.c50f2b9
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  STACK_DIR: /var/lib/qemu-tool/stacks/helios-ci
  FLEET_FILE: qemu/xml/helios-tray.xml
  FLEET_OVERLAY: qemu/xml/overlay-helios-ci.xml
  VM1_NAME: helios-ci-1

jobs:
  generate-helios-report:
    name: Report for helios
    runs-on: ubuntu-latest
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261112.gdca6903-qemu11.1.3-vfu.05bb5e5
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    - name: Verify KVM is available
      run: |
        test -c /dev/kvm || { echo "::error::/dev/kvm missing - guest would run under TCG"; exit 1; }
        test -r /dev/kvm && test -w /dev/kvm || { echo "::error::/dev/kvm not read-write"; exit 1; }
        python3 -c "import os, fcntl; fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00, 0)" \
          || { echo "::error::/dev/kvm present but KVM_GET_API_VERSION failed"; exit 1; }
        echo "KVM available: $(ls -l /dev/kvm)"

    - name: Use a fixed pip cache directory
      run: echo "PIP_CACHE_DIR=/var/cache/pip-ci" >> "$GITHUB_ENV"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: /var/cache/pip-ci
        key: pip-qemu-tool-v2-${{ hashFiles('qemu/pyproject.toml') }}

    - name: Install qemu-tool
      run: pip install --break-system-packages -e ./qemu

    - name: Generate SSH key-pair
      run: |
        mkdir -p "$HOME/.ssh" && ssh-keygen -t rsa -q -f "$HOME/.ssh/id_rsa" -N ""
        [ "$HOME" = /root ] || { rm -rf /root/.ssh && ln -s "$HOME/.ssh" /root/.ssh; }

    - name: Cache cloud image
      uses: actions/cache@v4
      with:
        path: ${{ env.VM_IMAGES_DIR }}/*-server-cloudimg-*.img
        key: cloud-img-amd64-resolute-helios-report

    - name: Ensure images directory exists
      run: mkdir -p "$VM_IMAGES_DIR" && chmod 777 "$VM_IMAGES_DIR"

    - name: Stage qemu-tool source for the sibling containers
      run: |
        rm -rf /var/lib/qemu-tool/src
        mkdir -p /var/lib/qemu-tool/src
        cp -r qemu /var/lib/qemu-tool/src/

    # Build the local sdxi Docker image. rocm-sdxi binary is extracted from the
    # SDXI CI image; Dockerfile expects it via the sdxi-bin build context.
    - name: Build sdxi Docker image
      run: |
        tmpdir=$(mktemp -d)
        cid=$(docker create "$SDXI_IMAGE")
        docker cp "${cid}:/usr/local/bin/rocm-sdxi" "${tmpdir}/"
        docker rm "${cid}"
        docker build --build-context "sdxi-bin=${tmpdir}" \
          -t qemu-tool/sdxi:latest qemu/docker/sdxi
        rm -rf "${tmpdir}"

    - name: Generate VM 1
      run: |
        qemu-tool gen-vm \
          --fleet-file "$FLEET_FILE" \
          --fleet-file "$FLEET_OVERLAY" \
          --vm-name "$VM1_NAME" \
          --images "$VM_IMAGES_DIR" \
          --release resolute \
          --username ubuntu \
          --password password \
          --packages qemu/packages.d/packages-default \
          --size 8

    - name: Generate compose stack
      run: |
        qemu-tool gen-compose \
          --fleet-file "$FLEET_FILE" \
          --fleet-file "$FLEET_OVERLAY" \
          --output-dir "$STACK_DIR"

    - name: Pull CI images
      run: |
        docker pull "$ERNIC_IMAGE"
        docker pull "$ROCJITSU_IMAGE"
        docker pull "$QEMU_IMAGE"

    # Derive guest sizing from the runner; 4 vCPU floor for ionic_rdma.
    - name: Size the guest from the runner
      run: |
        HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)

        VM_VMEM=$(( HOST_MEM_MB * 3 / 4 ))
        if [ "$VM_VMEM" -gt 6144 ]; then VM_VMEM=6144; fi
        if [ "$VM_VMEM" -lt 1024 ]; then VM_VMEM=1024; fi

        echo "VM_VMEM=$VM_VMEM" >> "$GITHUB_ENV"
        echo "runner: $(nproc) vCPU, ${HOST_MEM_MB} MB"
        echo "guest: 4 vCPU (overlay), ${VM_VMEM} MB"

    - name: Bring up the helios-ci compose stack
      run: |
        qemu-tool compose --stack-dir "$STACK_DIR" -- up --detach
        echo "Compose stack started"

    # The compose project name is derived from STACK_DIR basename: helios-ci.
    - name: Join the compose network
      run: docker network connect helios-ci_fleet "$(cat /etc/hostname)"

    - name: Wait for sdxi-1 to be healthy
      run: |
        for i in $(seq 1 30); do
          sdxi_ok=$(qemu-tool compose --stack-dir "$STACK_DIR" ps --format json sdxi-1 \
            | python3 -c "import sys,json; s=json.load(sys.stdin); print(s.get('Health',''))" \
            2>/dev/null || true)
          [ "$sdxi_ok" = "healthy" ] && break
          sleep 2
        done
        [ "$sdxi_ok" = "healthy" ] || \
          (qemu-tool compose --stack-dir "$STACK_DIR" logs sdxi-1 && exit 1)
        echo "sdxi-1 healthy"

    - name: Wait for ernic hubs to be healthy
      run: |
        for i in $(seq 1 30); do
          hub_ok=$(qemu-tool compose --stack-dir "$STACK_DIR" ps --format json ernic-1 \
            | python3 -c "import sys,json; s=json.load(sys.stdin); print(s.get('Health',''))" \
            2>/dev/null || true)
          [ "$hub_ok" = "healthy" ] && break
          sleep 2
        done
        [ "$hub_ok" = "healthy" ] || \
          (qemu-tool compose --stack-dir "$STACK_DIR" logs ernic-1 && exit 1)
        echo "ernic-1 healthy"

    - name: Wait for VM 1 SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2322 ubuntu@qemu-1 true 2>/dev/null; then
            echo "VM 1 ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM 1 failed to boot in time"
        getent hosts qemu-1 || echo "qemu-1 does not resolve"
        ssh -o ConnectTimeout=5 \
            -o NoHostAuthenticationForLocalhost=yes \
            -o StrictHostKeyChecking=no \
            -vv -p 2322 ubuntu@qemu-1 true 2>&1 | tail -30 || true
        exit 1

    # vm-helios.yml installs the SDXI driver (rocm-sdxi) and configures amdgpu
    # firmware stubs for rocjitsu emulation.  The ROCJITSU_IMAGE env is used by
    # the firmware-stubs task (delegate_to: localhost, runs docker on this container).
    - name: Provision VM 1 with Ansible
      env:
        ROCJITSU_IMAGE: ${{ env.ROCJITSU_IMAGE }}
      run: |
        ANSIBLE_HOST_KEY_CHECKING=False \
        ansible-playbook ansible/playbooks/vm-helios.yml \
          -i "qemu-1 ansible_port=2322 ansible_user=ubuntu," \
          --private-key "$HOME/.ssh/id_rsa" \
          -e "rocjitsu_image=${ROCJITSU_IMAGE}"

    # Into site/helios so the existing site/ tree is left intact.
    - name: Generate VM 1 report
      timeout-minutes: 15
      env:
        REPORT_SDXI_BENCH: "1"
      run: bash scripts/generate-vm-report.sh site/helios 2322 ubuntu "Helios VM 1" qemu-1

    - name: Show compose logs on failure
      if: failure()
      run: qemu-tool compose --stack-dir "$STACK_DIR" -- logs

    - name: Tear down compose stack
      if: always()
      run: |
        qemu-tool compose --stack-dir "$STACK_DIR" -- down --remove-orphans || true

    - name: Upload the report
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vm-report-helios
        path: site/helios/
        if-no-files-found: error
