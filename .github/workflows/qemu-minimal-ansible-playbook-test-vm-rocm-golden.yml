name: qemu-minimal - Ansible Playbook Test - vm-rocm-golden

# vm-rocm-golden: combined image, boot with the full single-VM compose stack,
# verify both the ernic NIC and the GPU.

# This lane was parked carrying two failures. The ernic DKMS failure against
# the guest's 7.0.0-31-generic kernel is fixed -- rocm_ernic_setup installs the
# pinned mainline kernel, and the ionic lane has been green since b501f18. The
# parking note also cited a rocjitsu amdgpu-probe hang burning ~50 minutes per
# run, but the last run (35783675534) failed in 12 minutes inside the playbook
# step, so whatever remains is not that hang. The PR trigger is restored on
# that basis; if a ~50m hang reappears, bound the probe step with a
# timeout-minutes and a dmesg dump rather than parking the lane again.
#
# Not a required check -- it is the slowest lane here and fires on any
# ansible/playbooks/roles change.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # 'qemu/qemu-tool/**' and 'qemu/pyproject.toml' are deliberately absent:
    # this lane tests the playbook, not the tool that runs it.
    paths:
      - 'ansible/playbooks/vm-rocm-golden.yml'
      # It imports vm-basic.yml and reads vars/, and every role it uses lives
      # under roles/, so a change to any of them changes this guest.
      - 'ansible/playbooks/vm-basic.yml'
      - 'ansible/playbooks/vars/**'
      - 'ansible/playbooks/roles/**'
      - 'ansible/requirements.yml'
      - 'ansible/playbooks/templates/**'
      - 'qemu/checks/rocm-golden.sh'
      - 'qemu/packages.d/rocm-golden.txt'
      - 'qemu/compose/vfio-user-ernic-rocjitsu-vm/**'
      - '.github/actions/setup-vm-job/action.yml'
      - '.github/actions/report-image-size/action.yml'
      - '.github/workflows/qemu-minimal-ansible-playbook-test-vm-rocm-golden.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ERNIC_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20261112.gdca6903-ernic.90434a2-vfu.05bb5e5
  ROCJITSU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20261112.gdca6903-rocjitsu.50be05a
  QEMU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261112.gdca6903-qemu11.1.3-vfu.05bb5e5
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  # No ANSIBLE_EXTRA_ARGS. The playbook's own defaults are the published
  # image's -- no dotfiles, no SSH private key, no GPG signing, no distro
  # upgrade, no ip_discovery.bin -- and this lane bakes with exactly those, so
  # a default that drifts shows up here.

jobs:
  test-vm-rocm-golden:
    name: Ansible Playbook Test - vm-rocm-golden
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261112.gdca6903-qemu11.1.3-vfu.05bb5e5
      # /var/lib/qemu-tool is bind-mounted from the host at the same path so the
      # qcow2 this job generates is the same file the sibling qemu container opens:
      # compose bind-mounts are resolved by the host docker daemon, not in this
      # container's filesystem.
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    - name: Set up VM job
      uses: ./.github/actions/setup-vm-job
      with:
        cloud-image-key: rocm-golden
        stage-src: 'true'

    - name: Pull CI images
      run: |
        docker pull "$ERNIC_IMAGE"
        docker pull "$ROCJITSU_IMAGE"
        docker pull "$QEMU_IMAGE"

    - name: Generate VM with vm-rocm-golden playbook
      uses: sbates130272/qemu-tool-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        operation: gen-vm
        qemu-tool-source: ./qemu
        vm-name: rocm-golden-test
        release: resolute
        size: '64'
        vcpus: '4'
        ansible-playbook: ansible/playbooks/vm-rocm-golden.yml
        # The manifest the published guest is built with, so the check below
        # sees the guest a consumer gets.
        extra-args: >-
          --username ubuntu --password password
          --packages qemu/packages.d/rocm-golden.txt

    - name: Bring up rocm-golden compose stack
      uses: sbates130272/qemu-tool-action@v1
      env:
        QEMU_TOOL_SRC: /var/lib/qemu-tool/src
        # ionic_create_rdma_admin() hard-fails below 4 online CPUs, so this lane cannot run ionic_rdma
        # at 2 either.
        VM_VCPUS: "4"
        VM_VMEM: "4096"
        VM_SHM_SIZE: "5g"
      with:
        operation: compose
        qemu-tool-source: ./qemu
        vm-name: rocm-golden-test
        stack: vfio-user-ernic-rocjitsu-vm
        compose-args: up --detach
        wait-for-healthy: 'true'
        wait-timeout: '60'

    # The qemu container publishes 2222 on the HOST, which this job
    # container cannot reach: the runner puts it on its own bridge network
    # and "--network" is not supported in container.options. Attach to the
    # compose network instead and address the VM by its service name.
    - name: Join the compose network
      run: docker network connect vfio-user-ernic-rocjitsu-vm_default "$(cat /etc/hostname)"

    - name: Wait for VM SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@qemu true 2>/dev/null; then
            echo "VM ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM failed to boot in time"
        exit 1

    # The file batesste-ci-images gates the published image on, run here so
    # this repo gates the same thing. It is written for a boot with no
    # device; this guest has both attached, so the probe is expected to say
    # "ready" where a bare boot says "absent". Before the firmware step
    # below, because it asserts the image carries no ip_discovery.bin.
    #
    # Over "bash -s": non-login and non-interactive, which is the session
    # the check's ROCm PATH assertions are about.
    - name: Run the rocm-golden guest check
      run: |
        { echo 'set -eu'; cat qemu/checks/rocm-golden.sh; } |
          ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
            -p 2222 ubuntu@qemu "ROCM_GOLDEN_EXPECT_PROBE=ready bash -s"
        echo "✓ qemu/checks/rocm-golden.sh passed"

    - name: Verify amdgpu DKMS module installed
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu \
          "dkms status amdgpu | grep -q installed"
        echo "✓ amdgpu DKMS module installed"

    # imu: the gap set holds only what no driver release ships, and it sits
    # beside the packaged blobs in updates/.
    - name: Verify firmware stubs present
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu \
          "test -f /lib/firmware/updates/amdgpu/gc_12_1_0_imu.bin"
        echo "✓ gfx1250 firmware stubs present"

    - name: Verify amdgpu-probe installed
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu \
          "test -x /usr/local/bin/amdgpu-probe"
        echo "✓ amdgpu-probe installed"

    # configure sets up the NIC. firmware installs ip_discovery.bin from the
    # rocjitsu image serving this guest: the bake carries none, and amdgpu
    # cannot probe without it.
    - name: Run the ernic configure and live firmware stages
      run: |
        ansible-playbook \
          -i "qemu," \
          ansible/playbooks/vm-rocm-golden.yml \
          --tags configure,firmware \
          -e "ansible_host=qemu" \
          -e "ansible_port=2222" \
          -e "ansible_user=ubuntu" \
          -e 'ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"'

    # ionic mode builds ionic and ionic_rdma; there is no rocm_ernic module.
    - name: Verify ionic modules loaded and NIC visible
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu "lsmod | grep -qE '^ionic\b' && lsmod | grep -qE '^ionic_rdma\b'"
        echo "✓ ionic and ionic_rdma modules loaded"
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu "ip link show | grep -q rocm-ernic0"
        echo "✓ rocm-ernic0 interface present"

    # A device in ibv_devices can still have its port down, so gate on PORT_ACTIVE the way upstream does.
    - name: Verify the RDMA port is active
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu "ibv_devinfo" | tee /tmp/ibv_devinfo.txt
        grep -q PORT_ACTIVE /tmp/ibv_devinfo.txt
        echo "✓ RDMA port active"

    # This step has hung and only died to the job-level timeout, with no diagnostic output. Bound at all three layers
    # -- the guest command, the ssh session and the step. It needs the
    # ip_discovery.bin the firmware stage above installed.
    - name: Load amdgpu via amdgpu-probe
      timeout-minutes: 10
      run: |
        SSH="ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          -p 2222 ubuntu@qemu"
        for attempt in 1 2 3; do
          $SSH "sudo timeout 120 /usr/local/bin/amdgpu-probe" || true
          deadline=$(($(date +%s) + 30))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            gpus=$($SSH "cat /sys/class/kfd/kfd/topology/nodes/*/name 2>/dev/null | grep -c . || true" 2>/dev/null || echo 0)
            [ "$gpus" -ge 1 ] && { echo "✓ amdgpu-probe completed, KFD GPU node present"; exit 0; }
            sleep 3
          done
          if [ "$attempt" -lt 3 ]; then
            echo "KFD GPU node not present after attempt $attempt, reloading amdgpu..." >&2
            $SSH "sudo rmmod amdgpu" || true
            sleep 5
          fi
        done
        echo "no GPU KFD node after 3 amdgpu-probe attempts" >&2
        $SSH "sudo dmesg | grep -i amdgpu | tail -30" >&2
        exit 1

    - name: Dump guest dmesg on failure
      if: failure()
      timeout-minutes: 2
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          -p 2222 ubuntu@qemu "sudo dmesg | tail -200" || true

    # /dev/kfd is not a valid probe assertion: kfd_chardev_init() creates it before amdgpu_init()
    # registers the PCI driver, so it exists even when every probe fails.
    # Node 0 is the CPU and has an empty name; a bound GPU adds a named node.
    - name: Verify amdgpu module loaded and a GPU KFD node present
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu "lsmod | grep -q amdgpu"
        echo "✓ amdgpu module loaded"
        gpus=$(ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu \
          "cat /sys/class/kfd/kfd/topology/nodes/*/name 2>/dev/null | grep -c .")
        if [ "$gpus" -lt 1 ]; then
          echo "no GPU KFD node: amdgpu loaded but never bound the device" >&2
          ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
            -p 2222 ubuntu@qemu "sudo dmesg | grep -i amdgpu | tail -20" >&2
          exit 1
        fi
        echo "✓ GPU KFD node present ($gpus)"

    # Diagnostic only, and always() so a red lane still reports what it
    # built -- the size question is most interesting exactly when
    # something else went wrong.
    - name: Report VM image size
      if: always()
      uses: ./.github/actions/report-image-size
      with:
        vm-name: rocm-golden-test
        ssh-host: qemu

    - name: Show compose logs on failure
      if: failure()
      run: qemu-tool compose --stack vfio-user-ernic-rocjitsu-vm logs
