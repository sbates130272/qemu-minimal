name: qemu-minimal - Ansible Playbook Test - vm-rocm-golden

# vm-rocm-golden: combined image, boot as one guest of the default fleet,
# verify both the ernic NIC and the GPU.

# This lane was parked carrying two failures. The ernic DKMS failure against
# the guest's 7.0.0-31-generic kernel is fixed -- rocm_ernic_setup installs the
# pinned mainline kernel, and the ionic lane has been green since b501f18. The
# parking note also cited a rocjitsu amdgpu-probe hang burning ~50 minutes per
# run, but the last run (35783675534) failed in 12 minutes inside the playbook
# step, so whatever remains is not that hang. The PR trigger is restored on
# that basis; if a ~50m hang reappears, bound the probe step with a
# timeout-minutes and a dmesg dump rather than parking the lane again.
#
# Not a required check -- it is the slowest lane here and fires on any
# ansible/playbooks/roles change.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # 'qemu/qemu-tool/**' and 'qemu/pyproject.toml' are deliberately absent:
    # this lane tests the playbook, not the tool that runs it. gen_vm.py is
    # the exception: it turns the package manifest below into cloud-config,
    # and getting that wrong hangs this bake.
    paths:
      - 'ansible/playbooks/vm-rocm-golden.yml'
      # It imports vm-basic.yml and reads vars/, and every role it uses lives
      # under roles/, so a change to any of them changes this guest.
      - 'ansible/playbooks/vm-basic.yml'
      - 'ansible/playbooks/vars/**'
      - 'ansible/playbooks/roles/**'
      - 'ansible/requirements.yml'
      - 'ansible/playbooks/templates/**'
      - 'qemu/checks/rocm-golden.sh'
      - 'qemu/packages.d/rocm-golden.txt'
      - 'qemu/qemu-tool/gen_vm.py'
      - 'qemu/stacks/rocm-golden.xml'
      - '.github/actions/setup-vm-job/action.yml'
      - '.github/actions/report-image-size/action.yml'
      # The compiler cache of the bake: how it is named, restored and saved.
      - '.github/actions/bake-ccache-restore/action.yml'
      - '.github/actions/bake-ccache-save/action.yml'
      - '.github/workflows/qemu-minimal-ansible-playbook-test-vm-rocm-golden.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ERNIC_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20261112.gdca6903-ernic.90434a2-vfu.05bb5e5
  ROCJITSU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20261112.gdca6903-rocjitsu.50be05a
  QEMU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261112.gdca6903-qemu11.1.3-vfu.05bb5e5
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  # The fleet names its guests <vm-name-prefix>-N, so the bake takes the name
  # of guest 1 and the stack boots the overlay the bake made.
  VM_PREFIX: rocm-golden-test
  VM_NAME: rocm-golden-test-1
  # Under the shared mount, like the images. The compose project is this
  # directory's basename, playbook-test.
  STACK_DIR: /var/lib/qemu-tool/stacks/playbook-test
  OVERLAY: /var/lib/qemu-tool/stacks/playbook-test.xml
  # No ANSIBLE_EXTRA_ARGS. The playbook's own defaults are the published
  # image's -- no dotfiles, no SSH private key, no GPG signing, no distro
  # upgrade, no ip_discovery.bin -- and this lane bakes with exactly those, so
  # a default that drifts shows up here.
  #
  # The module builds go through a compiler cache, as the published bake's
  # do: the two workflows share one cache, through the bake-ccache-restore
  # and bake-ccache-save actions. What differs from a published bake is on
  # the bake step below, and none of it changes what is installed: the guest
  # name, the login key, and that the image is not compacted afterwards.

jobs:
  test-vm-rocm-golden:
    name: Ansible Playbook Test - vm-rocm-golden
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261112.gdca6903-qemu11.1.3-vfu.05bb5e5
      # /var/lib/qemu-tool is bind-mounted from the host at the same path so the
      # qcow2 this job generates is the same file the sibling qemu container opens:
      # compose bind-mounts are resolved by the host docker daemon, not in this
      # container's filesystem.
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    - name: Set up VM job
      uses: ./.github/actions/setup-vm-job
      with:
        cloud-image-key: rocm-golden
        stage-src: 'true'

    - name: Pull CI images
      run: |
        docker pull "$ERNIC_IMAGE"
        docker pull "$ROCJITSU_IMAGE"
        docker pull "$QEMU_IMAGE"
        # Read from the fleet file, which is what the stack below runs.
        docker pull "$(sed -n 's|.*<sdxi-image>\(.*\)</sdxi-image>.*|\1|p' qemu/stacks/rocm-golden.xml)"

    # The compiler cache of the bake, shared with the publish workflow: both
    # use this action, so both compute one key prefix for one directory, and
    # an entry either saves is a prefix hit for the other. A pull request can
    # read the entries saved on main, which the publish workflow keeps
    # current because it runs on every push to main that moves a pin. The
    # action also marks the start of the bake, so the bake must be the next
    # step.
    - name: Restore the compiler cache
      id: bake-ccache
      uses: ./.github/actions/bake-ccache-restore

    # Baked exactly as the published guest is, from the default fleet's
    # <bake-*> elements, so the check below sees the guest a consumer gets.
    # A plain run step, not qemu-tool-action: the action always passes
    # --release, which would outrank <bake-release>. The name differs:
    # --vm-name outranks <bake-name>. And the key is the job's own, so that
    # plain ssh reaches the guest; gen-vm would otherwise generate one.
    #
    # --cache-dir is what turns the compiler cache on, here and in the
    # publish workflow; gen-vm creates the directory. --cache-replace is
    # passed when the entry restored above was saved under another key
    # prefix, or none was restored; the action decides. --no-compact because
    # nothing publishes this image: the recompress was most of the three
    # minutes between the playbook ending and the image being ready, spent
    # on a file the job throws away.
    - name: Generate VM with vm-rocm-golden playbook
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BAKE_CCACHE_DIR: ${{ steps.bake-ccache.outputs.dir }}
        CACHE_REPLACE: ${{ steps.bake-ccache.outputs.replace }}
      run: |
        # Empty is not "no cache": gen-vm takes "" for the current
        # directory, and the save step would look in "/" and find nothing.
        if [ -z "$BAKE_CCACHE_DIR" ]; then
          echo "::error::bake-ccache-restore handed back no cache directory"
          exit 1
        fi
        mkdir -p "$VM_IMAGES_DIR"
        qemu-tool gen-vm --bake --xml qemu/stacks/rocm-golden.xml \
          --vm-name "$VM_NAME" --images "$VM_IMAGES_DIR" \
          --ssh-key-file "$HOME/.ssh/id_rsa.pub" --no-compact \
          --cache-dir "$BAKE_CCACHE_DIR" $CACHE_REPLACE

    # always(), because the playbook saves the cache before its last two
    # plays and a bake that failed in one of them still compiled everything.
    # The statistics go to the step summary; the directory is saved only if
    # the bake wrote a new archive into it.
    - name: Save the compiler cache
      if: always()
      uses: ./.github/actions/bake-ccache-save
      with:
        dir: ${{ steps.bake-ccache.outputs.dir }}
        key: ${{ steps.bake-ccache.outputs.key }}

    # One guest of the default fleet: qemu/stacks/rocm-golden.xml plus the few
    # elements this lane changes. Left out are the TAP, which is the L2 path
    # to a peer this guest does not have, and P4 in guest scope. The SDXI
    # device stays: the baked guest autoloads sdxi_char, and qemu-1 waits on
    # sdxi-1 being healthy. The guest size is the
    # default fleet's 4 vCPU, which is the ionic_rdma floor:
    # ionic_create_rdma_admin() hard-fails below 4 online CPUs.
    #
    # <qemu-tool-src> is a HOST path: compose bind mounts are resolved by the
    # host daemon, and the checkout exists only in this container, so
    # setup-vm-job staged a copy under the shared mount.
    - name: Render the test stack
      run: |
        set -eu
        mkdir -p "$(dirname "$OVERLAY")"
        cat > "$OVERLAY" <<XML
        <?xml version="1.0" encoding="UTF-8"?>
        <!-- Written by qemu-minimal-ansible-playbook-test-vm-rocm-golden.yml. Not a settings file anyone runs by hand. -->
        <fleet xmlns="http://qemu-tool/fleet/1.0">
          <vm-count>1</vm-count>
          <vm-name-prefix>${VM_PREFIX}</vm-name-prefix>
          <vm-images-dir>${VM_IMAGES_DIR}</vm-images-dir>
          <qemu-tool-src>/var/lib/qemu-tool/src</qemu-tool-src>
          <ernic-tap>false</ernic-tap>
          <p4-enable>false</p4-enable>
        </fleet>
        XML
        cat "$OVERLAY"
        qemu-tool gen-compose \
          --xml qemu/stacks/rocm-golden.xml --xml "$OVERLAY" \
          --output-dir "$STACK_DIR"
        # The render is what names the disk the guest boots from. Asserted,
        # because a guest name that matches no image is a QEMU that exits.
        grep -q -- "--vm-name \"${VM_NAME}\"" "$STACK_DIR/docker-compose.yml"
        grep -q '^  sdxi-1:' "$STACK_DIR/docker-compose.yml"
        test -f "$VM_IMAGES_DIR/${VM_NAME}.qcow2"

    # `up` returns once the guest's container has started, which compose
    # only does after every device server it depends on reports healthy.
    - name: Bring up the test stack
      run: |
        qemu-tool compose --stack-dir "$STACK_DIR" \
          --xml qemu/stacks/rocm-golden.xml --xml "$OVERLAY" \
          up --detach

    # Asked of the containers rather than of compose: a service that exited
    # is absent from `compose ps`, not failed.
    - name: Wait for the device servers
      run: |
        set -eu
        elapsed=0
        while true; do
          bad=""
          for svc in ernic-1 rocjitsu-1 sdxi-1; do
            h=$(docker inspect -f '{{.State.Health.Status}}' \
                  "playbook-test-${svc}-1" 2>/dev/null || echo missing)
            if [ "$h" != healthy ]; then bad="$bad ${svc}=${h}"; fi
          done
          q=$(docker inspect -f '{{.State.Status}}' \
                playbook-test-qemu-1-1 2>/dev/null || echo missing)
          if [ "$q" != running ]; then bad="$bad qemu-1=${q}"; fi
          if [ -z "$bad" ]; then break; fi
          if [ "$elapsed" -ge 60 ]; then
            echo "the stack is not ready after ${elapsed}s:${bad}" >&2
            qemu-tool compose --stack-dir "$STACK_DIR" ps --all || true
            exit 1
          fi
          sleep 5; elapsed=$((elapsed + 5))
        done
        echo "device servers healthy and the guest's container running after ${elapsed}s"

    # The qemu container publishes 2222 on the HOST, which this job
    # container cannot reach: the runner puts it on its own bridge network
    # and "--network" is not supported in container.options. Attach to the
    # stack's network instead and address the VM by its service name.
    - name: Join the stack network
      run: docker network connect playbook-test_fleet "$(cat /etc/hostname)"

    - name: Wait for VM SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@qemu-1 true 2>/dev/null; then
            echo "VM ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM failed to boot in time"
        exit 1

    # The file batesste-ci-images gates the published image on, run here so
    # this repo gates the same thing. It is written for a boot with no
    # device; this guest has the ernic, the GPU and the SDXI device attached,
    # so the probe is expected to say "nofirmware" where a bare boot says
    # "absent": a GPU on the bus and no ip_discovery.bin, which is the state
    # the probe refuses in. Its SDXI section is static and holds either way.
    # Before the firmware step below, because it asserts the image carries
    # no ip_discovery.bin.
    #
    # Over "bash -s": non-login and non-interactive, which is the session
    # the check's ROCm PATH assertions are about.
    - name: Run the rocm-golden guest check
      run: |
        { echo 'set -eu'; cat qemu/checks/rocm-golden.sh; } |
          ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
            -p 2222 ubuntu@qemu-1 "ROCM_GOLDEN_EXPECT_PROBE=nofirmware bash -s"
        echo "✓ qemu/checks/rocm-golden.sh passed"

    # The check above cannot ask for the device; this boot has one, and the
    # baked guest autoloads sdxi_char against it.
    - name: Verify sdxi_char bound the SDXI device
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 "test -e /dev/sdxi0"
        echo "✓ /dev/sdxi0 present"

    - name: Verify amdgpu DKMS module installed
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 \
          "dkms status amdgpu | grep -q installed"
        echo "✓ amdgpu DKMS module installed"

    # imu: the gap set holds only what no driver release ships, and it sits
    # beside the packaged blobs in updates/.
    - name: Verify firmware stubs present
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 \
          "test -f /lib/firmware/updates/amdgpu/gc_12_1_0_imu.bin"
        echo "✓ gfx1250 firmware stubs present"

    - name: Verify amdgpu-probe installed
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 \
          "test -x /usr/local/bin/amdgpu-probe"
        echo "✓ amdgpu-probe installed"

    # configure sets up the NIC. firmware installs ip_discovery.bin from the
    # rocjitsu image serving this guest: the bake carries none, and amdgpu
    # cannot probe without it.
    - name: Run the ernic configure and live firmware stages
      run: |
        ansible-playbook \
          -i "qemu-1," \
          ansible/playbooks/vm-rocm-golden.yml \
          --tags configure,firmware \
          -e "ansible_host=qemu-1" \
          -e "ansible_port=2222" \
          -e "ansible_user=ubuntu" \
          -e 'ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"'

    # The configure stage runs the collection's ernic_guest_setup, which
    # copies rocm-ernic's own 99-rocm-ernic.rules over the image's; the play
    # puts this repository's back afterwards. The guest check asserted the
    # file before that stage. These are the same lines of it, run again
    # after: "begin: ernic naming rules" to "end: ernic naming rules".
    - name: Verify the configure stage left this repository's naming rules
      run: |
        out=$({ echo 'set -eu'
                sed -n '/^# begin: ernic naming rules$/,/^# end: ernic naming rules$/p' \
                  qemu/checks/rocm-golden.sh; } |
              ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
                -p 2222 ubuntu@qemu-1 "bash -s")
        echo "$out"
        # The line the block ends on: markers that moved would send nothing.
        echo "$out" | grep -q '^udev: 99-rocm-ernic.rules indexes both devices'
        echo "✓ 99-rocm-ernic.rules is still this repository's"

    # ionic mode builds ionic and ionic_rdma; there is no rocm_ernic module.
    - name: Verify ionic modules loaded and NIC visible
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 "lsmod | grep -qE '^ionic\b' && lsmod | grep -qE '^ionic_rdma\b'"
        echo "✓ ionic and ionic_rdma modules loaded"
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 "ip link show | grep -q rocm-ernic0"
        echo "✓ rocm-ernic0 interface present"

    # A device in ibv_devices can still have its port down, so gate on PORT_ACTIVE the way upstream does.
    - name: Verify the RDMA port is active
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 "ibv_devinfo" | tee /tmp/ibv_devinfo.txt
        grep -q PORT_ACTIVE /tmp/ibv_devinfo.txt
        echo "✓ RDMA port active"

    # This step has hung and only died to the job-level timeout, with no diagnostic output. Bound at all three layers
    # -- the guest command, the ssh session and the step. It needs the
    # ip_discovery.bin the firmware stage above installed.
    #
    # A retry is amdgpu-probe again, never rmmod: unloading this module has
    # been seen to fault, and on a resident amdgpu whose GPU has no driver the
    # probe binds it through sysfs, which is the recovery a guest's own user
    # is given.
    - name: Load amdgpu via amdgpu-probe
      timeout-minutes: 10
      run: |
        SSH="ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          -p 2222 ubuntu@qemu-1"
        for attempt in 1 2 3; do
          $SSH "sudo timeout 120 /usr/local/bin/amdgpu-probe" || true
          deadline=$(($(date +%s) + 30))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            gpus=$($SSH "cat /sys/class/kfd/kfd/topology/nodes/*/name 2>/dev/null | grep -c . || true" 2>/dev/null || echo 0)
            [ "$gpus" -ge 1 ] && { echo "✓ amdgpu-probe completed, KFD GPU node present"; exit 0; }
            sleep 3
          done
          if [ "$attempt" -lt 3 ]; then
            echo "KFD GPU node not present after attempt $attempt: $($SSH "/usr/local/bin/amdgpu-probe --status" 2>/dev/null || echo unknown); probing again..." >&2
            sleep 5
          fi
        done
        echo "no GPU KFD node after 3 amdgpu-probe attempts" >&2
        $SSH "sudo dmesg | grep -i amdgpu | tail -30" >&2
        exit 1

    - name: Dump guest dmesg on failure
      if: failure()
      timeout-minutes: 2
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          -p 2222 ubuntu@qemu-1 "sudo dmesg | tail -200" || true

    # /dev/kfd is not a valid probe assertion: kfd_chardev_init() creates it before amdgpu_init()
    # registers the PCI driver, so it exists even when every probe fails.
    # Node 0 is the CPU and has an empty name; a bound GPU adds a named node.
    - name: Verify amdgpu module loaded and a GPU KFD node present
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 "lsmod | grep -q amdgpu"
        echo "✓ amdgpu module loaded"
        gpus=$(ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 \
          "cat /sys/class/kfd/kfd/topology/nodes/*/name 2>/dev/null | grep -c .")
        if [ "$gpus" -lt 1 ]; then
          echo "no GPU KFD node: amdgpu loaded but never bound the device" >&2
          ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
            -p 2222 ubuntu@qemu-1 "sudo dmesg | grep -i amdgpu | tail -20" >&2
          exit 1
        fi
        echo "✓ GPU KFD node present ($gpus)"

    # Diagnostic only, and always() so a red lane still reports what it
    # built -- the size question is most interesting exactly when
    # something else went wrong.
    #
    # The backing image's "disk size" here is the allocation the slim pass
    # left, not a compacted one: this lane bakes with --no-compact, so the
    # figure runs 2.3-2.5x what the published image measures and is not
    # comparable with runs from before that flag. The in-guest half is
    # unaffected, and is the half that says where the space went.
    - name: Report VM image size
      if: always()
      uses: ./.github/actions/report-image-size
      with:
        vm-name: ${{ env.VM_NAME }}
        ssh-host: qemu-1

    - name: Show compose logs on failure
      if: failure()
      run: qemu-tool compose --stack-dir "$STACK_DIR" logs
