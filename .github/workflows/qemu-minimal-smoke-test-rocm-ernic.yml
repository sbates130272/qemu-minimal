name: qemu-minimal - Smoke Test - rocm-ernic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - 'qemu/compose/**'
      - 'ansible/**'
      - '.github/workflows/qemu-minimal-smoke-test-rocm-ernic.yml'
  # Monday only, and ahead of the nightly report lanes: all four of those now
  # fire together at 08:00 and this wants a KVM-capable runner to itself.
  schedule:
    - cron: '7 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ERNIC_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-ernic:20260919.g959f0cf-ernic.0b48aa1-vfu.8039244
  ROCJITSU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260921.gb3399b3-rocjitsu.8e01a5a
  QEMU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260919.g359579e-qemu11.1.1-vfu.8039244
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  VM1_NAME: 2vm-smoke-1
  VM2_NAME: 2vm-smoke-2

jobs:

  smoke-test-2vm:
    name: Smoke Test - rocm-ernic
    runs-on: ubuntu-latest
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260919.g359579e-qemu11.1.1-vfu.8039244
      # Provides qemu-system-x86_64 and cloud-image-utils. /var/lib/qemu-tool is
      # bind-mounted from the host at the same path so the qcow2 generated here
      # is the same file the sibling qemu containers open: compose bind-mounts
      # are resolved by the host docker daemon, not in this container.
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    # No udev rule here: this job gets /dev/kvm from "options: --device /dev/kvm"
    # and runs as root. The ioctl is the real test -- a bind-mounted node can
    # exist and still be non-functional, and QEMU would silently fall back to TCG.
    - name: Verify KVM is available
      run: |
        test -c /dev/kvm || { echo "::error::/dev/kvm missing - guest would run under TCG"; exit 1; }
        test -r /dev/kvm && test -w /dev/kvm || { echo "::error::/dev/kvm not read-write"; exit 1; }
        python3 -c "import os, fcntl; fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00, 0)" \
          || { echo "::error::/dev/kvm present but KVM_GET_API_VERSION failed"; exit 1; }
        echo "KVM available: $(ls -l /dev/kvm)"

    # Everything else -- qemu-system-x86_64, qemu-img, cloud-localds, ansible
    # and openssh-client -- already ships in the CI image. Only pip is missing.
    - name: Install missing packages
      run: |
        apt-get update -qq
        apt-get install -y -qq python3-pip

    # Absolute, not "~/.cache/pip": actions/cache expands ~ on the runner and
    # pip expands it in this container, so the restore never reached pip.
    # See .github/actions/setup-vm-job/action.yml.
    - name: Use a fixed pip cache directory
      run: echo "PIP_CACHE_DIR=/var/cache/pip-ci" >> "$GITHUB_ENV"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: /var/cache/pip-ci
        key: pip-qemu-tool-v2-${{ hashFiles('qemu/pyproject.toml') }}

    - name: Install qemu-tool
      run: pip install --break-system-packages -e ./qemu

    - name: Generate SSH key-pair
      run: |
        mkdir -p "$HOME/.ssh" && ssh-keygen -t rsa -q -f "$HOME/.ssh/id_rsa" -N ""
        # ssh(1) expands ~ from the passwd entry, not $HOME. A container job
        # runs as root with HOME=/github/home, so the default identity would be
        # looked for at /root/.ssh/id_rsa, not found, and never offered.
        [ "$HOME" = /root ] || { rm -rf /root/.ssh && ln -s "$HOME/.ssh" /root/.ssh; }

    - name: Cache cloud image
      uses: actions/cache@v4
      with:
        path: ${{ env.VM_IMAGES_DIR }}/*-server-cloudimg-*.img
        key: cloud-img-amd64-noble-2vm-smoke

    - name: Ensure images directory exists
      run: mkdir -p "$VM_IMAGES_DIR" && chmod 777 "$VM_IMAGES_DIR"

    # Same reason as the bind mount above: the compose stack mounts
    # QEMU_TOOL_SRC by host path, and the checkout only exists inside this
    # container. Copy it under the shared mount instead.
    - name: Stage qemu-tool source for the sibling containers
      run: |
        rm -rf /var/lib/qemu-tool/src
        mkdir -p /var/lib/qemu-tool/src
        cp -r qemu /var/lib/qemu-tool/src/

    - name: Generate VM 1
      run: |
        qemu-tool gen-vm \
          --vm-name "$VM1_NAME" \
          --images "$VM_IMAGES_DIR" \
          --release noble \
          --username ubuntu \
          --password password \
          --packages none \
          --size 8

    - name: Generate VM 2 from shared backing file
      run: |
        qemu-tool gen-vm \
          --vm-name "$VM2_NAME" \
          --images "$VM_IMAGES_DIR" \
          --backing-file "$VM_IMAGES_DIR/${VM1_NAME}-backing.qcow2"

    - name: Pull CI images
      run: |
        docker pull "$ERNIC_IMAGE"
        docker pull "$ROCJITSU_IMAGE"
        docker pull "$QEMU_IMAGE"

    # Size the guests from the runner instead of taking the compose defaults.
    # Those are 4 vCPU / 8192 MB applied to EACH guest, which is the whole of
    # a 4 vCPU / 16 GB hosted runner with nothing left for the two ernic
    # servers, this job container and the runner agent. Deriving it the way
    # upstream's system-tests.yml does means a larger runner class benefits
    # without another edit here.
    - name: Size the guests from the runner
      env:
        VMS: "2"
      run: |
        HOST_CPUS=$(nproc)
        HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)

        VM_VCPUS=$(( (HOST_CPUS - 1) / VMS ))
        # Four is a floor, not a preference: ionic_lif_size() sets
        # neqs = min(rdma.eq_qtype.qid_count, num_online_cpus()) and
        # ionic_create_rdma_admin() rejects anything below IONIC_EQ_COUNT_MIN
        # (4) with a bare -EINVAL. Oversubscribing the runner is the cheaper
        # problem; starving the guest fails every time.
        if [ "$VM_VCPUS" -lt 4 ]; then VM_VCPUS=4; fi

        # Three quarters of RAM split per guest -- the host keeps the rest.
        VM_VMEM=$(( HOST_MEM_MB * 3 / 4 / VMS ))
        if [ "$VM_VMEM" -gt 8192 ]; then VM_VMEM=8192; fi
        if [ "$VM_VMEM" -lt 1024 ]; then VM_VMEM=1024; fi

        echo "VM_VCPUS=$VM_VCPUS" >> "$GITHUB_ENV"
        echo "VM_VMEM=$VM_VMEM" >> "$GITHUB_ENV"
        echo "runner: ${HOST_CPUS} vCPU, ${HOST_MEM_MB} MB"
        echo "guests: ${VMS} x ${VM_VCPUS} vCPU, ${VM_VMEM} MB"

    - name: Bring up full 2vm compose stack
      working-directory: qemu/compose/vfio-user-ernic-2vm
      env:
        QEMU_TOOL_SRC: /var/lib/qemu-tool/src
      run: |
        docker compose --profile rocjitsu-vm1 --profile rocjitsu-vm2 up --detach
        echo "Compose stack started"

    # Both qemu containers publish their SSH port on the HOST, which this job
    # container cannot reach: the runner puts it on its own bridge network and
    # "--network" is not supported in container.options. Attach to the compose
    # network instead and address each VM by its service name on port 2222.
    - name: Join the compose network
      run: docker network connect vfio-user-ernic-2vm_default "$(cat /etc/hostname)"

    - name: Wait for GPU/NIC servers to be healthy
      working-directory: qemu/compose/vfio-user-ernic-2vm
      run: |
        for i in $(seq 1 30); do
          hub_ok=$(docker compose ps --format json ernic-hub \
            | python3 -c "import sys,json; s=json.load(sys.stdin); print(s.get('Health',''))" \
            2>/dev/null || true)
          worker_ok=$(docker compose ps --format json ernic-worker \
            | python3 -c "import sys,json; s=json.load(sys.stdin); print(s.get('Health',''))" \
            2>/dev/null || true)
          [ "$hub_ok" = "healthy" ] && [ "$worker_ok" = "healthy" ] && break
          sleep 2
        done
        [ "$hub_ok" = "healthy" ]    || (docker compose logs ernic-hub    && exit 1)
        [ "$worker_ok" = "healthy" ] || (docker compose logs ernic-worker && exit 1)
        echo "GPU/NIC servers healthy"

    - name: Wait for VM 1 SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@qemu-1 true 2>/dev/null; then
            echo "VM 1 ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM 1 failed to boot in time"
        echo "--- diagnostics: last ssh attempt, unfiltered ---"
        getent hosts qemu-1 || echo "qemu-1 does not resolve"
        ssh -o ConnectTimeout=5 \
            -o NoHostAuthenticationForLocalhost=yes \
            -o StrictHostKeyChecking=no \
            -vv -p 2222 ubuntu@qemu-1 true 2>&1 | tail -30 || true
        exit 1

    - name: Wait for VM 2 SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@qemu-2 true 2>/dev/null; then
            echo "VM 2 ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM 2 failed to boot in time"
        echo "--- diagnostics: last ssh attempt, unfiltered ---"
        getent hosts qemu-2 || echo "qemu-2 does not resolve"
        ssh -o ConnectTimeout=5 \
            -o NoHostAuthenticationForLocalhost=yes \
            -o StrictHostKeyChecking=no \
            -vv -p 2222 ubuntu@qemu-2 true 2>&1 | tail -30 || true
        exit 1

    - name: Verify SSH access to VM 1
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 ls -ltrh

    - name: Verify SSH access to VM 2
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-2 ls -ltrh

    - name: Verify qemu-guest-agent in VM 1
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 \
          "dpkg-query -W -f='\${Status}' qemu-guest-agent" \
          | grep -q "install ok installed"
        echo "qemu-guest-agent installed in VM 1"

    - name: Verify qemu-guest-agent in VM 2
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-2 \
          "dpkg-query -W -f='\${Status}' qemu-guest-agent" \
          | grep -q "install ok installed"
        echo "qemu-guest-agent installed in VM 2"

    - name: Show compose logs on failure
      if: failure()
      working-directory: qemu/compose/vfio-user-ernic-2vm
      run: docker compose logs
