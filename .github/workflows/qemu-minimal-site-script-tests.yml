name: qemu-minimal - Site Script Tests

# render-site-perf.py runs exactly once per Pages publish, on a runner, against
# state that only exists on the gh-pages branch. workflow_run and schedule only
# ever run the default branch's copy of a workflow, so publish-pages cannot be
# exercised from a PR at all -- every bug in the renderer used to be a
# post-merge bug, found by reading the published site afterwards. This lane is
# the pre-merge half: it drives the same code paths against fixtures in about a
# second, with no VM and no branch state.
#
# No push: trigger and no paths: filter, matching shell-check and setup-test --
# every commit reaches main through a PR, and a path-filtered required check
# never reports on a PR outside its filter, leaving that PR blocked forever.
# The job is seconds, so there is nothing to save by filtering it.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  site-script-tests:
    name: Site Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      # Stdlib unittest on the runner's system python. The tests deliberately
      # take no dependency, so there is nothing to install and nothing to pin.
      - name: Run the renderer unit tests
        run: python3 -m unittest discover -s tests -v
