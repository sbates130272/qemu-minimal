name: qemu-minimal - shellcheck

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'libvirt/create-nvme'
      - 'libvirt/virt-install-ubuntu'
      - 'scripts/*.sh'
      - '.github/workflows/shell-check.yml'
  push:
    branches:
      - main
    paths:
      - 'libvirt/create-nvme'
      - 'libvirt/virt-install-ubuntu'
      - 'scripts/*.sh'
      - '.github/workflows/shell-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1
      
      - name: Run ShellCheck
        run: |
          shopt -s nullglob
          files=(
            libvirt/create-nvme
            libvirt/virt-install-ubuntu
            scripts/*.sh
            scripts/vm-report/*.sh
          )
          shellcheck -S error "${files[@]}"
