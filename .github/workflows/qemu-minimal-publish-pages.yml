name: qemu-minimal - Publish Pages

# The only workflow that writes the site. Every report lane uploads a named
# artifact and stops there; this assembles them into one site on the gh-pages
# branch.
#
# It exists because the lanes used to publish themselves: vm-report and
# vm-report-ernic each called actions/deploy-pages with their own full
# _site/, and a Pages deploy replaces the whole site. Whichever ran last won
# and the other lane's report simply vanished, with both workflows green.
#
# Artifacts are fetched by name from the most recent run that produced them,
# not from the run that triggered this one, so a lane that has not run for a
# week still contributes its last report and the site is always complete.
#
# Flow:
#   1. Fetch report artifacts into docs/<dest>/ subtrees.
#   2. Clone gh-pages (for perf history continuity).
#   3. Run render-site-perf.py to update docs/perf/ with trends and badges.
#   4. Run mkdocs build to produce site/.
#   5. Sync site/ onto the gh-pages branch and push.
#
# Prerequisite (one-time, requires repo-admin access):
#   Settings > Pages > Source = "Deploy from a branch", gh-pages / (root)

on:
  workflow_run:
    workflows:
      # "Report for vm-rocjitsu" produces both the vm-report-rocjitsu and the
      # vm-report-hipfile-fio artifacts since the two lanes were merged; there
      # is no separate "Report for hipfile-fio" workflow to wait on any more.
      # The fetch list below is unchanged and still names both artifacts.
      - qemu-minimal - Report for vm-basic
      - qemu-minimal - Report for vm-rocjitsu
      - qemu-minimal - Report for vm-ernic
      - qemu-minimal - Report for lmcache
      - qemu-minimal - Report for quickstart
      - qemu-minimal - Report for mi355x
      - qemu-minimal - Ansible Playbook Test - vm-ernic-srq-p4
      - qemu-minimal - Report for helios
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/workflows/qemu-minimal-publish-pages.yml'
      - 'docs/**'
      - '.mkdocs.yml'
      - 'scripts/render-site-perf.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-pages
  # Never cancel: a cancelled run can leave the branch half-written.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Pages
    # This used to gate on `conclusion == 'success'`, on the reasoning that a
    # failed report lane "has nothing worth publishing". That reasoning does not
    # survive the merge of the two rocjitsu lanes.
    #
    # report-for-vm-rocjitsu now runs two benchmarks against one guest, each
    # continue-on-error with its own upload gated on that step's outcome, and
    # then fails the job on purpose if either half failed. Since 2026-09-24 the
    # GEMM half has hung every run and the fio half has passed every run -- so
    # every run uploads a good, fresh vm-report-hipfile-fio and concludes
    # `failure`. Under the old gate its own workflow_run always skipped, and
    # that artifact reached the site only if some unrelated lane happened to
    # trigger a publish later while it was still unexpired. On 2026-09-26 both
    # of the day's publishes ran before the artifact existed and the 13:15 run
    # triggered by the lane itself skipped, so a good report sat in artifact
    # storage for a day. That defeated the entire reason the lane was
    # restructured to survive a hang.
    #
    # `skipped` is still excluded: the triggering workflow did no work at all,
    # so there is nothing new to assemble and no reason to spend a runner.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1
        with:
          ref: main

      - name: Set up Python for MkDocs
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Fetch the latest artifact from every report lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Lane name -> path under docs/ (becomes a subtree in the built site).
          fetch() {
            name=$1
            dest=$2
            # The API returns newest first, so per_page=1 is the latest run
            # that produced this name. Filter as a list and use // empty: for a
            # name that has never been uploaded, .artifacts[0] is null and
            # indexing it is a jq error, which under set -e would kill the job
            # instead of taking the warning path below.
            url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=1" \
                    --jq '[.artifacts[] | select(.expired == false)][0].archive_download_url // empty' \
                  || true)
            if [ -z "${url}" ]; then
              echo "::warning::no unexpired '${name}' artifact, leaving docs/${dest}/ as it is"
              return 0
            fi
            mkdir -p "docs/${dest}"
            curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" "${url}" -o /tmp/"${name}".zip
            unzip -q /tmp/"${name}".zip -d "docs/${dest}"
            # Some artifacts wrap their content in a site/ subdirectory.
            if [ -d "docs/${dest}/site" ] && [ ! -e "docs/${dest}/index.md" ]; then
              rsync -a "docs/${dest}/site/" "docs/${dest}/"
              rm -rf "docs/${dest}/site"
            fi
            echo "${name} -> docs/${dest}/ ($(find "docs/${dest}" -type f | wc -l) files)"
          }

          fetch vm-report-1vm 1vm
          fetch vm-report-rocjitsu rocjitsu
          fetch vm-report-ernic ernic
          fetch vm-report-hipfile-fio hipfile-fio
          fetch vm-report-lmcache lmcache
          fetch vm-report-quickstart quickstart
          fetch vm-report-mi355x mi355x
          fetch vm-report-ernic-p4 ernic-p4
          fetch vm-report-helios helios

          # Nested _config.yml from old Jekyll-based report scripts are dead
          # weight; MkDocs ignores them but they would just mislead reviewers.
          find docs -mindepth 2 -name _config.yml -delete

      - name: Render performance trends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global commit.gpgSign false

          rm -rf gh-pages
          git init -q gh-pages
          cd gh-pages
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            echo "gh-pages does not exist yet, starting fresh"
            git checkout -q -b gh-pages
          fi

          # green.json is kept apart from history.jsonl because the history
          # appends only when a benchmark number changes, and the all-green date
          # has to be able to advance on a publish where nothing did.
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/render-site-perf.py \
            --site-dir docs \
            --history-in gh-pages/perf/history.jsonl \
            --history-out docs/perf/history.jsonl \
            --green-in gh-pages/perf/green.json \
            --green-out docs/perf/green.json

      - name: Build site with MkDocs
        run: mkdocs build --config-file .mkdocs.yml --strict

      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish() {
            rm -rf gh-pages
            git init -q gh-pages
            cd gh-pages
            git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
              git checkout -q -b gh-pages FETCH_HEAD
            else
              git checkout -q -b gh-pages
            fi

            sync_dir() {
              src=$1
              dest=$2
              [ -d "${src}" ] || return 0
              rsync -a --delete "${src}/" "${dest}/"
            }

            # Replace the entire published tree with the built site.
            # MkDocs adds .nojekyll automatically so GitHub Pages serves
            # the pre-built HTML rather than running Jekyll over it.
            # --filter 'protect .git' keeps the clone's .git/ intact;
            # without it rsync --delete removes it (site/ has no .git/),
            # causing subsequent git commands to fall back to the workspace git.
            rsync -a --delete --filter 'protect .git' "../site/" ./

            git add -A
            if git diff --cached --quiet; then
              echo "site is already up to date, nothing to push"
              return 0
            fi
            git commit -q \
              -m "site: publish from ${GITHUB_SHA}" \
              -m "Built by publish-pages.yml. [skip ci]"
            git push -q origin gh-pages
          }

          # A report lane finishing while this one builds lands a commit on the
          # branch and the push is rejected. Rebuilding from the new tip is
          # correct and cheap, since the site is assembled from scratch anyway.
          cd "${GITHUB_WORKSPACE}"
          for attempt in 1 2 3; do
            if publish; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::publish attempt ${attempt} failed, retrying"
            cd "${GITHUB_WORKSPACE}"
            sleep $((attempt * 5))
          done
          echo "::error::could not publish to gh-pages after 3 attempts"
          exit 1
