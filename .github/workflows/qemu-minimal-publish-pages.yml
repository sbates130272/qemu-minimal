name: qemu-minimal - Publish Pages

# The only workflow that writes the site: the repository's own docs/ plus a
# performance page built from the numbers the benchmark jobs upload. No guest
# report is published any more; the site carries documentation and trends.
#
# Artifacts are fetched by name from the most recent run that produced them,
# not from the run that triggered this one, so a benchmark that failed today
# still contributes its last good number.
#
# Flow:
#   1. Fetch the perf-* artifacts into perf-in/ (inputs, never published).
#   2. Clone gh-pages (for perf history continuity).
#   3. Run render-site-perf.py to write docs/perf/ with trends and badges.
#   4. Run mkdocs build to produce site/.
#   5. Sync site/ onto the gh-pages branch and push.
#
# Prerequisite (one-time, requires repo-admin access):
#   Settings > Pages > Source = "Deploy from a branch", gh-pages / (root)

on:
  workflow_run:
    workflows:
      # The one workflow that produces perf-* artifacts: perf-rocjitsu,
      # perf-hipfile-fio, perf-ernic and perf-helios, from three jobs.
      - qemu-minimal - Report for vm-rocm-golden
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/workflows/qemu-minimal-publish-pages.yml'
      - 'docs/**'
      - '.mkdocs.yml'
      - 'scripts/render-site-perf.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-pages
  # Never cancel: a cancelled run can leave the branch half-written.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Pages
    # Deliberately NOT gated on `conclusion == 'success'`. The benchmark
    # workflow runs several benchmarks, uploads each one's artifact as soon as
    # that benchmark succeeds, and then fails on purpose if any of them failed.
    # A run that concludes `failure` therefore routinely carries good, fresh
    # numbers, and under a success gate they would sit in artifact storage
    # until some later run happened to be fully green.
    #
    # `skipped` is still excluded: the triggering workflow did no work at all,
    # so there is nothing new to assemble and no reason to spend a runner.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1
        with:
          ref: main

      - name: Set up Python for MkDocs
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Fetch the latest artifact from every benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Artifact name -> directory under perf-in/. That tree is an input to
          # render-site-perf.py and deliberately sits outside docs/, so the raw
          # artifacts are never published -- only the perf/ page built from
          # them is.
          fetch() {
            name=$1
            dest=$2
            # The API returns newest first, so per_page=1 is the latest run
            # that produced this name. Filter as a list and use // empty: for a
            # name that has never been uploaded, .artifacts[0] is null and
            # indexing it is a jq error, which under set -e would kill the job
            # instead of taking the warning path below.
            url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=1" \
                    --jq '[.artifacts[] | select(.expired == false)][0].archive_download_url // empty' \
                  || true)
            if [ -z "${url}" ]; then
              echo "::warning::no unexpired '${name}' artifact, that metric keeps its last recorded value"
              return 0
            fi
            mkdir -p "perf-in/${dest}"
            curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" "${url}" -o /tmp/"${name}".zip
            unzip -q /tmp/"${name}".zip -d "perf-in/${dest}"
            echo "${name} -> perf-in/${dest}/ ($(find "perf-in/${dest}" -type f | wc -l) files)"
          }

          # The directory names are the `source` entries in METRICS in
          # scripts/render-site-perf.py.
          mkdir -p perf-in
          fetch perf-rocjitsu rocjitsu
          fetch perf-hipfile-fio hipfile-fio
          fetch perf-ernic ernic
          fetch perf-helios helios

      - name: Render performance trends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global commit.gpgSign false

          rm -rf gh-pages
          git init -q gh-pages
          cd gh-pages
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            echo "gh-pages does not exist yet, starting fresh"
            git checkout -q -b gh-pages
          fi

          cd "${GITHUB_WORKSPACE}"
          python3 scripts/render-site-perf.py \
            --input-dir perf-in \
            --site-dir docs \
            --history-in gh-pages/perf/history.jsonl \
            --history-out docs/perf/history.jsonl

      - name: Build site with MkDocs
        run: mkdocs build --config-file .mkdocs.yml --strict

      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish() {
            rm -rf gh-pages
            git init -q gh-pages
            cd gh-pages
            git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
              git checkout -q -b gh-pages FETCH_HEAD
            else
              git checkout -q -b gh-pages
            fi

            sync_dir() {
              src=$1
              dest=$2
              [ -d "${src}" ] || return 0
              rsync -a --delete "${src}/" "${dest}/"
            }

            # Replace the entire published tree with the built site.
            # MkDocs adds .nojekyll automatically so GitHub Pages serves
            # the pre-built HTML rather than running Jekyll over it.
            # --filter 'protect .git' keeps the clone's .git/ intact;
            # without it rsync --delete removes it (site/ has no .git/),
            # causing subsequent git commands to fall back to the workspace git.
            rsync -a --delete --filter 'protect .git' "../site/" ./

            git add -A
            if git diff --cached --quiet; then
              echo "site is already up to date, nothing to push"
              return 0
            fi
            git commit -q \
              -m "site: publish from ${GITHUB_SHA}" \
              -m "Built by publish-pages.yml. [skip ci]"
            git push -q origin gh-pages
          }

          # A report lane finishing while this one builds lands a commit on the
          # branch and the push is rejected. Rebuilding from the new tip is
          # correct and cheap, since the site is assembled from scratch anyway.
          cd "${GITHUB_WORKSPACE}"
          for attempt in 1 2 3; do
            if publish; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::publish attempt ${attempt} failed, retrying"
            cd "${GITHUB_WORKSPACE}"
            sleep $((attempt * 5))
          done
          echo "::error::could not publish to gh-pages after 3 attempts"
          exit 1
