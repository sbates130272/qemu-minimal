name: qemu-minimal - ansible-setup-test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - '.github/workflows/ansible-setup-test.yml'
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - '.github/workflows/ansible-setup-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  syntax-check:
    name: ansible-syntax-check
    runs-on: ubuntu-latest
    container: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260917.g857483b-qemu11.1.1-vfu.8039244
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1
    # ansible ships in the CI image at /usr/local/bin; only pip is missing.
    - name: Install pip
      run: apt-get update -qq && apt-get install -y -qq python3-pip
    # Resolve the path in the container; actions/cache expands ~ in Node on the
    # runner, ansible-galaxy expands it from $HOME in here, and the two are not
    # the same directory. See .github/actions/setup-vm-job/action.yml.
    - name: Resolve the Ansible collections path
      id: acp
      run: echo "path=$HOME/.ansible/collections" >> "$GITHUB_OUTPUT"
    - name: Cache Ansible collections
      uses: actions/cache@v4
      with:
        path: ${{ steps.acp.outputs.path }}
        key: ansible-collections-v2-${{ hashFiles('ansible/requirements.yml') }}
    - name: Install sbates130272.batesste collection
      run: ansible-galaxy collection install --pre --no-deps -r ansible/requirements.yml
    - name: Syntax-check vm-basic playbook
      run: ansible-playbook --syntax-check playbooks/vm-basic.yml
      working-directory: ansible
    - name: Syntax-check vm-rocm playbook
      run: ansible-playbook --syntax-check playbooks/vm-rocm.yml
      working-directory: ansible
    - name: Syntax-check vm-ernic playbook
      run: ansible-playbook --syntax-check playbooks/vm-ernic.yml
      working-directory: ansible
    - name: Syntax-check vm-rocjitsu playbook
      run: ansible-playbook --syntax-check playbooks/vm-rocjitsu.yml
      working-directory: ansible
    - name: Syntax-check vm-ernic-rocjitsu playbook
      run: ansible-playbook --syntax-check playbooks/vm-ernic-rocjitsu.yml
      working-directory: ansible

  gen-vm-ansible-setup:
    name: gen-vm-ansible-setup
    needs: syntax-check
    runs-on: ubuntu-latest
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260917.g857483b-qemu11.1.1-vfu.8039244
      # Supplies qemu-system-x86_64, qemu-img and cloud-localds.
      options: --device /dev/kvm
    timeout-minutes: 90
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    # This job used to inline its own copy of the prologue, which is how it
    # kept the "~/.ansible/collections" cache path after the composite action
    # was fixed: actions/cache expands ~ in Node on the runner, ansible-galaxy
    # expands it from $HOME in the container, so the restore never reached
    # galaxy and gen-vm redownloaded the collections every run.
    - name: Set up VM job
      uses: ./.github/actions/setup-vm-job
      with:
        cloud-image-key: ansible-setup
        release: noble
    - name: Generate VM with Ansible post-setup
      run: |
        qemu-tool gen-vm \
          --vm-name ansible-setup-test \
          --release noble \
          --username ubuntu \
          --password password \
          --packages none \
          --size 8 \
          --ansible-playbook ansible/playbooks/vm-basic.yml
      env:
        ANSIBLE_EXTRA_ARGS: '-e {"git_setup_enable_gpg_signing":false,"user_setup_dotfiles_enable":false,"user_setup_install_amd_ca":false}'
    - name: Boot VM as background task
      run: |
        qemu-tool run-vm --vm-name ansible-setup-test > run-vm-output.log 2>&1 &
    - name: Wait for VM to boot (180s timeout)
      run: |
        echo "Waiting for VM to accept SSH..."
        timeout=180
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@localhost true 2>/dev/null; then
            echo "✓ VM ready after $elapsed seconds"
            exit 0
          fi
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "✗ VM failed to boot within $timeout seconds"
        exit 1
    - name: Output run-vm log on failure
      if: failure()
      run: cat qemu/run-vm-output.log
    - name: Verify user_setup copied SSH key
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost test -f .ssh/id_rsa
        echo "✓ user_setup SSH key present in guest"
    - name: Verify fave_packages installed fio
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost \
          "dpkg-query -W -f='\${Status}' fio" \
          | grep -q 'install ok installed'
        echo "✓ fave_packages installed fio in guest"
    - name: Verify git_setup configured git identity
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost \
          git config --global user.name \
          | grep -q 'Stephen Bates'
        echo "✓ git_setup configured git user.name in guest"
