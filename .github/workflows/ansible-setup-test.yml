name: ansible-setup-test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'qemu/gen-vm'
      - '.github/workflows/ansible-setup-test.yml'
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'qemu/gen-vm'
      - '.github/workflows/ansible-setup-test.yml'

jobs:

  syntax-check:
    name: ansible-syntax-check
    runs-on: ubuntu-latest
    container: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:august-11-2026
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1
    - name: Install ansible
      run: apt-get update -qq && apt-get install -y -qq ansible python3-pip
    - name: Cache Ansible collections
      uses: actions/cache@v4
      with:
        path: ~/.ansible/collections
        key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
    - name: Install sbates130272.batesste collection
      run: ansible-galaxy collection install --pre -r ansible/requirements.yml
    - name: Syntax-check vm-setup playbook
      run: ansible-playbook --syntax-check playbooks/vm-setup.yml
      working-directory: ansible
    - name: Syntax-check vm-rocm-setup playbook
      run: ansible-playbook --syntax-check playbooks/vm-rocm-setup.yml
      working-directory: ansible

  gen-vm-ansible-setup:
    name: gen-vm-ansible-setup
    needs: syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install packages
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          qemu-system-x86 qemu-utils cloud-image-utils ansible \
          openssh-client python3-pip
    - name: Install jmespath for Ansible json_query filter
      run: |
        py=$(sed -n '1s/^#! *//p' "$(command -v ansible-playbook)" | awk '{print $1}')
        "${py}" -m pip install --break-system-packages jmespath
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-qemu-tool-${{ hashFiles('qemu/pyproject.toml') }}
    - name: Install qemu-tool
      run: pip install --break-system-packages -e ./qemu
    - name: Generate SSH key-pair
      run: mkdir -p "$HOME/.ssh" && ssh-keygen -t rsa -q -f "$HOME/.ssh/id_rsa" -N ""
    - name: Prepare GnuPG directory for git_setup
      run: mkdir -p "$HOME/.gnupg"
    - name: Cache cloud image
      uses: actions/cache@v4
      with:
        path: images/*-server-cloudimg-*.img
        key: cloud-img-amd64-noble-ansible
    - name: Cache Ansible collections
      uses: actions/cache@v4
      with:
        path: ~/.ansible/collections
        key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
    - name: Ensure images directory exists
      run: mkdir -p images
    - name: Generate VM with Ansible post-setup
      run: |
        qemu-tool gen-vm \
          --vm-name ansible-setup-test \
          --release noble \
          --username ubuntu \
          --password password \
          --packages none \
          --size 8 \
          --ansible-profile ansible/profiles/vm-setup
      env:
        ANSIBLE_EXTRA_ARGS: '-e {"git_setup_enable_gpg_signing":false,"user_setup_dotfiles_enable":false,"user_setup_install_amd_ca":false}'
    - name: Boot VM as background task
      run: |
        qemu-tool run-vm --vm-name ansible-setup-test > run-vm-output.log 2>&1 &
    - name: Wait for VM to boot (180s timeout)
      run: |
        echo "Waiting for VM to accept SSH..."
        timeout=180
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@localhost true 2>/dev/null; then
            echo "✓ VM ready after $elapsed seconds"
            exit 0
          fi
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "✗ VM failed to boot within $timeout seconds"
        exit 1
    - name: Output run-vm log on failure
      if: failure()
      run: cat qemu/run-vm-output.log
    - name: Verify user_setup copied SSH key
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost test -f .ssh/id_rsa
        echo "✓ user_setup SSH key present in guest"
    - name: Verify fave_packages installed fio
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost \
          "dpkg-query -W -f='\${Status}' fio" \
          | grep -q 'install ok installed'
        echo "✓ fave_packages installed fio in guest"
    - name: Verify git_setup configured git identity
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost \
          git config --global user.name \
          | grep -q 'Stephen Bates'
        echo "✓ git_setup configured git user.name in guest"
