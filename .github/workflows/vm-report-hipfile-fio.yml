name: qemu-minimal - vm-report-hipfile-fio

# Measures fio's libhipfile ioengine against a rocjitsu guest's NVMe.
#
# Its own lane rather than a third benchmark inside vm-report-rocjitsu because
# it is a different question: that lane measures a hand-written hipFile client,
# this one measures the engine fio ships, built from a pinned master commit.
# Keeping them apart means a fio-side regression cannot take the GEMM and
# hipFile badges down with it, and the two can move on separate schedules.

on:
  push:
    branches:
      - main
    paths:
      - 'ansible/playbooks/vm-rocjitsu.yml'
      - 'ansible/playbooks/roles/**'
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - 'qemu/compose/vfio-user-rocjitsu-vm/**'
      - 'scripts/generate-vm-report.sh'
      - 'scripts/vm-report/fio-hipfile-bench.sh'
      - '.github/actions/setup-vm-job/action.yml'
      - '.github/workflows/vm-report-hipfile-fio.yml'
      - '.github/workflows/publish-pages.yml'
  # Offset from vm-report-rocjitsu's Monday 04:00 so the two lanes do not
  # contend for a KVM-capable runner, and off the hour because every scheduled
  # workflow on the platform asks for :00.
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-report-hipfile-fio
  cancel-in-progress: true

env:
  ROCJITSU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260921.gb3399b3-rocjitsu.8e01a5a
  QEMU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260919.g359579e-qemu11.1.1-vfu.8039244
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  ANSIBLE_EXTRA_ARGS: '-e {"git_setup_enable_gpg_signing":false,"user_setup_dotfiles_enable":false,"user_setup_install_amd_ca":false}'

jobs:
  generate-hipfile-fio-report:
    name: generate-vm-report-hipfile-fio
    runs-on: ubuntu-latest
    # 30 minutes over the rocjitsu lane: same bring-up, plus an in-guest fio
    # build from source.
    timeout-minutes: 180
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260919.g359579e-qemu11.1.1-vfu.8039244
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    - name: Set up VM job
      uses: ./.github/actions/setup-vm-job
      with:
        cloud-image-key: hipfile-fio-report
        release: resolute
        stage-src: 'true'

    - name: Pull CI images
      run: |
        docker pull "$ROCJITSU_IMAGE"
        docker pull "$QEMU_IMAGE"

    - name: Generate VM with vm-rocjitsu playbook
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        qemu-tool gen-vm \
          --vm-name hipfile-fio-report \
          --release resolute \
          --username ubuntu \
          --password password \
          --packages none \
          --size 64 \
          --ansible-playbook ansible/playbooks/vm-rocjitsu.yml

    - name: Bring up rocjitsu compose stack
      working-directory: qemu/compose/vfio-user-rocjitsu-vm
      env:
        VM_NAME: hipfile-fio-report
        QEMU_TOOL_SRC: /var/lib/qemu-tool/src
        VM_VCPUS: "4"
        VM_VMEM: "4096"
        VM_SHM_SIZE: "5g"
        VM_NVME: "1"
      run: |
        docker compose up --detach
        echo "Compose stack started"

    - name: Join the compose network
      run: docker network connect vfio-user-rocjitsu-vm_default "$(cat /etc/hostname)"

    - name: Wait for rocjitsu server healthy
      working-directory: qemu/compose/vfio-user-rocjitsu-vm
      run: |
        for i in $(seq 1 30); do
          health=$(docker compose ps --format json rocjitsu \
            | python3 -c "import sys,json; s=json.load(sys.stdin); print(s.get('Health',''))" \
            2>/dev/null || true)
          [ "$health" = "healthy" ] && break
          sleep 2
        done
        [ "$health" = "healthy" ] || (docker compose logs rocjitsu && exit 1)
        echo "rocjitsu server healthy"

    - name: Wait for VM SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@qemu true 2>/dev/null; then
            echo "VM ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM failed to boot in time"
        exit 1

    - name: Load amdgpu via amdgpu-probe
      timeout-minutes: 5
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          -p 2222 ubuntu@qemu "sudo -n timeout 120 /usr/local/bin/amdgpu-probe"
        echo "✓ amdgpu-probe completed"

    - name: Generate hipFile fio report
      env:
        REPORT_HIPFILE_FIO_BENCH: "1"
      run: bash scripts/generate-vm-report.sh site/hipfile-fio 2222 ubuntu "hipFile fio VM" qemu

    - name: Show compose logs on failure
      if: failure()
      working-directory: qemu/compose/vfio-user-rocjitsu-vm
      run: docker compose logs

    - name: Upload the report
      uses: actions/upload-artifact@v4
      with:
        name: vm-report-hipfile-fio
        path: site/hipfile-fio/
        if-no-files-found: error
