name: qemu-minimal - Report for quickstart

# The README's Quick Start, run daily.
#
# WHAT THIS LANE IS FOR. It is the only lane that executes the documented
# fast path end to end: pull the published ernic-rocjitsu qcow2, generate a
# two-VM stack from qemu/env/quickstart, boot it with Prometheus and Grafana
# beside it, and prove both emulated devices with one test each. Every other
# lane here either bakes its own guest with Ansible (the vm-* report lanes,
# ~50 minutes of gen-vm) or builds an 11 GB container first
# (report-for-lmcache), so none of them would notice the quickstart breaking.
#
# It runs `qemu-tool quick-start`, the same command the README tells a human
# to run, with the same settings file. That is deliberate and worth keeping:
# a documented path nothing executes rots, and a lane that executes something
# else proves nothing about the documentation. This used to be a shell script
# under scripts/; it is gone, and the subcommand is the one implementation.
#
# WHAT IT ASSERTS, beyond the two tests passing: that the NIC's own byte
# counter moved. A passing ib_send_bw proves the verbs worked; only
# total_bytes_sent moving proves the bytes crossed the mesh.
#
# It also asserts what qemu-tool reports about the guests while they are up --
# the NVMe, the disk, the GPU, the verified SSH key and the login -- because
# every one of those fields fails to a plausible placeholder rather than to an
# error. See scripts/check-vm-devices.sh.
#
# SIZING. The guests are now sized from the host by DEFAULT rather than under
# a flag, so this lane passes no sizing argument at all: what it exercises is
# what a human gets. A GitHub runner is smaller than any host a human runs
# this on, and 4 vCPU is the ionic_rdma floor, so a 4-core runner gets two
# 4-vCPU guests and is 2x oversubscribed against the mesh manager's untunable
# 20 s heartbeat. Treat a first red run as that (AGENTS.md issue 14), not as
# a regression in what it tests.
#
# NON-INTERACTIVE. `quick-start` prompts, and takes the default answer to
# every prompt when stdin is not a terminal -- which it is not here. --yes is
# passed anyway, so the lane does not depend on how the runner happens to
# wire stdin, and so a reader can see the choice rather than infer it.

on:
  push:
    branches:
      - main
    paths:
      - 'qemu/qemu-tool/quick_start.py'
      - 'scripts/check-vm-devices.sh'
      - 'qemu/env/quickstart'
      - 'ansible/playbooks/fleet-quickstart.yml'
      - 'ansible/playbooks/roles/lmcache_guest/tasks/amdgpu_firmware.yml'
      - 'ansible/playbooks/roles/lmcache_guest/tasks/netplan_ernic.yml'
      - 'ansible/playbooks/roles/rocjitsu_gpu_test/files/vector_add.hip'
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - '.github/workflows/qemu-minimal-report-for-quickstart.yml'
      - '.github/workflows/qemu-minimal-publish-pages.yml'
  # Daily, and deliberately not in the 08:00 block the four vm-* lanes share:
  # this one boots two guests and publish-pages would be assembling four other
  # reports at the same time.
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-report-quickstart
  cancel-in-progress: true

env:
  ENV_FILE: qemu/env/quickstart
  STACK_DIR: /var/lib/qemu-tool/stacks/quickstart
  KEY_DIR: /var/lib/qemu-tool/quickstart-key

jobs:
  generate-quickstart-report:
    name: Report for quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261014.geea0485-qemu11.1.2-vfu.8039244
      # /var/lib/qemu-tool is bind-mounted from the host at the same path so
      # the qcow2 pulled in here is the file the sibling qemu containers open:
      # compose bind mounts are resolved by the host docker daemon, not in
      # this container.
      #
      # --pid=host is what lets the device checks below see anything at all:
      # qemu-tool list and inspect enumerate /proc, and the QEMU processes run
      # in SIBLING containers. Without it both commands print an empty table
      # and exit 0, which is the exact false green those checks exist to
      # catch.
      options: >-
        --device /dev/kvm
        --pid=host
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    # quick-start checks this too, in its preflight. Repeated here so a
    # runner without working KVM fails in two seconds with a named cause
    # rather than inside a pull.
    - name: Verify KVM is available
      run: |
        test -c /dev/kvm
        python3 -I -c "import fcntl, os; assert fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00, 0) >= 0; print('KVM usable')"

    # The guest qcow2 is ~17 GB compressed and decompresses to about the same
    # again. A stock runner does not have that on / without help -- this is
    # where report-for-lmcache ran out of disk, with a bare zstd "No space
    # left on device" that named nothing.
    # Run the stack as a non-root user, not as the job's root. See the
    # action: a root caller resolves CONTAINER_USER to 0:0 and proves
    # root-with-no-capabilities, which is not the configuration an operator
    # has. The workspace is in the chown list because this lane writes its
    # report into it and the checkout is root-owned.
    - name: Run the stack as a non-root user
      uses: ./.github/actions/nonroot-user
      with:
        # The subdirectories too, not just the root: chown -R only
        # reaches what exists, and a later root step that mkdir -p's
        # a missing one owns it.
        chown: >-
          /var/lib/qemu-tool
          /var/lib/qemu-tool/images
          /var/lib/qemu-tool/stacks
          ${{ github.workspace }}

    # These lanes drive the stack with PLAIN `docker compose` in places --
    # the `ps` after `up`, and the logs-on-failure path -- and plain compose
    # cannot resolve CONTAINER_USER from the caller the way qemu-tool does.
    # Without this the committed stack's `${CONTAINER_USER:?}` refuses
    # outright, which on the failure path would cost exactly the logs that
    # explain the failure.
    #
    # The value must match the uid the overlays were created as, so it is
    # derived from the action's rather than written out again.
    #
    # pr-quickstart-boot deliberately does NOT do this: it uses qemu-tool
    # throughout, so leaving the variable unset is what tests that
    # compose._caller_identity() resolves it.
    - name: Let plain docker compose see the same uid
      run: echo "CONTAINER_USER=$CIUSER_UID:$CIUSER_UID" >> "$GITHUB_ENV"


    - name: Free disk space
      run: |
        df -h /
        rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        docker image prune -af || true
        df -h /

    # --force and PIPX_BIN_DIR, because the CI image already ships a
    # qemu-tool at /usr/local/bin that wins on PATH -- so a plain install
    # succeeds and every gen-vm and gen-compose below still runs the IMAGE's
    # copy, which is a different build calling itself the same version. Assert
    # it rather than trusting the version string.
    #
    # Asserting `quick-start` exists is not belt-and-braces either: the
    # image's qemu-tool predates the subcommand, so a shadowed install fails
    # here with "invalid choice" rather than running the wrong quickstart.
    - name: Install qemu-tool
      run: |
        set -eu
        PIPX_BIN_DIR=/usr/local/bin pipx install --force ./qemu
        RESOLVED=$(readlink -f "$(command -v qemu-tool)")
        echo "qemu-tool resolves to: $RESOLVED"
        case "$RESOLVED" in
          /opt/qemu-tool/*)
            echo "::error::the image's qemu-tool is shadowing the one just installed"
            exit 1
            ;;
        esac
        qemu-tool quick-start --help >/dev/null

    - name: Install collections
      run: ansible-galaxy collection install --no-deps -r ansible/requirements.yml

    # The same command the README documents, split at the one point a CI run
    # differs from a human one: the guests are published on HOST ports, which
    # this job container cannot reach -- the runner puts it on its own bridge
    # and `--network` is not available in container.options. So join the
    # fleet network between the two halves and address the guests on it.
    - name: Fetch the guest image and bring the stack up
      run: |
        setpriv --reuid "$CIUSER_UID" --regid "$CIUSER_UID" --init-groups \
          env HOME="$CIUSER_HOME" \
          qemu-tool quick-start up \
            --env-file "$ENV_FILE" \
            --stack-dir "$STACK_DIR" \
            --key-dir "$KEY_DIR" \
            --in-network \
            --yes

    - name: Join the fleet network
      run: docker network connect quickstart_fleet "$(cat /etc/hostname)"

    - name: Configure the guests, run the tests and write the report
      run: |
        setpriv --reuid "$CIUSER_UID" --regid "$CIUSER_UID" --init-groups \
          env HOME="$CIUSER_HOME" \
          qemu-tool quick-start test \
            --env-file "$ENV_FILE" \
            --stack-dir "$STACK_DIR" \
            --key-dir "$KEY_DIR" \
            --report-dir site/quickstart \
            --in-network \
            --yes

    # Prometheus and Grafana are part of the documented quickstart now, so a
    # lane that never looked at them would publish a green report about a
    # stack half of which had not started. Asked of the containers rather
    # than of compose: `compose ps` reports a service that exited as absent
    # rather than as failed, and Prometheus crash-looping on an unwritable
    # TSDB is exactly the failure the data-directory choice exists to avoid.
    - name: Check the monitoring sidecars
      run: |
        set -eu
        for svc in prometheus grafana; do
          state=$(docker inspect -f '{{.State.Status}}' "quickstart-${svc}-1")
          echo "${svc}: ${state}"
          [ "$state" = running ] || {
            echo "::error::${svc} is ${state}, not running"
            docker logs --tail 50 "quickstart-${svc}-1" || true
            exit 1
          }
        done
        # Prometheus is only useful if it is actually scraping the ernic
        # exporter. An up-but-scraping-nothing Prometheus is the quiet
        # version of this failing.
        docker exec quickstart-prometheus-1 \
          wget -q -O- 'http://127.0.0.1:9090/api/v1/query?query=up' \
          | grep -q '"status":"success"' || {
            echo "::error::Prometheus answered no query"
            exit 1
          }

    # Here and not at the end: the guests are only booted between the step
    # above and "Take the stack down", and the whole point is to ask a LIVE
    # guest what it has. Deliberately not `if: always()` for the same reason.
    #
    # Every field checked here degrades to a plausible placeholder rather than
    # to an error -- "-", no Disk line, "configured default, unverified",
    # "unknown" -- so the checks demand the positive value. Roughly 2 s: four
    # qemu-tool invocations, each one docker exec per VM.
    - name: Check the reported devices
      run: |
        set -eu
        NET=$(sed -n 's/^FLEET_NET_PREFIX=//p' "$ENV_FILE" | tail -1)
        GUEST_USER=$(sed -n 's/^VM_USERNAME=//p' "$ENV_FILE" | tail -1)
        # The image beats the settings file on who exists in it, the same way
        # quick-start's _adopt_login does -- it has already pulled
        # vm-info.json here as part of the keypair referrer. Without this the
        # check logs in as whoever the settings file names, which is how this
        # lane went red against guests that were entirely healthy.
        FROM_IMAGE=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("username") or "")' \
            "${KEY_DIR}/vm-info.json" 2>/dev/null || true)
        [ -n "$FROM_IMAGE" ] && GUEST_USER=$FROM_IMAGE
        PREFIX=$(sed -n 's/^VM_NAME_PREFIX=//p' "$ENV_FILE" | tail -1)

        # Nothing else in this lane holds an SSH session open: Ansible closes
        # its connections and the RDMA test runs as a transient systemd unit,
        # which is not a login session. These guests have no /var/run/utmp, so
        # the Login line comes from logind session files and is only non-empty
        # while somebody is actually logged in -- hence this one, held for the
        # length of the check.
        # -tt, so the session gets a pty: that is what makes it visible to
        # both sources inspect reads, utmp and logind, rather than only one.
        ssh -i "${KEY_DIR}/id_rsa" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            -p 2222 -tt "${GUEST_USER}@${NET}.3.1" "sleep 120" \
            >/tmp/devcheck-ssh.log 2>&1 &
        SSH_PID=$!
        trap 'kill "$SSH_PID" 2>/dev/null || true' EXIT
        sleep 5
        kill -0 "$SSH_PID" 2>/dev/null || {
          # -p 2222 is not optional, and its absence is why this step had
          # never once run to completion: each guest's sshd is published on
          # 2222 INSIDE its own container's network namespace, so without the
          # flag this connected to port 22 of the qemu container, where
          # nothing listens. report-for-lmcache learned the same thing and
          # says so above its own wait loop.
          #
          # The ssh output is kept rather than sent to /dev/null, because
          # "did not stay up" describes a guest that never booted, a wrong
          # account and a closed port identically -- which is exactly what
          # made this failure take a second run to read.
          echo "::error::the background SSH session to guest 1 did not stay up"
          echo "--- ssh output ---"
          cat /tmp/devcheck-ssh.log 2>/dev/null || echo "(no output captured)"
          exit 1
        }

        # The adopted account has to reach qemu-tool as well, not just this
        # step's ssh. `inspect` verifies the key by reading THAT USER's
        # authorized_keys over the guest agent, and it learns the user from
        # the settings layers -- so with only $ENV_FILE it looked under
        # /home/ubuntu on a guest whose account is batesste, found nothing,
        # and reported ssh_key_source None, which --strict-key correctly
        # refused. quick-start writes the adopted name to env.image-login
        # beside the stack for exactly this.
        set -- --env-file "$ENV_FILE"
        [ -f "${STACK_DIR}/env.image-login" ] &&
          set -- "$@" --env-file "${STACK_DIR}/env.image-login"

        scripts/check-vm-devices.sh "$@" \
          --gpu gfx1250 --strict-key --login "$GUEST_USER" "${PREFIX}-1"
        # Guest 2 has the same devices but no session of its own, so its
        # Login check is only "logind answered" -- see the script.
        scripts/check-vm-devices.sh "$@" \
          --gpu gfx1250 --strict-key "${PREFIX}-2"

    - name: Show logs on failure
      if: failure()
      run: |
        cd "$STACK_DIR" 2>/dev/null || {
          echo "stack directory absent; the run failed before it was created"
          exit 0
        }
        docker compose --project-name quickstart \
          --env-file "${GITHUB_WORKSPACE}/${ENV_FILE}" --profile metrics \
          logs --tail 100 || true

    - name: Take the stack down
      if: always()
      run: |
        qemu-tool quick-start down \
          --stack-dir "$STACK_DIR" \
          --env-file "$ENV_FILE" \
          --yes || true

    # Upload only, and on success only. publish-pages.yml is the sole writer
    # of the site, and it fetches each lane's latest artifact BY NAME -- it
    # cannot tell a failed run's debris from a good report, so a failed run
    # must upload nothing. Diagnostics belong in the run log above.
    - name: Upload the report
      uses: actions/upload-artifact@v4
      with:
        name: vm-report-quickstart
        path: site/quickstart/
        if-no-files-found: error
