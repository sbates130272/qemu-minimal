name: qemu-minimal - Report for quickstart

# The README's Quick Start, run daily.
#
# WHAT THIS LANE IS FOR. It is the only lane that executes the documented
# fast path end to end: pull the published ernic-rocjitsu qcow2, generate a
# two-VM stack from qemu/env/quickstart, boot it, and prove both emulated
# devices with one test each. Every other lane here either bakes its own
# guest with Ansible (the vm-* report lanes, ~50 minutes of gen-vm) or builds
# an 11 GB container first (report-for-lmcache), so none of them would notice
# the quickstart breaking.
#
# It runs scripts/quickstart-2vm.sh, the same script the README tells a human
# to run, with the same settings file. That is deliberate and worth keeping:
# a documented path nothing executes rots, and a lane that executes something
# else proves nothing about the documentation.
#
# WHAT IT ASSERTS, beyond the two tests passing: that the NIC's own byte
# counter moved. A passing ib_send_bw proves the verbs worked; only
# total_bytes_sent moving proves the bytes crossed the mesh.
#
# SIZING. A GitHub runner is smaller than any host a human runs this on, so
# --size-from-host derives the guest sizes from it -- but 4 vCPU is the
# ionic_rdma floor, so a 4-core runner gets two 4-vCPU guests and is 2x
# oversubscribed against the mesh manager's untunable 20 s heartbeat. Treat a
# first red run as that (AGENTS.md issue 14), not as a regression in what it
# tests.

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/quickstart-2vm.sh'
      - 'qemu/env/quickstart'
      - 'ansible/playbooks/fleet-quickstart.yml'
      - 'ansible/playbooks/roles/lmcache_guest/tasks/amdgpu_firmware.yml'
      - 'ansible/playbooks/roles/lmcache_guest/tasks/netplan_ernic.yml'
      - 'ansible/playbooks/roles/rocjitsu_gpu_test/files/vector_add.hip'
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - '.github/workflows/qemu-minimal-report-for-quickstart.yml'
      - '.github/workflows/qemu-minimal-publish-pages.yml'
  # Daily, and deliberately not in the 08:00 block the four vm-* lanes share:
  # this one boots two guests and publish-pages would be assembling four other
  # reports at the same time.
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-report-quickstart
  cancel-in-progress: true

env:
  ENV_FILE: qemu/env/quickstart
  STACK_DIR: /var/lib/qemu-tool/stacks/quickstart
  KEY_DIR: /var/lib/qemu-tool/quickstart-key

jobs:
  generate-quickstart-report:
    name: Report for quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261014.geea0485-qemu11.1.2-vfu.8039244
      # /var/lib/qemu-tool is bind-mounted from the host at the same path so
      # the qcow2 pulled in here is the file the sibling qemu containers open:
      # compose bind mounts are resolved by the host docker daemon, not in
      # this container.
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    # The script checks this too. Repeated here so a runner without working
    # KVM fails in two seconds with a named cause rather than inside a pull.
    - name: Verify KVM is available
      run: |
        test -c /dev/kvm
        python3 -I -c "import fcntl, os; assert fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00, 0) >= 0; print('KVM usable')"

    # The guest qcow2 is ~17 GB compressed and decompresses to about the same
    # again. A stock runner does not have that on / without help -- this is
    # where report-for-lmcache ran out of disk, with a bare zstd "No space
    # left on device" that named nothing.
    - name: Free disk space
      run: |
        df -h /
        rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        docker image prune -af || true
        df -h /

    # --force and PIPX_BIN_DIR, because the CI image already ships a
    # qemu-tool at /usr/local/bin that wins on PATH -- so a plain install
    # succeeds and every gen-vm and gen-compose below still runs the IMAGE's
    # copy, which is a different build calling itself the same version. Assert
    # it rather than trusting the version string.
    - name: Install qemu-tool
      run: |
        set -eu
        PIPX_BIN_DIR=/usr/local/bin pipx install --force ./qemu
        RESOLVED=$(readlink -f "$(command -v qemu-tool)")
        echo "qemu-tool resolves to: $RESOLVED"
        case "$RESOLVED" in
          /opt/qemu-tool/*)
            echo "::error::the image's qemu-tool is shadowing the one just installed"
            exit 1
            ;;
        esac

    - name: Install collections
      run: ansible-galaxy collection install --no-deps -r ansible/requirements.yml

    # The same script the README documents, split at the one point a CI run
    # differs from a human one: the guests are published on HOST ports, which
    # this job container cannot reach -- the runner puts it on its own bridge
    # and `--network` is not available in container.options. So join the
    # fleet network between the two halves and address the guests on it.
    - name: Fetch the guest image and bring the stack up
      run: |
        scripts/quickstart-2vm.sh \
          --env-file "$ENV_FILE" \
          --stack-dir "$STACK_DIR" \
          --key-dir "$KEY_DIR" \
          --size-from-host \
          --in-network \
          up

    - name: Join the fleet network
      run: docker network connect quickstart_fleet "$(cat /etc/hostname)"

    - name: Configure the guests, run the tests and write the report
      run: |
        scripts/quickstart-2vm.sh \
          --env-file "$ENV_FILE" \
          --stack-dir "$STACK_DIR" \
          --key-dir "$KEY_DIR" \
          --report-dir site/quickstart \
          --in-network \
          test

    - name: Show logs on failure
      if: failure()
      run: |
        cd "$STACK_DIR" 2>/dev/null || {
          echo "stack directory absent; the run failed before it was created"
          exit 0
        }
        docker compose --project-name quickstart \
          --env-file "${GITHUB_WORKSPACE}/${ENV_FILE}" logs --tail 100 || true

    - name: Take the stack down
      if: always()
      run: |
        scripts/quickstart-2vm.sh --stack-dir "$STACK_DIR" \
          --env-file "$ENV_FILE" down || true

    # Upload only, and on success only. publish-pages.yml is the sole writer
    # of the site, and it fetches each lane's latest artifact BY NAME -- it
    # cannot tell a failed run's debris from a good report, so a failed run
    # must upload nothing. Diagnostics belong in the run log above.
    - name: Upload the report
      uses: actions/upload-artifact@v4
      with:
        name: vm-report-quickstart
        path: site/quickstart/
        if-no-files-found: error
