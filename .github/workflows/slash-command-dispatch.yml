name: qemu-minimal - slash-command-dispatch

# Listens for slash commands in issue/PR comments from repo collaborators.
# Supported commands:
#   /run-ci-full  — trigger every ansible-playbook-test-* workflow on the PR
#                   branch (or main)

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write
  pull-requests: write

jobs:

  run-ci-full:
    name: /run-ci-full
    if: |
      github.event.comment.body == '/run-ci-full' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
    - name: Resolve target branch
      id: branch
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: |
          if (context.payload.issue.pull_request) {
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            return pr.data.head.ref;
          }
          return context.payload.repository.default_branch;

    - name: Trigger the ansible-playbook-test workflows
      uses: actions/github-script@v7
      with:
        script: |
          const workflows = [
            'ansible-playbook-test-rocm.yml',
            'ansible-playbook-test-ernic.yml',
            'ansible-playbook-test-rocjitsu.yml',
            'ansible-playbook-test-ernic-rocjitsu.yml',
          ];
          for (const workflow_id of workflows) {
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              ref: '${{ steps.branch.outputs.result }}',
            });
          }

    - name: Post acknowledgement comment
      uses: actions/github-script@v7
      with:
        script: |
          const branch = '${{ steps.branch.outputs.result }}';
          const profiles = ['rocm', 'ernic', 'rocjitsu', 'ernic-rocjitsu'];
          const links = profiles.map((p) =>
            `[${p}](https://github.com/${context.repo.owner}/${context.repo.repo}` +
            `/actions/workflows/ansible-playbook-test-${p}.yml)`
          ).join(' · ');
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.issue.number,
            body: `Full CI triggered on \`${branch}\`. View runs: ${links}`,
          });
