name: qemu-minimal - Image Tag Consistency Check

# Every batesste-ci-images tag in workflow files, compose stacks and fleet files
# must share the same YYYYMMDD.gHASH stamp. A tag bump that
# updates a fleet file but forgets a workflow's container.image: (or vice versa) ships
# a mismatched image in CI; this check makes the failure visible on the PR.
#
# The SDXI server image is the one exception. It follows the guest's
# sdxi_source_pin by commit (tests/test_playbook_pins.py), not the fleet's
# stamp, so a ref whose tag carries -sdxi.<sha> is left out of the comparison
# and checked only for naming one tag everywhere.
#
# QEMU and the ernic server are the fork images (sbates-fork) everywhere:
# every fleet file, every generated stack, every workflow's QEMU_IMAGE and
# ERNIC_IMAGE and every job container. The fork QEMU is what lets one
# vfio-user device DMA into another's BAR. They are in the fleet files beside
# rocjitsu, which gen-compose holds to one stamp with them, so there is one
# stamp to check and not a second for the fork. A ref to the stock QEMU or
# ernic image (the same repository names without -sbates-fork) is an error:
# a lane left on it tests a QEMU no stack runs.
#
# The guest image, <backing-ref>, is not a batesste-ci-images ref and is in
# none of those counts: qemu-minimal publishes it, under its own stamp. Its
# check is the last one below. Every fleet file names one guest, the same
# one, in the repository rocm-golden.xml's <publish-ref> names, by the dated
# tag of one publish; "latest" and qm.<sha7> move, and are refused. Whether
# that guest matches the servers is a question of pins at its bake commit,
# which tests/test_playbook_pins.py answers in Gen Compose Check.
#
# What is searched: all files under .github/workflows/, .github/actions/,
# qemu/compose/ (the generated stacks) and qemu/stacks/ (the fleet files they
# are generated from).
# Markdown files are excluded: docs and CHANGELOG reference old tags by design.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  image-tag-consistency:
    name: Image Tag Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Check batesste-ci-images stamps are consistent
        run: |
          SEARCH_DIRS=".github/workflows/ .github/actions/ qemu/compose/ qemu/stacks/"
          # A directory that has moved would otherwise just stop being
          # searched: grep's complaint goes to /dev/null below.
          for dir in $SEARCH_DIRS; do
            [ -d "$dir" ] || { echo "::error::$dir does not exist"; exit 1; }
          done

          # Extract every ref, then split two ways: the SDXI server (its
          # tag carries -sdxi.<sha>) and the rest, fork images included.
          REF_RE='batesste-ci-images[^:]*:[0-9]{8}\.g[a-f0-9]+[A-Za-z0-9._-]*'
          SDXI_RE='-sdxi\.[a-f0-9]+'
          all_refs=$(grep -rEoh "$REF_RE" $SEARCH_DIRS 2>/dev/null || true)

          sdxi_tags=$(echo "$all_refs" | grep -E -- "$SDXI_RE" |
            sed 's/^[^:]*://' | sort -u)
          # The SPDK NVMe server is exempt too: it is held to QEMU's
          # libvfio-user (vfu.<sha>) at render time and in the unit tests.
          SPDK_RE='-spdk\.[a-f0-9]+'
          stamped_refs=$(echo "$all_refs" | grep -vE -- "$SDXI_RE" |
            grep -vE -- "$SPDK_RE" || true)
          stamps=$(echo "$stamped_refs" |
            grep -oE '[0-9]{8}\.g[a-f0-9]+' | sort -u)

          fail=0

          # --- one stamp ---
          stamp_count=$(echo "$stamps" | grep -c . || true)
          if [ "$stamp_count" -eq 0 ]; then
            echo "::error::No batesste-ci-images refs found — search paths may be wrong"
            exit 1
          fi
          echo "Image stamps ($stamp_count distinct):"
          echo "$stamps"
          if [ "$stamp_count" -gt 1 ]; then
            echo "" >&2
            echo "::error::Images have $stamp_count stamps (expected 1). Files per stamp:" >&2
            echo "$stamps" | while IFS= read -r s; do
              echo "  $s:" >&2
              grep -rEn "$REF_RE" $SEARCH_DIRS 2>/dev/null |
                grep "$s" |
                grep -vE -- "$SDXI_RE" | grep -vE -- "$SPDK_RE" |
                sed 's/^/    /' >&2
            done
            fail=1
          else
            echo "OK: all refs on stamp $stamps"
          fi

          # --- QEMU and the ernic server are the fork's ---
          # The name is the repository's whole last component, so the fork's
          # own name, which continues with -sbates-fork, does not match.
          STOCK_RE='batesste-ci-images-ubuntu-(qemu-libvfio-user|rocm-ernic):'
          FORK_RE='batesste-ci-images-ubuntu-(qemu-libvfio-user|rocm-ernic)-sbates-fork:'
          if grep -rEn "$STOCK_RE" $SEARCH_DIRS; then
            echo "::error::A stock QEMU or ernic image is named above; every stack, workflow and job container uses the sbates-fork pair"
            fail=1
          fi
          fork_refs=$(grep -rEoh "${FORK_RE}[A-Za-z0-9._-]+" $SEARCH_DIRS | sort -u)
          fork_count=$(echo "$fork_refs" | grep -c . || true)
          if [ "$fork_count" -ne 2 ]; then
            echo "::error::Expected one fork QEMU tag and one fork ernic tag everywhere, found $fork_count:" >&2
            echo "$fork_refs" | sed 's/^/    /' >&2
            fail=1
          else
            echo "OK: QEMU and the ernic server are the fork pair everywhere:"
            echo "$fork_refs" | sed 's/^/    /'
          fi
          for fleet in qemu/stacks/*.xml; do
            for element in qemu-ref ernic-ref; do
              if ! grep -qE "<$element>[^<]*${FORK_RE}[^<]+</$element>" "$fleet"; then
                echo "::error file=$fleet::<$element> does not name the sbates-fork image"
                fail=1
              fi
            done
          done

          # --- SDXI server image ---
          sdxi_count=$(echo "$sdxi_tags" | grep -c . || true)
          if [ "$sdxi_count" -eq 0 ]; then
            echo "::error::No SDXI server image ref found — the fleet files name one"
            fail=1
          elif [ "$sdxi_count" -gt 1 ]; then
            echo "" >&2
            echo "::error::SDXI server refs name $sdxi_count tags (expected 1):" >&2
            grep -rEn "$REF_RE" $SEARCH_DIRS 2>/dev/null |
              grep -E -- "$SDXI_RE" | sed 's/^/    /' >&2
            fail=1
          else
            echo "OK: all SDXI server refs on tag $sdxi_tags (follows sdxi_source_pin, not the fleet stamp)"
          fi

          # --- guest image ---
          publish_ref=$(sed -n 's|.*<publish-ref>\([^<]*\)</publish-ref>.*|\1|p' \
            qemu/stacks/rocm-golden.xml)
          if [ -z "$publish_ref" ]; then
            echo "::error::qemu/stacks/rocm-golden.xml names no <publish-ref>"
            exit 1
          fi
          guest_refs=""
          for fleet in qemu/stacks/*.xml; do
            refs=$(sed -n 's|.*<backing-ref>\([^<]*\)</backing-ref>.*|\1|p' "$fleet")
            if [ "$(echo "$refs" | grep -c .)" -ne 1 ]; then
              echo "::error file=$fleet::expected one <backing-ref>, found: ${refs:-none}"
              fail=1
              continue
            fi
            guest_refs="$guest_refs$refs"$'\n'
            case "$refs" in
              "$publish_ref":*) tag="${refs#"$publish_ref":}" ;;
              *)
                echo "::error file=$fleet::<backing-ref> $refs is not a tag of $publish_ref"
                fail=1
                continue ;;
            esac
            if ! echo "$tag" | grep -qxE '[0-9]{8}\.g[0-9a-f]{7}'; then
              echo "::error file=$fleet::<backing-ref> tag '$tag' is not a dated tag (YYYYMMDD.g<sha7>); latest and qm.<sha7> move"
              fail=1
            fi
          done
          guest_count=$(echo "$guest_refs" | sort -u | grep -c . || true)
          if [ "$guest_count" -gt 1 ]; then
            echo "::error::The fleet files pull $guest_count different guests (expected 1):" >&2
            echo "$guest_refs" | sort -u | grep . | sed 's/^/    /' >&2
            fail=1
          elif [ "$guest_count" -eq 1 ]; then
            echo "OK: every fleet file pulls $(echo "$guest_refs" | sort -u | grep .)"
          fi
          # The image the fleet files pulled before this repository published
          # its own. Nothing committed may still name it. The name is put
          # together here so that this file does not match itself.
          old_guest='batesste-ci-images-ubuntu-''qcow2'
          if grep -rn "$old_guest" $SEARCH_DIRS; then
            echo "::error::A batesste-ci-images guest image is still named above"
            fail=1
          fi

          exit $fail
