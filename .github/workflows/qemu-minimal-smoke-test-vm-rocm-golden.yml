name: qemu-minimal - Smoke Test - vm-rocm-golden

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - 'qemu/compose/**'
      - 'qemu/stacks/**'
      - 'ansible/**'
      - '.github/workflows/qemu-minimal-smoke-test-vm-rocm-golden.yml'
  # Monday only, and ahead of the nightly report lanes: all four of those now
  # fire together at 08:00 and this wants a KVM-capable runner to itself.
  schedule:
    - cron: '7 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ERNIC_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-ernic-sbates-fork:20261112.gdca6903-ernic.90434a2-vfu.3719c3a
  ROCJITSU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20261112.gdca6903-rocjitsu.50be05a
  QEMU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user-sbates-fork:20261112.gdca6903-qemu.4cb9698-vfu.3719c3a
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  # The fleet names its guests <vm-name-prefix>-N.
  VM_PREFIX: rocm-ernic-smoke
  VM1_NAME: rocm-ernic-smoke-1
  VM2_NAME: rocm-ernic-smoke-2
  # Under the shared mount, like the images. The compose project is this
  # directory's basename, rocm-ernic-smoke.
  STACK_DIR: /var/lib/qemu-tool/stacks/rocm-ernic-smoke
  OVERLAY: /var/lib/qemu-tool/stacks/rocm-ernic-smoke.xml

jobs:

  smoke-test-vm-rocm-golden:
    name: Smoke Test - vm-rocm-golden
    runs-on: ubuntu-latest
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user-sbates-fork:20261112.gdca6903-qemu.4cb9698-vfu.3719c3a
      # Provides qemu-system-x86_64 and cloud-image-utils. /var/lib/qemu-tool is
      # bind-mounted from the host at the same path so the qcow2 generated here
      # is the same file the sibling qemu containers open: compose bind-mounts
      # are resolved by the host docker daemon, not in this container.
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    # No package installation step here any more: python3-pip was the only gap
    # in the CI image and it closed at 20260924.ge1cd640, the pin above.

    # Absolute, not "~/.cache/pip": actions/cache expands ~ on the runner and
    # pip expands it in this container, so the restore never reached pip.
    # See .github/actions/setup-vm-job/action.yml.
    - name: Use a fixed pip cache directory
      run: echo "PIP_CACHE_DIR=/var/cache/pip-ci" >> "$GITHUB_ENV"

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: /var/cache/pip-ci
        key: pip-qemu-tool-v2-${{ hashFiles('qemu/pyproject.toml') }}

    - name: Install qemu-tool
      run: pip install --break-system-packages -e ./qemu

    - name: Generate SSH key-pair
      run: |
        mkdir -p "$HOME/.ssh" && ssh-keygen -t rsa -q -f "$HOME/.ssh/id_rsa" -N ""
        # ssh(1) expands ~ from the passwd entry, not $HOME. A container job
        # runs as root with HOME=/github/home, so the default identity would be
        # looked for at /root/.ssh/id_rsa, not found, and never offered.
        [ "$HOME" = /root ] || { rm -rf /root/.ssh && ln -s "$HOME/.ssh" /root/.ssh; }

    - name: Cache cloud image
      uses: actions/cache@v6
      with:
        path: ${{ env.VM_IMAGES_DIR }}/*-server-cloudimg-*.img
        key: cloud-img-amd64-resolute-rocm-ernic-smoke

    - name: Ensure images directory exists
      run: mkdir -p "$VM_IMAGES_DIR" && chmod 777 "$VM_IMAGES_DIR"

    # Same reason as the bind mount above: the compose stack mounts
    # QEMU_TOOL_SRC by host path, and the checkout only exists inside this
    # container. Copy it under the shared mount instead.
    - name: Stage qemu-tool source for the sibling containers
      run: |
        rm -rf /var/lib/qemu-tool/src
        mkdir -p /var/lib/qemu-tool/src
        cp -r qemu /var/lib/qemu-tool/src/

    - name: Generate VM 1
      run: |
        qemu-tool gen-vm \
          --vm-name "$VM1_NAME" \
          --images "$VM_IMAGES_DIR" \
          --release resolute \
          --username ubuntu \
          --password password \
          --packages none \
          --ssh-key-file "$HOME/.ssh/id_rsa.pub" \
          --size 8

    - name: Generate VM 2 from shared backing file
      run: |
        qemu-tool gen-vm \
          --vm-name "$VM2_NAME" \
          --images "$VM_IMAGES_DIR" \
          --backing-file "$VM_IMAGES_DIR/${VM1_NAME}-backing.qcow2"

    - name: Pull CI images
      run: |
        docker pull "$ERNIC_IMAGE"
        docker pull "$ROCJITSU_IMAGE"
        docker pull "$QEMU_IMAGE"
        # Read from the fleet file, which is what the stack below runs.
        docker pull "$(sed -n 's|.*<sdxi-image>\(.*\)</sdxi-image>.*|\1|p' qemu/stacks/rocm-golden.xml)"

    # The two-guest default fleet, pointed at the guests generated above:
    # qemu/stacks/rocm-golden.xml plus an overlay naming them. The device set
    # is the fleet's own, SDXI included: each guest waits on its SDXI server
    # being healthy, though these bare guests carry no driver for it.
    #
    # The guests are sized from the runner rather than taking the fleet's
    # 4 vCPU / 4096 MB, so a larger runner class benefits without another
    # edit here. Deriving it the way upstream's system-tests.yml does.
    #
    # <qemu-tool-src> is a HOST path: compose bind mounts are resolved by the
    # host daemon, hence the copy staged under the shared mount above.
    - name: Size the guests from the runner and render the stack
      env:
        VMS: "2"
      run: |
        HOST_CPUS=$(nproc)
        HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)

        VM_VCPUS=$(( (HOST_CPUS - 1) / VMS ))
        # Four is a floor, not a preference: ionic_lif_size() sets
        # neqs = min(rdma.eq_qtype.qid_count, num_online_cpus()) and
        # ionic_create_rdma_admin() rejects anything below IONIC_EQ_COUNT_MIN
        # (4) with a bare -EINVAL. Oversubscribing the runner is the cheaper
        # problem; starving the guest fails every time.
        if [ "$VM_VCPUS" -lt 4 ]; then VM_VCPUS=4; fi

        # Three quarters of RAM split per guest -- the host keeps the rest.
        VM_VMEM=$(( HOST_MEM_MB * 3 / 4 / VMS ))
        if [ "$VM_VMEM" -gt 8192 ]; then VM_VMEM=8192; fi
        if [ "$VM_VMEM" -lt 1024 ]; then VM_VMEM=1024; fi

        echo "runner: ${HOST_CPUS} vCPU, ${HOST_MEM_MB} MB"
        echo "guests: ${VMS} x ${VM_VCPUS} vCPU, ${VM_VMEM} MB"

        mkdir -p "$(dirname "$OVERLAY")"
        # Guest RAM is a shared memfd, so shm must be at least vm-vmem.
        cat > "$OVERLAY" <<XML
        <?xml version="1.0" encoding="UTF-8"?>
        <!-- Written by qemu-minimal-smoke-test-vm-rocm-golden.yml. Not a settings file anyone runs by hand. -->
        <fleet xmlns="http://qemu-tool/fleet/1.0">
          <vm-count>${VMS}</vm-count>
          <vm-name-prefix>${VM_PREFIX}</vm-name-prefix>
          <vm-images-dir>${VM_IMAGES_DIR}</vm-images-dir>
          <qemu-tool-src>/var/lib/qemu-tool/src</qemu-tool-src>
          <vm-vcpus>${VM_VCPUS}</vm-vcpus>
          <vm-vmem>${VM_VMEM}</vm-vmem>
          <vm-shm-size>$(( VM_VMEM + 1024 ))m</vm-shm-size>
        </fleet>
        XML
        cat "$OVERLAY"
        qemu-tool gen-compose \
          --xml qemu/stacks/rocm-golden.xml --xml "$OVERLAY" \
          --output-dir "$STACK_DIR"
        # The render is what names the disks the guests boot from.
        for vm in "$VM1_NAME" "$VM2_NAME"; do
          grep -q -- "--vm-name \"${vm}\"" "$STACK_DIR/docker-compose.yml"
          test -f "$VM_IMAGES_DIR/${vm}.qcow2"
        done
        for svc in sdxi-1 sdxi-2; do
          grep -q "^  ${svc}:" "$STACK_DIR/docker-compose.yml"
        done

    # `up` returns once both guests' containers have started, which compose
    # only does after every device server they depend on reports healthy.
    - name: Bring up the two-guest stack
      run: |
        qemu-tool compose --stack-dir "$STACK_DIR" \
          --xml qemu/stacks/rocm-golden.xml --xml "$OVERLAY" \
          up --detach
        echo "Compose stack started"

    # Both qemu containers publish their SSH port on the HOST, which this job
    # container cannot reach: the runner puts it on its own bridge network and
    # "--network" is not supported in container.options. Attach to the stack's
    # network instead and address each VM by its service name on port 2222.
    - name: Join the stack network
      run: docker network connect rocm-ernic-smoke_fleet "$(cat /etc/hostname)"

    # Asked of the containers rather than of compose: a service that exited
    # is absent from `compose ps`, not failed.
    - name: Wait for the device servers to be healthy
      run: |
        set -eu
        elapsed=0
        while true; do
          bad=""
          for svc in ernic-1 ernic-2 rocjitsu-1 rocjitsu-2 sdxi-1 sdxi-2; do
            h=$(docker inspect -f '{{.State.Health.Status}}' \
                  "rocm-ernic-smoke-${svc}-1" 2>/dev/null || echo missing)
            if [ "$h" != healthy ]; then bad="$bad ${svc}=${h}"; fi
          done
          if [ -z "$bad" ]; then break; fi
          if [ "$elapsed" -ge 60 ]; then
            echo "the device servers are not healthy after ${elapsed}s:${bad}" >&2
            qemu-tool compose --stack-dir "$STACK_DIR" logs \
              ernic-1 ernic-2 rocjitsu-1 rocjitsu-2 sdxi-1 sdxi-2 || true
            exit 1
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "device servers healthy"

    - name: Wait for VM 1 SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@qemu-1 true 2>/dev/null; then
            echo "VM 1 ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM 1 failed to boot in time"
        echo "--- diagnostics: last ssh attempt, unfiltered ---"
        getent hosts qemu-1 || echo "qemu-1 does not resolve"
        ssh -o ConnectTimeout=5 \
            -o NoHostAuthenticationForLocalhost=yes \
            -o StrictHostKeyChecking=no \
            -vv -p 2222 ubuntu@qemu-1 true 2>&1 | tail -30 || true
        exit 1

    - name: Wait for VM 2 SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@qemu-2 true 2>/dev/null; then
            echo "VM 2 ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM 2 failed to boot in time"
        echo "--- diagnostics: last ssh attempt, unfiltered ---"
        getent hosts qemu-2 || echo "qemu-2 does not resolve"
        ssh -o ConnectTimeout=5 \
            -o NoHostAuthenticationForLocalhost=yes \
            -o StrictHostKeyChecking=no \
            -vv -p 2222 ubuntu@qemu-2 true 2>&1 | tail -30 || true
        exit 1

    - name: Verify SSH access to VM 1
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 ls -ltrh

    - name: Verify SSH access to VM 2
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-2 ls -ltrh

    - name: Verify qemu-guest-agent in VM 1
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-1 \
          "dpkg-query -W -f='\${Status}' qemu-guest-agent" \
          | grep -q "install ok installed"
        echo "qemu-guest-agent installed in VM 1"

    - name: Verify qemu-guest-agent in VM 2
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@qemu-2 \
          "dpkg-query -W -f='\${Status}' qemu-guest-agent" \
          | grep -q "install ok installed"
        echo "qemu-guest-agent installed in VM 2"

    - name: Show compose logs on failure
      if: failure()
      run: qemu-tool compose --stack-dir "$STACK_DIR" logs
