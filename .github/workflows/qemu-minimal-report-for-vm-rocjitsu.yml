name: qemu-minimal - Report for vm-rocjitsu

# Produces BOTH rocjitsu reports -- the GEMM/hipFile one under site/rocjitsu/
# and the fio libhipfile one under site/hipfile-fio/ -- from a single guest.
#
# They were two lanes until they were merged. The two gen-vm invocations were
# byte-identical apart from --vm-name, and gen-vm is ~90% of the lane (2866s of
# 3200s on run 35787709858), so the split cost a full extra guest build, ~50
# minutes, every night for nothing.
#
# The original split had two stated reasons. "The two can move on separate
# schedules" stopped being true when all four report lanes moved to 0 8 * * *.
# "A fio-side regression cannot take the GEMM and hipFile badges down with it"
# is preserved here instead by structure: each report step is
# continue-on-error and each upload runs under if: always(), so a failure in
# one benchmark still publishes the other. publish-pages fetches each lane's
# newest artifact BY NAME, so both artifact names must keep being uploaded --
# vm-report-rocjitsu and vm-report-hipfile-fio -- or that section of the site
# silently freezes.
on:
  push:
    branches:
      - main
    paths:
      - 'ansible/playbooks/vm-rocjitsu.yml'
      - 'ansible/playbooks/roles/**'
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - 'qemu/compose/vfio-user-rocjitsu-vm/**'
      - 'scripts/generate-vm-report.sh'
      - 'scripts/vm-report/**'
      - '.github/actions/setup-vm-job/action.yml'
      - '.github/workflows/qemu-minimal-report-for-vm-rocjitsu.yml'
      - '.github/workflows/qemu-minimal-publish-pages.yml'
      - 'README.md'
  # Daily at 01:00 MST alongside the other three report lanes -- see
  # report-for-vm-basic.yml.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-report-rocjitsu
  cancel-in-progress: true

env:
  ROCJITSU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:20260924.gad7a357-rocjitsu.c85bb75
  QEMU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260924.ge1cd640-qemu11.1.1-vfu.8039244
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  ANSIBLE_EXTRA_ARGS: '-e {"git_setup_enable_gpg_signing":false,"user_setup_dotfiles_enable":false,"user_setup_install_amd_ca":false}'

jobs:
  generate-rocjitsu-report:
    name: Report for vm-rocjitsu
    runs-on: ubuntu-latest
    # 180 rather than the old lane's 150: one guest now carries both benchmarks,
    # and the fio one builds fio from source in-guest.
    timeout-minutes: 180
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260924.ge1cd640-qemu11.1.1-vfu.8039244
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    - name: Set up VM job
      uses: ./.github/actions/setup-vm-job
      with:
        cloud-image-key: rocjitsu-report
        release: resolute
        stage-src: 'true'

    - name: Pull CI images
      run: |
        docker pull "$ROCJITSU_IMAGE"
        docker pull "$QEMU_IMAGE"

    - name: Generate VM with vm-rocjitsu playbook
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        qemu-tool gen-vm \
          --vm-name rocjitsu-report \
          --release resolute \
          --username ubuntu \
          --password password \
          --packages qemu/packages.d/packages-default \
          --size 64 \
          --ansible-playbook ansible/playbooks/vm-rocjitsu.yml

    - name: Bring up rocjitsu compose stack
      working-directory: qemu/compose/vfio-user-rocjitsu-vm
      env:
        VM_NAME: rocjitsu-report
        QEMU_TOOL_SRC: /var/lib/qemu-tool/src
        VM_VCPUS: "4"
        VM_VMEM: "4096"
        VM_SHM_SIZE: "5g"
        VM_NVME: "1"
      run: |
        docker compose up --detach
        echo "Compose stack started"

    - name: Join the compose network
      run: docker network connect vfio-user-rocjitsu-vm_default "$(cat /etc/hostname)"

    - name: Wait for rocjitsu server healthy
      working-directory: qemu/compose/vfio-user-rocjitsu-vm
      run: |
        for i in $(seq 1 30); do
          health=$(docker compose ps --format json rocjitsu \
            | python3 -c "import sys,json; s=json.load(sys.stdin); print(s.get('Health',''))" \
            2>/dev/null || true)
          [ "$health" = "healthy" ] && break
          sleep 2
        done
        [ "$health" = "healthy" ] || (docker compose logs rocjitsu && exit 1)
        echo "rocjitsu server healthy"

    - name: Wait for VM SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@qemu true 2>/dev/null; then
            echo "VM ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM failed to boot in time"
        exit 1

    - name: Load amdgpu via amdgpu-probe
      timeout-minutes: 5
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          -p 2222 ubuntu@qemu "sudo -n timeout 120 /usr/local/bin/amdgpu-probe"
        echo "✓ amdgpu-probe completed"

    # The same live-guest validation the PR gate in
    # qemu-minimal-ansible-playbook-test-vm-rocjitsu.yml runs, repeated here on
    # the merged tree. The role owns the HIP, hsa-snoop and RVS smoke checks.
    - name: Run rocjitsu live-guest validation
      timeout-minutes: 30
      run: |
        ansible-playbook \
          -i "qemu," \
          ansible/playbooks/vm-rocjitsu.yml \
          --tags test \
          -e "ansible_host=qemu" \
          -e "ansible_port=2222" \
          -e "ansible_user=ubuntu" \
          -e 'ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"'

    # Both benchmarks run against the one guest. continue-on-error on each,
    # paired with if: always() on its upload, is what keeps the two badges
    # independent now that they share a lane -- a fio-side regression must not
    # take the GEMM and hipFile report down with it, which was the reason the
    # two lanes were separate in the first place.
    - name: Generate rocjitsu report
      id: rocjitsu-report
      continue-on-error: true
      env:
        REPORT_ROCJITSU_BENCH: "1"
      run: bash scripts/generate-vm-report.sh site/rocjitsu 2222 ubuntu "rocjitsu VM" qemu

    - name: Upload the rocjitsu report
      if: always() && steps.rocjitsu-report.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: vm-report-rocjitsu
        path: site/rocjitsu/
        if-no-files-found: error

    - name: Generate hipFile fio report
      id: hipfile-fio-report
      continue-on-error: true
      env:
        REPORT_HIPFILE_FIO_BENCH: "1"
      run: bash scripts/generate-vm-report.sh site/hipfile-fio 2222 ubuntu "hipFile fio VM" qemu

    - name: Upload the hipFile fio report
      if: always() && steps.hipfile-fio-report.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: vm-report-hipfile-fio
        path: site/hipfile-fio/
        if-no-files-found: error

    - name: Show compose logs on failure
      if: failure() || steps.rocjitsu-report.outcome == 'failure'
        || steps.hipfile-fio-report.outcome == 'failure'
      working-directory: qemu/compose/vfio-user-rocjitsu-vm
      run: docker compose logs

    # continue-on-error above keeps the job green, so fail it explicitly when
    # either benchmark failed -- otherwise publish-pages, which gates on
    # workflow_run conclusion == success, would publish a stale half-report as
    # though the run had been clean.
    # shell: bash is not decoration. This job runs in the qemu container, where
    # GitHub resolves the default shell to `sh -e {0}`, and dash rejects
    # `set -o pipefail` outright -- "Illegal option -o pipefail", exit 2. That
    # failed the lane on a run where both reports had succeeded.
    - name: Fail if either report failed
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        rc=0
        for pair in \
          "rocjitsu:${{ steps.rocjitsu-report.outcome }}" \
          "hipfile-fio:${{ steps.hipfile-fio-report.outcome }}"
        do
          name=${pair%%:*}
          outcome=${pair#*:}
          if [ "${outcome}" != "success" ]; then
            echo "::error::${name} report failed (${outcome})"
            rc=1
          fi
        done
        exit "${rc}"
