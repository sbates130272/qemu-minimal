name: qemu-minimal - Gen Compose Check

# The scale-out stack's docker-compose.yml and prometheus.yml are generated
# from qemu/env/scale-out and committed, so they can be reviewed in a diff and
# used with plain `docker compose`. That only holds if the committed copy
# actually matches the settings file.
#
# AGENTS.md and the stack README have both claimed "gen-compose --check fails
# in CI" since the generator landed. It did not: no workflow ran it, so a hand
# edit to the generated tree -- or a settings change without a regenerate --
# would have shipped undetected. This lane makes the claim true.
#
# No push: trigger and no paths: filter, matching site-script-tests and
# shell-check -- every commit reaches main through a PR, and a path-filtered
# required check never reports on a PR outside its filter, leaving that PR
# blocked forever. The job is seconds, so there is nothing to save by
# filtering it.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gen-compose-check:
    name: Gen Compose Check
    runs-on: ubuntu-latest
    # Every service in the rendered stacks carries
    # `user: ${CONTAINER_USER:?...}`, so a PLAIN `docker compose` -- which is
    # what most of the steps below run, deliberately, to prove the committed
    # files work without qemu-tool -- refuses to interpolate without these.
    # That refusal is the feature: the alternative spelling interpolates to
    # empty, `user: ":"` is not an error to Docker, and the stack runs as
    # root. `qemu-tool compose` fills both in from the caller; here there is
    # no caller to ask, so the runner's own ids are named.
    #
    # A literal gid for kvm, because an ubuntu-latest runner has no kvm group
    # and getent would return nothing. Nothing here starts a container, so the
    # value only has to parse.
    env:
      CONTAINER_USER: "1001:127"
      CONTAINER_KVM_GID: "108"
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      # qemu-tool is stdlib-only, so an editable install needs no resolver and
      # pulls nothing. Installing it rather than importing from the tree keeps
      # this honest about the entry point users actually run.
      - name: Install qemu-tool
        run: python3 -m pip install --user -e ./qemu

      # tests/test_ernic_identity.py is the only thing in the repo that asks
      # udev to parse the rules file, and the only thing that reads the fleet
      # role's wiring -- no lane runs ernic_fleet_guest against a guest. Both
      # used to skip themselves when a tool was absent, which is how an IB
      # rule that udev REJECTED at parse time shipped beside thirty green
      # tests. Belt and braces, because either half alone still fails open:
      # this step guarantees the tools are here and says which are missing,
      # and _require() in the test file turns a skip into a failure whenever
      # CI=true, so moving the suite into a leaner container or onto a
      # different runner image goes red here instead of quietly testing less.
      # Seconds: three pip wheels, and apt only on an image that dropped one.
      - name: Tooling the identity tests must not skip for
        run: |
          python3 -m pip install --user --quiet PyYAML Jinja2
          need=""
          command -v lspci >/dev/null || need="$need pciutils"
          command -v udevadm >/dev/null || need="$need udev"
          if [ -n "$need" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq $need
          fi
          for t in awk lspci udevadm; do
            command -v "$t" >/dev/null || {
              echo "::error::$t is unavailable and the identity tests need it"; exit 1; }
          done
          # `verify` is systemd >= 251; an older udevadm would fail the rules
          # check for the wrong reason.
          udevadm verify --help >/dev/null || {
            echo "::error::udevadm has no verify subcommand"; exit 1; }
          python3 -c "import yaml, jinja2"

      # CI=true is set by GitHub on every runner; the tests key on it to
      # refuse to skip. Set explicitly so the behaviour is visible here and
      # survives a local `act` run.
      - name: Unit tests
        env:
          CI: "true"
        run: python3 -m unittest discover -s tests -v

      # The gate itself. --check regenerates into a temporary directory and
      # compares, so it fails on a stale committed stack *and* on a settings
      # file edited without regenerating.
      - name: Committed stack matches qemu/env/scale-out
        run: |
          python3 -m qemu_tool gen-compose \
            --env-file qemu/env/scale-out \
            --output-dir qemu/compose/vfio-user-ernic-rocjitsu-scale-out \
            --check

      # A generated file that is in step with its settings can still be
      # invalid YAML or reference an undefined network, which --check cannot
      # see. compose parses and resolves it without starting anything.
      - name: Generated stack is valid compose
        run: |
          docker compose \
            --project-directory qemu/compose/vfio-user-ernic-rocjitsu-scale-out \
            --env-file qemu/env/scale-out config -q

      # Profiles FILTER services out of `config` output, so the step above
      # validates only the default set -- ernic, qemu, rocjitsu, tapsetup.
      # Every observability and LMCache service is profile-gated, so all seven
      # of them (prometheus, grafana, loki, alloy, lmcache-coordinator and the
      # two stats exporters) were parsed by nothing: a dangling depends_on or a
      # bad bind-mount path in any of them shipped green. Enable both profiles
      # and assert the services are actually present, because `config -q` on a
      # file whose services were all filtered away also exits 0 -- the
      # assertion is what stops this silently reverting to checking nothing.
      - name: Profile-gated services also validate
        run: |
          svcs="$(docker compose \
            --project-directory qemu/compose/vfio-user-ernic-rocjitsu-scale-out \
            --env-file qemu/env/scale-out \
            --profile lmcache --profile metrics config --services)"
          for s in prometheus grafana loki alloy lmcache-coordinator \
                   lmcache-stats-exporter ernic-stats-exporter; do
            echo "$svcs" | grep -qx "$s" || {
              echo "::error::$s missing from the lmcache+metrics render"; exit 1; }
          done
          docker compose \
            --project-directory qemu/compose/vfio-user-ernic-rocjitsu-scale-out \
            --env-file qemu/env/scale-out \
            --profile lmcache --profile metrics config -q

      # Every lane here runs the golden file alone, so an overlay only gets
      # rendered by the lane that uses it -- report-for-lmcache is weekly, and
      # the mi100 overlay has no lane at all. A key renamed in the golden
      # would sit broken in an overlay until someone ran a fleet. Render each
      # committed overlay on top of the golden and validate the result.
      #
      # Each overlay is paired with the golden file it is a delta OF, rather
      # than every overlay being assumed to sit on scale-out: overlay-mi355x-ci
      # layers on qemu/env/mi355x-node, and rendering it against the wrong
      # golden would validate a stack nobody runs while leaving the real one
      # unchecked. --stack matters for the same reason it does elsewhere --
      # it is what the asset mirror reads FROM.
      - name: Committed overlays render and validate
        run: |
          for pair in \
            vfio-user-ernic-rocjitsu-scale-out:qemu/env/scale-out:qemu/env/overlay-ci \
            vfio-user-ernic-rocjitsu-scale-out:qemu/env/scale-out:qemu/env/overlay-mi100 \
            vfio-user-mi355x-node:qemu/env/mi355x-node:qemu/env/overlay-mi355x-ci; do
            stack=${pair%%:*}; rest=${pair#*:}
            golden=${rest%%:*}; overlay=${rest#*:}
            dir="/tmp/stack-$(basename "$overlay")"
            mkdir -p "$dir"
            python3 -m qemu_tool gen-compose --stack "$stack" \
              --env-file "$golden" --env-file "$overlay" \
              --output-dir "$dir"
            docker compose --project-directory "$dir" \
              --env-file "$golden" --env-file "$overlay" config -q
          done

      # The MI355X CI overlay exists to shrink the FLEET and the guest, never
      # the topology: a lane that quietly halved the devices would publish a
      # green report about a shape nobody runs. Assert the reduced render
      # still carries the full switch wiring, because that is exactly the
      # property a well-meaning "make CI faster" edit would drop.
      - name: The MI355X CI overlay reduces the fleet, not the topology
        run: |
          set -eu
          dir=/tmp/stack-overlay-mi355x-ci
          grep -q -- '--vfio-user-switch-width 2' "$dir/docker-compose.yml" \
            || { echo "::error::the CI overlay lost --vfio-user-switch-width"; exit 1; }
          for s in ernic-1-8 rocjitsu-1-8; do
            docker compose --project-directory "$dir" \
              --env-file qemu/env/mi355x-node \
              --env-file qemu/env/overlay-mi355x-ci config --services \
              | grep -qx "$s" \
              || { echo "::error::$s missing: the overlay reduced the device count"; exit 1; }
          done
          # One VM, though: that part IS meant to shrink.
          docker compose --project-directory "$dir" \
            --env-file qemu/env/mi355x-node \
            --env-file qemu/env/overlay-mi355x-ci config --services \
            | grep -qx qemu-2 \
            && { echo "::error::the CI overlay rendered more than one VM"; exit 1; }
          echo "topology intact, fleet reduced to one VM"

      # ERNIC_TAP has two shapes and the golden sets it to true, so every
      # render above covers the tap one: the tap path's extra network,
      # per-service device and sidecar per VM are already validated, and the
      # shape validated nowhere is the one WITHOUT them. This step used to
      # sed ERNIC_TAP=true into a copy of a file that already said true, so
      # it re-checked the committed shape and the other shape shipped
      # unparsed. The override is a one-key scratch overlay rather than a sed
      # of the golden, which also exercises the repeatable --env-file
      # layering the overlays depend on.
      - name: Tap-less stack also renders and validates
        run: |
          echo 'ERNIC_TAP=false' > /tmp/env.notap
          mkdir -p /tmp/notapstack
          python3 -m qemu_tool gen-compose \
            --env-file qemu/env/scale-out --env-file /tmp/env.notap \
            --output-dir /tmp/notapstack
          docker compose --project-directory /tmp/notapstack \
            --env-file qemu/env/scale-out --env-file /tmp/env.notap config -q

      # qemu/env/quickstart is the settings file README.md's Quick Start and
      # report-for-quickstart both use, through `qemu-tool quick-start`.
      # Nothing else here renders it, and the lane that does runs daily and
      # after the merge -- so without this a broken quickstart is found the
      # next morning rather than on the PR that broke it. The service
      # assertion is the same guard as above: `config -q` on a render with no
      # services also exits 0.
      - name: Quickstart stack renders and validates
        run: |
          mkdir -p /tmp/qsstack
          python3 -m qemu_tool gen-compose \
            --env-file qemu/env/quickstart --output-dir /tmp/qsstack
          svcs="$(docker compose --project-directory /tmp/qsstack \
            --env-file qemu/env/quickstart config --services)"
          for s in ernic-1 ernic-2 rocjitsu-1 rocjitsu-2 qemu-1 qemu-2; do
            echo "$svcs" | grep -qx "$s" || {
              echo "::error::$s missing from the quickstart render"; exit 1; }
          done
          docker compose --project-directory /tmp/qsstack \
            --env-file qemu/env/quickstart config -q

      # `qemu-tool compose` inside a rendered directory needs no flags: it
      # reads the layers back out of the provenance header. The failure that
      # makes this worth a lane is not the command erroring -- it is the
      # command succeeding against the WRONG stack, which is how an 8-VM
      # golden render once stood in for a 32-VM fleet and reported success.
      # So the assertion is on which directory compose acted in, taken from
      # the project name (docker compose derives it from the working
      # directory, so it cannot agree by coincidence), and on a VM_COUNT that
      # belongs to no committed stack. Exit status asserts nothing here.
      # `config` resolves and prints; it starts nothing.
      #
      # The layers are passed absolute: a header records the paths as given,
      # and relative ones resolve against the stack directory, so a render
      # driven by relative paths from the checkout cannot be re-read from
      # inside /tmp. That is the documented rule, exercised rather than
      # assumed.
      - name: A rendered stack is resolved from the cwd with no flags
        run: |
          probe=/tmp/stack-memory-probe
          mkdir -p "$probe"
          echo 'VM_COUNT=3' > /tmp/env.probe
          python3 -m qemu_tool gen-compose \
            --env-file "$PWD/qemu/env/scale-out" --env-file /tmp/env.probe \
            --output-dir "$probe"
          ( cd "$probe" && python3 -m qemu_tool compose config --format json ) > /tmp/probe.json
          python3 - <<'PY'
          import json, sys
          cfg = json.load(open("/tmp/probe.json"))
          svcs = sorted(cfg["services"])
          want = ["qemu-1", "qemu-2", "qemu-3"]
          bad = []
          if cfg["name"] != "stack-memory-probe":
              bad.append(f"compose ran in project {cfg['name']!r}, not the rendered stack")
          if [s for s in svcs if s.startswith("qemu-")] != want:
              bad.append(f"resolved to a stack with qemu services {svcs}, wanted {want}")
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          PY
          # The other half of the same guard: one directory up is not a
          # rendered stack, and must not be treated as one. A walk-up would
          # make every command in a fleet's parent directory drive the fleet.
          out="$( cd /tmp && python3 -m qemu_tool compose config --services 2>&1 || true )"
          echo "$out" | grep -qx 'qemu-3' && {
            echo "::error::compose adopted the probe stack from outside it"; exit 1; }
          exit 0

      # The MI355X-shaped stack: 8 ernics and 8 rocjitsus per VM behind 8
      # PCIe switches. Its committed tree is generated the same way and gets
      # the same gate.
      #
      # --stack is not optional here even though --output-dir names the same
      # directory. It is what the asset mirror reads FROM, and its default is
      # the scale-out stack -- so without it this would compare mi355x's
      # grafana/, logging/ and tapsetup/ against the other stack's and then,
      # on a real generation, overwrite them authoritatively.
      - name: Committed MI355X stack matches qemu/env/mi355x-node
        run: |
          python3 -m qemu_tool gen-compose \
            --stack vfio-user-mi355x-node \
            --env-file qemu/env/mi355x-node \
            --output-dir qemu/compose/vfio-user-mi355x-node \
            --check

      # Both renders, for the same reason the scale-out stack validates both:
      # profiles filter services out of `config` output, and `config -q` on a
      # render with everything filtered away still exits 0. The service
      # assertion is what stops this silently checking nothing.
      #
      # ernic-4-8 and rocjitsu-4-8 specifically: they are the LAST device of
      # the LAST VM, so they only exist if the per-VM device loop ran to the
      # end rather than emitting one of each.
      - name: MI355X stack renders and validates
        run: |
          svcs="$(docker compose \
            --project-directory qemu/compose/vfio-user-mi355x-node \
            --env-file qemu/env/mi355x-node \
            --profile metrics config --services)"
          for s in ernic-1-1 ernic-4-8 rocjitsu-1-1 rocjitsu-4-8 \
                   qemu-1 qemu-4 prometheus grafana; do
            echo "$svcs" | grep -qx "$s" || {
              echo "::error::$s missing from the mi355x render"; exit 1; }
          done
          docker compose \
            --project-directory qemu/compose/vfio-user-mi355x-node \
            --env-file qemu/env/mi355x-node config -q
          docker compose \
            --project-directory qemu/compose/vfio-user-mi355x-node \
            --env-file qemu/env/mi355x-node \
            --profile metrics config -q

      # The topology is the point of the stack, and a flat tree boots just as
      # happily as a switched one -- so assert the guest actually gets the
      # switches rather than trusting that the flag was passed along.
      - name: MI355X guest gets 8 switches, each with one NIC and one GPU
        run: |
          python3 - <<'PY'
          import re
          from qemu_tool.config import VMConfig
          from qemu_tool import run_vm
          socks = []
          for i in range(1, 9):
              socks += [f"/run/vfu/ernic-1-{i}.sock",
                        f"/run/vfu/rocjitsu-1-{i}.sock"]
          cfg = VMConfig(vm_name="mi355x-1", vcpus=8, vfio_userdev=socks,
                         vfio_user_switch_width=2, cpu_sockets=1,
                         pci_hole64_size="512G", dry_run=True)
          args = run_vm._vfio_userdev_args(cfg)
          joined = " ".join(args)
          assert joined.count("x3130-upstream") == 8, "expected 8 switches"
          assert joined.count("xio3130-downstream") == 16
          chassis = re.findall(r"chassis=(\d+)", joined)
          assert len(chassis) == len(set(chassis)) == 24, "chassis collision"
          assert all("hotplug=off" in a for a in args
                     if a.startswith(("pcie-root-port", "xio3130-downstream")))
          for s in range(8):
              assert f'"bus":"vfudp{s}.0"' in joined
              assert f'"bus":"vfudp{s}.1"' in joined
          assert run_vm._smp_args(cfg) == [
              "-smp", "cpus=8,sockets=1,cores=8,threads=1"]
          print("topology OK: 8 switches, 24 unique chassis, 1 socket")
          PY
