name: qemu-minimal - Gen Compose Check

# Every stack under qemu/compose/ is generated from the fleet file of the same
# name in qemu/stacks/ and committed, so it can be reviewed in a diff and used
# with plain `docker compose`. That only holds if the committed copy actually
# matches the settings file.
#
# AGENTS.md and the stack README have both claimed "gen-compose --check fails
# in CI" since the generator landed. It did not: no workflow ran it, so a hand
# edit to the generated tree -- or a settings change without a regenerate --
# would have shipped undetected. This lane makes the claim true.
#
# No push: trigger and no paths: filter, matching shell-check -- every commit
# reaches main through a PR, and a path-filtered required check never reports
# on a PR outside its filter, leaving that PR blocked forever. The job is seconds, so there is nothing to save by
# filtering it.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gen-compose-check:
    name: Gen Compose Check
    runs-on: ubuntu-latest
    # Every service in the rendered stacks carries
    # `user: ${CONTAINER_USER:?...}`, so a PLAIN `docker compose` -- which is
    # what most of the steps below run, deliberately, to prove the committed
    # files work without qemu-tool -- refuses to interpolate without these.
    # That refusal is the feature: the alternative spelling interpolates to
    # empty, `user: ":"` is not an error to Docker, and the stack runs as
    # root. `qemu-tool compose` fills both in from the caller; here there is
    # no caller to ask, so the runner's own ids are named.
    #
    # A literal gid for kvm, because an ubuntu-latest runner has no kvm group
    # and getent would return nothing. Nothing here starts a container, so the
    # value only has to parse.
    env:
      CONTAINER_USER: "1001:127"
      CONTAINER_KVM_GID: "108"
    steps:
      # All history, not the one commit: tests/test_playbook_pins.py reads
      # vm-rocm-golden.yml at the commit the fleet's <backing-ref> guest was
      # baked from, to compare the pins that guest was built at with the
      # server images the fleet files name. On a shallow checkout that test
      # skips, and this is the only lane that runs it on a pull request.
      - name: Check out code
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      # qemu-tool is stdlib-only, so an editable install needs no resolver and
      # pulls nothing. Installing it rather than importing from the tree keeps
      # this honest about the entry point users actually run.
      - name: Install qemu-tool
        run: python3 -m pip install --user -e ./qemu

      # tests/test_ernic_identity.py is the only thing in the repo that asks
      # udev to parse the rules file, and the only thing that reads the fleet
      # role's wiring -- no lane runs rocm_ernic_setup against a guest. Both
      # used to skip themselves when a tool was absent, which is how an IB
      # rule that udev REJECTED at parse time shipped beside thirty green
      # tests. Belt and braces, because either half alone still fails open:
      # this step guarantees the tools are here and says which are missing,
      # and _require() in the test file turns a skip into a failure whenever
      # CI=true, so moving the suite into a leaner container or onto a
      # different runner image goes red here instead of quietly testing less.
      # Seconds: three pip wheels, and apt only on an image that dropped one.
      - name: Tooling the identity tests must not skip for
        run: |
          python3 -m pip install --user --quiet PyYAML Jinja2
          need=""
          command -v lspci >/dev/null || need="$need pciutils"
          command -v udevadm >/dev/null || need="$need udev"
          if [ -n "$need" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq $need
          fi
          for t in awk lspci udevadm; do
            command -v "$t" >/dev/null || {
              echo "::error::$t is unavailable and the identity tests need it"; exit 1; }
          done
          # `verify` is systemd >= 251; an older udevadm would fail the rules
          # check for the wrong reason.
          udevadm verify --help >/dev/null || {
            echo "::error::udevadm has no verify subcommand"; exit 1; }
          python3 -c "import yaml, jinja2"

      # CI=true is set by GitHub on every runner; the tests key on it to
      # refuse to skip. Set explicitly so the behaviour is visible here and
      # survives a local `act` run.
      - name: Unit tests
        env:
          CI: "true"
        run: python3 -m unittest discover -s tests -v

      # The privilege posture of every committed stack, as compose RESOLVES
      # it rather than as gen_compose renders it. Resolving collapses the x-
      # anchors, so this catches a service that merges the wrong anchor or
      # overrides `user:` back to root after inheriting it. A unit test
      # reading the YAML text cannot see either.
      #
      # Plain `docker compose`, with nothing but the job's CONTAINER_USER and
      # CONTAINER_KVM_GID: a generated stack has every setting baked in, and
      # the two names it still interpolates beyond those carry defaults.
      #
      # Checked against the real failure modes, not a snapshot: a snapshot of
      # 161 services would be rewritten on every topology change and would
      # stop being read.
      - name: No stack runs anything as root
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          ROOT = "qemu/compose"
          STACKS = ["rocm-golden", "helios-tray", "mi355x-server"]
          # tapsetup cannot take a uid (Docker sets no ambient capabilities,
          # so a non-root uid holds no effective NET_ADMIN). alloy must not:
          # it mounts /var/run/docker.sock to ship container logs, and that
          # socket is root's. Both documented in AGENTS.md.
          EXEMPT = lambda n: n.startswith("tapsetup-") or n == "alloy"
          ALLOWED = {"tapsetup": {"NET_ADMIN"}}

          bad, total = [], 0
          for stack in STACKS:
              cmd = ["docker", "compose", "--project-directory", f"{ROOT}/{stack}",
                     "--profile", "metrics", "config", "--format", "json"]
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0:
                  bad.append(f"{stack}: config failed: {r.stderr.strip()[:200]}")
                  continue
              services = json.loads(r.stdout).get("services", {})
              # A profile typo filters every service away and `config` still
              # exits 0, so an empty render must be a failure and not a pass.
              if not services:
                  bad.append(f"{stack}: resolved to no services at all")
                  continue
              total += len(services)
              for name, svc in sorted(services.items()):
                  at = f"{stack}/{name}"
                  if svc.get("privileged"):
                      bad.append(f"{at}: privileged")
                  drop = {c.upper() for c in (svc.get("cap_drop") or [])}
                  if "ALL" not in drop:
                      bad.append(f"{at}: does not cap_drop ALL (got {sorted(drop)})")
                  add = {c.upper() for c in (svc.get("cap_add") or [])}
                  key = "tapsetup" if name.startswith("tapsetup-") else name
                  if add - ALLOWED.get(key, set()):
                      bad.append(f"{at}: unexpected cap_add "
                                 f"{sorted(add - ALLOWED.get(key, set()))}")
                  user = str(svc.get("user") or "")
                  if not EXEMPT(name):
                      if not user:
                          bad.append(f"{at}: no user, so it runs as the image's (root)")
                      elif user in ("0", "0:0", "root", "root:root"):
                          bad.append(f"{at}: pinned to root ({user})")
                  elif user:
                      bad.append(f"{at}: exempt but carries user={user}")
                  if "no-new-privileges:true" not in " ".join(svc.get("security_opt") or []):
                      bad.append(f"{at}: no no-new-privileges")
                  # :ro restricts the inode, not the API behind it: anything
                  # that can connect to this socket can create a privileged
                  # container. Only the log shipper may hold it.
                  for vol in svc.get("volumes") or []:
                      src = vol.get("source") if isinstance(vol, dict) else str(vol)
                      if src and "docker.sock" in src and name != "alloy":
                          bad.append(f"{at}: holds the Docker socket")
              print(f"  {stack}: {len(services)} services")

          if bad:
              print("\n::error::privilege posture regressions:", file=sys.stderr)
              for b in bad:
                  print(f"  {b}", file=sys.stderr)
              sys.exit(1)
          print(f"\n{total} services: non-root (or exempt), cap_drop ALL, "
                "no-new-privileges, no stray Docker socket.")
          PY

      # check is a command a human is told to run, so the lane runs
      # the command rather than importing its functions -- the same reason
      # report-for-vm-rocm-golden runs `qemu-tool quick-start` itself.
      #
      # Its exit status is NOT asserted to be 0: a GitHub runner legitimately
      # lacks oras and ansible, which it reports as warnings, and asserting
      # success here would make the lane depend on what a runner image
      # happens to ship. What is asserted is that it runs, reports every
      # section, and -- the half that actually guards something -- exits 1 on
      # a host fact that really would stop a stack.
      - name: check runs and fails on a real problem
        run: |
          set -eu
          out="$(python3 -m qemu_tool check 2>&1 || true)"
          echo "$out"
          for section in Tools Docker Virtualisation "Container identity" \
                         Settings Capacity Images; do
            echo "$out" | grep -q "^$section$" || {
              echo "::error::check printed no '$section' section"; exit 1; }
          done

          # Below 4 vCPU ionic_rdma never probes, and the only symptom is a
          # line in a guest log nobody reads. That is the kind of thing this
          # command exists to catch, so prove it does.
          printf '<fleet xmlns="http://qemu-tool/fleet/1.0">\n  <vm-count>2</vm-count>\n  <vm-vcpus>2</vm-vcpus>\n</fleet>\n' \
            > /tmp/fleet.toosmall.xml
          if python3 -m qemu_tool check --xml /tmp/fleet.toosmall.xml \
               > /tmp/cs.out 2>&1; then
            cat /tmp/cs.out
            echo "::error::check exited 0 on a sub-floor <vm-vcpus>"; exit 1
          fi
          grep -q "FAIL.*floor" /tmp/cs.out || {
            cat /tmp/cs.out
            echo "::error::check failed, but not for the stated reason"; exit 1; }
          echo "check reports its sections and fails on a real problem."

      # down --all on a host with no stacks. Cheap, and it covers the half
      # quickstart-boot cannot: that lane always has a stack running, so
      # it never exercises the empty case -- where a command that removes
      # containers had better say "nothing to do" and exit 0 rather than
      # find something.
      #
      # --dry-run as well as the empty host, because a runner for an
      # unrelated job could legitimately have containers on it and this step
      # must not be the thing that removes them.
      - name: down --all finds nothing to do on a bare host
        run: |
          set -eu
          out="$(python3 -m qemu_tool down --all --dry-run 2>&1)"
          echo "$out"
          echo "$out" | grep -q "No running qemu-tool stacks" || {
            echo "::error::down --all claimed to find stacks on a bare runner"
            exit 1; }

      # The gate itself. --check regenerates into a temporary directory and
      # compares, so it fails on a stale committed stack *and* on a settings
      # file edited without regenerating. The stack, and so the directory
      # compared against and the assets mirrored from, is the one named after
      # the fleet file.
      - name: Committed stacks match their fleet files
        run: |
          set -eu
          for stack in rocm-golden helios-tray mi355x-server; do
            python3 -m qemu_tool gen-compose \
              --xml "qemu/stacks/${stack}.xml" --check
          done
          # No --xml at all is the same question about the default stack, and
          # is what someone in a checkout types.
          python3 -m qemu_tool gen-compose --check

      # A generated file that is in step with its settings can still be
      # invalid YAML or reference an undefined network, which --check cannot
      # see. compose parses and resolves it without starting anything.
      #
      # Plain `docker compose`, to prove the committed files work without
      # qemu-tool: every setting is baked in at gen-compose time, so the job's
      # CONTAINER_USER and CONTAINER_KVM_GID are all it needs.
      #
      # qemu/stacks/rocm-golden.xml is also what `qemu-tool quick-start` runs,
      # and the lane that boots it is path-filtered, so this is where a broken
      # quickstart is found on the PR that broke it. The service assertion is
      # the guard: `config -q` on a render with no services also exits 0.
      - name: Default stack is valid compose
        run: |
          set -eu
          svcs="$(docker compose --project-directory qemu/compose/rocm-golden \
            config --services)"
          for s in ernic-1 ernic-2 rocjitsu-1 rocjitsu-2 sdxi-1 sdxi-2 \
                   qemu-1 qemu-2; do
            echo "$svcs" | grep -qx "$s" || {
              echo "::error::$s missing from the default stack"; exit 1; }
          done
          docker compose --project-directory qemu/compose/rocm-golden config -q

      # Profiles FILTER services out of `config` output, so the step above
      # validates only the default set -- ernic, qemu, rocjitsu, sdxi,
      # tapsetup. Every observability service is profile-gated, so all five
      # of them (prometheus, grafana, loki, alloy and the ernic stats
      # exporter) were parsed by nothing: a dangling depends_on or a bad
      # bind-mount path in any of them shipped green. Enable the profile and
      # assert the services are actually present, because `config -q` on a
      # file whose services were all filtered away also exits 0 -- the
      # assertion is what stops this silently reverting to checking nothing.
      - name: Profile-gated services also validate
        run: |
          set -eu
          svcs="$(docker compose --project-directory qemu/compose/rocm-golden \
            --profile metrics config --services)"
          for s in prometheus grafana loki alloy ernic-stats-exporter; do
            echo "$svcs" | grep -qx "$s" || {
              echo "::error::$s missing from the metrics render"; exit 1; }
          done
          docker compose --project-directory qemu/compose/rocm-golden \
            --profile metrics config -q

      # Every step above runs a fleet file alone, and no overlay is committed,
      # so an element renamed in rocm-golden.xml would sit broken in the
      # overlays the booting lanes write until one of them ran. Render the
      # shapes those lanes use on top of the default fleet and validate each:
      # one guest with no TAP (quickstart-boot), one guest from a local bake
      # with no TAP and no P4 (the publish lane; the playbook-test lane is
      # both at once), and more guests than the committed stack has.
      #
      # Driven through `qemu-tool compose --stack-dir`, which is how those
      # lanes drive theirs, and asserted on the guest list: resolving to the
      # wrong stack also exits 0.
      - name: Overlay renders validate
        run: |
          set -eu
          ns='xmlns="http://qemu-tool/fleet/1.0"'
          mkdir -p /tmp/overlays
          printf '<fleet %s>\n  <vm-count>1</vm-count>\n  <vm-name-prefix>prboot</vm-name-prefix>\n  <ernic-tap>false</ernic-tap>\n</fleet>\n' "$ns" \
            > /tmp/overlays/one-guest.xml
          printf '<fleet %s>\n  <vm-count>1</vm-count>\n  <vm-name-prefix>baked</vm-name-prefix>\n  <qemu-tool-src>/var/lib/qemu-tool/src</qemu-tool-src>\n  <ernic-tap>false</ernic-tap>\n  <p4-enable>false</p4-enable>\n</fleet>\n' "$ns" \
            > /tmp/overlays/baked-guest.xml
          printf '<fleet %s>\n  <vm-count>8</vm-count>\n</fleet>\n' "$ns" \
            > /tmp/overlays/eight-guests.xml
          for case in one-guest:1 baked-guest:1 eight-guests:8; do
            name=${case%%:*}; count=${case#*:}
            dir="/tmp/stack-${name}"
            python3 -m qemu_tool gen-compose \
              --xml qemu/stacks/rocm-golden.xml --xml "/tmp/overlays/${name}.xml" \
              --output-dir "$dir"
            got="$(python3 -m qemu_tool compose --stack-dir "$dir" \
              --xml qemu/stacks/rocm-golden.xml --xml "/tmp/overlays/${name}.xml" \
              config --services | grep -c '^qemu-[0-9]*$' || true)"
            [ "$got" = "$count" ] || {
              echo "::error::${name}: ${got} guests in the render, wanted ${count}"
              exit 1; }
            docker compose --project-directory "$dir" config -q
            docker compose --project-directory "$dir" --profile metrics config -q
          done
          # The one-guest shape keeps the fleet's SDXI device and has no TAP.
          svcs="$(docker compose --project-directory /tmp/stack-one-guest config --services)"
          echo "$svcs" | grep -qx sdxi-1 || {
            echo "::error::the one-guest render has no sdxi-1 service"; exit 1; }
          if echo "$svcs" | grep -q '^tapsetup-'; then
            echo "::error::the one-guest render still has a tapsetup service"
            exit 1
          fi

      # <ernic-tap> has two shapes and the default fleet sets it to true, so
      # every committed render covers the tap one: the tap path's extra
      # network, per-service device and sidecar per VM are already validated,
      # and the shape validated nowhere is the one WITHOUT them. The override
      # is a one-element scratch overlay, which also exercises the repeatable
      # --xml layering the overlays depend on.
      - name: Tap-less stack also renders and validates
        run: |
          set -eu
          printf '<fleet xmlns="http://qemu-tool/fleet/1.0">\n  <ernic-tap>false</ernic-tap>\n</fleet>\n' \
            > /tmp/fleet.notap.xml
          python3 -m qemu_tool gen-compose \
            --xml qemu/stacks/rocm-golden.xml --xml /tmp/fleet.notap.xml \
            --output-dir /tmp/notapstack
          svcs="$(docker compose --project-directory /tmp/notapstack config --services)"
          echo "$svcs" | grep -qx qemu-2 || {
            echo "::error::the tap-less render has no guests"; exit 1; }
          if echo "$svcs" | grep -q '^tapsetup-'; then
            echo "::error::the tap-less render still has a tapsetup sidecar"; exit 1
          fi
          docker compose --project-directory /tmp/notapstack config -q

      # `qemu-tool compose` inside a rendered directory needs no flags: the
      # settings are baked into the YAML and the provenance header marks the
      # directory as a rendered stack. The failure that makes this worth a
      # lane is not the command erroring -- it is the command succeeding
      # against the WRONG stack, which is how a committed render once stood
      # in for a 32-VM fleet and reported success. So the assertion is on
      # which directory compose acted in, taken from the project name (docker
      # compose derives it from the working directory, so it cannot agree by
      # coincidence), and on a <vm-count> that belongs to no committed stack.
      # Exit status asserts nothing here. `config` resolves and prints; it
      # starts nothing.
      - name: A rendered stack is resolved from the cwd with no flags
        run: |
          set -eu
          probe=/tmp/stack-memory-probe
          mkdir -p "$probe"
          printf '<fleet xmlns="http://qemu-tool/fleet/1.0">\n  <vm-count>3</vm-count>\n</fleet>\n' \
            > /tmp/fleet.probe.xml
          python3 -m qemu_tool gen-compose \
            --xml "$PWD/qemu/stacks/rocm-golden.xml" --xml /tmp/fleet.probe.xml \
            --output-dir "$probe"
          ( cd "$probe" && python3 -m qemu_tool compose config --format json ) > /tmp/probe.json
          python3 - <<'PY'
          import json, sys
          cfg = json.load(open("/tmp/probe.json"))
          svcs = sorted(cfg["services"])
          want = ["qemu-1", "qemu-2", "qemu-3"]
          bad = []
          if cfg["name"] != "stack-memory-probe":
              bad.append(f"compose ran in project {cfg['name']!r}, not the rendered stack")
          if [s for s in svcs if s.startswith("qemu-")] != want:
              bad.append(f"resolved to a stack with qemu services {svcs}, wanted {want}")
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          PY
          # The other half of the same guard: one directory up is not a
          # rendered stack, and must not be treated as one. A walk-up would
          # make every command in a fleet's parent directory drive the fleet.
          out="$( cd /tmp && python3 -m qemu_tool compose config --services 2>&1 || true )"
          if echo "$out" | grep -qx 'qemu-3'; then
            echo "::error::compose adopted the probe stack from outside it"; exit 1
          fi

      # The MI355X-shaped stack: 8 ernics and 8 rocjitsus per VM behind 8
      # PCIe switches. Both renders, for the same reason the default stack
      # validates both: profiles filter services out of `config` output, and
      # `config -q` on a render with everything filtered away still exits 0.
      # The service assertion is what stops this silently checking nothing.
      #
      # ernic-4-8 and rocjitsu-4-8 specifically: they are the LAST device of
      # the LAST VM, so they only exist if the per-VM device loop ran to the
      # end rather than emitting one of each.
      - name: MI355X stack renders and validates
        run: |
          set -eu
          svcs="$(docker compose --project-directory qemu/compose/mi355x-server \
            --profile metrics config --services)"
          for s in ernic-1-1 ernic-4-8 rocjitsu-1-1 rocjitsu-4-8 \
                   qemu-1 qemu-4 prometheus grafana; do
            echo "$svcs" | grep -qx "$s" || {
              echo "::error::$s missing from the mi355x render"; exit 1; }
          done
          docker compose --project-directory qemu/compose/mi355x-server config -q
          docker compose --project-directory qemu/compose/mi355x-server \
            --profile metrics config -q

      # The Helios tray: one VM with 4 GPUs, 8 ernics and an SDXI device.
      # ernic-1-8 and rocjitsu-1-4 are the last of each, for the reason above.
      - name: Helios tray stack renders and validates
        run: |
          set -eu
          svcs="$(docker compose --project-directory qemu/compose/helios-tray \
            --profile metrics config --services)"
          for s in ernic-1-1 ernic-1-8 rocjitsu-1-1 rocjitsu-1-4 sdxi-1 \
                   qemu-1 prometheus grafana; do
            echo "$svcs" | grep -qx "$s" || {
              echo "::error::$s missing from the helios render"; exit 1; }
          done
          docker compose --project-directory qemu/compose/helios-tray config -q
          docker compose --project-directory qemu/compose/helios-tray \
            --profile metrics config -q

      # The topology is the point of the stack, and a flat tree boots just as
      # happily as a switched one -- so assert the guest actually gets the
      # switches rather than trusting that the flag was passed along.
      - name: MI355X guest gets 8 switches, each with one NIC and one GPU
        run: |
          python3 - <<'PY'
          import re
          from qemu_tool.config import VMConfig
          from qemu_tool import run_vm
          socks = []
          for i in range(1, 9):
              socks += [f"/run/vfu/ernic-1-{i}.sock",
                        f"/run/vfu/rocjitsu-1-{i}.sock"]
          cfg = VMConfig(vm_name="mi355x-1", vcpus=8, vfio_userdev=socks,
                         vfio_user_switch_width=2, cpu_sockets=1,
                         pci_hole64_size="512G", dry_run=True)
          args = run_vm._vfio_userdev_args(cfg)
          joined = " ".join(args)
          assert joined.count("x3130-upstream") == 8, "expected 8 switches"
          assert joined.count("xio3130-downstream") == 16
          chassis = re.findall(r"chassis=(\d+)", joined)
          assert len(chassis) == len(set(chassis)) == 24, "chassis collision"
          assert all("hotplug=off" in a for a in args
                     if a.startswith(("pcie-root-port", "xio3130-downstream")))
          for s in range(8):
              assert f'"bus":"vfudp{s}.0"' in joined
              assert f'"bus":"vfudp{s}.1"' in joined
          assert run_vm._smp_args(cfg) == [
              "-smp", "cpus=8,sockets=1,cores=8,threads=1"]
          print("topology OK: 8 switches, 24 unique chassis, 1 socket")
          PY
