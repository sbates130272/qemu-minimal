name: qemu-minimal - Report for lmcache

# LMCache L1 P2P between two guests, over NIXL -> UCX -> RDMA -> rocm-ernic.
#
# WHAT THIS LANE IS FOR. Everything else that touches LMCache checks it at the
# edges: ansible-setup-test.yml syntax-checks fleet-lmcache.yml, gen-compose
# -check.yml asserts the services appear in a --profile lmcache render, and
# tests/test_lmcache_unit_render.py asserts the server's flags. None of them
# runs the role, boots a guest, or moves a byte. Every defect that cost real
# time here was invisible to all three -- a driver that was never built, a
# device name UCX silently refused, a worker count that wedged the server --
# and each presented as a cache miss or a healthy-looking fallback to TCP.
#
# THE ACCEPTANCE TEST IS THE ERNIC BYTE COUNTER, NOT A CACHE HIT. A hit proves
# the key was found, not that it crossed the mesh: a guest serving from its own
# L1 hits 2/2 with zero RDMA bytes, and so does a fleet whose NIXL has fallen
# back to TCP. Only total_bytes_rdma_read moving says RDMA happened.
#
# NOT ON PULL REQUESTS. It builds an ~11 GB image and boots two guests under
# TCG-free KVM; it is by some distance the most expensive lane here. Weekly,
# plus on demand, plus on a push that touches the parts it exercises.
#
# STATUS: this lane has not yet run green end to end. It is assembled from a
# sequence that was driven by hand on a 32-core host, and the first dispatch
# should be expected to shake out runner-sized problems -- most likely disk
# for the image build, and guest memory. Treat a first red run as that, not as
# a regression in what it tests.

on:
  push:
    branches:
      - main
    paths:
      - 'ansible/playbooks/fleet-lmcache.yml'
      - 'ansible/playbooks/roles/lmcache_guest/**'
      - 'ansible/requirements.yml'
      - 'qemu/docker/lmcache/**'
      - 'qemu/env.scale-out-ci'
      - 'qemu/qemu-tool/gen_compose.py'
      - '.github/workflows/qemu-minimal-report-for-lmcache.yml'
      - '.github/workflows/qemu-minimal-publish-pages.yml'
  # Weekly rather than daily: the other report lanes bake one guest, this one
  # builds an image and boots two.
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-report-lmcache
  cancel-in-progress: true

env:
  ENV_FILE: qemu/env.scale-out-ci
  STACK_DIR: /var/lib/qemu-tool/stacks/lmcache-ci
  LMCACHE_IMAGE: qemu-tool/lmcache-rocm:0.5.6-gfx1250-srq
  QEMU_IMAGE: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261014.geea0485-qemu11.1.2-vfu.8039244

jobs:
  generate-lmcache-report:
    name: Report for lmcache
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20261014.geea0485-qemu11.1.2-vfu.8039244
      options: >-
        --device /dev/kvm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/qemu-tool:/var/lib/qemu-tool
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    # The ioctl, not the node: a bind-mounted /dev/kvm can exist and still be
    # non-functional, and QEMU would fall back to TCG without saying so. Two
    # guests under TCG will not finish inside any timeout worth setting.
    - name: Verify KVM is available
      run: |
        test -c /dev/kvm
        python3 - <<'PY'
        import fcntl, os
        fd = os.open("/dev/kvm", os.O_RDWR)
        assert fcntl.ioctl(fd, 0xAE00, 0) >= 0
        print("KVM usable")
        PY

    # The image build wants ~11 GB and the guest qcow2 another ~16 GB. A
    # stock runner does not have that on / without help.
    - name: Free disk space
      run: |
        df -h /
        rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        docker image prune -af || true
        df -h /

    # --force and PIPX_BIN_DIR, because the CI image already ships one.
    # /usr/local/bin/qemu-tool is a symlink to /opt/qemu-tool/bin/qemu-tool,
    # baked into the image, and it wins on PATH -- so a plain `pipx install`
    # succeeds, prints "not /opt/pipx/venvs/qemu-tool/bin/qemu-tool", and the
    # lane then runs the IMAGE's qemu-tool for every gen-compose and gen-vm
    # call. That build predates _copy_stack_assets, so the generated stack
    # arrived without tapsetup/ and the fleet died with "unable to prepare
    # context: path .../tapsetup not found" -- a fix present in the tree,
    # absent from the binary, and invisible in the log but for one warning.
    #
    # Then assert it, because a version string cannot catch this: both builds
    # call themselves 1.4.1.
    - name: Install qemu-tool
      run: |
        set -eu
        PIPX_BIN_DIR=/usr/local/bin pipx install --force ./qemu
        RESOLVED=$(readlink -f "$(command -v qemu-tool)")
        echo "qemu-tool resolves to: $RESOLVED"
        case "$RESOLVED" in
          /opt/qemu-tool/*)
            echo "::error::the image's qemu-tool is shadowing the one just installed"
            exit 1
            ;;
        esac

    # Required before the build. `load: true` on the default DOCKER driver
    # cannot export a cache -- the first dispatch of this lane died on
    # "Cache export is not supported for the docker driver" before it built
    # anything. setup-buildx-action creates a docker-container builder, which
    # supports both loading into the daemon and the gha cache.
    - name: Set up buildx
      uses: docker/setup-buildx-action@v3

    # Built, not pulled: nothing publishes this image. The cache is what makes
    # a second run cheap -- the base layer alone is 11.58 GB.
    - name: Build the LMCache image
      uses: docker/build-push-action@v6
      with:
        context: qemu/docker/lmcache
        tags: ${{ env.LMCACHE_IMAGE }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Verified in the shipping stage of the Dockerfile too, but repeated here
    # because this is the thing the whole lane depends on and its absence is
    # the silent-TCP failure rather than an error.
    - name: Verify the image carries a usable RDMA stack
      run: |
        docker run --rm "$LMCACHE_IMAGE" bash -c '
          ucx_info -b | grep -q "^#define HAVE_IB  *1$"
          ls /etc/libibverbs.d/ionic.driver >/dev/null
          python3 -c "import nixl_rocm; print(\"nixl variant:\", nixl_rocm.__name__)"
        '

    - name: Export the image for the guests
      run: |
        mkdir -p /var/lib/qemu-tool/share
        docker save "$LMCACHE_IMAGE" -o /var/lib/qemu-tool/share/lmcache-srq.tar
        ls -lh /var/lib/qemu-tool/share/lmcache-srq.tar

    # Reclaim before the qcow2 arrives, which is where this lane ran out of
    # disk: "zstd: error 70 : Write error : cannot write block : No space
    # left on device".
    #
    # The runner is NOT short of a filesystem -- / is 145G with 87G free
    # after the cleanup above. This lane simply spends it: an 11.58 GB base
    # image, a ~10.8 GB built image in the daemon, the buildx builder's own
    # copy of every layer (cache-to mode=max), a 7.3 GB save tar, and then a
    # ~17 GB compressed qcow2 that decompresses to about the same again.
    #
    # By this point the only ones still needed are the tar (the guests load
    # it over 9p) and the image in the daemon. The builder cache has already
    # been exported to gha, so dropping it locally costs nothing on the next
    # run; the base image is only an input to a build that has finished.
    - name: Reclaim build space
      run: |
        df -h /
        docker buildx prune --all --force || true
        docker image rm "$BASE_IMAGE" 2>/dev/null || true
        docker image prune --force || true
        df -h /
      env:
        BASE_IMAGE: rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0

    # A runner is smaller than any node a human runs this on, so the fleet
    # defaults would ask for more than it has. Same derivation as
    # report-for-vm-ernic.yml; 4 vCPU is the ionic_rdma floor, not a choice.
    - name: Size the guests from the runner
      env:
        VMS: "2"
      run: |
        HOST_CPUS=$(nproc)
        HOST_MEM_MB=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)
        VM_VCPUS=$(( (HOST_CPUS - 1) / VMS ))
        if [ "$VM_VCPUS" -lt 4 ]; then VM_VCPUS=4; fi
        VM_VMEM=$(( HOST_MEM_MB * 3 / 4 / VMS ))
        if [ "$VM_VMEM" -gt 8192 ]; then VM_VMEM=8192; fi
        if [ "$VM_VMEM" -lt 4096 ]; then VM_VMEM=4096; fi
        {
          echo "VM_VCPUS=$VM_VCPUS"
          echo "VM_VMEM=$VM_VMEM"
          echo "VM_SHM_SIZE=${VM_VMEM}m"
        } >> "$GITHUB_ENV"
        echo "runner: ${HOST_CPUS} vCPU, ${HOST_MEM_MB} MB"
        echo "guests: ${VMS} x ${VM_VCPUS} vCPU, ${VM_VMEM} MB"

    # Overridden on top of the committed env file rather than edited into it,
    # so the file stays reviewable and the sizing stays runner-derived.
    - name: Apply the runner-derived sizing
      run: |
        {
          echo "VM_VCPUS=${VM_VCPUS}"
          echo "VM_VMEM=${VM_VMEM}"
          echo "VM_SHM_SIZE=${VM_SHM_SIZE}"
        } >> "$ENV_FILE"

    # Generated to a scratch directory. gen-compose also copies the stack's
    # non-generated assets (tapsetup/, logging/, grafana/) next to the
    # generated files -- without them compose creates the missing bind-mount
    # sources as directories and loki crash-loops on a config that is a
    # directory.
    - name: Generate the two-VM fleet stack
      run: |
        qemu-tool gen-compose --env-file "$ENV_FILE" --output-dir "$STACK_DIR"
        ls -la "$STACK_DIR"

    - name: Fetch the guest image and create the overlays
      run: |
        set -eux
        # Printed because the failure mode here is a bare zstd "No space left
        # on device" from inside gen-vm, which says nothing about how much
        # was free when it started.
        df -h /
        BACKING=$(grep '^VM_BACKING_IMAGE=' "$ENV_FILE" | cut -d= -f2-)
        qemu-tool gen-vm --env-file "$ENV_FILE" \
          --vm-name lmcache-ci-1 --backing-image "$BACKING"
        qemu-tool gen-vm --env-file "$ENV_FILE" \
          --vm-name lmcache-ci-2 \
          --backing-file /var/lib/qemu-tool/images/lmcache-ci-1-backing.qcow2

    # The keypair ships as an ORAS referrer next to the qcow2; gen-vm pulls
    # only the disk. Without it the generated inventory authenticates as a
    # user that exists with a key that does not.
    # The qcow2 ships its keypair as an ORAS REFERRER, not inside the image,
    # and gen-vm pulls only the disk -- so without this the generated
    # inventory authenticates as a user that exists with a key that does not.
    #
    # Selected by artifactType, not by position. The first cut read
    # ["manifests"][0] and died with KeyError: 'manifests' -- oras 1.3.4
    # calls the list "referrers" -- and [0] would have been a second guess
    # waiting to break the day a signature or SBOM referrer is attached ahead
    # of this one. Verified against the pinned qcow2, which has exactly one.
    #
    # One line on purpose: a heredoc inside a `run: |` block keeps its
    # leading whitespace, so an indented Python body is an IndentationError.
    - name: Fetch the guest SSH key
      env:
        VM_INFO_TYPE: application/vnd.batesste.vm-info.v1
      run: |
        # set -eu, not -euo pipefail: no `shell:` is set anywhere in this
        # lane, so steps run under the container's /bin/sh -- dash, which
        # answers pipefail with "Illegal option -o pipefail" and exits 2.
        # The other two scripted steps here use `set -eux` for the same
        # reason. Nothing below needs pipefail: the one pipe feeds a
        # variable that is checked by the python that follows, and oras
        # writes to a file rather than into a pipe.
        set -eu
        BACKING=$(grep '^VM_BACKING_IMAGE=' "$ENV_FILE" | cut -d= -f2-)
        oras discover "$BACKING" --format json > /tmp/referrers.json
        REF=$(python3 -I -c 'import json,os,sys; want=os.environ["VM_INFO_TYPE"]; refs=json.load(sys.stdin).get("referrers",[]); hits=[r["reference"] for r in refs if r.get("artifactType")==want]; print(hits[0]) if hits else sys.exit("no %s referrer on the qcow2; found %r. The guest keypair ships as a referrer -- without it the inventory has a user and no key." % (want,[r.get("artifactType") for r in refs]))' < /tmp/referrers.json)
        mkdir -p /tmp/guest-key
        oras pull "$REF" -o /tmp/guest-key
        # Named explicitly: a silent miss here surfaces much later as an SSH
        # permission denial against a guest that is perfectly healthy.
        test -f /tmp/guest-key/id_rsa
        chmod 600 /tmp/guest-key/id_rsa

    - name: Bring up the fleet
      working-directory: /var/lib/qemu-tool/stacks/lmcache-ci
      run: |
        docker compose --env-file "$GITHUB_WORKSPACE/$ENV_FILE" \
          --profile lmcache up --detach
        docker compose --env-file "$GITHUB_WORKSPACE/$ENV_FILE" --profile lmcache ps

    # Both qemu containers publish SSH on the HOST, which this job container
    # cannot reach. Join the compose network and address guests by service
    # name, as report-for-vm-ernic.yml does.
    - name: Join the compose network
      run: |
        NET=$(docker network ls --format '{{.Name}}' | grep 'lmcache-ci.*fleet' | head -1)
        docker network connect "$NET" "$(hostname)"

    # -p 2222, which the first cut of this omitted -- so it spent its whole
    # 20 minutes connecting to port 22 of the qemu CONTAINER, where nothing
    # listens, and reported only "context canceled". Each guest's sshd is
    # reached through that container's own hostfwd on 2222; note both
    # services use 2222 INSIDE their container even though the host
    # publishes 2222 and 2223. The vm-* report lanes have always done this.
    #
    # The last ssh error is kept and printed on timeout. Discarding it is
    # what made the previous failure unreadable: a guest that never booted,
    # a guest with no network and a name that does not resolve all look
    # identical when stderr goes to /dev/null.
    - name: Wait for both guests
      timeout-minutes: 12
      run: |
        set -eu
        for host in qemu-1 qemu-2; do
          elapsed=0
          ready=
          while [ "$elapsed" -lt 300 ]; do
            if err=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                         -o NoHostAuthenticationForLocalhost=yes \
                         -o ConnectTimeout=5 -p 2222 -i /tmp/guest-key/id_rsa \
                         batesste@"$host" true 2>&1); then
              echo "$host ready after ${elapsed}s"
              ready=yes
              break
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          if [ -z "$ready" ]; then
            echo "::error::$host never answered ssh; last error: $err"
            echo "--- containers ---"
            docker ps --format '{{.Names}}\t{{.Status}}' || true
            echo "--- $host console tail ---"
            docker logs --tail 40 "$(docker ps --filter "name=$host" --format '{{.Names}}' | head -1)" 2>&1 | tail -40 || true
            exit 1
          fi
        done

    - name: Install collections
      run: ansible-galaxy collection install --no-deps -r ansible/requirements.yml

    # The long one: builds the SRQ ionic driver in each guest, loads the
    # image over 9p, formats L2 and starts the MP servers.
    # An overlay, not an edit of the generated inventory. gen-compose writes
    # ansible_host: 127.0.0.1 with the PUBLISHED ports (2222, 2223), which is
    # right from the host and wrong from here: this job runs in a container
    # attached to the compose network, where 127.0.0.1 is the job container
    # itself. On the network each guest is its service name on 2222 -- both
    # of them, since the published 2223 is a host-side mapping of qemu-2's
    # own in-container 2222.
    #
    # Ansible merges inventory sources left to right and the later one wins,
    # so the generated file keeps supplying every lmcache_guest_* var and
    # this supplies only the addressing.
    - name: Address the guests over the compose network
      run: |
        set -eu
        cat > /tmp/ci-addressing.yml <<'YAML'
        all:
          children:
            fleet:
              hosts:
                lmcache-ci-1:
                  ansible_host: qemu-1
                  ansible_port: 2222
                lmcache-ci-2:
                  ansible_host: qemu-2
                  ansible_port: 2222
        YAML
        cat /tmp/ci-addressing.yml

    - name: Configure the fleet
      timeout-minutes: 120
      working-directory: ansible
      run: |
        ansible-playbook \
          -i "$STACK_DIR/fleet-inventory.yml" \
          -i /tmp/ci-addressing.yml \
          playbooks/fleet-lmcache.yml --private-key /tmp/guest-key/id_rsa

    # A green playbook recap does NOT mean a working fleet: registration is
    # reported as a message, not a failure, so assert it separately.
    # Polled, not asked once. Registration is asynchronous: the server starts,
    # loads torch and the ROCm runtime, registers its KV cache and only then
    # appears to the coordinator. A single curl the instant the play returns
    # is a race, and it lost -- the play's own check (12 x 10s) reported
    # "1 of 2 registered. Missing: ['lmcache-ci-2']" and this step then
    # failed immediately on the same answer.
    #
    # 300s because the bench sees ~70s on a 32-core host and this runner is
    # slower; a guest that is merely slow should pass, and one that is stuck
    # should fail with its log attached rather than with a bare count.
    - name: Assert both instances registered
      run: |
        set -eu
        elapsed=0
        n=0
        while [ "$elapsed" -lt 300 ]; do
          n=$(curl -sf http://lmcache-coordinator:9300/instances 2>/dev/null \
              | python3 -I -c 'import sys,json; print(len(json.load(sys.stdin).get("instances",[])))' 2>/dev/null || echo 0)
          [ "$n" = "2" ] && break
          sleep 10
          elapsed=$((elapsed + 10))
        done
        echo "registered: $n after ${elapsed}s"
        if [ "$n" != "2" ]; then
          echo "::error::expected 2 registered instances, got $n after ${elapsed}s"
          curl -sf http://lmcache-coordinator:9300/instances || true
          echo
          # Both guests, not just the first: the one that failed to register
          # is by definition the one whose log is wanted, and last time that
          # was guest 2 while the step only ever dumped guest 1.
          for host in qemu-1 qemu-2; do
            echo "--- $host lmcache-server ---"
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=5 -p 2222 -i /tmp/guest-key/id_rsa \
                batesste@"$host" \
                'systemctl is-active lmcache-server; sudo docker logs --tail 40 lmcache-server 2>&1' || true
          done
          exit 1
        fi

    # The test itself: seed on guest 1, settle, pull the SAME keys on guest 2.
    # Geometry is deliberately small -- the default takes ~20 minutes to
    # allocate on the emulated GPU and buys nothing, and a per-request total
    # at or above 16 MiB tears the mesh connection down (AGENTS.md issue 22).
    - name: Run the P2P transfer
      timeout-minutes: 30
      run: |
        set -eux
        SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/guest-key/id_rsa"
        BENCH="sudo docker exec lmcache-server lmcache bench server --mode gpu \
          --kvcache-shape-spec '(2,32,16,8,128):float16:4' --num-tokens 512 --start 600 --end 602"
        before=$(docker exec lmcache-ci-ernic-stats-exporter-1 \
                 sh -c 'grep total_bytes_rdma_read /run/ernic-stats/ernic-1.stats' | awk '{print $3}')
        $SSH batesste@qemu-1 "$BENCH" | tee /tmp/seed.log
        sleep 20
        $SSH batesste@qemu-2 "$BENCH" | tee /tmp/pull.log
        sleep 10
        after=$(docker exec lmcache-ci-ernic-stats-exporter-1 \
                sh -c 'grep total_bytes_rdma_read /run/ernic-stats/ernic-1.stats' | awk '{print $3}')
        echo "rdma_read delta: $((after - before))"
        echo "RDMA_DELTA=$((after - before))" >> "$GITHUB_ENV"

    # 16 KiB/token x 512 tokens x 2 requests. Asserted exactly, not as "more
    # than zero": a partial transfer is a defect, and the figure has been
    # stable across every passing run.
    - name: Assert the bytes crossed the mesh
      run: |
        [ "$RDMA_DELTA" = "16777216" ] || {
          echo "::error::expected 16777216 RDMA bytes, got $RDMA_DELTA."
          echo "A cache hit with zero bytes means NIXL fell back to TCP --"
          echo "check the IB device name and that max_srq is non-zero."
          exit 1
        }

    # NOT if: always(). The other report lanes upload on success only -- the
    # default -- and deviating from that published a FAILED run's debris to
    # the site as a plausible-looking page: "RDMA bytes moved: unknown",
    # "Could not resolve hostname qemu-1", "No such container". publish-pages
    # cannot tell a failed run's artifact from a good one; it fetches the
    # latest by name. Diagnostics for a failure belong in the run log, which
    # the "Show logs on failure" step already dumps, not on the front page.
    - name: Build the report
      run: |
        mkdir -p site/lmcache
        {
          echo "# LMCache L1 P2P report"
          echo
          echo "- Run: ${GITHUB_RUN_ID}"
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "- RDMA bytes moved: ${RDMA_DELTA:-unknown} (expected 16777216)"
          # The stamp render-site-perf.py's REPORT_STATUS_RE reads. A report
          # with no Status is treated as unknown rather than as a pass, so
          # without this the lane could never contribute to the all-green
          # badge. Only reachable on success now, hence the constant.
          echo "- Generated: **$(date -u '+%Y-%m-%d %H:%M UTC')** &middot; Commit: \`${GITHUB_SHA:0:7}\` &middot; Status: **pass**"
          echo
          echo '## Guest device state'
          echo '```'
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i /tmp/guest-key/id_rsa batesste@qemu-1 \
              'ibv_devinfo | head -5; ibv_devinfo -v | grep -E "max_srq:|max_msg_sz"' 2>&1 || true
          echo '```'
          echo
          echo '## ernic counters'
          echo '```'
          docker exec lmcache-ci-ernic-stats-exporter-1 \
            sh -c 'grep -E "total_bytes_rdma|total_bytes_sent" /run/ernic-stats/ernic-*.stats' 2>&1 || true
          echo '```'
          echo
          echo '## Pull output'
          echo '```'
          grep -E 'cold\] (LOOKUP|RETRIEVE)' /tmp/pull.log 2>/dev/null || echo "no pull output"
          echo '```'
        } > site/lmcache/index.md

    # No working-directory: an early failure (the image build, say) never
    # creates the stack directory, and a step that chdir's into a missing
    # path dies with "chdir to cwd ... exit 127" -- replacing the real error
    # in the log with its own. Guarded instead.
    - name: Show logs on failure
      if: failure()
      run: |
        cd /var/lib/qemu-tool/stacks/lmcache-ci 2>/dev/null || {
          echo "stack directory absent; the run failed before it was created"
          exit 0
        }
        docker compose --env-file "$GITHUB_WORKSPACE/$ENV_FILE" --profile lmcache logs --tail 100 || true
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i /tmp/guest-key/id_rsa batesste@qemu-1 \
            'sudo docker logs lmcache-server 2>&1 | tail -50' || true

    # Upload only. publish-pages.yml is the sole writer of the site: a Pages
    # deploy replaces the whole site, so a lane that deploys erases the others.
    - name: Upload the report
      uses: actions/upload-artifact@v4
      with:
        name: vm-report-lmcache
        path: site/lmcache/
        if-no-files-found: error
