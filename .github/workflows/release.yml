name: qemu-minimal - release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-flight.
  cancel-in-progress: false

jobs:
  verify-version:
    name: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      # The tag is the only thing a user sees, but the wheel takes its version
      # from pyproject.toml and the deb from debian/changelog, so a tag that
      # disagrees with either ships artifacts labelled with the wrong release.
      # Fail before anything is built or published rather than after.
      - name: Check the tag, pyproject.toml and debian/changelog agree
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' qemu/pyproject.toml | head -1)
          DEB_VERSION=$(sed -n '1s/^[^ ]* (\([^)]*\)).*/\1/p' qemu/debian/changelog)

          echo "tag:              ${TAG_VERSION}"
          echo "pyproject.toml:   ${PY_VERSION}"
          echo "debian/changelog: ${DEB_VERSION}"

          rc=0
          if [ "${TAG_VERSION}" != "${PY_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match qemu/pyproject.toml ${PY_VERSION}"
            rc=1
          fi
          if [ "${TAG_VERSION}" != "${DEB_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match qemu/debian/changelog ${DEB_VERSION}"
            rc=1
          fi
          if ! grep -q "^## \[${GITHUB_REF_NAME}\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${GITHUB_REF_NAME}] - <date>' heading"
            rc=1
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "::error::run scripts/release.sh ${TAG_VERSION} to stamp all three"
            exit 1
          fi
          echo "all three agree on ${TAG_VERSION}"

  release:
    name: create-github-release
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build qemu/ --wheel --outdir dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*.whl

  build-deb:
    name: build-deb-package
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools python3-build

      - name: Build deb
        working-directory: qemu
        run: dpkg-buildpackage -us -uc -b

      - name: Upload deb to release
        uses: softprops/action-gh-release@v2.3.2
        with:
          generate_release_notes: false
          draft: false
          prerelease: false
          files: "*.deb"
