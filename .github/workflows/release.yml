name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: create-github-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4.3.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
