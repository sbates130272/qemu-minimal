name: qemu-minimal - Smoke Test - qemu-tool

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'qemu/qemu-tool/**'
      - 'qemu/pyproject.toml'
      - '.github/workflows/qemu-minimal-smoke-test-qemu-tool.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  smoke-test-x86:
    name: Smoke Test - x86 ${{ matrix.release }}
    runs-on: ubuntu-latest
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260919.g359579e-qemu11.1.1-vfu.8039244
      # Supplies qemu-system-x86_64, qemu-img and cloud-localds.
      options: --device /dev/kvm
    strategy:
      matrix:
        release:
          - noble
          - resolute
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1
    # No udev rule here: this job gets /dev/kvm from "options: --device /dev/kvm"
    # and runs as root. The ioctl is the real test -- a bind-mounted node can
    # exist and still be non-functional, and QEMU would silently fall back to TCG.
    - name: Verify KVM is available
      run: |
        test -c /dev/kvm || { echo "::error::/dev/kvm missing - guest would run under TCG"; exit 1; }
        test -r /dev/kvm && test -w /dev/kvm || { echo "::error::/dev/kvm not read-write"; exit 1; }
        python3 -c "import os, fcntl; fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00, 0)" \
          || { echo "::error::/dev/kvm present but KVM_GET_API_VERSION failed"; exit 1; }
        echo "KVM available: $(ls -l /dev/kvm)"
    # Everything else -- qemu-system-x86_64, qemu-img, cloud-localds, ansible
    # and openssh-client -- already ships in the CI image. Only pip is missing.
    - name: Install missing packages
      run: |
        apt-get update -qq
        apt-get install -y -qq python3-pip
    # Absolute, not "~/.cache/pip": actions/cache expands ~ on the runner and
    # pip expands it in this container, so the restore never reached pip.
    # See .github/actions/setup-vm-job/action.yml.
    - name: Use a fixed pip cache directory
      run: echo "PIP_CACHE_DIR=/var/cache/pip-ci" >> "$GITHUB_ENV"
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: /var/cache/pip-ci
        key: pip-qemu-tool-v2-${{ hashFiles('qemu/pyproject.toml') }}
    - name: Install qemu-tool
      run: pip install --break-system-packages -e ./qemu
    - name: Generate SSH key-pair
      run: |
        mkdir -p "$HOME/.ssh" && ssh-keygen -t rsa -q -f "$HOME/.ssh/id_rsa" -N ""
        # ssh(1) expands ~ from the passwd entry, not $HOME. A container job
        # runs as root with HOME=/github/home, so the default identity would be
        # looked for at /root/.ssh/id_rsa, not found, and never offered.
        [ "$HOME" = /root ] || { rm -rf /root/.ssh && ln -s "$HOME/.ssh" /root/.ssh; }
    - name: Cache cloud image
      uses: actions/cache@v4
      with:
        path: /var/lib/qemu-tool/images/*-server-cloudimg-*.img
        key: cloud-img-amd64-${{ matrix.release }}-qemu-tool
    - name: Ensure images directory exists
      run: mkdir -p /var/lib/qemu-tool/images && chmod 777 /var/lib/qemu-tool/images
    - name: Generate VM with qemu-tool gen-vm
      run: |
        qemu-tool gen-vm \
          --vm-name qemu-tool-smoke-test \
          --release ${{ matrix.release }} \
          --username ubuntu \
          --password password \
          --packages none \
          --size 8
    - name: Test --restore-image mode
      run: |
        rm -f /var/lib/qemu-tool/images/qemu-tool-smoke-test.qcow2
        qemu-tool gen-vm \
          --vm-name qemu-tool-smoke-test \
          --restore-image
        if [ ! -f /var/lib/qemu-tool/images/qemu-tool-smoke-test.qcow2 ]; then
          echo "Image not restored from backing"
          exit 1
        fi
        if ! qemu-img info /var/lib/qemu-tool/images/qemu-tool-smoke-test.qcow2 \
             | grep -q "backing file:"; then
          echo "Restored image does not have backing file"
          exit 1
        fi
        echo "✓ --restore-image test passed"
    - name: Test --backing-file mode
      run: |
        qemu-tool gen-vm \
          --vm-name shared-overlay-test \
          --backing-file /var/lib/qemu-tool/images/qemu-tool-smoke-test-backing.qcow2
        if [ ! -f /var/lib/qemu-tool/images/shared-overlay-test.qcow2 ]; then
          echo "Overlay not created by --backing-file mode"
          exit 1
        fi
        if ! qemu-img info \
             /var/lib/qemu-tool/images/shared-overlay-test.qcow2 \
             | grep -q "backing file:"; then
          echo "Overlay does not reference a backing file"
          exit 1
        fi
        echo "✓ --backing-file test passed"
    - name: Boot VM with qemu-tool run-vm
      run: |
        qemu-tool run-vm \
          --vm-name qemu-tool-smoke-test \
          --nvme 1 \
          > run-vm-output.log 2>&1 &
    - name: Wait for VM to boot (180s timeout)
      run: |
        echo "Waiting for VM to boot and accept SSH..."
        timeout=180
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@localhost true 2>/dev/null; then
            echo "✓ VM ready after $elapsed seconds"
            exit 0
          fi
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "✗ VM failed to boot within $timeout seconds"
        exit 1
    - name: Output run-vm log
      if: always()
      run: cat run-vm-output.log
    - name: Verify SSH access to VM
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost ls -ltrh
    - name: Verify qemu-guest-agent in guest
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes \
          -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost \
          "dpkg-query -W -f='\${Status}' qemu-guest-agent" \
          | grep -q "install ok installed"
        echo "✓ qemu-guest-agent installed in guest"

  smoke-test-arm64:
    name: Smoke Test - arm64
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1
    - name: Install packages
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          qemu-system-arm qemu-utils cloud-image-utils python3-pip
    - name: Install qemu-tool
      run: pip install --break-system-packages -e ./qemu
    - name: Generate SSH key-pair
      run: mkdir -p "$HOME/.ssh" && ssh-keygen -t rsa -q -f "$HOME/.ssh/id_rsa" -N ""
    - name: Cache cloud image
      uses: actions/cache@v4
      with:
        path: /var/lib/qemu-tool/images
        key: cloud-img-arm64-noble-qemu-tool
    - name: Ensure images directory exists
      run: sudo mkdir -p /var/lib/qemu-tool/images && sudo chmod 777 /var/lib/qemu-tool/images
    - name: Generate arm64 VM with qemu-tool gen-vm
      run: |
        qemu-tool gen-vm \
          --vm-name qemu-tool-smoke-test-arm64 \
          --arch arm64 \
          --no-kvm \
          --username ubuntu \
          --password password \
          --packages none \
          --size 8

  smoke-test-riscv64:
    name: Smoke Test - riscv64
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1
    - name: Install packages
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          qemu-system-misc qemu-utils u-boot-qemu cloud-image-utils python3-pip
    - name: Install qemu-tool
      run: pip install --break-system-packages -e ./qemu
    - name: Generate SSH key-pair
      run: mkdir -p "$HOME/.ssh" && ssh-keygen -t rsa -q -f "$HOME/.ssh/id_rsa" -N ""
    - name: Cache cloud image
      uses: actions/cache@v4
      with:
        path: /var/lib/qemu-tool/images
        key: cloud-img-riscv64-noble-qemu-tool
    - name: Ensure images directory exists
      run: sudo mkdir -p /var/lib/qemu-tool/images && sudo chmod 777 /var/lib/qemu-tool/images
    - name: Generate riscv64 VM with qemu-tool gen-vm
      run: |
        qemu-tool gen-vm \
          --vm-name qemu-tool-smoke-test-riscv64 \
          --arch riscv64 \
          --no-kvm \
          --username ubuntu \
          --password password \
          --packages none \
          --size 8
