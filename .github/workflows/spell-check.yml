name: qemu-minimal - spell-check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**.md'
      - '.wordlist.txt'
      - '.spellcheck.yaml'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '.wordlist.txt'
      - '.spellcheck.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spell-check:
    name: spell-check
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1
    - name: GitHub Spellcheck Action
      uses: rojopolis/spellcheck-github-actions@0.60.0
