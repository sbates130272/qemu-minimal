name: qemu-minimal - spell-check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spell-check:
    name: spell-check
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1
    - name: Install codespell
      run: pipx install codespell==2.4.3
    # No arguments: codespell reads .codespellrc from the repo root, so a local
    # run and this one are the same command.
    - name: Run codespell
      run: codespell
