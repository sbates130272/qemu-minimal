name: qemu-minimal - Ansible Playbook Test - vm-rocm

# vm-rocm: install the ROCm stack, boot a bare VM, verify packages.
# Boots QEMU directly via qemu-tool run-vm inside the CI image. No compose, so
# the forwarded SSH port lives in this container and localhost is correct.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # 'qemu/qemu-tool/**' and 'qemu/pyproject.toml' are deliberately absent --
    # see the note in qemu-minimal-ansible-playbook-test-vm-rocjitsu.yml.
    paths:
      - 'ansible/playbooks/vm-rocm.yml'
      # vm-rocm.yml imports vm-basic.yml and reads both vars files.
      - 'ansible/playbooks/vm-basic.yml'
      # ... and imports vm-slim.yml as its last play, which is where the guest
      # cleanup and fstrim happen. Named explicitly because these filters
      # enumerate playbooks rather than globbing ansible/playbooks/*.yml.
      - 'ansible/playbooks/vm-slim.yml'
      - 'ansible/playbooks/vars/**'
      # ionic_image_prep's kernel.yml installs the pinned mainline kernel from
      # this playbook (vm-rocm.yml:180), and image_slim is the role vm-slim.yml
      # runs, so a change under roles/ changes this guest.
      - 'ansible/playbooks/roles/**'
      - 'ansible/requirements.yml'
      - '.github/actions/setup-vm-job/action.yml'
      - '.github/actions/report-image-size/action.yml'
      - '.github/workflows/qemu-minimal-ansible-playbook-test-vm-rocm.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs: a push to main or a scheduled run should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VM_IMAGES_DIR: /var/lib/qemu-tool/images
  # No spaces inside the JSON — gen_vm.py splits on whitespace so spaces
  # inside the value create extra positional arguments for ansible-playbook.
  # No rocm_setup_skip_system_upgrade here any more: sbates130272.batesste
  # 3.0.0 defaults it true, so the role's "upgrade: safe" + autoremove pass is
  # off everywhere, local bakes included. This lane asked for that on its own
  # behalf and the reasons hold for any bake -- the pass pulls the whole distro
  # forward (28 packages and 18.1 MB on a recent run: perl, netplan, polkit,
  # sudo, none of them under test), it is the single largest source of flake
  # here because it is what meets the security.ubuntu.com mirror skew (one
  # stale node in an eight-address pool, which re-running does not dependably
  # route around), and it is a reproducibility hole: the ernic side pins the
  # guest kernel via ernic_ionic_kernel_ref and fails the build on a
  # major.minor mismatch precisely so the guest does not drift, and this then
  # re-randomises everything around that kernel. Pass
  # rocm_setup_skip_system_upgrade=false to get it back.
  ANSIBLE_EXTRA_ARGS: '-e {"git_setup_enable_gpg_signing":false,"user_setup_dotfiles_enable":false,"user_setup_install_amd_ca":false,"user_setup_deploy_ssh_key":false}'

jobs:
  test-vm-rocm:
    name: Ansible Playbook Test - vm-rocm
    runs-on: ubuntu-latest
    container:
      image: docker.io/sbates130272/batesste-ci-images-ubuntu-qemu-libvfio-user:20260924.ge1cd640-qemu11.1.1-vfu.8039244
      # Supplies qemu-system-x86_64, qemu-img and cloud-localds.
      options: --device /dev/kvm
    timeout-minutes: 90
    steps:
    - name: Check out code
      uses: actions/checkout@v4.3.1

    - name: Set up VM job
      uses: ./.github/actions/setup-vm-job
      with:
        cloud-image-key: rocm
        release: resolute

    - name: Generate VM with vm-rocm playbook
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        qemu-tool gen-vm \
          --vm-name rocm-test \
          --release resolute \
          --username ubuntu \
          --password password \
          --packages none \
          --size 64 \
          --ansible-playbook ansible/playbooks/vm-rocm.yml

    - name: Boot VM
      run: qemu-tool run-vm --vm-name rocm-test > run-vm-output.log 2>&1 &

    - name: Wait for VM SSH (180s timeout)
      run: |
        elapsed=0
        while [ $elapsed -lt 180 ]; do
          if ssh -o ConnectTimeout=1 \
                 -o NoHostAuthenticationForLocalhost=yes \
                 -o StrictHostKeyChecking=no \
                 -p 2222 ubuntu@localhost true 2>/dev/null; then
            echo "VM ready after ${elapsed}s"
            exit 0
          fi
          sleep 2; elapsed=$((elapsed + 2))
        done
        echo "VM failed to boot in time"
        exit 1

    - name: Verify ROCm directory present
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost "ls /opt/rocm/"
        echo "✓ /opt/rocm present"

    - name: Verify amdrocm-runtime-dev installed
      run: |
        ssh -o NoHostAuthenticationForLocalhost=yes -o StrictHostKeyChecking=no \
          -p 2222 ubuntu@localhost \
          "dpkg-query -W -f='\${Status}' amdrocm-runtime-dev" \
          | grep -q "install ok installed"
        echo "✓ amdrocm-runtime-dev installed"

    # Diagnostic only, and always() so a red lane still reports what it
    # built -- the size question is most interesting exactly when
    # something else went wrong.
    - name: Report VM image size
      if: always()
      uses: ./.github/actions/report-image-size
      with:
        vm-name: rocm-test
        ssh-host: localhost

    - name: Print run-vm log on failure
      if: failure()
      run: cat run-vm-output.log
